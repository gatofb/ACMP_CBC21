          Heller's concept of “specific being” and Berger and Luckmann's concept of “institution” are similar
          because both refer to a set of norms and typical roles that each society imposes.
        B: >-
          Berger and Luckmann's concept of “socialization” is similar to that of “homogenization” because both
          explain why in a society all individuals act in the same way.
        C: >-
          Heller thinks about society through the concept of “socioeconomic structure” and Berger and Luckmann
          through the concept of “institutions”.
        D: >-
          Berger and Luckmann's concept of “socialization” and Heller's concept of “maturation” are similar
          because both speak of the process by which people become social beings.
        E: >-
          Heller's idea that everyday action is “spontaneous” and “pragmatic” is similar to the idea of
          “habitualization” in Berger and Luckmann: both indicate that a large part of social life is
          unreflective.
