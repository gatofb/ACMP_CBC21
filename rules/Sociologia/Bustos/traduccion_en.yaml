  q-0f50144a:
    - fuente: d99ac38d6f
      enunciado: Indicate which statements about Heller and Berger & Luckmann are true (T) and which are false (F).
      opciones:
        A: >-
          According to Heller, when particularity subordinates the specific, individual needs are placed ahead
          of the interests and needs of social integration.
        B: >-
          According to Berger and Luckmann, socialization is a process that begins with the individual's birth
          and ends in adulthood.
        C: >-
          According to Berger and Luckmann, everyday life is the set of activities in which people reproduce
          themselves and, at the same time, the socioeconomic structures.
        D: >-
          According to Berger and Luckmann, an institutional world is experienced as objective reality, has a
          history that predates the individual's birth, and is not accessible to his biographical memory.
        E: >-
          According to Heller, it is necessary to develop a mental capacity that all individuals possess,
          which makes it possible to link biography with history.
