  q-3f687e89:
    - fuente: bd4bd14954
      enunciado: >-
        Mark which statements about the differences between Althusser and Foucault regarding the “construction
        of the modern subject” are true (T) or false (F).
      opciones:
        A: >-
          For Althusser it is the result of the reproduction carried out by the Ideological State Apparatuses,
          and for Foucault, of surveillance in closed and artificial spaces.
        B: For Althusser it is the result of the dominant ideology, and for Foucault, of subaltern ideologies.
        C: >-
          For Althusser it is the result of ideological interpellation, while for Foucault it is the result of
          disciplinary technologies.
        D: >-
          For Althusser it is the result of an economic process; for Foucault it is the result of a series of
          judicial procedures.
        E: >-
          For Althusser it occurs at the level of the infrastructure; for Foucault it is at the level of
          biopolitics.
