    - fuente: f8f6d8309c
      enunciado: >-
        Mark the correct option with a cross (X). Which of the following statements corresponds to Karl Marx's
        thought?
      opciones:
        A: In the exchange of commodities, use value ceases to matter.
        B: The individual ceases to be linked to nature because he produces manufactured goods.
        C: >-
          The development of the productive forces depends on the availability of natural resources, since
          nature is the source of wealth.
        D: >-
          The simplest economic category, such as exchange value, presupposes a population that produces
          within specific relations of production.
        E: Capitalist profit becomes a means of solving poverty.
