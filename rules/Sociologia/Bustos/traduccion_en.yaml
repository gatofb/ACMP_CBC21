          they illuminate certain aspects of reality in order to better serve the interests of society as a
          whole.
        E: they present themselves as globalizing images of social reality.
fichas:
  weber.accion-social:
    fuente: f151b7ed4e
    tema: Social action
    autor: Max Weber
    pregunta_guia: What does an action need to have for Weber to call it “social”?
  weber.sociologia-comprensiva:
    fuente: 04b8213603
    tema: Interpretive sociology
    autor: Max Weber
    pregunta_guia: According to Weber, what does the sociologist have to do to understand why people act the way they do?
  weber.tipos-de-accion:
    fuente: e474e64547
    tema: The types of social action
    autor: Max Weber
    pregunta_guia: What are Weber's four types of social action and what orients each one?
  weber.accion-con-arreglo-a-fines:
    fuente: 95e10fa772
    tema: Instrumentally rational action
    autor: Max Weber
    pregunta_guia: What does someone who acts in an instrumentally rational way weigh up?
  weber.accion-con-arreglo-a-valores:
    fuente: 92f51c901d
    tema: Value-rational action
    autor: Max Weber
    pregunta_guia: 'What drives someone who acts in a value-rational way: the result, emotion, custom or conviction?'
  weber.poder-y-dominacion:
    fuente: 67d94626bc
    tema: Power and legitimate domination
    autor: Max Weber
    pregunta_guia: What does domination have that power does not?
  weber.dominacion-tradicional:
    fuente: 2ff1fcb825
    tema: Traditional domination
    autor: Max Weber
    pregunta_guia: 'Why do people obey under traditional domination: because of the person, the law or custom?'
  weber.dominacion-carismatica:
    fuente: 67cb054965
    tema: Charismatic domination
    autor: Max Weber
    pregunta_guia: Whom do people obey under charismatic domination, and why?
  weber.dominacion-legal-racional:
    fuente: 1ca444374c
    tema: Legal-rational domination
    autor: Max Weber
    pregunta_guia: 'Under legal-rational domination, what do people obey: a person, custom or a rule?'
  weber.tipo-ideal:
    fuente: d9b47dd443
    tema: The ideal type
    autor: Max Weber
    pregunta_guia: What is the ideal type useful for to the researcher, and what is it not?
  durkheim.hecho-social:
    fuente: 7280799c75
    tema: The social fact
    autor: Émile Durkheim
    pregunta_guia: >-
      For Durkheim, which explains which: do individuals explain the group, or does the group explain
      individuals?
  durkheim.exterioridad-y-coercion:
    fuente: 4b07d3c2cd
    tema: Externality of social facts and collective consciousness
    autor: Émile Durkheim
    pregunta_guia: External to what are social facts, and what effect do they have on people?
  durkheim.corrientes-sociales:
    fuente: e578cc5b99
    tema: Social currents and currents of opinion
    autor: Émile Durkheim
    pregunta_guia: Why can a collective enthusiasm or an opinion that is “in the air” be social facts?
  mills.imaginacion-sociologica:
    fuente: de2a370f24
    tema: The sociological imagination
    autor: C. Wright Mills
    pregunta_guia: Between which two levels does the sociological imagination move, and what does it allow us to see?
  mills.inquietudes-y-problemas:
    fuente: 5f1ffdc1c8
    tema: Personal troubles and public issues
    autor: C. Wright Mills
    pregunta_guia: Faced with a difficulty, how does Mills distinguish whether it is a personal trouble or a public issue?
  mills.malestar-e-indiferencia:
    fuente: 42eccf240e
    tema: A time of uneasiness and indifference
    autor: C. Wright Mills
    pregunta_guia: According to Mills, what happens to people when they cannot put a name to what troubles them?
  marques.naturalizacion:
    fuente: 31603149b3
    tema: 'The social is not natural: naturalization and denaturalization'
    autor: Josep-Vicent Marqués
    pregunta_guia: >-
      According to Marqués, what are we doing when we say something “is natural”, and what does sociology have
      to do with that?
  marques.construccion-social-del-varon:
    fuente: 9c8413d22f
    tema: The social construction of the male
    autor: Josep-Vicent Marqués
    pregunta_guia: >-
      Whom does dominant masculinity repress, according to Marqués, and how does that differ from the ideology
      of complementarity?
  marques.homosocialidad-masculina:
    fuente: 66caf229a8
    tema: Male homosociality
    autor: Josep-Vicent Marqués
    pregunta_guia: Which author in the course studies how masculinity is socially constructed?
  marques.coincidencias-con-mills:
    fuente: cfa0599f35
    tema: 'Marqués and Mills: everyday life in its social and historical context'
    autor: Josep-Vicent Marqués
    pregunta_guia: What do Marqués and Mills do with everyday-life situations in order to think about them sociologically?
  heller.vida-cotidiana:
    fuente: 77ff99f244
    tema: Everyday life as the reproduction of the particular individual and of society
    autor: Agnes Heller
    pregunta_guia: What is reproduced in everyday life according to Heller, and who takes part in it?
  heller.heterogeneidad:
    fuente: feea7f3afd
    tema: The heterogeneity of everyday life
    autor: Agnes Heller
    pregunta_guia: When Heller says that everyday life is heterogeneous, what is it that is diverse?
  heller.particular-y-especifico:
    fuente: 1fbacb042c
    tema: Particular being and species-being (genericness)
    autor: Agnes Heller
    pregunta_guia: >-
      What two dimensions coexist in each person according to Heller, and in what process does the second
      become conscious?
  heller.muda-copresencia:
    fuente: e72d7c3c95
    tema: The mute coexistence of particularity and species-being
    autor: Agnes Heller
    pregunta_guia: What two dimensions coexist «mute» within each person, and why is it said that they do not clash?
  heller.homogeneizacion:
    fuente: a71a187a26
    tema: Homogenization and morality, two ways of going beyond particularity
    autor: Agnes Heller
    pregunta_guia: >-
      What does the individual suspend in order to become homogenized, and what do they connect with? What two
      things does morality do?
  heller.objetivacion:
    fuente: b17e213081
    tema: Objectivation according to Heller
    autor: Agnes Heller
    pregunta_guia: What does an activity need to have to be an objectivation according to Heller?
  berger-luckmann.institucionalizacion:
    fuente: 88d80eee6f
    tema: Institution and institutionalization
    autor: Peter Berger and Thomas Luckmann
    pregunta_guia: What has to be typified for there to be an institution?
  berger-luckmann.orden-social:
    fuente: 1f90833705
    tema: Social order as a human product (externalization and objectivation)
    autor: Peter Berger and Thomas Luckmann
    pregunta_guia: >-
      Who produces the social order according to Berger and Luckmann, and what happens to what we produce when
      it is «objectivated»?
  berger-luckmann.socializacion:
    fuente: 48d134c4bc
    tema: Internalization, socialization and the generalized other
    autor: Peter Berger and Thomas Luckmann
    pregunta_guia: >-
      What does the individual take in when being socialized, and what does it mean for them to recognize
      roles «abstracted from persons»?
  berger-luckmann.coincidencias-con-heller:
    fuente: 080cade852
    tema: Where Heller and Berger and Luckmann agree
    autor: Peter Berger and Thomas Luckmann
    pregunta_guia: >-
      Where is each person's life reproduced according to the two approaches, and what role do habitual
      behaviors play?
  berger-luckmann.comparacion-con-heller:
    fuente: 9744ab937b
    tema: Which concept of Heller's resembles which of Berger and Luckmann's
    autor: Peter Berger and Thomas Luckmann
    pregunta_guia: >-
      In each pair of concepts, are they talking about the same process? From which concept does each author
      think about society?
  lefebvre.lenguaje:
    fuente: 6dad7c119b
    tema: Language as the existence of consciousness
    autor: Henri Lefebvre
    pregunta_guia: >-
      Which concept is, at the same time, the form in which consciousness exists and what arises from the need
      to communicate?
  elias.interdependencia:
    fuente: ea92404874
    tema: Society and institutions as a web of reciprocal dependencies
    autor: Norbert Elías
    pregunta_guia: >-
      According to Elías, is society outside the individual or is it a network of relationships? Where does
      the discontent come from?
  elias.modelo-egocentrico:
    fuente: '3902376e01'
    tema: The egocentric model and the reification of social figures
    autor: Norbert Elías
    pregunta_guia: What is at the center of the egocentric model, and why does Elías say it reifies social figures?
  elias.modelos-heteronomos:
    fuente: 2b12e1d82d
    tema: The task of sociology and heteronomous models
    autor: Norbert Elías
    pregunta_guia: >-
      Besides researching and explaining, what must sociologists' thinking free itself from according to
      Elías?
  althusser.aparatos-del-estado:
    fuente: 65c2ef7a68
    tema: The State and its apparatuses (repressive and ideological)
    autor: Louis Althusser
    pregunta_guia: >-
      Whom does the State serve according to Althusser, and with which two types of apparatuses does it
      maintain the relations of production?
  althusser.ideologia-en-general:
    fuente: 71ace12244
    tema: Ideology in general and its material existence
    autor: Louis Althusser
    pregunta_guia: >-
      Where does ideology exist for Althusser, in each person's ideas or in practices? What links the social
      order with the formation of subjects?
  althusser.interpelacion:
    fuente: 1a870d4c23
    tema: Ideological interpellation and the formation of subjects
    autor: Louis Althusser
    pregunta_guia: >-
      How does an individual become a subject for Althusser? Who calls them, and in whom do they recognize
      themselves?
  althusser.infraestructura-superestructura:
    fuente: e74c6e62db
    tema: The levels of society, infrastructure and superstructure
    autor: Louis Althusser
    pregunta_guia: What levels does Althusser distinguish in every society, and what does each one contain?
  althusser.poder-vs-weber:
    fuente: b8a9811a4e
    tema: Power and domination, Althusser versus Weber
    autor: Louis Althusser
    pregunta_guia: >-
      Where does power come from for Althusser, and where can it come from for Weber? What are both seeking
      when they talk about domination?
  althusser.sujeto-moderno-vs-foucault:
    fuente: 866f47cadd
    tema: The construction of the modern subject, Althusser versus Foucault
    autor: Louis Althusser
    pregunta_guia: >-
      For each author, what is it that produces the modern subject, ideology or techniques applied to the
