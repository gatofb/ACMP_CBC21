  q-a7005f62:
    - fuente: 25359596ea
      enunciado: >-
        Mark which statements about the differences between Althusser and Foucault regarding the conception of
        the state and of power are true (T) and which are false (F).
      opciones:
        A: >-
          For Althusser the State guarantees the reproduction of the relations of production, and for
          Foucault, beliefs in the legitimacy of the order.
        B: >-
          Althusser highlights the repressive and ideological role of power, while Foucault analyzes power
          outside the State, where it is concretely exercised over people.
        C: >-
          For Althusser the State represents the dominant class; for Foucault it represents all citizens
          equally.
        D: For Althusser power descends from the State to society; for Foucault power goes from the bottom up.
        E: >-
          For Althusser the State acts through the Ideological Apparatuses, and for Foucault it does so
          through the Repressive Apparatuses.
