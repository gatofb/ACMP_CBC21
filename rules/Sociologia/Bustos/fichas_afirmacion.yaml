  - texto: El derecho no está atravesado por la ideología patriarcal, o se posiciona en contra de ella.
    error: cambio_de_palabra
    por_que: El examen da por falsas las dos frases; el derecho está atravesado por la ideología patriarcal
      y no se le opone.
  - texto: El sexo es una revolución frente a la ideología patriarcal.
    error: dato_inventado
    por_que: Mezcla palabras del tema; lo que sostienen las autoras es que el sexo es mutable porque se
      constituye en una relación.
  pregunta_guia: ¿Qué tiene de novedoso decir que no solo el género sino también el sexo es construido?
  explicacion_modelo: 'La correcta es que el sexo y el género son construidos y, por eso, mutables. Para
    Facio y Fries, el sexo no pertenece al orden de la naturaleza, sino que se constituye en una relación
    sociohistórica, igual que el género. La trampa más tentadora es «el género es una construcción histórica
    y el sexo pertenece al orden de la naturaleza», porque la primera mitad es cierta, pero la segunda
    es justamente lo que las autoras discuten.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-16a8aa3b
  - q-ad425b76
  - q-fea92296
  estado: borrador
  notas: 'Esta postura (también el sexo es construido) va más allá de la distinción sexo/género que enseña
    la ficha de Maffía; el examen da por falsa la opción «el sexo pertenece al orden de la naturaleza».
    En q-16a8aa3b la v1 es de marcas y coincide con la v2 de campus. Sobre el nombre de las autoras, ver
    la nota de facio-fries.construccion-social-de-mujer-y-varon.

    '
- id: maffia.dicotomias
  eje: conceptos
  autor: Diana Maffía
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Las dicotomías y la heteronormatividad
  afirmacion: 'Para Maffía, las dicotomías son pares de conceptos exhaustivos y excluyentes, además jerarquizados
    y opuestos. La heteronormatividad nos constituye a partir de esas categorías, con el género planteado
    en términos binarios.

    '
  puntos:
  - El concepto que corresponde a la definición «Pares de conceptos exhaustivos y excluyentes» es «Dicotomías».
  - Para Maffía, las dicotomías son categorías exhaustivas y excluyentes.
  - Para Maffía, las dicotomías son conceptos jerarquizados y opuestos.
  - Según Maffía, la heteronormatividad constituye a las personas partiendo de conceptos exhaustivos y
    excluyentes.
  - La heteronormatividad nos constituye a partir de categorías jerarquizadas y opuestas.
  - La heteronormatividad parte del género planteado en términos binarios.
  trampas:
  - texto: Las dicotomías son conceptos equivalentes, o categorías igualitarias e incluyentes.
    error: cambio_de_palabra
    por_que: Invierte los rasgos; las dicotomías son jerarquizadas (un polo vale más que el otro) y excluyentes.
  - texto: La heteronormatividad nos constituye a partir de conceptos jerarquizados y equivalentes.
    error: media_verdad
    por_que: «Jerarquizados» está bien, pero si hay jerarquía no pueden ser equivalentes; son opuestos.
  - texto: La heteronormatividad nos constituye a partir de conceptos contrapuestos y contradictorios.
    error: cambio_de_palabra
    por_que: Suena parecido a «opuestos», pero la fórmula de Maffía es «jerarquizados y opuestos» y «exhaustivos
      y excluyentes».
  - texto: Las dicotomías son hechos sociales contradictorios entre sí, o hechos sociales impuestos al
      hombre.
    error: concepto_vecino
    por_que: El hecho social, externo y coactivo, es de Durkheim; las dicotomías son pares de categorías.
  - texto: Las dicotomías son categorías para entender la conducta del hombre.
    error: verdad_general
    por_que: Suena razonable, pero Maffía no las define por su utilidad sino por ser exhaustivas, excluyentes,
      jerarquizadas y opuestas.
  - texto: La heteronormatividad parte de una matriz homosexual o de las sexualidades múltiples.
    error: cambio_de_palabra
    por_que: Es al revés; la heteronormatividad parte de un género binario, no de una matriz homosexual
      ni de sexualidades múltiples.
  - texto: La heteronormatividad parte de las categorías dicotómicas «varón real» y «varón desviado».
    error: dato_inventado
    por_que: Inventa un par que el examen no avala; el binario del que parte es el del género.
  pregunta_guia: ¿Qué cuatro rasgos tienen los pares dicotómicos para Maffía y qué tiene que ver eso con
    la heteronormatividad?
  explicacion_modelo: 'Las dicotomías son pares de conceptos exhaustivos y excluyentes (no queda una tercera
    opción y no se puede estar en los dos polos a la vez) y, además, jerarquizados y opuestos. Para Maffía,
    la heteronormatividad nos constituye a partir de esas categorías, con un género binario. La trampa
    más tentadora es «conceptos jerarquizados y equivalentes», que arranca bien, pero si un polo vale
    más que el otro no pueden ser equivalentes.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-a4c69fcc
  - q-1562cbcf
  - q-dfa7f88a
  - q-0cefbc02
  estado: borrador
  notas: 'q-a4c69fcc viene sin autor; «dicotomías» es el concepto de Maffía. Se juntan dicotomías y heteronormatividad
    en una ficha porque el examen evalúa la heteronormatividad con los mismos rasgos de las dicotomías.
    Todas las claves son de campus.

    '
- id: maffia.aportes-del-feminismo
  eje: conceptos
  autor: Diana Maffía
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Lo que nos permitieron comprender el feminismo y la perspectiva de género
  afirmacion: 'Para Maffía, el feminismo y la perspectiva de género nos permitieron comprender la idea
    de la construcción social de la mujer y la distinción entre sexo y género.

    '
  puntos:
  - Para Maffía, el feminismo nos ha permitido comprender la idea de la construcción social de la mujer.
  - Para Maffía, el feminismo nos ha permitido comprender la distinción entre sexo y género.
  - Para Maffía, la perspectiva de género nos ha permitido comprender la idea de la construcción social
    de la mujer y la distinción entre sexo y género.
  trampas:
  - texto: … explicar la subordinación de la mujer a partir de las diferencias biológicas.
    error: cambio_de_palabra
    por_que: Es lo contrario; el feminismo muestra que la situación de la mujer es una construcción social,
      no un efecto de la biología.
  - texto: … justificar biológicamente la sumisión de la mujer.
    error: cambio_de_palabra
    por_que: Es justamente lo que el feminismo critica, no lo que justifica.
  - texto: … comprender que las categorías de género son igualitarias e incluyentes.
    error: cambio_de_palabra
    por_que: Para Maffía las categorías de género son dicotómicas, jerarquizadas y excluyentes, no igualitarias
      ni incluyentes.
  pregunta_guia: ¿Qué dos ideas nos dejó el feminismo para pensar la situación de la mujer, según Maffía?
  explicacion_modelo: 'Son verdaderas la construcción social de la mujer y la distinción entre sexo y
    género. Para Maffía, el feminismo y la perspectiva de género permitieron ver que la situación de la
    mujer no se explica por la biología, sino que es una construcción social. La trampa más tentadora
    es «comprender que las categorías de género son igualitarias e incluyentes», que suena a meta feminista,
    pero Maffía describe esas categorías como jerarquizadas y excluyentes.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-f0307a14
  - q-161780ea
  estado: borrador
  notas: 'q-f0307a14 («feminismo», marcas) y q-161780ea («perspectiva de género», campus) tienen la misma
    clave. No confundir con Facio y Fries, para quienes la mirada de género permite comprender la construcción
    social de la mujer y el varón, y también que el sexo es construido.

    '
- id: maffia.etapas-del-feminismo
  eje: conceptos
  autor: Diana Maffía
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Las posiciones del feminismo en los años setenta, ochenta y noventa
  afirmacion: 'Para Maffía, el feminismo fue cambiando de posición en las últimas décadas del siglo XX.
    En los setenta la lucha es por la igualdad, en los ochenta por la diferencia, y el cuestionamiento
    de las categorías dicotómicas llega en los noventa.

    '
  puntos:
  - En los años setenta la lucha es por la igualdad.
  - En los años ochenta la lucha es por la diferencia.
  - Es falso que en los años ochenta se cuestionen las categorías dicotómicas.
  - Es falso que en los años noventa no se cuestionen las categorías dicotómicas; el cuestionamiento de
    las dicotomías es de los noventa.
  trampas:
  - texto: En los años ochenta se cuestionan las categorías dicotómicas.
    error: anacronismo
    por_que: Pone en los ochenta lo que corresponde a los noventa; en los ochenta la lucha es por la diferencia.
  - texto: En los años noventa no se cuestionan las categorías dicotómicas.
    error: cambio_de_palabra
    por_que: Niega justamente el rasgo de los noventa, que es la etapa que cuestiona las dicotomías.
  pregunta_guia: ¿Qué reclamaba el feminismo en cada década según Maffía y en cuál se pone en duda la
    dicotomía misma?
  explicacion_modelo: 'En los setenta la lucha es por la igualdad, en los ochenta por la diferencia y
    recién en los noventa se cuestionan las categorías dicotómicas. Para Maffía, cada década tuvo un reclamo
    distinto, y solo la última pone en duda el par dicotómico mismo. La trampa más tentadora es «en los
    ochenta se cuestionan las categorías dicotómicas», porque la lucha por la diferencia ya discute el
    lugar de la mujer, pero el cuestionamiento de las dicotomías corresponde a los noventa.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-7138c3df
  estado: borrador
  notas: 'Ficha de una sola pregunta, con toda la clave de marcas. Clave dudosa en q-7138c3df, opción
    B («En los años setenta no se cuestionan las jerarquías», marcada F). En el esquema que suele atribuirse
    a Maffía, el feminismo de la igualdad (setenta) discute que las mujeres queden en el polo desvalorizado
    pero no la jerarquía entre los polos, y es el de la diferencia (ochenta) el que discute la jerarquía.
    Si es así, la B sería V. No se enseña ni como punto ni como trampa hasta validarla con el texto.

    '
- id: lifszyc.capitalismo
  eje: conceptos
  autor: Sara Lifszyc
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Características del modo de producción capitalista
  afirmacion: 'Para Lifszyc, el capitalismo es un modo de producción basado en la relación entre los dueños
    de los medios de producción y trabajadores asalariados formalmente libres, que solo poseen su fuerza
    de trabajo. Esa fuerza de trabajo es una mercancía como cualquier otra, y en esa relación se extrae
    plusvalía.

    '
  puntos:
  - El capitalismo es un modo de producción en el que existe extracción de plusvalía (plusvalor) en las
    relaciones de producción.
  - En el capitalismo el trabajador asalariado no es dueño de los medios sociales de producción; solo
    posee su fuerza de trabajo.
  - En el capitalismo son necesarias las relaciones entre los dueños de los medios de producción y los
    asalariados formalmente libres.
  - En el capitalismo la fuerza de trabajo es considerada una mercancía como cualquier otra; el trabajo
    es tratado como una mercancía más.
  - La mercancía es la forma concreta que adopta el trabajo en el capitalismo.
  - Las relaciones sociales de producción determinan la forma general del modo de producción y están vinculadas
    al tipo de propiedad predominante.
  - Son características del capitalismo el predominio de la gran industria sobre la manufactura artesanal
    y la existencia de trabajadores asalariados libres.
  trampas:
  - texto: En el capitalismo la fuerza de trabajo no es considerada una mercancía como cualquier otra,
      o es lo único que no es mercancía.
    error: cambio_de_palabra
    por_que: Es al revés; la fuerza de trabajo se compra y se vende como una mercancía más.
  - texto: En el capitalismo el trabajador es libre y dueño de los medios de producción.
    error: media_verdad
    por_que: Es formalmente libre, pero justamente no tiene los medios de producción; solo tiene su fuerza
      de trabajo para vender.
  - texto: Las condiciones laborales son similares a la esclavitud porque no existe la libertad formal,
      o predominan relaciones de producción sin libertad formal.
    error: concepto_vecino
    por_que: Confunde el capitalismo con la esclavitud; el asalariado es formalmente libre.
  - texto: Las leyes y estatutos constitucionales originan las relaciones de producción capitalistas,
      o determinan el modo de producción.
    error: cambio_de_palabra
    por_que: Pone a las leyes en el lugar de las relaciones sociales de producción, que son las que determinan
      la forma del modo de producción.
  - texto: En el capitalismo la gran industria va desapareciendo en favor de las manufacturas artesanales
      y las artesanías regionales.
    error: cambio_de_palabra
    por_que: Invierte la relación; en el capitalismo predomina la gran industria sobre la manufactura
      artesanal.
  - texto: Los empresarios capitalistas obtienen sus ganancias gracias a su racionalidad superior.
    error: verdad_general
    por_que: Suena a explicación razonable, pero en el texto lo que caracteriza la relación capitalista
      es la extracción de plusvalía al trabajo asalariado.
  - texto: Una mercancía es el resultado de la producción orientada al consumo.
    error: verdad_general
    por_que: La mercancía se produce para el intercambio; producir para el consumo propio no define a
      la mercancía.
  - texto: Son características del capitalismo el deterioro de la legitimidad política por la injusticia
      social, o la inflación y el estancamiento económico.
    error: dato_inventado
    por_que: Pueden darse en sociedades capitalistas, pero no son los rasgos que definen el modo de producción
      en el texto.
  pregunta_guia: ¿Qué tiene y qué no tiene el trabajador asalariado en el capitalismo, y qué se extrae
    de su trabajo?
  explicacion_modelo: 'En el capitalismo el trabajador asalariado es formalmente libre, pero no es dueño
    de los medios de producción, así que solo tiene su fuerza de trabajo, que se vende como una mercancía
    más. Para Lifszyc, en esa relación entre propietarios y asalariados se extrae plusvalía, y son las
    relaciones sociales de producción (no las leyes) las que dan forma al modo de producción. La trampa
    más tentadora es «el trabajador es libre y dueño de los medios de producción», porque lo de libre
    es cierto, pero si fuera dueño de los medios no tendría que vender su fuerza de trabajo.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-17610373
  - q-23ecc19f
  - q-b5cb94a9
  - q-4395c3ab
  - q-c738233f
  estado: borrador
  notas: 'Las tres preguntas estaban en el grupo sin autor, pero nombran a S. (Sara) Lifszyc en el enunciado.
    q-2424b3ac v1 y q-17610373 tienen clave de marcas y son coherentes con las versiones de campus (v2
    y v3 de q-2424b3ac y q-e99ed7cb). La C de q-17610373 («Una mercancía es el resultado de producción
    orientada al consumo», F por marcas) coincide con la idea marxista de que la mercancía se produce
    para el cambio; validar que Lifszyc lo dice así. El examen pregunta la misma idea al derecho y al
    revés («la fuerza de trabajo es una mercancía como cualquier otra» es V en q-17610373 y q-2424b3ac
    v3, y su negación es F en q-2424b3ac v2); sirve como ejercicio de reformulación.

    '
- id: weber.capitalismo-moderno
  eje: conceptos
  autor: Max Weber
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Capitalismo moderno y Estado racional
  afirmacion: 'El capitalismo moderno es el único orden social en el cual puede prosperar el Estado racional
    moderno, apoyado en una burocracia especializada y en un derecho racional, formalista y calculable.

    '
  puntos:
  - El concepto que corresponde a la definición «El único orden social en el cual puede prosperar el Estado
    racional moderno apoyado en una burocracia especializada y en un derecho racional, formalista y calculable»
    es «Capitalismo moderno».
  trampas:
  - texto: Para esta definición, elegir «Tipo ideal».
    error: concepto_vecino
    por_que: El tipo ideal también es de Weber, pero es una herramienta para construir conceptos, no un
      orden social.
  - texto: Para esta definición, elegir «Ideología» o «Superestructura».
    error: concepto_vecino
    por_que: La definición describe un orden social con su Estado, su burocracia y su derecho, no un sistema
      de representaciones ni un nivel de la sociedad.
  pregunta_guia: ¿Qué Estado, qué burocracia y qué derecho van de la mano del capitalismo moderno según
    Weber?
  explicacion_modelo: 'La definición corresponde al capitalismo moderno. Para Weber, el capitalismo moderno
    va de la mano del Estado racional, apoyado en una burocracia especializada y en un derecho racional,
    formalista y calculable. La opción tentadora es «Tipo ideal», porque también es un concepto de Weber,
    pero es un instrumento de análisis, no un orden social.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-5bf2e667
  estado: borrador
  notas: 'Ficha de una sola pregunta. Viene sin autor; la burocracia especializada y el derecho racional,
    formalista y calculable son de Weber. Ojo, en la formulación más conocida de Weber la relación se
    lee al revés («solo en el Estado racional puede prosperar el capitalismo moderno»), mientras que el
    examen dice «el único orden social en el cual puede prosperar el Estado racional». La ficha enseña
    la versión del examen; validar con el texto de la cátedra. Puede fusionarse con una ficha de Weber
    de otra parte si alguna trata el capitalismo moderno. La v1 es de marcas y la v2 de campus; coinciden.

    '
- id: foucault.sexo
  eje: conceptos
  autor: Michel Foucault
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: El sexo como cruce de la anatomopolítica y la biopolítica
  afirmacion: 'Para Foucault, el sexo es una dimensión estratégica de la vida humana donde se articulan
    la anatomopolítica y la biopolítica.

    '
  puntos:
  - El concepto que corresponde a la definición «Dimensión estratégica de la vida humana donde se articulan
    la anatomopolítica y la biopolítica» es «Sexo».
  trampas:
  - texto: Para esta definición, elegir «Biopolítica».
    error: concepto_vecino
    por_que: La biopolítica es uno de los dos polos que se cruzan en el sexo; la definición pide el punto
      donde se articulan los dos.
  - texto: Para esta definición, elegir «Dicotomías».
    error: concepto_vecino
    por_que: Las dicotomías son de Maffía (pares de conceptos exhaustivos y excluyentes); la definición
      habla del poder sobre la vida.
  pregunta_guia: ¿Por qué el sexo le interesa al poder, según Foucault, tanto en el cuerpo de cada uno
    como en la población?
  explicacion_modelo: 'La definición corresponde al sexo. Para Foucault, el sexo es estratégico porque
    en él se cruzan los dos polos del poder sobre la vida, la anatomopolítica, que disciplina los cuerpos,
    y la biopolítica, que regula la población. La opción tentadora es «Biopolítica», porque aparece en
    la misma definición, pero es solo uno de los dos polos que se articulan en el sexo.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-3afd8628
  estado: borrador
  notas: 'Ficha de una sola pregunta. Viene sin autor; anatomopolítica y biopolítica son conceptos de
    Foucault. Conviene fusionarla con las fichas de Foucault sobre anatomopolítica y biopolítica de la
    otra parte. La explicación usa la distinción cuerpo individual / población, que es firme en Foucault,
    pero el examen no la evalúa en esta pregunta.

    '
