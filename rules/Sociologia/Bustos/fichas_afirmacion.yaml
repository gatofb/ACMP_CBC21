  puntos:
  - La imaginación sociológica es la capacidad de pasar de las características más impersonales a las
    más íntimas del yo humano, y de ver la relación entre ambas cosas.
  - Quien la desarrolla puede obtener recapitulaciones válidas de lo que ocurre en su entorno y en sí
    mismo, comprendiendo la íntima conexión entre los cambios en la estructura social y la vida, posibilidades
    y trayectoria de cada hombre y mujer.
  - «Imaginación sociológica» es un concepto de (C. Wright) Mills.
  - «Biografía» es un concepto de Mills.
  trampas:
  - texto: Es la capacidad sistemática de pasar de una dimensión temporal a otra, del pasado al presente
      y viceversa.
    error: cambio_de_palabra
    por_que: El pasaje es de lo impersonal a lo íntimo (estructura y yo), no entre tiempos.
  - texto: Es una capacidad que solo poseen los sociólogos, ya que requiere una formación profesional.
    error: absoluto_falso
    por_que: El “solo” la vuelve exclusiva de los profesionales, y Mills no la plantea así.
  - texto: Es una capacidad biológica que se desarrolla en quienes tienen la predisposición de vincular
      la biografía con la historia.
    error: dato_inventado
    por_que: Lo de biografía e historia suena bien, pero Mills no habla de una base biológica ni de predisposición.
  - texto: Es la capacidad de observar y explicar las diversas inquietudes privadas que transcurren en
      un tiempo determinado.
    error: media_verdad
    por_que: Se queda en lo privado; la imaginación sociológica consiste en relacionar esas inquietudes
      con la estructura social.
  - texto: Quien la desarrolla puede comprender las motivaciones psicológicas que impulsan a los demás
      y a sí mismo a actuar.
    error: verdad_general
    por_que: Suena a conocerse mejor, pero Mills no apunta a la psicología individual sino a su conexión
      con la estructura.
  - texto: Quien la desarrolla puede tener mejores posibilidades si se relaciona con quienes están en
      sus mismas circunstancias, proyectarse en una vida más original o incorporar los logros de la sociología.
    error: dato_inventado
    por_que: Son beneficios que Mills no plantea; lo que da es comprender la relación entre la propia
      vida y la historia.
