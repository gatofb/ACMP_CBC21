- id: mills.imaginacion-sociologica
  eje: conceptos
  autor: C. Wright Mills
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: La imaginación sociológica
  afirmacion: 'La imaginación sociológica es la capacidad de pasar de lo más impersonal a lo más íntimo
    del yo y ver la relación entre ambas cosas: conecta la biografía de cada persona con los cambios de
