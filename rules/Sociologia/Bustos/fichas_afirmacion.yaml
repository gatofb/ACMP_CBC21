  - El concepto de hecho social permite comprender que la realidad social es independiente de la voluntad
    de los individuos.
  - Las maneras de hacer y de pensar de los individuos son impuestas por el grupo al que pertenecen.
  - «Hecho social» y «Hechos sociales» son conceptos de Durkheim.
