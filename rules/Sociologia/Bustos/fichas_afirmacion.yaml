- id: berger-luckmann.institucionalizacion
  eje: conceptos
  autor: Peter Berger y Thomas Luckmann
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Institución e institucionalización
  afirmacion: 'Para Berger y Luckmann, una institución es una interacción en la cual acciones y actores
    están tipificados; la institucionalización se da a partir de esa tipificación.

    '
  puntos:
  - Una institución es una interacción en la cual acciones y actores están tipificados.
  - «Institucionalización» y «Tipificación de acciones y actores» son conceptos de Berger y Luckmann.
  trampas:
  - texto: Un espacio delimitado que provee un servicio específico a la población.
    error: verdad_general
    por_que: Es la idea de sentido común (la escuela, el hospital); para Berger y Luckmann una institución
      es una tipificación de acciones y actores.
  - texto: Una comunidad regulada por un conjunto de normas escritas (y una autoridad que las hace cumplir).
    error: verdad_general
    por_que: 'No hacen falta normas escritas ni una autoridad: alcanza con que acciones y actores estén
      tipificados.'
  - texto: La aprehensión del significado de las acciones de otros.
    error: concepto_vecino
    por_que: Eso se acerca a la internalización (aprehender el significado del mundo), no a la institución.
  - texto: Atribuirle «Institucionalización» o «Tipificación de acciones y actores» a Heller o a Marx.
    error: concepto_vecino
    por_que: Heller piensa la sociedad desde la estructura socioeconómica; las instituciones son el concepto
      con el que la piensan Berger y Luckmann.
  pregunta_guia: ¿Qué tiene que estar tipificado para que haya una institución?
  explicacion_modelo: 'Una institución es una interacción en la que acciones y actores están tipificados.
    Para Berger y Luckmann hay institución cuando ciertas acciones se vuelven típicas y las realizan tipos
    de actores, no cuando hay un edificio o un reglamento. La opción más tentadora es la del espacio que
    presta un servicio, porque es como usamos la palabra a diario; tampoco hacen falta normas escritas
    ni una autoridad.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-05ab8991
  - q-81cfd932
  - q-c7c9358c
  estado: borrador
  notas: 'La clave de q-05ab8991 sale de marcas, pero coincide con el campus: las instituciones son el
    concepto de Berger y Luckmann en q-e8fe44c4 C y q-c8a0d9fc A.

    '
- id: berger-luckmann.orden-social
  eje: conceptos
  autor: Peter Berger y Thomas Luckmann
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: El orden social como producto humano (externalización y objetivación)
  afirmacion: 'El orden social es una producción humana constante, en el curso de la continua externalización
    del hombre; la objetivación es el momento en que esos productos externalizados alcanzan el carácter
    de objetividad.

    '
  puntos:
  - El orden social es una producción humana constante, en el curso de su continua externalización.
  - La objetivación es el momento en el que los productos externalizados de la actividad humana alcanzan
    el carácter de objetividad.
  trampas:
  - texto: El orden social deriva de datos biológicos, o forma parte de la naturaleza de las cosas y de
      sus leyes.
    error: verdad_general
    por_que: Para Berger y Luckmann el orden social es producto de la actividad humana, no un dato de
      la naturaleza.
  - texto: El orden social es producto del contrato social, de delegar el poder soberano al Estado.
    error: concepto_vecino
    por_que: Es la idea contractualista (Hobbes); Berger y Luckmann lo explican por la externalización
      constante.
  - texto: El orden social es el resultado de la suma de las voluntades individuales.
    error: verdad_general
    por_que: No es un acuerdo de voluntades, sino una producción continua de la actividad humana.
  - texto: La objetivación es el momento en que se internaliza al otro generalizado y finaliza la socialización
      primaria.
    error: concepto_vecino
    por_que: Eso describe la socialización (internalización), el movimiento inverso a la objetivación.
  - texto: La objetivación es la metodología que estudia los fenómenos sociales como «cosas», externas
      y objetivas.
    error: concepto_vecino
    por_que: Es la regla de método de Durkheim (tratar los hechos sociales como cosas), no la objetivación
      de Berger y Luckmann.
  - texto: La objetivación es la coacción y la presión que ejercen las figuras sociales sobre el individuo.
    error: concepto_vecino
    por_que: Mezcla la coacción de Durkheim con las «figuras sociales» de Elías.
  - texto: La objetivación es la etapa última de aprendizaje de la socialización secundaria.
    error: dato_inventado
    por_que: 'La objetivación no es una etapa de la socialización: es lo que les pasa a los productos
      de la actividad humana.'
  pregunta_guia: ¿Quién produce el orden social según Berger y Luckmann, y qué pasa con lo que producimos
    cuando se «objetiva»?
  explicacion_modelo: 'El orden social es una producción humana constante, que se da en la continua externalización,
    y la objetivación es el momento en que esos productos externalizados alcanzan carácter de objetividad.
    Para Berger y Luckmann lo social lo hacemos nosotros, pero después se nos presenta como algo objetivo,
    que está afuera. La trampa más tentadora en objetivación es la de estudiar los fenómenos sociales
    como "cosas": suena parecida, pero es la regla de método de Durkheim, no un momento del proceso social.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-5af0a7ac
  - q-af0bf53c
  - q-c26aa0dd
  estado: borrador
  notas: 'q-af0bf53c A da como falso, para «objetivación», que «se internaliza al otro generalizado y
    finaliza la socialización primaria»; esa frase parece describir bien otro concepto de Berger y Luckmann
    (ver berger-luckmann.socializacion). Validar con el texto.

    '
- id: berger-luckmann.socializacion
  eje: conceptos
  autor: Peter Berger y Thomas Luckmann
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Internalización, socialización y otro generalizado
  afirmacion: 'La socialización permite comprender cómo la sociedad se reproduce en la subjetividad de
    cada uno de sus miembros: por la internalización, los individuos incorporan valores, normas y creencias
    y aprehenden el significado del mundo que los rodea.

    '
  puntos:
  - La reproducción de la sociedad sería imposible sin un proceso en el cual los individuos incorporan
    valores, normas y creencias que les permiten interactuar y comprender a los otros (internalización).
  - Para que se reproduzca la sociedad hace falta que los individuos logren aprehender el significado
    del mundo que los rodea.
  - La socialización permite comprender la manera en que la sociedad se reproduce en la subjetividad de
    cada uno de los miembros que la conforman.
  - El otro generalizado es el reconocimiento de acciones y roles abstraídos de las personas.
  - «Socialización primaria» es un concepto de Berger y Luckmann.
  trampas:
  - texto: La sociedad interioriza los deseos y aspiraciones de los individuos a lo largo de un proceso.
    error: cambio_de_palabra
    por_que: 'Invierte el sentido: son los individuos los que internalizan la sociedad.'
  - texto: Los hombres nacemos naturalmente como seres sociales.
    error: verdad_general
    por_que: Si naciéramos sociales no haría falta internalizar nada; para Berger y Luckmann llegamos
      a ser miembros de la sociedad.
  - texto: El comportamiento social reposa en la amenaza de la sanción colectiva.
    error: concepto_vecino
    por_que: Es una idea de coacción a lo Durkheim; Berger y Luckmann ponen el acento en lo que el individuo
      incorpora.
  - texto: La racionalidad de los individuos es suficiente para asegurar el vínculo social.
    error: absoluto_falso
    por_que: El «suficiente» deja afuera la internalización, que es lo que hace posible la reproducción
      de la sociedad.
  - texto: La socialización explica la particularidad de cada individuo a pesar de las coacciones, o el
      sentido que los individuos les imprimen a sus acciones.
    error: concepto_vecino
    por_que: «Particularidad» es de Heller y el sentido de la acción remite a Weber; la socialización
      explica cómo la sociedad entra en la subjetividad.
  - texto: La socialización explica cómo los individuos se asocian y consensúan normas, o se unen detrás
      de un objetivo común.
    error: verdad_general
    por_que: 'No es un acuerdo entre individuos: es la sociedad reproduciéndose en cada uno.'
  - texto: El otro generalizado es la ultrageneralización que caracteriza la cotidianidad.
    error: concepto_vecino
    por_que: Juega con la palabra «general»; el otro generalizado es el reconocimiento de roles abstraídos
      de las personas.
  - texto: El otro generalizado es el inicio de la socialización primaria.
    error: cambio_de_palabra
    por_que: 'No está al principio: se alcanza cuando el chico ya reconoce roles abstraídos de las personas
      concretas.'
  - texto: El otro generalizado es la distribución social del conocimiento, o la carga afectiva que acompaña
      la internalización.
    error: concepto_vecino
    por_que: Pueden sonar al mismo autor, pero no definen al otro generalizado.
  pregunta_guia: ¿Qué incorpora el individuo al socializarse, y qué quiere decir que reconozca roles «abstraídos
    de las personas»?
  explicacion_modelo: 'La internalización muestra que la sociedad no podría reproducirse si los individuos
    no incorporaran sus valores, normas y creencias y no aprehendieran el significado del mundo que los
    rodea. Para Berger y Luckmann, la socialización es justamente la sociedad reproduciéndose en la subjetividad
    de cada uno. La trampa más tentadora es "la sociedad interioriza los deseos de los individuos": usa
    las mismas palabras, pero da vuelta quién internaliza a quién.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-7bc99f77
  - q-1e2e707c
  - q-18a0d17b
  - q-8e8145e8
  estado: borrador
  notas: 'q-7bc99f77 tiene dos versiones del campus con distinta letra correcta (A en v1, E en v2) porque
    cambian las opciones; las dos claves dicen lo mismo y la ficha enseña ambas. Que el otro generalizado
    se alcance al final de la socialización primaria sale de una opción de q-af0bf53c, no de una clave;
    validar con el texto. La «ultrageneralización» suele atribuirse al pensamiento cotidiano en Heller;
    el examen no lo dice.

    '
- id: berger-luckmann.coincidencias-con-heller
  eje: conceptos
  autor: Peter Berger y Thomas Luckmann
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: En qué coinciden Heller y Berger y Luckmann
  afirmacion: 'Heller y Berger y Luckmann coinciden en que la vida individual se reproduce en un ambiente
    social determinado y en que el orden social se sostiene en conductas habituales que no requieren reflexión.
    Los dos se preguntan qué distingue al ser humano de otras especies y por qué procesos sociales las
    personas están en relación permanente con su sociedad.

    '
  puntos:
  - Para todos estos autores, la reproducción de las condiciones de la vida individual se da en un ambiente
    social determinado (las personas reproducen su vida en un determinado ambiente social).
  - En ambas perspectivas, el orden social se mantiene en base a conductas habituales que no requieren
    reflexión; esas conductas son importantes para su funcionamiento.
  - Coinciden en que hay elementos que distinguen al ser humano de otras especies animales, y se preguntan
    cuáles son.
  - Coinciden en que es importante identificar mediante qué procesos sociales las personas están en relación
    permanente con la sociedad en la que viven.
  - Comparten la pregunta de cómo se reproduce la sociedad en las relaciones íntimas y cotidianas.
  trampas:
  - texto: Todos parten para su análisis del concepto de «extrañación».
    error: concepto_vecino
    por_que: La extrañación es un concepto de Heller; Berger y Luckmann no parten de él.
  - texto: La tesis marxista que explica la vida social a partir de las relaciones sociales de producción
      es el punto de partida de ambos textos.
    error: verdad_general
    por_que: Suena a sociología clásica, pero Berger y Luckmann piensan la sociedad desde las instituciones.
  - texto: Las relaciones (sociales) de producción son el único elemento determinante, o a considerar,
      de la vida cotidiana.
    error: absoluto_falso
    por_que: Ninguno sostiene ese «único»; tampoco comparten la pregunta de si la vida cotidiana está
      determinada por las relaciones de producción.
  - texto: La biología (la organización biológica) determina al individuo y su comportamiento social.
    error: verdad_general
    por_que: Los dos explican la vida de las personas por procesos sociales, no biológicos.
  - texto: Parten de entender al individuo solamente como un organismo biológico.
    error: absoluto_falso
    por_que: El «solamente» deja todo en la biología; para ambos el individuo se hace en un ambiente social.
  - texto: El tipo de racionalidad de las acciones constituye un elemento central en ambos textos.
    error: concepto_vecino
    por_que: Los tipos de racionalidad de la acción remiten a Weber; Heller y Berger y Luckmann destacan
      lo habitual e irreflexivo.
  - texto: Todos los comportamientos sociales se derivan de actitudes racionales y premeditadas.
    error: absoluto_falso
    por_que: 'Choca con lo que sí comparten: gran parte del orden social descansa en conductas habituales
      sin reflexión.'
  - texto: La sociedad se desarrolla en condiciones históricas aleatorias y excepcionales, por lo que
      no hay regularidades.
    error: dato_inventado
    por_que: Ninguno lo dice; al contrario, los dos buscan los procesos que reproducen la sociedad.
  pregunta_guia: ¿Dónde se reproduce la vida de cada persona según los dos enfoques, y qué papel juegan
    las conductas habituales?
  explicacion_modelo: 'Es verdadero que, para los dos enfoques, la vida individual se reproduce en un
    ambiente social determinado y que el orden social se sostiene en conductas habituales que no requieren
    reflexión. Heller y Berger y Luckmann miran cómo la sociedad se reproduce en lo cotidiano y por qué
    procesos las personas quedan ligadas a ella. La trampa más tentadora es que "todos parten de la extrañación":
    es un concepto de Heller, así que no puede ser el punto en común. También es falso cualquier determinismo,
    biológico o de las relaciones de producción.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-2b71b765
  - q-c28c610f
  - q-57e02c33
  - q-fa4a8a95
  - q-c652f758
  - q-49cf1015
  estado: borrador
  notas: Las claves de q-2b71b765, q-c28c610f, q-57e02c33 y q-c652f758 salen de marcas, pero coinciden
    con las del campus (q-fa4a8a95, q-49cf1015 y q-e8fe44c4 E). La ficha compara a dos autores, por eso
    el campo autor nombra a ambos. Compara con Agnes Heller.
- id: berger-luckmann.comparacion-con-heller
  eje: conceptos
  autor: Peter Berger y Thomas Luckmann
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Qué concepto de Heller se parece a cuál de Berger y Luckmann
  afirmacion: 'Heller piensa la sociedad a partir de la "estructura socioeconómica"; Berger y Luckmann,
    a partir de las "instituciones". Se parecen la socialización y la maduración (cómo las personas se
    vuelven seres sociales), y la habituación y la acción cotidiana espontánea y pragmática (gran parte
    de la vida social es irreflexiva).

    '
  puntos:
  - Heller piensa la sociedad a partir del concepto de «estructura socioeconómica»; Berger y Luckmann,
    a partir del concepto de «instituciones».
  - 'La «socialización» de Berger y Luckmann y la «maduración» de Heller son similares: ambas hablan del
    proceso por el cual las personas se convierten en seres sociales.'
  - 'La acción cotidiana «espontánea» y «pragmática» de Heller se parece a la «habituación» de Berger
    y Luckmann: ambas indican que gran parte de la vida social es irreflexiva.'
  - Según Berger y Luckmann, un mundo institucional se experimenta como realidad objetiva, tiene una historia
    que antecede al nacimiento del individuo y no es accesible a su memoria biográfica.
  - Según Heller, cuando la particularidad somete a lo específico se anteponen las necesidades individuales
    frente a los intereses y necesidades de la integración social.
  trampas:
  - texto: «Ser específico» (Heller) e «institución» (Berger y Luckmann) son semejantes porque remiten
      a normas y roles típicos que impone cada sociedad.
    error: concepto_vecino
    por_que: El ser específico remite a las capacidades del género humano, no a normas ni roles; los roles
      típicos son cosa de la institución.
  - texto: «Socialización» (Berger y Luckmann) y «homogeneización» (Heller) son similares porque explican
      por qué todos los individuos actúan de la misma manera.
    error: concepto_vecino
    por_que: La socialización se empareja con la maduración; la homogeneización es concentrarse en lo
      genérico, no uniformarse.
  - texto: «Habituación» (Berger y Luckmann) y «regimiento de la vida» (Heller) son similares porque explican
      por qué todos los individuos actúan de la misma manera.
    error: concepto_vecino
    por_que: La habituación se empareja con la acción espontánea y pragmática, y el motivo de «actuar
      todos igual» es inventado.
  - texto: «Externalización» (Berger y Luckmann) y «homogeneización» (Heller) se parecen porque refieren
      a cómo se diferencian las percepciones de las relaciones sociales.
    error: dato_inventado
    por_que: 'Ninguno de los dos conceptos trata de percepciones: la externalización produce el orden
      social y la homogeneización conecta con lo genérico.'
  - texto: Según Berger y Luckmann, la socialización empieza con el nacimiento y termina en la edad adulta.
    error: dato_inventado
    por_que: 'Le pone un final que no tiene: después de la socialización primaria sigue la secundaria.'
  - texto: Según Berger y Luckmann, la vida cotidiana es el conjunto de actividades en que se reproducen
      las personas y las estructuras socioeconómicas.
    error: concepto_vecino
    por_que: Es la mirada de Heller (reproducción del particular y estructura socioeconómica) puesta en
      boca de Berger y Luckmann.
  - texto: Según Heller, hay que desarrollar una capacidad mental que poseen todos los individuos y que
      permite vincular la biografía con la historia.
    error: concepto_vecino
    por_que: Es la imaginación sociológica de Mills, no un concepto de Heller.
  pregunta_guia: En cada par de conceptos, ¿hablan del mismo proceso? ¿Desde qué concepto piensa la sociedad
    cada autor?
  explicacion_modelo: 'Son verdaderos tres emparejamientos: estructura socioeconómica (Heller) frente
    a instituciones (Berger y Luckmann), socialización con maduración, y habituación con la acción espontánea
    y pragmática. Cada par habla del mismo proceso: volverse ser social, o actuar sin reflexionar. La
    trampa más tentadora usa conceptos reales mal emparejados y con un motivo armado ("por qué todos actúan
    igual"), que no describe a ninguno. Ojo también con las definiciones cambiadas de autor, como la imaginación
    sociológica de Mills atribuida a Heller.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-0f50144a
  - q-c3e967d6
  - q-a7976efb
  estado: borrador
  notas: Las claves de q-0f50144a salen de marcas y ninguna contradice al campus. Que la definición de
    q-0f50144a C sea de Heller se deduce de heller.vida-cotidiana y de q-e8fe44c4 C; validar. «Maduración»
    y «habituación» solo aparecen en estas comparaciones; si el banco crece, pueden pedir ficha propia.
    Compara con Agnes Heller.
- id: lefebvre.lenguaje
  eje: conceptos
  autor: Henri Lefebvre
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: El lenguaje como existencia de la conciencia
  afirmacion: 'El lenguaje es el medio natural y social de la conciencia: es la existencia de la conciencia,
    que nace como necesidad de comunicación.

    '
  puntos:
  - «Es el medio natural y social de la conciencia, es la existencia de la conciencia que nace como necesidad
    de comunicación» es la definición de lenguaje.
  trampas:
  - texto: Elegir «Ideología».
    error: concepto_vecino
    por_que: También tiene que ver con la conciencia, pero el examen define la ideología como representaciones
      que crean una conciencia parcial y fragmentaria.
  - texto: Elegir «Infraestructura».
    error: concepto_vecino
    por_que: El examen la define como el nivel de la sociedad que une fuerzas productivas y relaciones
      de producción, no como la conciencia.
  - texto: Elegir «Concepción jurídica del poder» o «Anatomopolítica».
    error: concepto_vecino
    por_que: Son conceptos sobre el poder (Foucault), no sobre la conciencia.
  pregunta_guia: ¿Qué concepto es, a la vez, la forma en que existe la conciencia y lo que nace de la
    necesidad de comunicarse?
  explicacion_modelo: 'Es "Lenguaje". La definición dice que la conciencia existe en el lenguaje y que
    el lenguaje nace de la necesidad de comunicarse con otros. La opción más tentadora es "Ideología",
    porque también habla de la conciencia; pero la ideología son representaciones que dan una conciencia
    parcial y fragmentaria, no el medio en el que la conciencia existe.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-6fa13b00
  estado: borrador
  notas: 'El examen no nombra al autor. El banco agrupó la pregunta con Berger y Luckmann, pero la definición
    sigue a Marx y Engels (La ideología alemana: el lenguaje nace, como la conciencia, de la necesidad
    de intercambio con los otros) y comparte opciones con Ideología, Infraestructura y Anatomopolítica
    (mismo examen, Final 02/2022). Probablemente viene del texto de Lefebvre sobre Marx. Validar el autor
    y mover la ficha antes de publicar. Los motivos de las trampas usan definiciones de otras preguntas
    del banco (q-38c4d652, q-fabbad14). Autor asignado por contenido (el lenguaje nace, como la conciencia,
    de la necesidad de comunicarse: Marx y Engels, vía Lefebvre). Validar con el texto.'
- id: elias.interdependencia
  eje: conceptos
  autor: Norbert Elías
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: La sociedad y las instituciones como entramado de dependencias recíprocas
  afirmacion: 'Para Elías, la relación entre las personas que forman una sociedad, y también las instituciones,
    deben entenderse como un complejo entramado de dependencias recíprocas. El malestar en las sociedades
    científico-técnicas nace de las coacciones que esos grupos interdependientes se ejercen unos a otros.

    '
  puntos:
  - La relación entre las personas individuales que conforman una sociedad debe entenderse como un complejo
    entramado de dependencias recíprocas.
  - Las instituciones (sociales) deben entenderse como un entramado de dependencias recíprocas entre los
    individuos.
  - «Relaciones de interdependencia entre los individuos» es un concepto de Elías.
  - El malestar en las sociedades científico-técnico-industriales lo causan las coacciones que las personas
    ejercen unas sobre otras y el modo en que utilizan los avances científico-tecnológicos.
  - Dicho de otro modo, lo causan las amenazas y coacciones de grupos humanos interdependientes, producidas
    en sus relaciones recíprocas.
  trampas:
  - texto: Un «yo» individual rodeado por las «figuras sociales» que forman la sociedad.
    error: concepto_vecino
    por_que: Es el modelo egocéntrico que Elías critica; el yo no está en el centro, está dentro del entramado.
  - texto: Una relación desigual en la cual la sociedad (o la institución) les impone su voluntad o sus
      normas a los individuos.
    error: concepto_vecino
    por_que: Pinta a la sociedad como algo exterior que se impone; para Elías las dependencias son recíprocas.
  - texto: Una suma de individuos cuyas características personales determinan el tipo de sociedad (o de
      institución).
    error: verdad_general
    por_que: Reduce la sociedad a individuos sueltos; para Elías lo que cuenta son las relaciones entre
      ellos.
  - texto: El resultado de la relación social entre el capital y el trabajo.
    error: concepto_vecino
    por_que: Es una explicación desde Marx; Elías habla de interdependencias, no de relaciones de producción.
  - texto: La institucionalización de los hechos sociales, o la posición jerárquica que ocupan los individuos
      en el entramado.
    error: concepto_vecino
    por_que: Mezcla vocabulario de otros autores o de jerarquías; lo que define a la institución es la
      dependencia recíproca.
  - texto: El malestar lo causan la bomba atómica y la guerra científicamente dirigida, o la vida en las
      ciudades tecnificadas y las fábricas.
    error: verdad_general
    por_que: Culpa a la técnica en sí; para Elías el problema está en cómo las personas se coaccionan
      y usan esos avances.
  - texto: El malestar lo causan la incapacidad de relacionarse de manera más saludable con los otros,
      o las formas de pensamiento mítico-mágicas.
    error: verdad_general
    por_que: Suenan razonables, pero Elías ubica la causa en las coacciones entre grupos interdependientes.
  pregunta_guia: Según Elías, ¿la sociedad está afuera del individuo o es una red de relaciones? ¿De dónde
    sale el malestar?
  explicacion_modelo: 'La respuesta es "un complejo entramado de dependencias recíprocas", tanto para
    la sociedad como para las instituciones. Para Elías no hay un individuo por un lado y la sociedad
    por otro: las personas dependen unas de otras, y de esas mismas relaciones salen las coacciones que
    explican el malestar en las sociedades científico-técnicas. La opción más tentadora es la del "yo"
    rodeado de figuras sociales, porque usa vocabulario de Elías; pero es el modelo egocéntrico que él
    critica.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-f4991797
  - q-e7540ed3
  - q-094386c4
  - q-cd4a172d
  - q-1ebc0bcc
  estado: borrador
  notas: 'q-1ebc0bcc tiene dos versiones del campus con distinta letra correcta (B en v1, C en v2) porque
    cambian las opciones; las dos claves dicen lo mismo con otras palabras y la ficha enseña ambas. Elías
    suele hablar de «figuraciones»; el examen usa «figuras sociales» y «entramado».

    '
- id: elias.modelo-egocentrico
  eje: conceptos
  autor: Norbert Elías
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: El modelo egocéntrico y la cosificación de las figuras sociales
  afirmacion: 'Elías critica el modelo egocéntrico de la sociedad: la imagen de un "yo" individual en
    el centro, rodeado por "figuras sociales" pensadas como cosas exteriores a él. Esa cosificación de
    las figuras sociales oculta que son entramados de dependencias recíprocas.

    '
  puntos:
  - «Modelo egocéntrico» es un concepto de Elías.
  - «Figuras sociales» es un concepto de Elías.
  - «Cosificación de las figuras sociales» es un concepto de Elías.
  trampas:
  - texto: Atribuirle «Cosificación de las figuras sociales» o «Figuras sociales» a Marx, Weber o Althusser.
    error: concepto_vecino
    por_que: «Cosificación» suena a la tradición marxista, pero la frase completa nombra la crítica de
      Elías a pensar las figuras sociales como cosas.
  - texto: Atribuirle «Modelo egocéntrico» a Heller o a Mills.
    error: concepto_vecino
    por_que: Heller habla del ser particular y Mills de la biografía, pero el modelo egocéntrico es la
      imagen de la sociedad que critica Elías.
  pregunta_guia: ¿Qué hay en el centro del modelo egocéntrico y por qué Elías dice que cosifica a las
    figuras sociales?
  explicacion_modelo: 'Los tres conceptos son de Elías. Él critica el modelo egocéntrico, que pone al
    "yo" en el centro y a las figuras sociales alrededor, como si fueran cosas exteriores; eso es la cosificación
    de las figuras sociales. La confusión más común es mandar "cosificación" a Marx por cómo suena la
    palabra; en esta materia la frase completa, "cosificación de las figuras sociales", es de Elías.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-09aebc8f
  - q-53340614
  - q-5a9423bd
  estado: borrador
  notas: 'El examen solo pregunta el autor de estos conceptos. El contenido (el yo en el centro y las
    figuras sociales alrededor) sale de los distractores de elias.interdependencia (q-e7540ed3 B, q-094386c4
    C, q-cd4a172d D), que el examen da por falsos como definición de sociedad o de institución. Validar
    con el texto.

    '
- id: elias.modelos-heteronomos
  eje: conceptos
  autor: Norbert Elías
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: La tarea de la sociología y los modelos heterónomos
  afirmacion: 'Para Elías, la sociología no solo debe investigar y explicar los procesos sociales, sino
    también liberar al pensamiento y al lenguaje de los sociólogos de las ataduras a modelos heterónomos,
    egocéntricos y antropomórficos.

    '
  puntos:
  - La sociología no solo debe investigar y explicar los procesos sociales, sino también liberar al pensamiento
    y al lenguaje de los sociólogos de las ataduras a modelos heterónomos, egocéntricos, antropomórficos.
  - «Representaciones heterónomas» y «Modelos heterónomos» son conceptos de Elías.
  trampas:
  - texto: Intervenir en los procesos sociales para encauzarlos en una dirección determinada.
    error: verdad_general
    por_que: Suena a compromiso político; lo que Elías le suma a la sociología es revisar su propio pensamiento
      y lenguaje.
  - texto: Construir modelos de pensamiento que den cuenta de la realidad objetiva de esos procesos.
    error: media_verdad
    por_que: Parece seguir a «investigar y explicar», pero Elías pide liberarse de ciertos modelos, no
      construir otros.
  - texto: Establecer esquemas que permitan a los sociólogos predecir el devenir de esos procesos.
    error: verdad_general
    por_que: La predicción no es la tarea que agrega Elías.
  - texto: Adaptar los conceptos de las ciencias naturales para dar más precisión al lenguaje sociológico.
    error: verdad_general
    por_que: Elías habla de liberar el lenguaje de modelos heterónomos, no de importar conceptos de otras
      ciencias.
  - texto: Atribuirle «Modelos heterónomos» o «Representaciones heterónomas» a Durkheim, Weber o Heller.
    error: concepto_vecino
    por_que: Son conceptos de Elías, ligados a su crítica de cómo pensamos la sociedad.
  pregunta_guia: Además de investigar y explicar, ¿de qué tiene que liberarse el pensamiento de los sociólogos
    según Elías?
  explicacion_modelo: 'Además de investigar y explicar los procesos sociales, la sociología debe liberar
    el pensamiento y el lenguaje de los sociólogos de los modelos heterónomos, egocéntricos y antropomórficos.
    Para Elías, nuestra forma de pensar la sociedad todavía arrastra esos modelos, y la sociología tiene
    que revisarlos. La opción más tentadora es la de adaptar conceptos de las ciencias naturales: suena
    a ganar precisión, pero lo que pide Elías es sacarse de encima esas ataduras.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-53f93e3d
  - q-fa1f23e2
  - q-9a87eba2
  estado: borrador
  notas: 'El examen no define «heterónomo» ni «antropomórfico». Validar con el texto qué entiende Elías
    por representaciones heterónomas (suelen explicarse como cargadas de deseos y temores, frente a representaciones
    más ajustadas a la realidad) antes de agregarlo a la ficha.

    '
- id: althusser.aparatos-del-estado
  eje: conceptos
  autor: Louis Althusser
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: El Estado y sus aparatos (represivos e ideológicos)
  afirmacion: 'Para Althusser, el Estado es un instrumento de las clases dominantes para mantener las
    relaciones sociales de producción. Esas relaciones se reproducen mediante la ideología dominante,
    con los Aparatos Represivos y los Aparatos Ideológicos del Estado, que pueden ser públicos o privados.

    '
  puntos:
  - Según Althusser, el Estado es un instrumento de las clases dominantes para mantener las relaciones
    sociales de producción.
  - Las relaciones sociales de producción se reproducen mediante la ideología dominante.
  - «Aparatos Represivos del Estado» es un concepto de Althusser.
  - Los Aparatos Ideológicos del Estado son públicos y privados.
  trampas:
  - texto: El Estado representa los intereses de todo el pueblo, o es la síntesis jurídico-política que
      representa por igual a todas las clases.
    error: verdad_general
    por_que: Es la imagen del Estado neutral; para Althusser el Estado sirve a las clases dominantes.
  - texto: El Estado es el instrumento de la clase proletaria para evitar que la exploten.
    error: cambio_de_palabra
    por_que: Invierte la clase; el Estado es instrumento de las clases dominantes, no de los explotados.
  - texto: El Estado es un andamiaje jurídico con control ciudadano.
    error: verdad_general
    por_que: Suena a definición de manual, pero deja afuera lo central para Althusser, que es la dominación
      de clase.
  - texto: Las relaciones de producción se reproducen mediante el accionar microfísico del poder.
    error: concepto_vecino
    por_que: La microfísica del poder es de Foucault; Althusser pone la reproducción en la ideología dominante.
  - texto: Se reproducen mediante el poder «amorfo» del Estado, la coacción de los hechos sociales o la
      opacidad ideológica.
    error: concepto_vecino
    por_que: El poder «amorfo» es de Weber, la coacción de los hechos sociales de Durkheim y la opacidad
      de la ideología de Lefebvre.
  - texto: Los Aparatos Ideológicos del Estado son todos públicos, todos privados o todos comunitarios
      con control estatal.
    error: absoluto_falso
    por_que: El «todos» es el error; hay AIE públicos y privados (la escuela, la iglesia, la familia).
  - texto: Atribuirle «Aparatos Represivos del Estado» a Weber o a Marx.
    error: concepto_vecino
    por_que: Marx habla del Estado de clase y Weber del monopolio de la violencia, pero la distinción
      entre aparatos represivos e ideológicos es de Althusser.
  pregunta_guia: ¿A quién sirve el Estado según Althusser y con qué dos tipos de aparatos mantiene las
    relaciones de producción?
  explicacion_modelo: 'Según Althusser, el Estado es un instrumento de las clases dominantes para mantener
    las relaciones sociales de producción. Esas relaciones se reproducen mediante la ideología dominante,
    que circula por los Aparatos Ideológicos del Estado (públicos y privados), con el respaldo de los
    Aparatos Represivos. La opción más tentadora es la del Estado que «representa los intereses de todo
    el pueblo»: suena bien, pero es justo la idea del Estado neutral que Althusser discute.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-d9421ce9
  - q-c128dd4a
  - q-f3ce3422
  - q-ddfab5fc
  estado: borrador
- id: althusser.ideologia-en-general
  eje: conceptos
  autor: Louis Althusser
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: La ideología en general y su existencia material
  afirmacion: 'Althusser propone una teoría de la ideología en general: la ideología tiene existencia
    material, porque son las prácticas sociales las que producen las representaciones ideológicas, y articula
    el orden social con la producción de la subjetividad.

    '
  puntos:
  - «Ideología general» o «Ideología en general» es un concepto de Althusser.
  - Una de las tesis de Althusser es que la ideología tiene existencia material.
  - Que las ideologías tengan existencia material significa que son las prácticas sociales las que producen
    las representaciones ideológicas.
  - El concepto de ideología en Althusser da cuenta de la articulación entre el orden social y la producción
    de la subjetividad.
  trampas:
  - texto: Que tenga existencia material significa que las ideas de cada individuo se plasman en la vida
      cotidiana.
    error: verdad_general
    por_que: Es la lectura de sentido común que Althusser da vuelta; no van de las ideas a las prácticas,
      sino de las prácticas a las representaciones.
  - texto: Que tenga existencia material significa que la ideología es la relación imaginaria con las
      condiciones reales de existencia.
    error: concepto_vecino
    por_que: Es otra tesis de Althusser, pero no explica qué quiere decir que la ideología sea material.
  - texto: Que tenga existencia material significa que la ideología aparece como evidente frente a los
      sujetos que la portan.
    error: concepto_vecino
    por_que: Habla del efecto de la ideología sobre los sujetos, no de su materialidad en prácticas.
  - texto: Las ideologías se transmiten principalmente a través de los Aparatos Represivos del Estado.
    error: cambio_de_palabra
    por_que: Cambia «ideológicos» por «represivos»; la ideología circula por los Aparatos Ideológicos.
  - texto: La ideología es la representación transparente que el individuo se hace de sus condiciones
      materiales.
    error: cambio_de_palabra
    por_que: La ideología no es un reflejo transparente; es una representación imaginaria.
  - texto: La ideología es la interpretación que hace cada individuo de sus condiciones reales de existencia.
    error: media_verdad
    por_que: Menciona las condiciones reales de existencia, pero la vuelve algo individual; para Althusser
      la ideología existe en prácticas y aparatos.
  - texto: La ideología articula las relaciones de producción y las fuerzas productivas, o la plusvalía
      y el salario.
    error: concepto_vecino
    por_que: Esas son articulaciones de la base económica (Marx); la ideología articula el orden social
      con la producción de subjetividad.
  - texto: Atribuirle «Ideología en general» a Marx.
    error: concepto_vecino
    por_que: Marx escribió sobre la ideología, pero la teoría de la ideología en general, con existencia
      material, es de Althusser.
  pregunta_guia: ¿Dónde existe la ideología para Althusser, en las ideas de cada uno o en las prácticas?
    ¿Qué une el orden social con la formación de los sujetos?
  explicacion_modelo: 'Para Althusser la ideología tiene existencia material: no está solo en la cabeza
    de las personas, sino que son las prácticas sociales las que producen las representaciones ideológicas.
    Por eso su concepto de ideología articula el orden social con la producción de la subjetividad. La
    trampa más tentadora es «las ideas de cada individuo se plasman en la vida cotidiana»: suena parecida,
    pero va en la dirección contraria, de las ideas a las prácticas.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-8ef6282c
  - q-ee73f8c5
  - q-004052f5
  - q-e96e7165
  - q-5d046501
  estado: borrador
  notas: 'La tesis de la ideología como «relación imaginaria con las condiciones reales de existencia»
    solo aparece en el banco como opción falsa de q-ee73f8c5 (responde a otra pregunta); la ficha la presenta
    como otra tesis de Althusser y la usa para explicar por qué la ideología no es «transparente». Validar
    con el texto. q-e96e7165 dice «Ideología general» y q-5d046501 «Ideología en general»: se toman como
    el mismo concepto.

    '
- id: althusser.interpelacion
  eje: conceptos
  autor: Louis Althusser
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: La interpelación ideológica y la conformación de los sujetos
  afirmacion: 'Según Althusser, los sujetos se conforman por la interpelación ideológica que llevan adelante
    los Aparatos Ideológicos del Estado. La interpelación combina la concepción de sujeto con la ideología
    dominante y tiene una estructura especular: el sujeto se reconoce a través de la interpelación de
    un Sujeto.

    '
  puntos:
  - «Interpelación» es un concepto de Althusser.
  - La conformación de los sujetos se da a través de la interpelación ideológica.
  - La conformación de los sujetos se da a través de los Aparatos Ideológicos del Estado.
  - 'La interpelación ideológica se entiende a partir de dos elementos: la concepción de sujeto y la ideología
    dominante.'
  - 'Estructura especular de la ideología: el sujeto se reconoce a través de la interpelación de un Sujeto.'
  trampas:
  - texto: La conformación de los sujetos se da a través de los Aparatos Represivos del Estado.
    error: cambio_de_palabra
    por_que: Cambia «ideológicos» por «represivos»; los sujetos se forman por la vía ideológica, no por
      la represión.
  - texto: Se da a través de la coerción que ejercen sobre ellos los hechos sociales.
    error: concepto_vecino
    por_que: La coerción de los hechos sociales es de Durkheim.
  - texto: Se da a través de las acciones sociales que los determinan, o de las acciones sociales intersubjetivas.
    error: concepto_vecino
    por_que: Es el lenguaje de la acción social (Weber); para Althusser el sujeto no sale de sus acciones,
      sino de la ideología que lo interpela.
  - texto: Se da a través del modo de producción o de las fuerzas productivas.
    error: concepto_vecino
    por_que: Son conceptos de la base económica; la subjetividad se produce en el plano ideológico.
  - texto: La interpelación se entiende a partir de la concepción de sujeto y la materialidad ideológica.
    error: media_verdad
    por_que: Arranca bien con el sujeto, pero el segundo elemento es la ideología dominante.
  - texto: La interpelación se entiende a partir de la ideología dominante y el modo de producción, o
      la ideología dominante y el concepto de Estado.
    error: media_verdad
    por_que: La ideología dominante está bien, pero falta la concepción de sujeto, que es lo que la interpelación
      produce.
  - texto: Para la definición del sujeto que se reconoce en un Sujeto, elegir «Dominación carismática»
      o «Dominación legítima».
    error: concepto_vecino
    por_que: Son conceptos de Weber; el reconocimiento del sujeto en un Sujeto es la estructura especular
      de la ideología.
  pregunta_guia: ¿Cómo se convierte un individuo en sujeto para Althusser? ¿Quién lo llama y en quién
    se reconoce?
  explicacion_modelo: 'Para Althusser los sujetos se conforman por la interpelación ideológica que llevan
    adelante los Aparatos Ideológicos del Estado: la ideología dominante «llama» a los individuos y los
    constituye como sujetos. Por eso la interpelación se entiende a partir de la concepción de sujeto
    y la ideología dominante, con una estructura especular: el sujeto se reconoce en un Sujeto que lo
    interpela. La trampa tentadora es «la concepción de sujeto y la materialidad ideológica»: empieza
    bien, pero el segundo elemento es la ideología dominante.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-df563cb6
  - q-328248fb
  - q-3d879020
  - q-873a18cd
  estado: borrador
  notas: 'q-df563cb6 tiene dos claves según la versión: «la interpelación ideológica» (v1, marcas) y «los
    Aparatos Ideológicos del Estado» (v2 marcas y v3 campus). No se contradicen: en la v1 los AIE no están
    entre las opciones y en las otras no está la interpelación. La ficha enseña las dos.

    '
- id: althusser.infraestructura-superestructura
  eje: conceptos
  autor: Louis Althusser
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Los niveles de la sociedad, infraestructura y superestructura
  afirmacion: 'Según Althusser, la estructura de toda sociedad está constituida por niveles: la infraestructura,
    que es la unidad de fuerzas productivas y relaciones de producción, y la superestructura, que tiene
    una instancia jurídico-política y otra ideológica.

    '
  puntos:
  - 'Superestructura: el nivel de la sociedad que tiene una instancia jurídico-política y otra ideológica.'
  - 'Infraestructura: el nivel de la sociedad que es la unidad de fuerzas productivas y relaciones de
    producción.'
  trampas:
  - texto: Para el nivel con una instancia jurídico-política y otra ideológica, elegir «Ideología».
    error: concepto_vecino
    por_que: La ideología es solo una de las dos instancias; el nivel completo es la superestructura.
  - texto: Para la unidad de fuerzas productivas y relaciones de producción, elegir «Ideología».
    error: concepto_vecino
    por_que: Fuerzas productivas y relaciones de producción forman la base económica, no el plano de las
      ideas.
  - texto: Confundir la instancia jurídico-política con la «Concepción jurídica del poder».
    error: concepto_vecino
    por_que: La concepción jurídica del poder es el modelo que critica Foucault, no un nivel de la sociedad.
  - texto: Para el nivel jurídico-político e ideológico, elegir «Carácter concurrente de las ideologías».
    error: concepto_vecino
    por_que: Ese rasgo de las ideologías es de Duby; no describe un nivel de la estructura social.
  pregunta_guia: ¿Qué niveles distingue Althusser en toda sociedad y qué contiene cada uno?
  explicacion_modelo: 'Según Althusser, toda sociedad tiene niveles: la infraestructura (la base económica),
    que es la unidad de fuerzas productivas y relaciones de producción, y la superestructura, con dos
    instancias, la jurídico-política y la ideológica. La trampa típica es elegir «Ideología» para la superestructura:
    la ideología es solo una de sus dos instancias, no el nivel completo.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-74f8380a
  - q-fabbad14
  estado: borrador
  notas: 'Althusser retoma la imagen del edificio de Marx (base y superestructura). En las de relacionar,
    el banco da «Estructura y superestructura» como concepto de Marx (q-f236ff14, en marx.modo-de-produccion);
    acá las definiciones por niveles se enseñan como de Althusser porque así las clasifica el banco.

    '
- id: althusser.poder-vs-weber
  eje: conceptos
  autor: Louis Althusser
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Poder y dominación, Althusser frente a Weber
  afirmacion: 'Para Althusser el poder de Estado es el poder de la clase dominante y se liga a la reproducción
    de las relaciones de producción. Para Weber el poder es más amplio: refiere a cualquier situación
    en la que sea probable que alguien imponga su voluntad a otro, y puede tener fuentes muy diversas.
    Lo que comparten es que la dominación pretende conseguir legitimidad.

    '
  puntos:
  - Lo que tienen en común el «poder de Estado» en Althusser y la «dominación» en Weber es que en ambos
    casos la dominación pretende conseguir legitimidad.
  - A diferencia de Althusser, para Weber el poder puede tener fuentes muy diversas.
  - Para Weber, el poder refiere a cualquier situación en la que sea probable que alguien imponga una
    voluntad a otro.
  - Para Weber, la dominación existe en cualquier situación en la que un grupo de personas logra imponer
    un mandato a otro.
  trampas:
  - texto: Para Weber el poder tiene su base en la propiedad, o el monopolio, de los medios de producción.
    error: concepto_vecino
    por_que: Ligar el poder a los medios de producción es la mirada marxista que sigue Althusser, no la
      de Weber.
  - texto: Para Weber el poder requiere de la existencia de la legalidad, o de un orden legítimo.
    error: concepto_vecino
    por_que: Confunde poder con dominación legítima; el poder, para Weber, no necesita legitimidad.
  - texto: Para Weber la base del poder es ideológica, o la dominación supone la reproducción de las relaciones
      sociales de producción, o se sostiene en la estructura económica.
    error: concepto_vecino
    por_que: Son rasgos del poder en Althusser, no en Weber.
  - texto: Para Weber el poder requiere de la fuerza represiva de quien domina, o la dominación se sostiene
      en el mero uso de la fuerza.
    error: concepto_vecino
    por_que: La fuerza represiva remite a los Aparatos Represivos de Althusser; en Weber la dominación
      busca obediencia y legitimidad.
  - texto: Para Weber el poder es la probabilidad de la coacción económica sobre los otros.
    error: cambio_de_palabra
    por_que: Agrega «económica»; Weber habla de imponer la voluntad, cualquiera sea la fuente.
  - texto: Para Weber el poder supone la resistencia.
    error: media_verdad
    por_que: El poder se impone «aun contra toda resistencia»; puede haberla, pero no es un requisito.
  - texto: En ambos casos la dominación se ejerce desde el Estado, la ejerce la clase dominante o tiene
      un objetivo económico.
    error: media_verdad
    por_que: Vale para Althusser, pero no para Weber, que encuentra dominación en cualquier relación de
      mandato y obediencia.
  - texto: En ambos casos la dominación es disciplinaria y al mismo tiempo biopolítica.
    error: concepto_vecino
    por_que: Disciplina y biopolítica son conceptos de Foucault.
  pregunta_guia: ¿De dónde sale el poder para Althusser y de dónde puede salir para Weber? ¿Qué buscan
    los dos cuando hablan de dominación?
  explicacion_modelo: 'Para Weber el poder es «amorfo»: refiere a cualquier situación en la que alguien
    pueda imponer su voluntad a otro, y puede tener fuentes muy diversas. Para Althusser, en cambio, el
    poder es el de la clase dominante y se liga a la reproducción de las relaciones de producción. Lo
    que comparten es que la dominación pretende conseguir legitimidad. La trampa tentadora es «el poder
    requiere de un orden legítimo»: eso describe la dominación legítima, no el poder en general.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-f33bd93c
  - q-39390acf
  - q-0f796afa
  estado: borrador
  notas: 'q-0f796afa (clave de marcas): «la dominación pretende conseguir legitimidad» es la única opción
    que vale para los dos autores, pero Althusser no usa la palabra «legitimidad»; la cátedra parece leerla
    en la función de los AIE. Validar. q-39390acf (campus) define la dominación weberiana como «cualquier
    situación en la que un grupo logra imponer un mandato»; en otras preguntas del banco la dominación
    es la probabilidad de obtener obediencia a un mandato con contenido específico, y el «cualquier situación»
    es propio del poder «amorfo». La ficha enseña la clave del campus; validar el matiz. Estas preguntas
    comparan con Weber, cuyas fichas están en otra parte; quedan acá porque el banco las clasifica con
    Althusser.

    '
- id: althusser.sujeto-moderno-vs-foucault
  eje: conceptos
  autor: Louis Althusser
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: La construcción del sujeto moderno, Althusser frente a Foucault
  afirmacion: 'Para Althusser el sujeto moderno está sujetado ideológicamente: es resultado de la interpelación
    y de la ideología dominante que reproducen los Aparatos Ideológicos del Estado. Para Foucault lo construyen
    las tecnologías del poder: las técnicas disciplinarias (la anatomopolítica) que vigilan en espacios
    cerrados y artificiales, un micropoder esparcido en toda la sociedad.

    '
  puntos:
  - Para Althusser es resultado de la reproducción llevada adelante por los Aparatos Ideológicos del Estado;
    para Foucault, de la vigilancia en espacios cerrados y artificiales.
  - Para Althusser es resultado de la interpelación ideológica; para Foucault, de las tecnologías o modernas
    técnicas disciplinarias.
  - Para Althusser el sujeto está sujetado ideológicamente; para Foucault es construido por las tecnologías
    del poder.
  - Para Althusser es constituido por la ideología; para Foucault, por la anatomopolítica en espacios
    cerrados y artificiales.
  - Para Althusser es resultado de la ideología dominante; para Foucault, de un micropoder esparcido en
    el conjunto de la sociedad.
  trampas:
  - texto: Para Althusser es resultado de la ideología, para Foucault de la biopolítica.
    error: concepto_vecino
    por_que: La biopolítica regula a la población como conjunto; al sujeto individual lo moldean las disciplinas
      (la anatomopolítica).
  - texto: Para Althusser se produce a nivel de la infraestructura, para Foucault al nivel de la biopolítica.
    error: concepto_vecino
    por_que: La ideología está en la superestructura, no en la base económica, y en Foucault el sujeto
      sale de la anatomopolítica.
  - texto: Para Althusser es resultado de la superestructura, para Foucault de la infraestructura.
    error: media_verdad
    por_que: Lo de Althusser se sostiene (la ideología es una instancia de la superestructura), pero Foucault
      no piensa el poder desde la base económica.
  - texto: Para Althusser es resultado de la ideología dominante y para Foucault de las ideologías subalternas.
    error: media_verdad
    por_que: Arranca bien, pero Foucault no explica al sujeto por ideologías, sino por técnicas de poder
      sobre los cuerpos.
  - texto: Para Althusser es resultado de un proceso económico, para Foucault de una serie de procedimientos
      judiciales.
    error: concepto_vecino
    por_que: Althusser lo explica por la ideología, no por la economía, y Foucault deja atrás la concepción
      jurídica del poder.
  - texto: Para Althusser es resultado de las ideologías globalizantes y para Foucault de la soberanía.
    error: concepto_vecino
    por_que: El carácter globalizante de las ideologías es de Duby, y la soberanía es el modelo de poder
      «en lo alto» que Foucault discute.
  pregunta_guia: Para cada autor, ¿qué es lo que fabrica al sujeto moderno, la ideología o las técnicas
    sobre el cuerpo?
  explicacion_modelo: 'Para Althusser el sujeto moderno está sujetado ideológicamente: es resultado de
    la interpelación, de la ideología dominante que reproducen los Aparatos Ideológicos del Estado. Para
    Foucault lo construyen las tecnologías del poder: las técnicas disciplinarias (anatomopolítica) que
    vigilan los cuerpos en espacios cerrados y artificiales, un micropoder esparcido en la sociedad. La
    trampa más tentadora es «para Foucault, de la biopolítica»: es de Foucault, pero la biopolítica regula
    a la población, no forma al individuo.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-3f687e89
  - q-23839043
  - q-5e17eda5
  estado: borrador
  notas: 'Ficha de comparación; va con autor Althusser porque el banco la clasifica ahí. Las claves de
    marcas de q-3f687e89 y q-23839043 coinciden con las del campus (q-199e00d7) en los ítems compartidos,
    incluido que la biopolítica no es lo que construye al sujeto.

    '
- id: althusser.poder-vs-foucault
  eje: conceptos
  autor: Louis Althusser
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: El Estado y el poder, Althusser frente a Foucault
  afirmacion: 'Althusser piensa el poder desde el Estado y sus aparatos: es el poder de la clase dominante,
    combina coerción física y reproducción ideológica y desciende del Estado hacia la sociedad. Foucault
    analiza el poder por fuera del Estado, como una multiplicidad de relaciones de fuerza y micropoderes
    cotidianos que van de abajo hacia arriba, y descarta pensarlo como algo meramente represivo.

    '
  puntos:
  - Althusser destaca el papel represivo e ideológico del poder; Foucault analiza el poder por fuera del
    Estado, donde se ejerce concretamente sobre las personas.
  - Para Althusser el poder desciende desde el Estado hacia la sociedad; para Foucault va desde abajo
    hacia arriba.
  - Para Althusser el poder se relaciona con el modo de producción social; para Foucault es toda relación
    de fuerzas.
  - Para Althusser el poder es el poder de la clase dominante; Foucault se enfoca en los micropoderes
    que se ejercen a nivel cotidiano.
  - Foucault descarta la concepción del poder como algo meramente represivo; Althusser subraya la combinación
    de coerción física y reproducción ideológica.
  - Foucault analiza una multiplicidad de poderes; Althusser se centra en el poder del Estado y sus Aparatos.
  trampas:
  - texto: Para Althusser el Estado actúa por medio de los Aparatos Ideológicos, y para Foucault a través
      de los Aparatos Represivos.
    error: concepto_vecino
    por_que: Los dos tipos de aparatos son de Althusser; Foucault no analiza el poder a través de aparatos
      del Estado.
  - texto: Para Althusser el Estado garantiza la reproducción de las relaciones de producción, y para
      Foucault las creencias en la legitimidad del orden.
    error: media_verdad
    por_que: Lo de Althusser es correcto, pero la creencia en la legitimidad es el eje de Weber.
  - texto: Para Althusser el Estado representa a la clase dominante, para Foucault representa a todos
      los ciudadanos por igual.
    error: media_verdad
    por_que: Lo de Althusser va, pero Foucault no piensa al Estado como representante de nadie; estudia
      el poder por fuera de él.
  - texto: Para Althusser el poder está concentrado en el Estado y para Foucault en el modo de producción.
    error: media_verdad
    por_que: Foucault no concentra el poder en ningún lugar; lo ve diseminado en toda la sociedad.
  - texto: Para Althusser el poder surge de una operación ideológica y para Foucault de una posición económica,
      o emana de la infraestructura para uno y de la superestructura para el otro.
    error: concepto_vecino
    por_que: Foucault no ubica el poder en la economía ni en el esquema base y superestructura; lo piensa
      como relación de fuerzas.
  - texto: Para Foucault la dominación es biopolítica y para Althusser es anatomopolítica.
    error: concepto_vecino
    por_que: Biopolítica y anatomopolítica son los dos sentidos del poder en Foucault; ninguna es de Althusser.
  - texto: Para Foucault la dominación se impone por la fuerza y para Althusser por vía de la legitimidad.
    error: concepto_vecino
    por_que: Foucault descarta el poder como pura represión, y la legitimidad es la clave de Weber.
  - texto: Para Foucault la dominación es un conjunto de relaciones de poder y para Althusser un sistema
      de gobierno.
    error: media_verdad
    por_que: Lo de Foucault va, pero Althusser no habla de un sistema de gobierno, sino del poder de Estado
      y sus Aparatos.
  pregunta_guia: ¿Dónde está el poder para cada uno, en el Estado o repartido en la sociedad? ¿Va de arriba
    hacia abajo o de abajo hacia arriba?
  explicacion_modelo: 'Althusser piensa el poder desde el Estado: es el poder de la clase dominante, combina
    coerción física (Aparatos Represivos) y reproducción ideológica (Aparatos Ideológicos) y baja del
    Estado hacia la sociedad. Foucault lo analiza por fuera del Estado, como una multiplicidad de relaciones
    de fuerza y micropoderes cotidianos que van de abajo hacia arriba. La trampa más tentadora es «Althusser
    actúa por los Aparatos Ideológicos y Foucault por los Represivos»: parece un reparto prolijo, pero
    los dos aparatos son de Althusser.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-cbdfc653
  - q-a7005f62
  - q-c72f26a5
  - q-e35074a4
  estado: borrador
  notas: 'Ficha de comparación; va con autor Althusser porque el banco la clasifica ahí. q-a7005f62 (marcas)
    y q-cbdfc653 (campus) tienen las mismas cinco afirmaciones en otro orden y coinciden en la clave.

    '
- id: marx.modo-de-produccion
  eje: conceptos
  autor: Karl Marx
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Modo de producción, fuerzas productivas y relaciones de producción
  afirmacion: 'Para Marx, el desarrollo de las fuerzas productivas de una sociedad se articula con las
    relaciones de producción predominantes, que se corresponden con ese desarrollo y no son el resultado
    de decisiones personales. Esa articulación es el modo de producción, la estructura económica sobre
    la que se levanta la superestructura.

    '
  puntos:
  - «Modo de producción», «Fuerzas productivas», «Relaciones sociales de producción» y «Estructura y superestructura»
    son conceptos de Marx.
  - El desarrollo de las fuerzas productivas de una sociedad se articula con las relaciones de producción
    predominantes.
  - Las relaciones de producción predominantes en una sociedad se corresponden con cierto desarrollo de
    las fuerzas productivas.
  trampas:
  - texto: En toda sociedad la producción se basa en el interés de conseguir una ganancia (dineraria).
    error: absoluto_falso
    por_que: La ganancia es propia de la producción capitalista; Marx no la extiende a «toda» sociedad.
  - texto: El dinero es el origen, o la fuente real, de todas las relaciones de producción.
    error: verdad_general
    por_que: Las relaciones de producción se corresponden con el desarrollo de las fuerzas productivas;
      el dinero no las origina.
  - texto: Las relaciones sociales de producción son el resultado de decisiones personales.
    error: verdad_general
    por_que: Para Marx dependen del desarrollo de las fuerzas productivas, no de la voluntad de cada uno.
  - texto: El individuo se vincula con la sociedad por medio de acciones orientadas por la conducta de
      los demás.
    error: concepto_vecino
    por_que: Es la acción social de Weber, no el planteo de Marx.
  - texto: Dado que la naturaleza provee todos los bienes primarios, ella misma es la fuente última de
      toda riqueza material.
    error: verdad_general
    por_que: Pone la riqueza en la naturaleza sola; para Marx lo decisivo es la producción, que siempre
      es social.
  - texto: Atribuirle «Fuerzas productivas» o «Relaciones sociales de producción» a Althusser.
    error: concepto_vecino
    por_que: Althusser retoma estos conceptos, pero son de Marx.
  pregunta_guia: ¿Qué dos elementos articula un modo de producción y cuál se corresponde con cuál?
  explicacion_modelo: 'Para Marx el desarrollo de las fuerzas productivas de una sociedad se articula
    con las relaciones de producción predominantes: a cierto grado de desarrollo le corresponden ciertas
    relaciones, y esa combinación es el modo de producción. Las relaciones de producción no son decisiones
    personales ni nacen del dinero. La trampa tentadora es «toda producción se basa en conseguir una ganancia»:
    vale para el capitalismo, pero Marx no lo generaliza a toda sociedad.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-a158f39d
  - q-c8281826
  - q-b297d3cb
  - q-f236ff14
  - q-0e838c2c
  - q-ad6a670e
  estado: borrador
  notas: 'La frase de la superestructura en la afirmación es la imagen clásica de Marx; el examen solo
    pregunta de quién es «Estructura y superestructura». Althusser la retoma con su teoría de los niveles
    (althusser.infraestructura-superestructura).

    '
- id: marx.categorias-historicas
  eje: conceptos
  autor: Karl Marx
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: La producción y el carácter histórico de las categorías económicas
  afirmacion: 'Para Marx, en una sociedad determinada las personas se apropian de la naturaleza mediante
    el proceso de producción. Por eso las categorías económicas son históricas: hasta la más simple, como
    el valor de cambio, supone una población que produce en determinadas relaciones de producción. Critica
    a los economistas clásicos por no incorporar ese carácter histórico.

    '
  puntos:
  - En una sociedad determinada, las personas se apropian de la naturaleza mediante el proceso de producción.
  - La categoría económica más simple, como el valor de cambio, supone una población que produce en determinadas
    relaciones de producción.
  - Marx critica a los economistas clásicos porque no incorporan en su análisis el carácter histórico
    de las categorías económicas.
  - El valor de uso de una mercancía es el sustrato que le permite tener cierto valor de cambio, porque
    es trabajo socialmente útil.
  - El desarrollo de las fuerzas productivas de una sociedad se articula con las relaciones de producción
    predominantes.
  - «Valor de cambio» es un concepto de Marx.
  trampas:
  - texto: En el intercambio de mercancías el valor de uso deja de tener importancia.
    error: verdad_general
    por_que: El valor de uso sigue siendo el sustrato del valor de cambio; algo que no es útil no se intercambia.
  - texto: El individuo deja de vincularse con la naturaleza porque produce manufacturas.
    error: verdad_general
    por_que: Toda producción, también la manufactura, es apropiación de la naturaleza; el vínculo no se
      corta.
  - texto: El desarrollo de las fuerzas productivas depende de la disponibilidad de recursos naturales,
      pues la naturaleza es la fuente de la riqueza.
    error: verdad_general
    por_que: Es una explicación naturalista; para Marx las fuerzas productivas se articulan con relaciones
      sociales de producción.
  - texto: La ganancia capitalista se convierte en un medio para solucionar la pobreza.
    error: verdad_general
    por_que: Es un argumento a favor del capitalismo que Marx no sostiene.
  - texto: La categoría de valor de cambio implica que todos los productores han cambiado sus medios de
      vida por otros mejores.
    error: dato_inventado
    por_que: Inventa una mejora que el texto no plantea; el valor de cambio supone relaciones de producción
      determinadas.
  - texto: Marx critica a los economistas clásicos porque no incorporan el consumo, el mercado internacional,
      la renta de la tierra o la producción a escala mundial.
    error: verdad_general
    por_que: Marx no les reprocha un tema que falte, sino tratar las categorías como si fueran eternas
      y no históricas.
  - texto: Las personas se apropian de la naturaleza mediante las fuerzas productivas, la dominación o
      la racionalización.
    error: concepto_vecino
    por_que: El proceso es la producción; las fuerzas productivas son uno de sus elementos, y dominación
      y racionalización son conceptos de Weber.
  pregunta_guia: ¿Por qué para Marx hasta el valor de cambio, la categoría más simple, tiene historia?
    ¿Qué les reprocha a los economistas clásicos?
  explicacion_modelo: 'Para Marx toda producción es la apropiación de la naturaleza por personas que viven
    en una sociedad determinada. Por eso las categorías económicas son históricas: hasta la más simple,
    el valor de cambio, supone una población que produce en determinadas relaciones de producción, y eso
    es lo que no ven los economistas clásicos. La opción tentadora es «en el intercambio el valor de uso
    deja de tener importancia»: para Marx el valor de uso es el sustrato del valor de cambio.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-d504147b
  - q-900f404b
  - q-6f659053
  - q-8a7bae6f
  - q-f1db1b5b
  estado: borrador
  notas: 'q-900f404b tiene tres versiones con distinta clave porque cambian las opciones: la v1 repite
    la correcta de q-d504147b, la v2 enseña el valor de uso como sustrato del valor de cambio y la v3
    repite la de q-0e838c2c (fuerzas productivas y relaciones de producción, ver marx.modo-de-produccion).
    Las ideas coinciden con la «Introducción» de 1857 a la crítica de la economía política; validar si
    es el texto de la cátedra. Ojo con la trampa del valor de uso: Marx dice que en la relación de cambio
    se hace abstracción del valor de uso, pero el examen la da por falsa porque el valor de uso sigue
    siendo el soporte del valor de cambio.

    '
- id: marx.fuerza-de-trabajo-y-clases
  eje: conceptos
  autor: Karl Marx
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Fuerza de trabajo, medios de producción, trabajo no remunerado y clases sociales
  afirmacion: 'Para Marx, en el capitalismo quienes no son dueños de los medios de producción venden su
    fuerza de trabajo a quienes sí lo son; una parte de ese trabajo no se paga (trabajo no remunerado),
    y esa relación divide a la sociedad en clases sociales.

    '
  puntos:
  - «Fuerza de trabajo» es un concepto de Marx.
  - «Medios de producción» es un concepto de Marx.
  - «Trabajo no remunerado» es un concepto de Marx.
  - «Clases sociales» es un concepto de Marx.
  trampas:
  - texto: Atribuirle «Fuerza de trabajo» o «Medios de producción» a Althusser.
    error: concepto_vecino
    por_que: Althusser usa esos conceptos para explicar la reproducción, pero vienen de Marx.
  - texto: Atribuirle «Trabajo no remunerado» o «Clases sociales» a Heller o a Lefebvre.
    error: concepto_vecino
    por_que: Los dos parten del marxismo para pensar la vida cotidiana, pero estos conceptos son del propio
      Marx.
  pregunta_guia: ¿Qué vende el trabajador, qué tiene el capitalista y de dónde sale la parte del trabajo
    que no se paga?
  explicacion_modelo: 'Para Marx, en el capitalismo quienes no tienen medios de producción solo poseen
    su fuerza de trabajo y la venden a cambio de un salario. Pero trabajan más de lo que el salario paga:
    ese trabajo no remunerado queda para el dueño de los medios de producción, y de esa relación surgen
    las clases sociales. En las de relacionar, la confusión típica es elegir a Althusser, que usa estos
    conceptos pero los toma de Marx.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-18f73071
  - q-ec34920a
  - q-61922aeb
  - q-ffcee055
  estado: borrador
  notas: 'El examen solo pregunta de qué autor son estos conceptos; la afirmación usa las definiciones
    clásicas de Marx y hay que validarlas con el texto de la cátedra. El banco tiene preguntas del texto
    de S. Lifszyc sobre capitalismo y plusvalía (fuera de esta parte) que tocan las mismas ideas.

    '
- id: foucault.microfisica-del-poder
  eje: conceptos
  autor: Michel Foucault
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: El poder como relación de fuerzas (poder microfísico)
  afirmacion: 'Foucault propone analizar el poder como una relación de fuerzas desiguales que no está
    situada en lo alto, sino diseminada en el conjunto de la sociedad: un poder microfísico. Así se aparta
    de la concepción jurídica del poder, que lo ubica en lo alto y le atribuye efectos únicamente represivos.

    '
  puntos:
  - «Poder microfísico» es un concepto de Foucault.
  - Foucault propone analizar el poder como relación de fuerzas desiguales.
  - El poder no está situado en lo alto, sino que está diseminado en el conjunto de la sociedad.
  - 'Concepción jurídica del poder: entender el poder como algo situado en lo alto y cuyos efectos son
    únicamente represivos.'
  trampas:
  - texto: Analizar el poder como algo concentrado en la ley y el soberano.
    error: concepto_vecino
    por_que: Esa es la concepción jurídica del poder, justamente la que Foucault discute.
  - texto: Analizar el poder a partir de las distintas formas de Estado y los Aparatos Ideológicos.
    error: concepto_vecino
    por_que: Los Aparatos Ideológicos son de Althusser; Foucault estudia el poder por fuera del Estado.
  - texto: Analizar el origen del poder de la clase dominante.
    error: concepto_vecino
    por_que: Pensar el poder como poder de una clase es la mirada de Althusser; Foucault mira cómo se
      ejerce en relaciones concretas.
  - texto: Atribuirle «Poder microfísico» a Althusser o a Weber.
    error: concepto_vecino
    por_que: Althusser piensa el poder desde el Estado y Weber como probabilidad de imponer la voluntad;
      la microfísica es de Foucault.
  - texto: Para la definición del poder situado en lo alto y solo represivo, elegir «Anatomopolítica».
    error: concepto_vecino
    por_que: También es de Foucault, pero es el poder disciplinario sobre los cuerpos, no la concepción
      que él critica.
  pregunta_guia: ¿Dónde está el poder para Foucault y qué modelo de poder deja atrás?
  explicacion_modelo: 'Foucault propone analizar el poder como una relación de fuerzas desiguales que
    no está en lo alto, sino diseminada en toda la sociedad: es un poder microfísico. Con eso se aparta
    de la concepción jurídica del poder, que lo piensa situado en lo alto (la ley, el soberano) y con
    efectos únicamente represivos. La trampa tentadora es «las formas de Estado y los Aparatos Ideológicos»:
    suena a teoría del poder, pero es el enfoque de Althusser.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-98da6906
  - q-5e1eb746
  - q-38806eec
  estado: borrador
- id: foucault.anatomopolitica
  eje: conceptos
  autor: Michel Foucault
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Las disciplinas, anatomopolítica y cuerpos dóciles
  afirmacion: 'Para Foucault, las técnicas de disciplinamiento se enfocan sobre los individuos considerados
    como cuerpos dóciles y funcionan con vigilancia en espacios cerrados y artificiales. Ese conjunto
    de técnicas enfocado en los cuerpos individuales es la anatomopolítica.

    '
  puntos:
  - «Anatomopolítica» es un concepto de Foucault.
  - 'Anatomopolítica: el conjunto de técnicas de disciplinamiento enfocadas en los cuerpos individuales.'
  - Las técnicas de disciplinamiento se enfocan sobre la vigilancia en espacios cerrados y artificiales.
  - Las técnicas de disciplinamiento se enfocan sobre los individuos considerados como cuerpos dóciles.
  trampas:
  - texto: Las técnicas de disciplinamiento se enfocan sobre la regulación de las leyes biológicas que
      atraviesan a la población.
    error: concepto_vecino
    por_que: Eso es la biopolítica; la disciplina trabaja sobre el cuerpo de cada individuo.
  - texto: Las técnicas de disciplinamiento se enfocan sobre la conciencia colectiva.
    error: concepto_vecino
    por_que: La conciencia colectiva es de Durkheim; las disciplinas no apuntan a la conciencia, sino
      al cuerpo.
  - texto: Las técnicas de disciplinamiento se enfocan sobre las mentalidades predominantes en una sociedad.
    error: verdad_general
    por_que: Suena razonable, pero las disciplinas no trabajan sobre ideas o mentalidades, sino sobre
      los cuerpos.
  - texto: Atribuirle «Anatomopolítica» a Althusser.
    error: concepto_vecino
    por_que: Althusser explica al sujeto por la ideología; las técnicas sobre el cuerpo son de Foucault.
  - texto: Para las técnicas sobre los cuerpos individuales, elegir «Concepción jurídica del poder» o
      «Ideología».
    error: concepto_vecino
    por_que: La concepción jurídica es el modelo de poder represivo que Foucault critica, y la ideología
      es el eje de Althusser.
  pregunta_guia: ¿Sobre qué trabaja la disciplina, la población, la conciencia o el cuerpo de cada uno?
    ¿Dónde lo hace?
  explicacion_modelo: 'Para Foucault las técnicas de disciplinamiento se enfocan en los individuos como
    cuerpos dóciles, a los que vigilan en espacios cerrados y artificiales. Ese conjunto de técnicas sobre
    los cuerpos individuales es la anatomopolítica. La trampa más tentadora es «la regulación de las leyes
    biológicas de la población»: también es de Foucault, pero es la biopolítica, que apunta al conjunto
    y no a cada cuerpo.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-76d143af
  - q-3c570e83
  - q-f7034fce
  estado: borrador
- id: foucault.espacios-disciplinarios
  eje: conceptos
  autor: Michel Foucault
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Microespacios o espacios disciplinarios
  afirmacion: 'Para Foucault, la disciplina organiza el espacio: los microespacios, o espacios disciplinarios,
    permiten la vigilancia individualizada y la jerarquización de los individuos y las conductas.

    '
  puntos:
  - 'Microespacios: espacios que permiten la vigilancia individualizada y la jerarquización de los individuos
    y las conductas.'
  - 'Espacios disciplinarios: permiten la vigilancia y la jerarquización de los individuos y las conductas.'
  trampas:
  - texto: Para esa definición, elegir «Ideología» o «Superestructura».
    error: concepto_vecino
    por_que: Son conceptos de Althusser sobre la sociedad en general; acá se habla de un espacio concreto
      donde se vigila.
  - texto: Para esa definición, elegir «Dominación tradicional», «Tipo ideal» o «Capitalismo moderno».
    error: concepto_vecino
    por_que: Son conceptos de Weber; ninguno describe un espacio de vigilancia.
  - texto: Para esa definición, elegir «Carácter estabilizante de la ideología» o «Carácter concurrente
      de las ideologías».
    error: concepto_vecino
    por_que: Hablan de las ideologías; los espacios disciplinarios son una técnica de poder sobre los
      cuerpos.
  pregunta_guia: ¿Qué permite un espacio disciplinario que no permite un espacio abierto y mezclado?
  explicacion_modelo: 'Para Foucault la disciplina distribuye a los individuos en el espacio: los microespacios,
    o espacios disciplinarios, permiten vigilar a cada uno y jerarquizar individuos y conductas. Por eso
    las disciplinas trabajan con vigilancia en espacios cerrados y artificiales. La trampa típica es elegir
    «Ideología» o «Superestructura»: son conceptos de Althusser sobre la sociedad en general, no sobre
    un espacio de vigilancia.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-c03c81e7
  - q-59bd227f
  estado: borrador
  notas: '«Capitalismo moderno» como concepto de Weber sale de otra pregunta del banco (sin autor asignado),
    que lo define por el Estado racional con burocracia y derecho calculable; validar la atribución.

    '
- id: foucault.biopolitica
  eje: conceptos
  autor: Michel Foucault
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: La biopolítica y los dos sentidos de las tecnologías de poder
  afirmacion: 'Según Foucault, las tecnologías de poder que surgen en los siglos XVII y XVIII se direccionan
    en dos sentidos: la anatomopolítica, sobre los cuerpos individuales, y la biopolítica, el conjunto
    de técnicas de regulación sobre los procesos poblacionales, en la que la estadística se vuelve una
    técnica para ejercer el poder.

    '
  puntos:
  - «Biopolítica» es un concepto de Foucault.
  - 'Biopolítica: el conjunto de técnicas de regulación sobre los procesos poblacionales.'
  - 'Biopolítica: la regulación de las leyes que atraviesan a una población.'
  - El concepto de biopolítica permite entender las técnicas regulatorias sobre la población como conjunto.
  - El concepto de biopolítica permite entender la relevancia de la estadística como técnica para el ejercicio
    del poder.
  - 'Las tecnologías de poder que surgen durante los siglos XVII y XVIII se direccionan en dos sentidos:
    la biopolítica y la anatomopolítica.'
  trampas:
  - texto: La biopolítica permite entender las técnicas de disciplinamiento de los cuerpos.
    error: concepto_vecino
    por_que: Las técnicas sobre los cuerpos individuales son la anatomopolítica; la biopolítica apunta
      a la población.
  - texto: La biopolítica permite entender el funcionamiento de los microespacios.
    error: concepto_vecino
    por_que: Los microespacios son una técnica disciplinaria (anatomopolítica), no biopolítica.
  - texto: La biopolítica permite entender el entrecruzamiento entre las técnicas disciplinarias y los
      aparatos ideológicos.
    error: concepto_vecino
    por_que: Mezcla a Foucault con Althusser; los aparatos ideológicos no son parte del planteo de Foucault.
  - texto: Las tecnologías de poder de los siglos XVII y XVIII se direccionan hacia la ideología, el poder
      estatal o la conciencia colectiva.
    error: concepto_vecino
    por_que: Ideología y poder estatal son el eje de Althusser, y la conciencia colectiva es de Durkheim.
  - texto: Para la regulación de una población, elegir «Dominación legítima» o «Estructura especular de
      la ideología»; o atribuirle «Biopolítica» a Althusser.
    error: concepto_vecino
    por_que: La dominación legítima es de Weber y la estructura especular de Althusser; ninguna habla
      de regular una población.
  pregunta_guia: ¿Qué diferencia hay entre disciplinar el cuerpo de cada individuo y regular a una población
    entera? ¿Para qué le sirve la estadística al poder?
  explicacion_modelo: 'Según Foucault, las tecnologías de poder que surgen en los siglos XVII y XVIII
    van en dos sentidos: la anatomopolítica, que disciplina los cuerpos individuales, y la biopolítica,
    que regula los procesos de la población como conjunto (como la natalidad o la salud); por eso la estadística
    se vuelve una técnica de poder. La trampa más tentadora es «la biopolítica permite entender el disciplinamiento
    de los cuerpos»: es de Foucault, pero eso es la anatomopolítica.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-4eaeb70f
  - q-0cb39393
  - q-726b4a40
  - q-b25a0da2
  - q-9c49aa9e
  estado: borrador
  notas: 'Los ejemplos de procesos poblacionales (natalidad, salud) no salen del examen; validar que la
    cátedra los use.

    '
- id: foucault.carcel-delincuencia
  eje: conceptos
  autor: Michel Foucault
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Por qué persiste la cárcel
  afirmacion: 'Foucault plantea que, a pesar de su aparente fracaso, el sistema penal carcelario persiste
    porque la delincuencia es útil: tiene una utilidad económica y la existencia del delincuente justifica
    mecanismos de control sobre la población.

    '
  puntos:
  - El sistema carcelario persiste porque la delincuencia tiene una utilidad económica.
  - El sistema carcelario persiste porque la existencia del delincuente justifica mecanismos de control
    sobre la población.
  trampas:
  - texto: Persiste porque las fallas en el proceso de socialización producen actitudes que tienden a
      infringir las leyes.
    error: verdad_general
    por_que: Explica por qué hay delitos; Foucault no pregunta eso, sino para qué le sirve la delincuencia
      al poder.
  - texto: Persiste porque la anomia social genera conductas desviadas como la delincuencia.
    error: concepto_vecino
    por_que: La anomia es un concepto de Durkheim.
  - texto: Persiste porque la delincuencia encubre la falta de legitimidad de un orden social.
    error: concepto_vecino
    por_que: La legitimidad del orden es el eje de Weber; Foucault habla de utilidad económica y de control.
  pregunta_guia: Si la cárcel no logra terminar con el delito, ¿para qué le sirve al poder que siga existiendo?
  explicacion_modelo: 'Según Foucault, la cárcel persiste a pesar de su aparente fracaso porque la delincuencia
    es útil: tiene una utilidad económica y la figura del delincuente justifica mecanismos de control
    sobre toda la población. La trampa más tentadora es la de la socialización fallida: suena razonable,
    pero explica por qué hay delitos, no por qué se mantiene el sistema carcelario.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-02ada85f
  estado: borrador
- id: lefebvre.que-es-la-ideologia
  eje: conceptos
  autor: Henri Lefebvre
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Qué es la ideología según Lefebvre
  afirmacion: 'Para Lefebvre, la ideología es un conjunto de representaciones características de una época
    y de una sociedad. Esas representaciones parten de una realidad determinada, pero crean una conciencia
    parcial y fragmentaria de ella.

    '
  puntos:
  - Según Lefebvre, la ideología es un conjunto de representaciones características de una época y de
    una sociedad.
  - Las ideologías son representaciones que parten de una determinada realidad, pero crean una conciencia
    parcial y fragmentaria.
  - El concepto que corresponde a la definición «Representaciones que parten de una determinada realidad,
    pero crean una conciencia parcial y fragmentaria» es «Ideología».
  trampas:
  - texto: La ideología es la práctica propia de los aparatos ideológicos de Estado.
    error: concepto_vecino
    por_que: Los aparatos ideológicos de Estado son un concepto de Althusser, no la definición de Lefebvre.
  - texto: La ideología es una ciencia general de las ideas abstractas.
    error: concepto_vecino
    por_que: Confunde la ideología con una ciencia de las ideas; para Lefebvre son representaciones de
      una época, no un saber científico.
  - texto: La ideología es un tipo de racionalidad con arreglo a fines.
    error: concepto_vecino
    por_que: La acción racional con arreglo a fines es uno de los tipos de acción social de Weber.
  - texto: Para la definición de las representaciones que crean una conciencia parcial y fragmentaria,
      elegir «Superestructura» o «Carácter concurrente de las ideologías».
    error: concepto_vecino
    por_que: La superestructura es un nivel de la sociedad en Marx y el carácter concurrente es un rasgo
      de Duby; la definición nombra a la ideología misma.
  pregunta_guia: ¿De dónde parten las ideologías según Lefebvre y qué tipo de conciencia producen?
  explicacion_modelo: 'La ideología es un conjunto de representaciones características de una época y
    de una sociedad. Según Lefebvre, esas representaciones parten de una realidad determinada, pero dan
    de ella una conciencia parcial y fragmentaria. La opción tentadora es «la práctica propia de los aparatos
    ideológicos de Estado», porque también habla de ideología, pero ese concepto es de Althusser, no la
    definición de Lefebvre.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-7c35613f
  - q-07286e7b
  - q-38c4d652
  - q-fe443432
  estado: borrador
  notas: 'Las tres definiciones «Representaciones que parten de una determinada realidad, pero crean una
    conciencia parcial y fragmentaria» (q-07286e7b, q-38c4d652, q-fe443432) vienen sin autor. Se asignan
    a Lefebvre porque coinciden con su idea de la ideología como versión mutilada y parcial de lo real;
    validar con el texto que la frase es suya y no de Duby. q-07286e7b y q-38c4d652 tienen clave de marcas,
    pero coinciden con la de campus de q-fe443432.

    '
- id: lefebvre.ideologia-mutilada-segun-marx
  eje: conceptos
  autor: Henri Lefebvre
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: La ideología en Marx según Lefebvre, una versión mutilada de la realidad
  afirmacion: 'Según Lefebvre, para Marx las ideologías son formas mutiladas y alteradas de la realidad
    que, sin embargo, se presentan como si fueran la realidad entera. Implican abstracciones no científicas
    y vuelven hacia la praxis por medio de la coacción y la persuasión.

    '
  puntos:
  - Para Marx, según Lefebvre, las ideologías son formas mutiladas y alteradas de la realidad.
  - Las ideologías se presentan como la totalidad de la realidad, a pesar de ser versiones mutiladas y
    alteradas de ella.
  - Las ideologías implican abstracciones no científicas.
  - La coacción y la persuasión son las formas en que la ideología vuelve hacia la praxis.
  trampas:
  - texto: Las ideologías son solo fantasías originadas por el interés personal; no parten de ninguna
      realidad.
    error: absoluto_falso
    por_que: Las ideologías parten de lo real y lo mutilan; no son pura fantasía sin conexión con la realidad.
  - texto: Las abstracciones implicadas en las ideologías son mayoritariamente científicas.
    error: cambio_de_palabra
    por_que: Invierte la idea; las abstracciones de la ideología son no científicas.
  - texto: La ideología retorna hacia la política a través de la mística y la religión.
    error: cambio_de_palabra
    por_que: Cambia «coacción y persuasión» por «mística y religión», y «praxis» por «política».
  - texto: Las ideologías representan el más alto grado del pensamiento filosófico (o económico) de las
      sociedades.
    error: verdad_general
    por_que: Para Lefebvre las ideologías mutilan la realidad; no son la cumbre del pensamiento de una
      sociedad.
  - texto: Las ideologías poseen un carácter simple que impide su análisis.
    error: cambio_de_palabra
    por_que: Lefebvre les atribuye un carácter doble, no simple, y justamente se pueden analizar.
  - texto: Las ideologías ayudan a los sectores dominados a comprender su situación social.
    error: verdad_general
    por_que: Las ideologías mutilan la realidad y responden a los sectores dominantes; no aclaran la situación
      de los dominados.
  - texto: La ideología es un hecho social (o determina los hechos sociales) porque es externa, general
      y coactiva.
    error: concepto_vecino
    por_que: Exterioridad, generalidad y coacción son los rasgos del hecho social de Durkheim.
  - texto: La ideología es un componente central de los aparatos ideológicos de Estado, o las prácticas
      disciplinarias del biopoder son ideológicas.
    error: concepto_vecino
    por_que: Son conceptos de Althusser y de Foucault; la pregunta pide la lectura de Marx que hace Lefebvre.
  pregunta_guia: ¿Qué le hace la ideología a la realidad de la que parte y cómo se presenta ante la sociedad?
  explicacion_modelo: 'Para Marx, según Lefebvre, las ideologías son formas mutiladas y alteradas de la
    realidad que se presentan como si fueran la realidad entera, y por eso implican abstracciones no científicas.
    No son fantasías sin base, porque parten de lo real, pero lo recortan y lo alteran. La trampa más
    tentadora es «son solo fantasías originadas por el interés personal», que exagera la idea; el problema
    de la ideología no es que no tenga nada de real, sino que muestra una parte como si fuera el todo.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-be728cac
  - q-01792b5c
  - q-9cee9c67
  - q-2cc65326
  estado: borrador
  notas: 'q-ec6b874a tiene clave de marcas en v1 a v3 («abstracciones no científicas»; «la coacción y
    la persuasión son las formas en que la ideología vuelve hacia la praxis») y de campus en v4 («formas
    mutiladas y alteradas de la realidad»); son coherentes entre sí y con q-be728cac (campus). La frase
    de la coacción y la persuasión solo la avala una clave de marcas; validarla con el texto.

    '
- id: lefebvre.caracter-doble-de-la-ideologia
  eje: conceptos
  autor: Henri Lefebvre
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: El carácter doble de la ideología
  afirmacion: 'Según Lefebvre, para Marx la ideología tiene un carácter doble. Está limitada por intereses
    particulares, pero se presenta como general y especulativa, es decir, como verdad para todos. Por
    eso en ella se instalan las representaciones que seleccionan y admiten los sectores dominantes.

    '
  puntos:
  - Para Marx, según Lefebvre, la ideología posee un carácter doble, limitado por intereses particulares,
    por un lado, y general y especulativo, por otro.
  - Las ideologías están limitadas por intereses particulares, pero se presentan como verdades generales.
  - En las ideologías se instalan representaciones que seleccionan y admiten los sectores dominantes.
  trampas:
  - texto: Las ideologías instalan representaciones a partir de lo que imponen los sectores politizados.
    error: cambio_de_palabra
    por_que: Cambia «sectores dominantes» por «sectores politizados».
  - texto: En las ideologías los intereses particulares se presentan como posiciones egoístas.
    error: cambio_de_palabra
    por_que: Es al revés; los intereses particulares se presentan como verdades generales, no como lo
      que son.
  - texto: Las ideologías están desconectadas por completo de las relaciones sociales de producción, o
      no las representan porque son fenómenos subjetivos.
    error: absoluto_falso
    por_que: Las ideologías parten de una realidad y en ellas se representan, recortadas, las relaciones
      sociales; no son algo puramente subjetivo.
  - texto: La ideología es una fantasía que no se conecta en ningún aspecto con la realidad.
    error: absoluto_falso
    por_que: El «en ningún aspecto» niega que la ideología parte de lo real.
  - texto: Las ideologías son verdaderas porque las producen los intelectuales más prominentes de una
      época.
    error: verdad_general
    por_que: Para Lefebvre la ideología no es más verdadera por venir de intelectuales; está limitada
      por intereses particulares.
  - texto: Las ideologías constituyen la mejor descripción posible de la realidad social (o la describen
      perfectamente).
    error: absoluto_falso
    por_que: Las ideologías dan una visión limitada por intereses; no describen la realidad tal como es.
  - texto: La ideología es la manera de comprender el mundo que genera la experiencia de cada persona,
      su representación particular de la vida cotidiana.
    error: verdad_general
    por_que: La ideología no es la visión personal de cada uno; es un conjunto de representaciones de
      una época ligado a intereses de grupo.
  pregunta_guia: ¿Qué dos caras tiene la ideología según Lefebvre y a qué sectores responde?
  explicacion_modelo: 'La ideología tiene un carácter doble, porque está limitada por intereses particulares,
    pero se presenta como general y especulativa. Por eso Lefebvre dice que en ella se instalan las representaciones
    que seleccionan y admiten los sectores dominantes, que muestran su interés como si fuera el de todos.
    La trampa más tentadora es «a partir de lo que imponen los sectores politizados», que repite la frase
    con una palabra cambiada; lo que cuenta es la dominación, no la politización.

    '
