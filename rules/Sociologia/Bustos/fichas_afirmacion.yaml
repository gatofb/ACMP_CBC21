    por_que: 'Invierte la relación: la masculinidad dominante no pone al varón en el lugar subordinado.'
  - texto: La masculinidad es completa si es represiva.
    error: dato_inventado
    por_que: Mezcla “completa” (complementariedad) con “represiva” (construcción social del varón); Marqués
      no dice eso.
  - texto: La mujer no puede decidir sobre su propio cuerpo; cada hombre es responsable de su propia vida.
    error: verdad_general
    por_que: Pueden sonar razonables, pero no son lo que implica la idea de masculinidad en Marqués.
  pregunta_guia: ¿A quién reprime la masculinidad dominante, según Marqués, y en qué se diferencia eso
    de la ideología de la complementariedad?
  explicacion_modelo: 'Para Marqués, la masculinidad es una construcción social que se le impone también
    al varón: la masculinidad dominante ejerce coacción sobre él y es represiva para hombres y mujeres.
    La trampa más tentadora es “lo masculino completa la identidad de la mujer” (o “el varón depende de
    la mujer”): se parece a la ideología de la complementariedad, que supone que el varón se completa
    con la mujer, pero eso es lo que sostiene esa ideología, no lo que muestra la construcción social
    del varón.'
  recurso_ubaxxi: pendiente
  preguntas:
  - q-7565a2de
  - q-5325fab9
  - q-d6a78328
  - q-5a879158
  - q-68ee58eb
  - q-9e272de8
  estado: borrador
  notas: 'Ojo con la complementariedad: en q-2e1c7702 “el varón se completa con la existencia de la mujer”
    es la correcta porque se pregunta qué supone esa ideología; en q-d6a78328 “el varón depende de la
    existencia de la mujer” es falsa porque se pregunta qué supone la idea de masculinidad. Validar con
    el texto cómo presenta Marqués la ideología de la complementariedad.'
- id: marques.homosocialidad-masculina
  eje: conceptos
  autor: Josep-Vicent Marqués
  fuente: Texto de la cátedra (pendiente de identificar)
