- id: weber.accion-social
  eje: conceptos
  autor: Max Weber
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: La acción social
  afirmacion: Para Weber, una acción es social cuando el sentido que le da quien la realiza tiene en cuenta
    la conducta de otros y se orienta por ella.
  puntos:
  - Una acción se considera “social” cuando los individuos que la ejecutan le asignan un sentido que tiene
    en cuenta las acciones de otros.
  - Existe acción social en la medida en que haya probabilidad de que los individuos den sentido a su
    acción en función de lo que se espera de ellos y de lo que esperan de los otros.
  - «Acción orientada» es un concepto de Weber.
  trampas:
  - texto: Existe acción social cuando el grupo logra imponer sobre los individuos sus maneras de hacer,
      pensar o sentir.
    error: concepto_vecino
    por_que: Esa es la idea de hecho social de Durkheim; Weber parte del sentido que el individuo le da
      a su acción.
  - texto: Existe acción social cuando dos individuos se encuentran cara a cara e interactúan voluntariamente.
    error: dato_inventado
    por_que: Weber no exige presencia física; alcanza con que la acción se oriente por la conducta de
      otros.
  - texto: Existe acción social cuando el grupo logra una socialización eficaz de sus miembros, o cuando
      las clases interactúan por su posición respecto de los medios de producción.
    error: concepto_vecino
    por_que: Socialización y clases sociales son conceptos de otros autores (Berger y Luckmann, Marx),
      no la definición weberiana.
  - texto: Las acciones sociales tienen una causa material y objetiva.
    error: concepto_vecino
    por_que: Busca la explicación en condiciones materiales; para Weber lo decisivo es el sentido que
      le dan los actores.
  - texto: Una acción puede considerarse social sólo cuando es considerada válida por el resto de los
      individuos.
    error: absoluto_falso
    por_que: Weber no pide que los demás la aprueben; pide que el sentido de la acción tenga en cuenta
      a los otros.
  - texto: Una acción es social cuando tiene lugar dentro de una sociedad y un momento histórico dado.
    error: verdad_general
    por_que: Que ocurra “en sociedad” no la vuelve social; lo que la vuelve social es el sentido referido
      a otros.
  - texto: Una acción es social cuando se basa en principios morales.
    error: dato_inventado
    por_que: Weber no define lo social por la moral sino por la orientación hacia la conducta de otros.
  - texto: Atribuir «Acción orientada» a Durkheim o a Marx.
    error: concepto_vecino
    por_que: La orientación por la conducta de otros es el núcleo de la acción social de Weber.
  pregunta_guia: ¿Qué tiene que tener una acción para que Weber la llame “social”?
  explicacion_modelo: 'Lo correcto es que una acción es social cuando quien la realiza le da un sentido
    que tiene en cuenta la conducta de otros. Para Weber, lo social no está en que la acción ocurra dentro
    de un grupo, sino en esa orientación hacia los demás: lo que espero de ellos y lo que ellos esperan
    de mí. La trampa más tentadora es la del grupo que impone sus maneras de hacer, pensar o sentir: suena
    sociológica, pero es el hecho social de Durkheim.'
  recurso_ubaxxi: pendiente
  preguntas:
  - q-a5f8ab08
  - q-facd15dd
  - q-dafe58a3
  estado: borrador
  notas: La clave de q-a5f8ab08 (marcas) habla de “probabilidad”, palabra que Weber usa sobre todo para
    definir la relación social; coincide con la idea y no contradice al campus, pero validar con el texto.
- id: weber.sociologia-comprensiva
  eje: conceptos
  autor: Max Weber
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: La sociología comprensiva
  afirmacion: La sociología de Weber es comprensiva porque exige que el sociólogo interprete el sentido
    subjetivo a partir del cual las personas orientan su acción.
  puntos:
  - La sociología de Weber es comprensiva porque exige que el sociólogo interprete el sentido a partir
    del cual las personas orientan su acción.
  - Su matriz “comprensivista” consiste en interpretar ese sentido.
  - «Sentido subjetivo» es un concepto de Weber.
  trampas:
  - texto: Exige que el sociólogo explique las causas objetivas que llevan a los individuos a actuar.
    error: cambio_de_palabra
    por_que: Cambia “interpretar el sentido” por “causas objetivas”; Weber parte de lo que la acción significa
      para quien actúa.
  - texto: Sostiene que las condiciones materiales de existencia definen el contenido de la acción social.
    error: concepto_vecino
    por_que: Es una mirada materialista, cercana a Marx, no la comprensiva de Weber.
  - texto: Presenta una mirada tolerante (o intolerante) frente a las diferencias culturales.
    error: verdad_general
    por_que: Juega con el sentido cotidiano de “comprensivo”; en Weber, comprender es interpretar el sentido
      de la acción.
  - texto: Tiene como finalidad última que los individuos de diferentes culturas lleguen a un entendimiento.
    error: verdad_general
    por_que: Confunde “comprender” con “entenderse”; es un método de análisis, no una meta de acuerdo
      entre culturas.
  - texto: Atribuir «Sentido subjetivo» a Berger y Luckmann o a Heller.
    error: concepto_vecino
    por_que: Otros autores también hablan de significados en lo cotidiano, pero el sentido subjetivo de
      la acción es de Weber.
  pregunta_guia: ¿Qué tiene que hacer el sociólogo, según Weber, para entender por qué la gente actúa
    como actúa?
  explicacion_modelo: 'La correcta es que la sociología de Weber exige interpretar el sentido a partir
    del cual las personas orientan su acción. Para Weber, entender lo social pasa por captar qué significa
    la acción para quien la realiza: su sentido subjetivo. La trampa más tentadora es “explicar las causas
    objetivas”: tiene la misma estructura que la correcta, pero cambia el sentido de los actores por causas
    externas a ellos.'
  recurso_ubaxxi: pendiente
  preguntas:
  - q-7957533c
  - q-8c92ac30
  - q-43ec97dc
  estado: borrador
  notas: Weber también habla de explicar causalmente la acción, pero a través de su sentido. Si el texto
    de la cátedra lo menciona, aclarar que lo falso de la opción es “causas objetivas” y no la palabra
    “explicar”.
- id: weber.tipos-de-accion
  eje: conceptos
  autor: Max Weber
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Los tipos de acción social
  afirmacion: 'Weber distingue tipos de acción social según cómo se orienta: racional con arreglo a fines,
    racional con arreglo a valores, afectiva y tradicional.'
  puntos:
  - «Acción afectiva» es un concepto de Weber.
  - «Acción tradicional» es un concepto de Weber.
  - «Acción tradicional con arreglo a fines» (así aparece en el examen) se atribuye a Weber.
  trampas:
  - texto: Atribuir «Acción tradicional» o «Acción afectiva» a Heller o a Elías.
    error: concepto_vecino
    por_que: Suenan a vida cotidiana o a emociones, pero la tipología de la acción (fines, valores, afectiva,
      tradicional) es de Weber.
  - texto: Atribuir los tipos de acción a Durkheim o a Marx.
    error: concepto_vecino
    por_que: Durkheim parte de hechos sociales que se imponen y Marx de las relaciones de producción;
      el sentido de la acción es de Weber.
  pregunta_guia: ¿Cuáles son los cuatro tipos de acción social de Weber y qué orienta a cada uno?
  explicacion_modelo: Las tres son de Weber. Para él, la acción social puede orientarse racionalmente
    por fines o por valores, por los afectos y sentimientos del momento (afectiva) o por la costumbre
    arraigada (tradicional). La confusión más común es atribuir la acción tradicional a autores de la
    vida cotidiana, como Heller, porque habla de costumbres; pero clasificar la acción según su orientación
    es propio de Weber.
  recurso_ubaxxi: pendiente
  preguntas:
  - q-5f336544
  - q-4b0b06f2
  - q-40eec0e5
  estado: borrador
  notas: El concepto de q-40eec0e5, «Acción tradicional con arreglo a fines», mezcla dos tipos distintos
    de Weber (tradicional y racional con arreglo a fines); parece un error del examen. La respuesta (Weber)
    no cambia. El examen no pregunta directamente las definiciones de acción afectiva y tradicional que
    usa la explicación; validarlas con el texto.
- id: weber.accion-con-arreglo-a-fines
  eje: conceptos
  autor: Max Weber
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Acción racional con arreglo a fines
  afirmacion: La acción racional con arreglo a fines es la que se orienta a lograr un resultado específico
    y, para eso, sopesa los medios, los fines y las consecuencias.
  puntos:
  - Se caracteriza por ser una acción que sopesa los medios, los fines y las consecuencias.
  - Se caracteriza por ser una acción orientada para lograr un resultado específico.
  trampas:
  - texto: Se caracteriza por ser una conducta motivada por la creencia consciente en determinado valor.
    error: concepto_vecino
    por_que: Esa es la acción con arreglo a valores; la de fines calcula medios y consecuencias.
  - texto: Se caracteriza por ser una conducta guiada por las emociones y los sentimientos actuales.
    error: concepto_vecino
    por_que: Describe la acción afectiva.
  - texto: Se caracteriza por ser un comportamiento basado en las costumbres de una sociedad, o una acción
      orientada por hábitos de la cotidianidad.
    error: concepto_vecino
    por_que: Costumbres y hábitos remiten a la acción tradicional, no a un cálculo de medios y fines.
  pregunta_guia: ¿Qué pone en la balanza quien actúa con arreglo a fines?
  explicacion_modelo: La correcta es la acción que sopesa medios, fines y consecuencias (en otra versión,
    la orientada a lograr un resultado específico). Para Weber, en este tipo de acción el actor calcula
    qué medios le sirven para su objetivo y qué efectos va a tener. La opción más tentadora es la de la
    creencia consciente en un valor, porque también es racional; pero ahí se actúa por convicción, sin
    atender al resultado.
  recurso_ubaxxi: pendiente
  preguntas:
  - q-8122d549
  - q-a08fcc04
  estado: borrador
- id: weber.accion-con-arreglo-a-valores
  eje: conceptos
  autor: Max Weber
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Acción racional con arreglo a valores
  afirmacion: 'La acción con arreglo a valores es la conducta motivada por la creencia consciente en determinado
    valor: se actúa así porque se cree que esa conducta encarna un valor.'
  puntos:
  - Se caracteriza por ser una conducta motivada por la creencia consciente en determinado valor.
  - Se caracteriza por ser una conducta motivada por la creencia de que encarna un valor.
  trampas:
  - texto: Se caracteriza por ser una acción orientada para lograr un resultado específico.
    error: concepto_vecino
    por_que: Eso es la acción con arreglo a fines; la de valores no se guía por el resultado.
  - texto: Se caracteriza por ser una conducta guiada por las emociones y los sentimientos actuales.
    error: concepto_vecino
    por_que: Describe la acción afectiva; la de valores es consciente, no un impulso del momento.
  - texto: Se caracteriza por ser una acción orientada por hábitos conscientes de la cotidianidad.
    error: concepto_vecino
    por_que: Los hábitos remiten a la acción tradicional; el “conscientes” está puesto para que se parezca
      a la de valores.
  - texto: Se caracteriza por ser un comportamiento basado en las costumbres de una sociedad.
    error: concepto_vecino
    por_que: La costumbre es lo propio de la acción tradicional.
  pregunta_guia: '¿Qué mueve a quien actúa con arreglo a valores: el resultado, la emoción, la costumbre
    o la convicción?'
  explicacion_modelo: 'La correcta es la conducta motivada por la creencia consciente en determinado valor.
    Para Weber, quien actúa así lo hace por convicción: cree que esa conducta vale por sí misma. La trampa
    más tentadora es “lograr un resultado específico”, que es la definición de la acción con arreglo a
    fines; también engaña la de los “hábitos conscientes”, que mezcla la costumbre de la acción tradicional
    con la conciencia de la acción por valores.'
  recurso_ubaxxi: pendiente
  preguntas:
  - q-f9142f7a
  - q-fb83c501
  - q-35a972cd
  estado: borrador
- id: weber.poder-y-dominacion
  eje: conceptos
  autor: Max Weber
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Poder y dominación legítima
  afirmacion: 'Para Weber, el poder es un concepto amorfo del que no se desprende ninguna autoridad; la
    dominación es la probabilidad de obtener obediencia a un mandato con contenido, y la dominación legítima
    tiene tres tipos: tradicional, carismática y legal-racional.'
  puntos:
  - La dominación es una relación en la que un mandato se legitima por la aceptación y la obediencia a
    la autoridad que se desprende de ese mandato.
  - La dominación legítima es la probabilidad de obtener obediencia a un mandato con contenido específico.
  - Del poder no se desprende ningún tipo de autoridad; de la dominación legítima se desprenden tres tipos
    de autoridad, que se corresponden con los tipos de dominación.
  - 'El poder no implica la obediencia a un mandato con contenido; la dominación legítima sí, en tres
    tipos distintos: tradicional, carismática y legal-racional.'
  - El concepto “amorfo” del poder es de Weber.
  trampas:
  - texto: La dominación es la posibilidad de imponer la voluntad propia contra toda resistencia.
    error: concepto_vecino
    por_que: Esa es la definición weberiana de poder, no de dominación.
  - texto: El poder es la capacidad de imponer la propia voluntad contra toda resistencia y la dominación
      es una consecuencia lógica del ejercicio del poder.
    error: media_verdad
    por_que: 'Arranca con la definición correcta de poder, pero la dominación no se deduce del poder:
      depende de la obediencia a un mandato.'
  - texto: Del poder se desprende un solo tipo de autoridad legítima y de la dominación, tres tipos.
    error: cambio_de_palabra
    por_que: Del poder no se desprende ninguna autoridad; los tres tipos son de la dominación legítima.
  - texto: El poder es un conjunto de técnicas disciplinarias sobre los cuerpos y la dominación legítima
      es resultado de la interpelación ideológica.
    error: concepto_vecino
    por_que: Mezcla a Foucault (disciplinas) y a Althusser (interpelación); no es la distinción de Weber.
  - texto: La dominación es la explotación de una clase sobre las otras, un conjunto de técnicas de disciplinamiento
      o el sistema de obediencia y explotación que surge del patriarcado.
    error: concepto_vecino
    por_que: Son las miradas de Marx, Foucault y la perspectiva feminista; para Weber la dominación es
      obediencia legítima a un mandato.
  - texto: Atribuir el concepto “amorfo” del poder a Foucault.
    error: concepto_vecino
    por_que: Foucault también trabaja el poder, pero llamarlo “amorfo” para diferenciarlo de la dominación
      es de Weber.
  pregunta_guia: ¿Qué tiene la dominación que no tiene el poder?
  explicacion_modelo: 'Para Weber, poder y dominación no son lo mismo. El poder es amorfo: cualquier cualidad
    o situación puede permitir imponer la propia voluntad, y de ahí no sale ninguna autoridad. La dominación
    es más precisa: es la probabilidad de que un mandato con contenido sea obedecido, y cuando es legítima
    toma tres formas (tradicional, carismática y legal-racional). La trampa más tentadora define la dominación
    como “imponer la voluntad contra toda resistencia”: esa es la definición de poder.'
  recurso_ubaxxi: pendiente
  preguntas:
  - q-d65164af
  - q-719e3a27
  - q-45dd31b0
  - q-c0323a54
  estado: borrador
  notas: En q-c0323a54 el examen llama «Dominación legítima» a lo que Weber define como dominación a secas
    (probabilidad de obediencia a un mandato de determinado contenido); la ficha sigue al examen. Validar
    con el texto el porqué de “amorfo” que da la explicación (cualquier cualidad o situación puede dar
    poder).
- id: weber.dominacion-tradicional
  eje: conceptos
  autor: Max Weber
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Dominación tradicional
  afirmacion: 'La dominación tradicional es la relación de mandato y obediencia que se apoya en la costumbre
    y el paso del tiempo: en la santidad de las ordenaciones y en un poder de mando heredado de tiempos
    lejanos.'
  puntos:
  - La dominación tradicional es la relación social de mandato y obediencia sancionada por la costumbre
    y el paso del tiempo.
  - Es una relación social que involucra mandatos fundados en la santidad de las ordenaciones y el poder
    de mando heredado de tiempos lejanos.
  - «Dominación tradicional» es un concepto de Weber.
  trampas:
  - texto: La cualidad de una personalidad que pasa por extraordinaria constituye a alguien como líder.
    error: concepto_vecino
    por_que: Es la dominación carismática.
  - texto: La dominación de tipo religiosa.
    error: verdad_general
    por_que: Se habla de “santidad”, pero lo que funda esta dominación es la tradición heredada, no una
      religión.
  - texto: Las cualidades extraordinarias de los cuadros burocráticos que sostienen una dominación.
    error: concepto_vecino
    por_que: Mezcla el carisma (cualidades extraordinarias) con la burocracia de la dominación legal-racional.
  - texto: La dominación de un líder elegido por la voluntad mayoritaria de la población.
    error: dato_inventado
    por_que: Ninguno de los tipos de Weber se define por el voto de la mayoría; la tradicional se funda
      en la costumbre.
  - texto: Atribuir «Dominación tradicional» a Durkheim, Heller o Marqués.
    error: concepto_vecino
    por_que: Los tipos de dominación legítima son de Weber.
  pregunta_guia: '¿Por qué se obedece en la dominación tradicional: por la persona, por la ley o por la
    costumbre?'
  explicacion_modelo: 'La correcta es la relación de mandato y obediencia sancionada por la costumbre
    y el paso del tiempo. Para Weber, en la dominación tradicional se obedece porque “siempre fue así”:
    las ordenaciones se consideran sagradas y el poder de mando se hereda de tiempos lejanos. La trampa
    más tentadora es la “dominación de tipo religiosa”, que se apoya en la palabra “santidad”, pero lo
    que legitima acá es la tradición.'
  recurso_ubaxxi: pendiente
  preguntas:
  - q-575f5319
  - q-6c6bb626
  - q-f3e0ef88
  estado: borrador
- id: weber.dominacion-carismatica
  eje: conceptos
  autor: Max Weber
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Dominación carismática
  afirmacion: 'En la dominación carismática se obedece a una persona por sus cualidades: la cualidad de
    una personalidad que pasa por extraordinaria la constituye como líder.'
  puntos:
  - La cualidad de una personalidad que pasa por extraordinaria constituye a alguien como líder.
  - Es la dominación basada en las características personales de una persona.
  - «Dominación carismática» es un concepto de Weber.
  trampas:
  - texto: Son las cualidades extraordinarias de los cuadros burocráticos que sostienen una dominación.
    error: cambio_de_palabra
    por_que: Cambia “una personalidad” por “los cuadros burocráticos”; el carisma es del líder y la burocracia,
      de la dominación legal-racional.
  - texto: Es una dominación de tipo religioso.
    error: verdad_general
    por_que: Puede haber líderes carismáticos religiosos, pero lo que define al carisma es la cualidad
      extraordinaria atribuida a la persona.
  - texto: Es la dominación de un líder elegido por la voluntad mayoritaria de la población.
    error: dato_inventado
    por_que: El carisma no depende de una elección mayoritaria sino de las cualidades que se le reconocen
      al líder.
  - texto: Es la dominación sancionada por la costumbre y el paso del tiempo.
    error: concepto_vecino
    por_que: Es la dominación tradicional.
  - texto: Atribuir «Dominación carismática» a Foucault, Althusser o Mills.
    error: concepto_vecino
    por_que: Estos autores también hablan de poder o de ideología, pero los tipos de dominación son de
      Weber.
  pregunta_guia: ¿A quién se obedece en la dominación carismática y por qué?
  explicacion_modelo: 'La correcta es la que dice que la cualidad extraordinaria de una personalidad constituye
    a alguien como líder. Para Weber, en este tipo se obedece a la persona por las características que
    se le atribuyen, no por la costumbre ni por una ley. La trampa más tentadora es la de “las cualidades
    extraordinarias de los cuadros burocráticos”: repite la palabra clave, pero le pone el carisma a la
    burocracia, que es propia de la dominación legal-racional.'
  recurso_ubaxxi: pendiente
  preguntas:
  - q-98b1e47c
  - q-9e42bb4a
  - q-e59ff872
  estado: borrador
- id: weber.dominacion-legal-racional
  eje: conceptos
  autor: Max Weber
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Dominación legal-racional
  afirmacion: En la dominación legal-racional se obedece a reglas estatuidas y no a personas por derecho
    propio; se ejerce a través de cuadros administrativos abocados a los deberes objetivos de su cargo.
  puntos:
  - Se ejerce implementando la obediencia a las reglas estatuidas y no a las personas por derecho propio.
  - Se ejerce por medio de cuadros administrativos abocados a los deberes objetivos de su cargo.
  trampas:
  - texto: Se ejerce según la interpretación que cada funcionario haga de las leyes y reglamentos.
    error: media_verdad
    por_que: Arranca bien con leyes y reglamentos, pero el funcionario cumple deberes objetivos; no manda
      su criterio personal.
  - texto: Se ejerce por medio de un sistema penal (o judicial).
    error: verdad_general
    por_que: Suena a “legal”, pero lo que la define es la obediencia a reglas impersonales a través de
      un cuadro administrativo.
  - texto: Se ejerce según los principios que marca la tradición.
    error: concepto_vecino
    por_que: Es la dominación tradicional.
  - texto: Se ejerce por medio de la coerción física.
    error: concepto_vecino
    por_que: Confunde dominación con fuerza; la dominación supone obediencia a un mandato que se acepta
      como legítimo.
  pregunta_guia: 'En la dominación legal-racional, ¿a qué se obedece: a una persona, a la costumbre o
    a una regla?'
  explicacion_modelo: 'Las correctas son la obediencia a reglas estatuidas y no a las personas, y el ejercicio
    a través de cuadros administrativos que cumplen los deberes objetivos de su cargo. Para Weber, en
    este tipo el mando es impersonal: se obedece a la norma, y quien manda también está sujeto a ella.
    La trampa más tentadora es “según la interpretación que cada funcionario haga de las leyes”: nombra
    las leyes, pero vuelve personal lo que Weber define como impersonal.'
  recurso_ubaxxi: pendiente
  preguntas:
  - q-fd023f40
  estado: borrador
  notas: 'Ficha de una sola pregunta (con dos versiones, marcas y campus, que coinciden): ninguna otra
    pregunta del banco desarrolla este tipo de dominación.'
- id: weber.tipo-ideal
  eje: conceptos
  autor: Max Weber
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: El tipo ideal
  afirmacion: 'El tipo ideal es un modelo que construye el investigador para orientar la investigación:
    no es un promedio ni una hipótesis, sino un conjunto de modos típicos de comportamiento accesibles
    a la comprensión.'
  puntos:
