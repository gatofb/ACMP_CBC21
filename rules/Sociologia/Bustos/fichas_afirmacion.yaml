- id: lefebvre.praxis-y-opacidad
  eje: conceptos
  autor: Henri Lefebvre
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Praxis social, praxis revolucionaria y opacidad de la ideología
  afirmacion: 'Para Lefebvre, la praxis social, en estructuras sociales y modos de producción determinados,
    genera representaciones que hacen que aumente o disminuya la falta de transparencia (la opacidad)
    de una sociedad. La praxis revolucionaria y la opacidad de la ideología son conceptos suyos.

    '
  puntos:
  - El concepto que corresponde a la definición «En estructuras sociales y modos de producción, genera
    representaciones que hacen que aumente o disminuya la falta de transparencia de una sociedad» es «Praxis
    social».
  - El concepto «Praxis revolucionaria» es de Lefebvre.
  - El concepto «Opacidad de la ideología» es de Lefebvre.
  trampas:
  - texto: Atribuir «Praxis revolucionaria» u «Opacidad de la ideología» a Marx.
    error: concepto_vecino
    por_que: Lefebvre trabaja sobre Marx, pero en el examen estos conceptos se le atribuyen a Lefebvre.
  - texto: Para la definición de praxis social, elegir «Carácter estabilizante de la ideología».
    error: concepto_vecino
    por_que: El carácter estabilizante es de Duby y trata de preservar o reemplazar el orden vigente;
      la definición habla de representaciones que vuelven más o menos opaca a la sociedad.
  pregunta_guia: ¿Qué produce la praxis social según Lefebvre y qué tiene que ver con la transparencia
    de una sociedad?
  explicacion_modelo: 'La definición corresponde a la praxis social. Según Lefebvre, en estructuras sociales
    y modos de producción determinados, la praxis genera representaciones que hacen más o menos opaca
    a una sociedad; por eso la «opacidad de la ideología» y la «praxis revolucionaria» son conceptos suyos.
    La opción tentadora es «Carácter estabilizante de la ideología», porque también habla de representaciones,
    pero es un rasgo de Duby sobre preservar o cambiar el orden vigente.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-237330e3
  - q-e3f78678
  - q-42bea2e8
  - q-6f9d3c0b
  estado: borrador
  notas: 'q-42bea2e8 viene sin autor; se asigna a Lefebvre por la idea de opacidad y transparencia de
    la sociedad, que es la misma de «Opacidad de la ideología». Las dos versiones de q-237330e3 son de
    marcas, pero no hay motivo para dudar. El examen solo pide el autor de «Praxis revolucionaria»; validar
    con el texto qué entiende Lefebvre por ella antes de enseñar más. Se sumó q-6f9d3c0b, que estaba en
    otra ficha sin autor: es la misma definición.'
- id: duby.definicion-de-ideologia
  eje: conceptos
  autor: Georges Duby
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Qué es la ideología según Duby
  afirmacion: 'Para Duby, la ideología es un sistema de representaciones (mitos, ideas) dotado de una
    existencia material y de un papel histórico determinado, que pertenece a una sociedad en un momento
    dado. Los individuos ajustan sus conductas a esa imagen de la sociedad, aunque no sea un reflejo fiel
    de ella.

    '
  puntos:
  - Según Duby, la ideología es un sistema de representaciones dotado de una existencia material y un
    papel histórico determinado.
  - Según Duby, la ideología es un conjunto de representaciones, mitos o ideas que pertenecen a una sociedad
    en determinado momento.
  - El concepto que corresponde a la definición «Imagen de la sociedad que no es un reflejo fiel de ella,
    pero a la cual los individuos ajustan sus conductas» es «Fenómenos mentales».
  - El concepto «Ideología popular» es de Duby.
  trampas:
  - texto: Un conjunto de representaciones, mitos o ideas que pertenecen a cualquier sociedad en cualquier
      tiempo y espacio.
    error: absoluto_falso
    por_que: Para Duby la ideología es propia de una sociedad dada y tiene un papel histórico determinado;
      no es igual en cualquier tiempo y lugar.
  - texto: Un conjunto de discursos e ideas que solo las clases dominantes son capaces de producir, o
      que provienen de la clase obrera.
    error: absoluto_falso
    por_que: Para Duby en una sociedad conviven varias ideologías que compiten entre sí; no son producto
      exclusivo de una clase.
  - texto: El conjunto de intereses propios de las clases dominantes.
    error: concepto_vecino
    por_que: Confunde la ideología (un sistema de representaciones) con los intereses a los que puede
      servir.
  - texto: Un sistema de representaciones que corresponde al conjunto de las clases sociales.
    error: verdad_general
    por_que: Las ideologías expresan antagonismos dentro de la sociedad (son concurrentes); no hay un
      único sistema compartido por todas las clases.
  - texto: Un conjunto de discursos y mandatos provenientes de los aparatos ideológicos del Estado.
    error: concepto_vecino
    por_que: Los aparatos ideológicos del Estado son un concepto de Althusser.
  - texto: La ciencia de las ideas que estudia el origen de los conceptos abstractos.
    error: concepto_vecino
    por_que: Confunde la ideología con una ciencia de las ideas; Duby habla de un sistema de representaciones
      con un papel histórico.
  - texto: Para la definición de la imagen a la que los individuos ajustan sus conductas, elegir «Tipo
      ideal» o «Praxis sociales».
    error: concepto_vecino
    por_que: El tipo ideal es una herramienta de Weber para construir conceptos y la praxis social es
      de Lefebvre; la definición nombra los fenómenos mentales.
  pregunta_guia: ¿Qué le agrega Duby a la palabra «representaciones» para que la ideología no sea una
    idea abstracta, y por qué importa que la gente ajuste su conducta a ellas?
  explicacion_modelo: 'Para Duby, la ideología es un sistema de representaciones con existencia material
    y un papel histórico determinado, propio de una sociedad en un momento dado. Por eso, aunque la imagen
    que da de la sociedad no sea fiel, los individuos ajustan sus conductas a ella. La trampa más tentadora
    es «pertenecen a cualquier sociedad en cualquier tiempo y espacio», que suena abarcadora pero borra
    justamente lo histórico y situado de la ideología.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-b7d0530c
  - q-4d903d8e
  - q-3b000ef6
  estado: borrador
  notas: 'q-4d903d8e (fenómenos mentales) viene sin autor; se asigna a Duby porque la idea de que los
    individuos ajustan su conducta a la imagen que se hacen de la sociedad, y no a la realidad, parece
    de su texto. Validar. q-3b000ef6 solo pide el autor de «Ideología popular»; validar con el texto qué
    dice Duby de ella antes de enseñar más. La v1 de q-b7d0530c (marcas, «una sociedad en determinado
    momento») es coherente con la v2 de campus; las dos versiones tienen distinta letra correcta porque
    cambian las opciones, y la ficha enseña las dos.

    '
- id: duby.caracter-globalizante
  eje: conceptos
  autor: Georges Duby
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: El carácter globalizante de las ideologías
  afirmacion: 'Para Duby, las ideologías son globalizantes porque se presentan como sistemas completos
    que ofrecen a la sociedad una representación de conjunto, integrada a una visión total del mundo.

    '
  puntos:
  - Para Duby, las ideologías son globalizantes porque son visiones completas del mundo social.
  - Las ideologías se presentan como sistemas completos que ofrecen una visión total del mundo.
  - El concepto que corresponde a la definición «Las ideologías son sistemas completos que ofrecen a la
    sociedad una representación de conjunto integrada a una visión del mundo» es «Carácter globalizante
    de las ideologías».
  trampas:
  - texto: … se superponen con varios sistemas de representación antagónicos, o expresan oposiciones que
      responden a distintos intereses.
    error: concepto_vecino
    por_que: Eso apunta al carácter concurrente (varias ideologías enfrentadas), no al globalizante.
  - texto: … ocultan o deforman ciertos aspectos de la realidad para servir mejor a intereses particulares.
    error: concepto_vecino
    por_que: Eso apunta al carácter deformante; globalizante quiere decir que ofrecen una visión completa
      del mundo.
  - texto: … son un conjunto de intereses que aglutinan a la burguesía mundial.
    error: dato_inventado
    por_que: Lee «globalizante» como «mundial»; Duby no habla de una burguesía mundial sino de visiones
      completas del mundo social.
  - texto: … son representaciones construidas por el Estado para dominar.
    error: dato_inventado
    por_que: Duby no dice que las construya el Estado; globalizante se refiere a que abarcan todo el mundo
      social.
  pregunta_guia: ¿Qué quiere decir que una ideología sea «globalizante» y en qué se diferencia de que
    sea concurrente o deformante?
  explicacion_modelo: 'Las ideologías son globalizantes porque se presentan como sistemas completos que
    dan una visión total del mundo social. Para Duby, una ideología no explica un aspecto suelto, sino
    que integra a toda la sociedad en una representación de conjunto. La opción tentadora es «se superponen
    con varios sistemas de representación antagónicos», que se parece a la idea de ideologías enfrentadas,
    pero eso describe el carácter concurrente, no el globalizante.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-2ef4de4f
  - q-a684b0c8
  estado: borrador
  notas: 'q-a684b0c8 viene sin autor; los caracteres globalizante, deformante, concurrente y estabilizante
    son de Duby. En q-2ef4de4f la v1 es de marcas y la v2 de campus; coinciden.

    '
