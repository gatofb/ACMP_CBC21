- id: marques.coincidencias-con-mills
  eje: conceptos
  autor: Josep-Vicent Marqués
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: 'Marqués y Mills: la vida cotidiana en su contexto social e histórico'
  afirmacion: 'Marqués y Mills coinciden en que, para pensar sociológicamente, hay que cuestionar la vida
    cotidiana y privada: lo que nos pasa ocurre en contextos sociales e históricos que lo definen y que
    no siempre son evidentes.'
  puntos:
  - Para Marqués, como para Mills, las personas atraviesan diferentes situaciones en la vida en contextos
    sociales e históricos que las definen y que no siempre son evidentes para ellas.
  - Mills y Marqués afirman que, para pensar sociológicamente, es necesario cuestionar lo que hacemos
    en nuestras vidas cotidianas y privadas.
  - Al afirmar que lo social no es natural, Marqués coincide con la imaginación sociológica de Mills porque
    explica diferentes circunstancias individuales en un contexto histórico y social.
  - Marqués y Mills coinciden en considerar la vida cotidiana según su carácter social e histórico.
  trampas:
  - texto: Los autores que lo afirman son Durkheim y Mills, o Weber y Marqués.
    error: media_verdad
    por_que: Cada par acierta con uno de los dos autores; la pareja correcta es Mills y Marqués.
  - texto: Los autores que lo afirman son Marx y Lefebvre, o Althusser y Weber.
    error: concepto_vecino
    por_que: Son autores de otras unidades; la idea de cuestionar la propia vida cotidiana es la que comparten
      Mills y Marqués.
  - texto: Las personas responden a las situaciones según sus ideologías particulares, la realidad socioeconómica
      o el nivel educativo que alcanzaron.
    error: verdad_general
    por_que: Pueden influir, pero la coincidencia entre ambos autores es el contexto social e histórico.
  - texto: Las situaciones ocurren en contextos en los que los valores y principios morales no cambian
      históricamente, y por eso las orientan.
    error: cambio_de_palabra
    por_que: 'Niega lo central: los contextos son históricos y cambian.'
  - texto: Coinciden porque la gente tiene representaciones imaginarias de sus relaciones reales de existencia.
    error: concepto_vecino
    por_que: Es la definición de ideología de Althusser; se cuelga de la palabra “imaginación”.
  - texto: Coinciden porque con la imaginación es posible representarse la vida de otras personas, o porque
      la vida humana es misteriosa y debemos imaginarla.
    error: verdad_general
    por_que: Toma “imaginación” en sentido cotidiano; la imaginación sociológica relaciona biografía e
      historia.
  - texto: Coinciden porque la gente no sabe nada de sociología y solo piensa en términos emocionales,
      políticos o económicos.
    error: absoluto_falso
    por_que: Generaliza con “nada” y “solo”; ninguno de los dos autores lo plantea así.
  - texto: Coinciden en ver la vida cotidiana como suma de relaciones de producción, espacio de ideologías
      concurrentes, muda copresencia o terreno de la anatomo-política.
    error: concepto_vecino
    por_que: Son conceptos de Marx, Duby, Heller y Foucault, no la mirada que comparten Marqués y Mills.
  pregunta_guia: ¿Qué hacen Marqués y Mills con las situaciones de la vida cotidiana para pensarlas sociológicamente?
  explicacion_modelo: 'Marqués y Mills coinciden en que hay que cuestionar lo que hacemos en la vida cotidiana
    y privada, porque eso ocurre en contextos sociales e históricos que lo definen y que muchas veces
    no vemos. Por eso, cuando Marqués dice que lo social no es natural, se acerca a la imaginación sociológica:
    explica circunstancias individuales dentro de su contexto. La trampa más tentadora es la de las “representaciones
    imaginarias”: se cuelga de la palabra “imaginación”, pero es la definición de ideología de Althusser.'
  recurso_ubaxxi: pendiente
  preguntas:
  - q-11db5810
  - q-0cf2ebe4
  - q-feab1fd9
  - q-80c9b73b
  - q-6acd7309
  estado: borrador
  notas: La ficha cruza dos autores; va con autor Marqués porque las preguntas están en su sección del
    banco. Si la app necesita reflejar a Mills también, evaluar cómo marcarlo.
- id: heller.vida-cotidiana
  eje: conceptos
  autor: Agnes Heller
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: La vida cotidiana como reproducción del particular y de la sociedad
  afirmacion: 'Para Heller, la vida cotidiana es el ámbito donde se produce la reproducción social y,
    a la vez, la autorreproducción de los individuos particulares; en ella participa el hombre entero.

    '
  puntos:
  - La vida cotidiana es el ámbito donde se produce la reproducción social, en cuanto reproducción de
    las relaciones sociales, y la autorreproducción de los individuos particulares.
  - La vida cotidiana es el ámbito en el que participa el hombre entero.
  - '«Pragmatismo» es un concepto de Heller: la acción cotidiana es espontánea y pragmática.'
  - «Regimiento de la vida» es un concepto de Heller.
  trampas:
  - texto: Es el ámbito en el que desarrollamos el conjunto de rutinas que repetimos a diario.
    error: verdad_general
    por_que: Es la idea de sentido común de «lo cotidiano»; Heller la define por lo que se reproduce en
      ella, no por la rutina.
  - texto: Es el ámbito en el que las personas nos desarrollamos libremente como seres particulares (o
      según nuestra particularidad).
    error: dato_inventado
    por_que: 'Heller habla de una particularidad socialmente mediada: el particular se reproduce en un
      mundo social dado, no «libremente».'
  - texto: Es el ámbito en el que desarrollamos todas nuestras capacidades en su máxima expresión.
    error: media_verdad
    por_que: Arranca de algo cierto (participa el hombre entero), pero participar con todas las capacidades
      no es desplegarlas al máximo.
  - texto: Es el ámbito desde el que (o al que hay que llegar para) superar la cosificación del lenguaje.
    error: dato_inventado
    por_que: La definición de Heller no habla de cosificación del lenguaje; es una frase armada para sonar
      teórica.
  - texto: Atribuirle «Pragmatismo» o «Regimiento de la vida» a Mills, Marx o Elías.
    error: concepto_vecino
    por_que: En el examen los dos son conceptos de Heller y van con su análisis de la vida cotidiana.
  pregunta_guia: ¿Qué se reproduce en la vida cotidiana según Heller, y quién participa en ella?
  explicacion_modelo: 'Son verdaderas las dos definiciones: la vida cotidiana es el ámbito de la reproducción
    social y de la autorreproducción del particular, y en ella participa el hombre entero. Heller la define
    por lo que se reproduce en ella, no por la repetición. Por eso la trampa más tentadora es "el conjunto
    de rutinas que repetimos a diario": suena a sentido común, pero no es la definición de la autora.
    Tampoco es cierto que ahí nos desarrollemos "libremente", porque la particularidad está socialmente
    mediada.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-e2e52b7d
  - q-4f7f0523
  - q-26dca9b5
  - q-9c097e46
  estado: borrador
  notas: 'q-e2e52b7d figura dos veces en la lista de ids y en el archivo de preguntas, con el mismo contenido.
    El examen solo pregunta el autor de «Regimiento de la vida»; validar con el texto qué entiende Heller
    por ese concepto (podría ser la «conducción de la vida») antes de explicarlo. Que «libremente» sea
    falso se apoya en «particularidad socialmente mediada» (q-a680fb62); confirmarlo con el texto.

    '
- id: heller.heterogeneidad
  eje: conceptos
  autor: Agnes Heller
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: La heterogeneidad de la vida cotidiana
  afirmacion: 'La vida cotidiana es heterogénea: está hecha de una diversidad de actividades y habilidades
    distintas. Heller habla también de una "jerarquía espontánea" dentro de la vida cotidiana.

    '
  puntos:
  - La heterogeneidad de la vida cotidiana es la diversidad de actividades (y habilidades) que desarrollamos
    en ese ámbito.
  - «Heterogeneidad» es un concepto de Heller.
  - «Jerarquía espontánea» es un concepto de Heller.
  trampas:
  - texto: La diversidad de enfoques teóricos que hay que tener en cuenta para analizar la vida cotidiana.
    error: cambio_de_palabra
    por_que: Lo heterogéneo está en la vida cotidiana misma (lo que hacemos), no en las teorías que la
      estudian.
  - texto: La diversidad de perspectivas culturales, de hombres y mujeres o de maneras de transitar la
      vida cotidiana.
    error: cambio_de_palabra
    por_que: Lo diverso son las actividades, no las personas ni sus puntos de vista.
  - texto: La diversidad de variables históricas, políticas y económicas que determinan la vida cotidiana.
    error: verdad_general
    por_que: Suena a explicación sociológica, pero la heterogeneidad nombra la variedad de actividades,
      no sus causas.
  - texto: La diversidad de conceptos que vamos adquiriendo a lo largo de la vida cotidiana.
    error: cambio_de_palabra
    por_que: Cambia «actividades» por «conceptos».
  - texto: Atribuirle «Heterogeneidad» o «Jerarquía espontánea» a Weber, Marqués o Lefebvre.
    error: concepto_vecino
    por_que: Los dos conceptos describen la vida cotidiana según Heller.
  pregunta_guia: Cuando Heller dice que la vida cotidiana es heterogénea, ¿qué es lo que es diverso?
  explicacion_modelo: 'La heterogeneidad es la diversidad de actividades (y habilidades) que desarrollamos
    en la vida cotidiana. Para Heller, en lo cotidiano hacemos cosas muy distintas, y eso es lo heterogéneo.
    La opción más tentadora es la de los "enfoques teóricos" necesarios para analizarla: pasa la diversidad
    de la vida misma a las teorías que la estudian.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-982e25d8
  - q-4c651386
  - q-ab01a885
  estado: borrador
  notas: 'Validar con el texto cómo se relaciona la heterogeneidad con la «jerarquía espontánea» (el examen
    solo pregunta el autor). La clave de q-982e25d8 v1 sale de marcas, pero coincide con la del campus
    (v2).

    '
- id: heller.particular-y-especifico
  eje: conceptos
  autor: Agnes Heller
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Ser particular y ser específico (genericidad)
  afirmacion: 'Cada persona es a la vez un ser particular, con una particularidad socialmente mediada,
    y un ser específico, que remite a las facultades y capacidades del género humano (la genericidad).
    En la vida cotidiana los dos coexisten de manera muda; lo específico se vuelve consciente en la homogeneización.

    '
  puntos:
  - El ser específico remite a las facultades y capacidades del género humano.
  - En la vida cotidiana, el ser específico coexiste de manera muda con el ser particular.
  - El ser específico se vuelve consciente en el proceso de homogeneización.
  - «Particularidad», «Particularidad socialmente mediada», «Ser específico» y «Genericidad» son conceptos
    de Heller.
  - «Extrañación» es un concepto de Heller.
  trampas:
  - texto: El ser específico se impone sobre el ser particular cuando se produce la extrañación.
    error: concepto_vecino
    por_que: 'Confunde extrañación con homogeneización: lo específico pasa al primer plano, consciente,
      en la homogeneización.'
  - texto: El ser específico es una característica del pensamiento cotidiano.
    error: concepto_vecino
    por_que: El pensamiento cotidiano es espontáneo y pragmático; el ser específico remite a las capacidades
      del género humano, que en lo cotidiano quedan mudas.
  - texto: Atribuirle «Particularidad» o «Extrañación» a Berger y Luckmann o a Marx.
    error: concepto_vecino
    por_que: Son conceptos de Heller; en las comparaciones el examen marca como falso que Berger y Luckmann
      partan de la extrañación.
  pregunta_guia: ¿Qué dos dimensiones conviven en cada persona según Heller, y en qué proceso se vuelve
    consciente la segunda?
  explicacion_modelo: 'Es verdadero que el ser específico remite a las facultades del género humano, que
    en la vida cotidiana coexiste de manera muda con el ser particular y que se vuelve consciente en la
    homogeneización. Para Heller cada persona es a la vez particular y específica (genérica). La trampa
    más tentadora dice que lo específico "se impone" en la extrañación: confunde la extrañación con la
    homogeneización, que es cuando lo genérico pasa al primer plano.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-b3e30f90
  - q-a680fb62
  - q-7f3ccb13
  - q-5f157308
  - q-7559dcbd
  - q-abb0cc49
  estado: borrador
  notas: 'El examen no define «extrañación»: solo pregunta el autor y la usa en distractores. Validar
    con el texto si para Heller la extrañación es el predominio de la particularidad sobre lo específico,
    como sugiere q-0f50144a A («cuando la particularidad somete a lo específico...»). Marx aparece como
    opción en q-abb0cc49; habla de trabajo enajenado (en algunas traducciones, «extrañado»), lo que puede
    confundir al alumno.

    '
- id: heller.muda-copresencia
  eje: conceptos
  autor: Agnes Heller
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: La muda copresencia de particularidad y especificidad
  afirmacion: 'La "muda copresencia" es la existencia simultánea, permanente y sin antagonismos de la
    particularidad y la especificidad dentro de cada persona.

    '
  puntos:
  - 'La muda copresencia es la existencia simultánea, permanente y sin antagonismos de dos dimensiones
    al interior de cada persona: la particularidad y la especificidad.'
  - «Muda copresencia» es un concepto de Heller.
  trampas:
  - texto: La imposibilidad de percibir el permanente conflicto entre la particularidad y la especificidad.
    error: media_verdad
    por_que: Toma lo «mudo» (no se percibe), pero lo convierte en un conflicto; la copresencia es sin
      antagonismos.
  - texto: Las dificultades en la comunicación entre las personas causadas por la cosificación del lenguaje.
    error: verdad_general
    por_que: Lee «muda» al pie de la letra, como un problema de comunicación; la copresencia ocurre dentro
      de cada persona.
  - texto: La convivencia de diversas corrientes teóricas que no se comunican entre sí.
    error: cambio_de_palabra
    por_que: Pasa a las teorías algo que Heller ubica dentro de cada persona.
  - texto: La participación del individuo en diversidad de ámbitos y espacios sociales.
    error: concepto_vecino
    por_que: Se parece a la heterogeneidad (muchas actividades); la muda copresencia es la convivencia
      de lo particular y lo específico.
  - texto: Atribuirle «Muda copresencia» a Berger y Luckmann o a Marx.
    error: concepto_vecino
    por_que: Es un concepto de Heller, ligado a su par particular/específico.
  pregunta_guia: ¿Qué dos dimensiones conviven «mudas» dentro de cada persona, y por qué se dice que no
    chocan?
  explicacion_modelo: 'Es la existencia simultánea, permanente y sin antagonismos de la particularidad
    y la especificidad dentro de cada persona. Para Heller, en la vida cotidiana lo particular y lo genérico
    conviven sin que nos demos cuenta, y por eso la copresencia es "muda". La opción más tentadora habla
    de "no poder percibir el conflicto" entre ambas: acierta en que no se percibe, pero inventa un conflicto
    que la definición niega.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-f943bc8b
  - q-0243a5e4
  estado: borrador
  notas: 'La clave de q-f943bc8b sale de marcas; coincide con el campus, que da por verdadero que el ser
    específico «coexiste de manera muda» con el particular (q-7559dcbd B). Validar con el texto el matiz
    «sin antagonismos».

    '
- id: heller.homogeneizacion
  eje: conceptos
  autor: Agnes Heller
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: Homogeneización y moral, dos formas de ir más allá de la particularidad
  afirmacion: 'En la homogeneización el individuo suspende por un momento su actividad particular y la
    subordina a la genericidad, en una relación consciente con el "nosotros". La moral también lo lleva
    más allá del ser particular: tiene una función inhibidora y otra transformadora.

    '
  puntos:
  - La homogeneización es el proceso por el que el individuo subordina su particularidad en favor de la
    genericidad, en una relación consciente con el «nosotros».
  - Supone la suspensión momentánea de toda actividad particular para centrar toda la atención en las
    tareas que lo vinculan con el «nosotros».
  - «Homogeneización» es un concepto de Heller.
  - 'La moral tiene dos funciones: inhibidora (nos impide hacer y decir cosas que atenten contra la vida
    en sociedad) y transformadora (nos lleva más allá del ser particular, hacia la especificidad).'
  trampas:
  - texto: La homogeneización es el proceso que genera la función inhibidora de la moral.
    error: concepto_vecino
    por_que: La función inhibidora es de la moral; la homogeneización es otro camino hacia lo genérico.
  - texto: Es el proceso que todo individuo desarrolla desde que nace para lograr la «reproducción del
      particular».
    error: concepto_vecino
    por_que: Eso se parece a la vida cotidiana y a la maduración; la homogeneización es una suspensión
      momentánea de lo particular.
  - texto: Es el proceso que comienza cuando el individuo se adapta a las normas sociales.
    error: verdad_general
    por_que: Lee «homogeneizarse» como volverse igual a los demás; para Heller es concentrarse conscientemente
      en lo genérico.
  - texto: La moral tiene una función evaluadora, porque nos permite distinguir lo que está bien de lo
      que está mal.
    error: verdad_general
    por_que: Suena a definición de manual, pero Heller le asigna a la moral una función inhibidora y otra
      transformadora.
  - texto: La moral tiene una función pacificadora (supera los conflictos) o revolucionaria (destruye
      las estructuras sociales).
    error: dato_inventado
    por_que: Heller no le asigna esas funciones a la moral.
  pregunta_guia: ¿Qué suspende el individuo para homogeneizarse, y con qué se conecta? ¿Qué dos cosas
    hace la moral?
  explicacion_modelo: 'Son verdaderas: la homogeneización subordina la particularidad a la genericidad
    en una relación consciente con el "nosotros", y supone suspender por un momento toda actividad particular.
    Para Heller es la vía por la que lo específico se vuelve consciente; la moral también nos saca de
    lo particular, con su función inhibidora y su función transformadora. La trampa más tentadora es leer
    "homogeneización" como adaptarse a las normas y volverse igual a los demás: no es uniformarse, es
    concentrarse en lo genérico.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-6c59f496
  - q-46b2f90d
  - q-353593e3
  estado: borrador
  notas: 'Moral y homogeneización van en la misma ficha porque el examen las cruza (q-6c59f496 C atribuye
    a la homogeneización la función inhibidora de la moral). Si se prefiere, q-353593e3 puede ir en una
    ficha aparte.

    '
- id: heller.objetivacion
  eje: conceptos
  autor: Agnes Heller
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: La objetivación según Heller
  afirmacion: 'Para Heller, la objetivación es toda actividad social que se presenta exterior al individuo
    y que posee un significado construido socialmente.

    '
  puntos:
  - La objetivación es toda actividad social que se presenta exterior al individuo y que posee un significado
    construido socialmente.
  trampas:
  - texto: El conjunto de objetos presentes en la vida cotidiana gracias a los cuales desarrollamos la
      reproducción del particular.
    error: cambio_de_palabra
    por_que: Lee «objetivación» como «objetos»; lo que se objetiva es una actividad social con un significado
      compartido.
  - texto: El conjunto de instituciones en las que participa el ser particular en su vida cotidiana.
    error: concepto_vecino
    por_que: Las instituciones son el concepto central de Berger y Luckmann, no la definición de objetivación
      de Heller.
  - texto: La forma en que se manifiesta la dualidad entre particularidad y especificidad.
    error: concepto_vecino
    por_que: Esa dualidad es la del ser particular y el ser específico, no la objetivación.
  - texto: La perspectiva con la que cada hombre percibe y analiza su relación con los otros.
    error: verdad_general
    por_que: Es algo subjetivo; la objetivación es justamente algo exterior al individuo.
  - texto: Ante la definición, elegir «Extrañación», «Heterogeneidad», «Vida cotidiana» o «Ser particular».
    error: concepto_vecino
    por_que: Son conceptos de Heller, pero ninguno nombra la actividad social exterior con significado
      social.
  pregunta_guia: ¿Qué tiene que tener una actividad para ser una objetivación según Heller?
  explicacion_modelo: 'La objetivación es toda actividad social que se presenta exterior al individuo
    y tiene un significado construido socialmente. Para Heller, lo objetivado está afuera de la persona
    y su sentido lo arma la sociedad. La opción más tentadora es "el conjunto de objetos de la vida cotidiana":
    juega con la palabra "objeto", pero la objetivación es una actividad con significado social, no una
    colección de cosas.

    '
  recurso_ubaxxi: pendiente
  preguntas:
