- id: duby.caracter-concurrente
  eje: conceptos
  autor: Georges Duby
  fuente: Texto de la cátedra (pendiente de identificar)
  tema: El carácter concurrente de las ideologías
  afirmacion: 'Para Duby, las ideologías son concurrentes. En una sociedad conviven sistemas de representaciones
    que tienen rasgos comunes, pero se enfrentan y se disputan la preeminencia, porque expresan las oposiciones
    y los antagonismos de esa sociedad.

    '
  puntos:
  - Una característica de la ideología según Duby es ser concurrente.
  - El concepto «Ideologías concurrentes» es de Duby.
  - Las ideologías son concurrentes porque expresan oposiciones que responden a varios niveles de la cultura.
  - El concepto que corresponde a la definición «Ideologías que se disputan la preeminencia en una sociedad»
    es «Ideologías concurrentes».
  - El concepto que corresponde a la definición «Los sistemas de representaciones tienen rasgos comunes
    pero se encuentran enfrentados ya que expresan antagonismos dentro de la sociedad» es «Carácter concurrente
    de las ideologías».
  trampas:
  - texto: «Opacas» o «Transparentes» como característica de la ideología según Duby.
    error: concepto_vecino
    por_que: La opacidad de la ideología es un concepto de Lefebvre, no uno de los caracteres de Duby.
  - texto: «Divergentes» o «Políticas» como característica de la ideología según Duby.
    error: cambio_de_palabra
    por_que: «Divergentes» suena parecido, pero el término de Duby es «concurrentes», ideologías que compiten
      por la preeminencia.
  - texto: Son concurrentes porque se superponen con varios sistemas de representación idénticos.
    error: cambio_de_palabra
    por_que: Las ideologías concurrentes están enfrentadas; si fueran idénticas no competirían.
  - texto: Son concurrentes porque se presentan como sistemas ideológicos completos, también denominados
      globalizantes.
    error: concepto_vecino
    por_que: Eso es el carácter globalizante; confundir concurrente con globalizante es el error típico.
  - texto: Son concurrentes porque ocultan ciertos aspectos de la realidad para servir mejor a unos intereses
      particulares.
    error: concepto_vecino
    por_que: Ocultar o deformar la realidad apunta al carácter deformante, no a la competencia entre ideologías.
  - texto: Son concurrentes porque reflejan los intereses de la clase propietaria.
    error: verdad_general
    por_que: Si reflejaran a una sola clase no habría competencia; concurrente quiere decir que varias
      ideologías se disputan la preeminencia.
  - texto: Atribuir «Ideologías concurrentes» a Marx o a Althusser.
    error: concepto_vecino
    por_que: Marx y Althusser también trabajan la ideología, pero el carácter concurrente es de Duby.
  pregunta_guia: ¿Por qué Duby dice que, en una misma sociedad, las ideologías compiten entre sí?
  explicacion_modelo: 'Las ideologías son concurrentes porque en una misma sociedad hay varios sistemas
    de representaciones que, aunque tienen rasgos comunes, se enfrentan y se disputan la preeminencia.
    Para Duby, esto pasa porque expresan las oposiciones y los antagonismos de la sociedad. La opción
    tentadora es «se presentan como sistemas ideológicos completos», que es otro rasgo de las ideologías
    según Duby, pero describe el carácter globalizante, no el concurrente.

    '
