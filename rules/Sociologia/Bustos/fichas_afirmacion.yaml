  explicacion_modelo: 'Es de Marqués. La pista es la palabra “masculina”: de los autores que aparecen
    en las opciones, Marqués es el que analiza la construcción social del varón y la masculinidad dominante.
    La confusión típica es atribuirlo a Foucault, que también trabaja temas de cuerpo y sexualidad, pero
