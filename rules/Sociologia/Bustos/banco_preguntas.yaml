  - enunciado: 'Indique cuáles afirmaciones son verdaderas (V) y cuáles falsas (F). Según Heller, la moral tiene
      dos funciones:'
    opciones:
      A: Transformadora, porque nos lleva a actuar más allá de nosotros mismos, más allá del “ser particular”, para
        conectarnos con la “especificidad”.
      B: Evaluadora, porque nos permite distinguir lo que está bien de lo que está mal.
      C: Pacificadora, porque nos otorga herramientas para superar los conflictos inherentes a toda vida en sociedad.
      D: Inhibidora, porque nos impide hacer y decir cosas que atenten contra la vida en sociedad.
      E: Revolucionaria, porque nos permite destruir las estructuras sociales.
    clave:
      A: V
      B: F
      C: F
      D: V
      E: F
    correctas:
