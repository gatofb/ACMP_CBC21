- id: q-c8a0d9fc
  tipo: vf_items
  puntos: 0.4
  veces_tomada: 1
  cuatrimestres:
  - Final 07/2021
  versiones:
  - enunciado: Las siguientes afirmaciones relacionan conceptos de A. Heller con conceptos de Berger & Luckmann.
      Señale cuáles son verdaderas y cuáles son falsas.
    opciones:
      A: Berger & Luckmann entienden la sociedad a partir del concepto de “instituciones”, mientras que Heller la
        piensa a partir del concepto de “estructura socioeconómica”.
      B: El concepto de “ser específico” en Heller y el de “institución” en Berger & Luckmann son semejantes porque
        ambos remiten a un conjunto de normas y de roles típicos que impone cada sociedad.
      C: El concepto de “externalización” de Berger & Luckmann se asemeja al de “homogeneización” en Heller, porque
        ambos hacen referencia a cómo se diferencian las percepciones de las relaciones sociales en la vida cotidiana.
      D: En referencia al proceso por el cual las personas se convierten en seres sociales, el concepto de “socialización”
        en Berger & Luckmann es similar al proceso de “maduración” en Heller.
      E: El concepto de “habituación” de Berger & Luckmann es similar al de “regimiento de la vida” en Heller, porque
        ambos explican por qué en una sociedad todos los individuos actúan de la misma manera.
    clave:
      A: V
      B: F
      C: F
      D: V
      E: F
    correctas:
    - Berger & Luckmann entienden la sociedad a partir del concepto de “instituciones”, mientras que Heller la piensa
      a partir del concepto de “estructura socioeconómica”.
    - En referencia al proceso por el cual las personas se convierten en seres sociales, el concepto de “socialización”
      en Berger & Luckmann es similar al proceso de “maduración” en Heller.
    fuente_clave: campus
