  - enunciado: Marque cuáles afirmaciones acerca de las diferencias entre Althusser y Foucault sobre la concepción
      del Estados son verdaderas y cuáles son falsas.
    opciones:
      A: Para Althusser el Estado representa a la clase dominante, para Foucault representa a todos los ciudadanos
        por igual.
      B: Althusser destaca el papel represivo e ideológico del poder, mientras que Foucault analiza el poder por
        fuera del Estado, donde se ejerce concretamente sobre las personas.
      C: Para Althusser el poder desciende desde el Estado hacia la sociedad, para Foucault el poder va desde abajo
        hacia arriba.
      D: Para Althusser el Estado actúa por medio de los Aparatos Ideológicos, y para Foucault lo hace a través
        de los Aparatos Represivos.
      E: Para Althusser el Estado garantiza la reproducción de las relaciones de producción, y para Foucault las
        creencias en la legitimidad del orden.
    clave:
      A: F
      B: V
      C: V
      D: F
      E: F
    correctas:
    - Althusser destaca el papel represivo e ideológico del poder, mientras que Foucault analiza el poder por fuera
      del Estado, donde se ejerce concretamente sobre las personas.
    - Para Althusser el poder desciende desde el Estado hacia la sociedad, para Foucault el poder va desde abajo
      hacia arriba.
