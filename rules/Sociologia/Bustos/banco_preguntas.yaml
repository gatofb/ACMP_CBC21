  - enunciado: Las siguientes afirmaciones relacionan conceptos de Berger y Luckmann con conceptos de A. Heller.
      Señale cuáles son verdaderas y cuáles falsas.
    opciones:
      A: El concepto de “ser específico” en Heller y el de “institución” en Berger y Luckmann son semejantes porque
        ambos remiten a un conjunto de normas y de roles típicos que impone cada sociedad.
      B: El concepto de “socialización” de Berger y Luckmann es similar al de “homogenización” porque ambos explican
        por qué en una sociedad todos los individuos actúan de la misma manera.
      C: Heller piensa la sociedad a partir del concepto de “estructura socioeconómica” y Berger y Luckmann a partir
        del concepto de “instituciones”.
      D: El concepto de “socialización” en Berger y Luckmann y de “maduración” en Heller son similares porque ambos
        hablan del proceso por el cual las personas se convierten en seres sociales.
      E: 'La idea de Heller de que la acción cotidiana es “espontánea” y “pragmática” es similar a la idea de “habituación”
        en Berger y Luckmann: ambas indican que gran parte de la vida social es irreflexiva.'
    clave:
      A: F
      B: F
      C: V
      D: V
      E: V
    correctas:
    - Heller piensa la sociedad a partir del concepto de “estructura socioeconómica” y Berger y Luckmann a partir
      del concepto de “instituciones”.
    - El concepto de “socialización” en Berger y Luckmann y de “maduración” en Heller son similares porque ambos
      hablan del proceso por el cual las personas se convierten en seres sociales.
    - 'La idea de Heller de que la acción cotidiana es “espontánea” y “pragmática” es similar a la idea de “habituación”
      en Berger y Luckmann: ambas indican que gran parte de la vida social es irreflexiva.'
