      C: En el intercambio de mercancías el valor de uso deja de tener importancia.
      D: El desarrollo de las fuerzas productivas de la disponibilidad de recursos naturales, pues la naturaleza
        es la fuente de la riqueza.
      E: El individuo deja de vincularse con la naturaleza porque produce manufacturas.
