      A: Para Althusser el poder se encuentra concetrado en el Estado y para Foucualt en el modo de producción.
      B: Para Althusser el poder se relaciona con el modo de producción social, para Foucault es toda relación de
        fuerzas.
      C: Althusser entiende que el poder surge de una operación ideológica, y para Foucault surge de una posición
        económica.
      D: Para Althusser el poder emana de la infraestructura y para Foucault de la superestructura.
      E: Para Althusser el poder es el poder de la clase dominante, Foucault se enfoca en los micropoderes que se
        ejercen a nivel cotidiano.
    clave:
      A: F
      B: V
      C: F
      D: F
      E: V
