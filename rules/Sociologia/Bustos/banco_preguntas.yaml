      A: Para Althusser el Estado garantiza la reproducción de las relaciones de producción, y para Foucault las
        creencias en la legitimidad del orden.
      B: Althusser destaca el papel represivo e ideológico del poder, mientras que Foucault analiza el poder por
        fuera del Estado, donde se ejerce concretamente sobre las personas.
      C: Para Althusser el Estado representa a la clase dominante, para Foucault representa a todos los ciudadanos
        por igual.
      D: Para Althusser el poder desciende desde el Estado hacia la sociedad, para Foucault el poder va desde abajo
        hacia arriba.
