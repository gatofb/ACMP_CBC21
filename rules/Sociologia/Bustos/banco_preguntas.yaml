  versiones:
  - enunciado: Indique cuáles afirmaciones de Heller y Berger & Luckmann son verdaderas (V) y cuáles falsas (F).
    opciones:
      A: Según Heller, cuando la particularidad somete a lo específico se anteponen las necesidades individuales
        frente a los intereses y las necesidades de la integración social.
      B: Según Berger y Luckmann, la socialización es un proceso que inicia con el nacimiento del individuo y finaliza
        en su edad adulta.
      C: Según Berger y Luckmann, la vida cotidiana es el conjunto de actividades en que se reproducen las personas
        y al mismo tiempo las estructuras socioeconómicas.
      D: Según Berger y Luckmann, un mundo institucional se experimenta como realidad objetiva, tiene una historia
        que antecede al nacimiento del individuo y no es accesible a su memoria biográfica.
      E: Según Heller, es necesario desarrollar una capacidad mental que poseen todos los individuos, la cual permite
        vincular la biografía con la historia.
    clave:
      A: V
      B: F
      C: F
      D: V
      E: F
    correctas:
    - Según Heller, cuando la particularidad somete a lo específico se anteponen las necesidades individuales frente
      a los intereses y las necesidades de la integración social.
    - Según Berger y Luckmann, un mundo institucional se experimenta como realidad objetiva, tiene una historia
      que antecede al nacimiento del individuo y no es accesible a su memoria biográfica.
    fuente_clave: marcas
    apariciones:
