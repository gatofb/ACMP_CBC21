  versiones:
  - enunciado: 'Determine si el siguiente enunciado es verdadero (V) o falso (F) según la teoría feminista del punto
      de vista. Escriba "V" o "F" donde dice "A" en la grilla de resolución.

      La situación social de las mujeres, en tanto grupo desfavorecido, les proporciona un acceso epistémicamente
      privilegiado a los objetos de conocimiento social y político.'
    opciones:
      A: Verdadero (V)
      B: Falso (F)
    clave: A
    correctas:
    - Verdadero (V)
    explicacion: La teoría del punto de vista parte de la primacía epistémica de la perspectiva de las mujeres (y
      en general de otros grupos oprimidos) sobre la perspectiva dominante de los varones. La razón de esta primacía
      radica en que las mujeres tienen un acceso privilegiado a las relaciones sociales opresivas en las que se
      hallan insertas y son capaces de mostrar que estas relaciones opresivas no son resultado de la naturaleza
      y la necesidad sino de la historia contingente, y por ello pueden ser modificadas.
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2026_B.pdf
      instancia: Final
      cuatrimestre: Final 07/2026
