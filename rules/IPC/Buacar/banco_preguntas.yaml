      instancia: 1er Parcial
      cuatrimestre: 1C 2025
      tema: 1
      consigna: 6
    - archivo: 1erParcial_2025_A.pdf
      instancia: 1er Parcial
      cuatrimestre: 1C 2025
      tema: 2
      consigna: 6
- id: q-7cfaa421
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: 'Al caracterizar los argumentos deductivos introdujimos la noción de validez. Dados los siguientes
      enunciados, determiná qué conclusión se infiere de modo válido.

      Si los mamuts tienen espaldas rectas, entonces aparecen con espaldas rectas en las pinturas rupestres. Pero
      los mamuts no aparecen con espaldas rectas en las pinturas rupestres.

      Seleccioná una opción y escribí el número en la grilla de resolución.'
    opciones:
      A: Los mamuts no aparecen en las pinturas rupestres.
      B: Los mamuts tienen espaldas rectas.
      C: Los mamuts aparecen con joroba en las pinturas rupestres.
      D: Los mamuts no tienen espaldas rectas.
    clave: D
    correctas:
    - Los mamuts no tienen espaldas rectas.
    explicacion: 'En este ejercicio se te pide que elijas qué enunciado de la lista puede funcionar como la conclusión
      de un argumento válido dada las premisas propuestas. Los argumentos válidos se pueden reconocer de modos diferentes.
      Por un lado, porque si suponemos que las premisas son todas verdaderas, entonces necesariamente hemos de admitir
      que la conclusión es verdadera también. Por otro lado, podemos atender a su estructura: si reconocemos alguna
      estructura de las presentadas oportunamente en el material de lectura, tales como el Modus Ponens, Modus Tollens,
      Silogismo disyuntivo, Instanciación del universal, etc., sabemos que estamos frente a una forma válida. En
      este caso, la opción 4 es el único enunciado que se puede inferir en forma válida, ya que es un caso de Modus
      Tollens. Recordá lo siguiente: lo que hace que un argumento sea válido o inválido no es que sus premisas y
      conclusión sean de hecho verdaderas o falsas; lo que lo hace válido o inválido es su forma.'
    fuente_clave: explicaciones
    apariciones:
