- id: q-83f0f148
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - 1C 2026
  versiones:
  - enunciado: 'Completá el siguiente enunciado para que sea una tautología. Seleccioná una opción y escribí el
      número en la grilla de resolución.

      Los tehuelches tenían una estructura social horizontal...'
    opciones:
      A: si no tenían grandes diferencias jerárquicas.
      B: pero no tenían una estructura social horizontal.
      C: o no la tenían.
      D: y muchos especialistas en antropología lo destacan.
    clave: C
    correctas:
    - o no la tenían.
    explicacion: 'Las tautologías son aquellos enunciados que son necesariamente verdaderos, no son meras verdades,
      siendo que son verdaderas por su forma lógica, sea como sea el mundo. Las contradicciones son necesariamente
      falsas. A diferencia de las tautologías y las contradicciones, las contingencias son enunciados que tal vez
      sean verdaderos o tal vez falsos, pero no son necesariamente ninguna de las dos cosas. Aun enunciados que
      nos parecen obviamente verdaderos serán contingentes si su verdad depende de cuestiones empíricas y no de
      la estructura misma de la oración. Así, el enunciado “La capital de Argentina es Buenos Aires” es verdadero
      pero es meramente contingente: si el proyecto de trasladar la capital a Viedma hubiera resultado exitoso,
      aquella oración hubiera sido falsa hoy. De modo semejante, la oración “Los dinosaurios no se extinguieron”
      es una oración falsa pero contingente: si las cosas hubieran resultado diferentes, esa oración podría haber
      resultado verdadera en la actualidad. Notá que esto no ocurre con las tautologías y contradicciones, no importa
      cómo hubieran resultado las cosas, la oración “Buenos Aires es y no es la capital de Argentina” no puede ser
      verdadera porque es una contradicción y la oración “Buenos Aires es o no es la capital de Argentina” no puede
      ser falsa porque es una tautología.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2026_A.pdf
      instancia: 1er Parcial
      cuatrimestre: 1C 2026
      tema: 1
      consigna: 6
- id: q-ea5b7ff4
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - 1C 2026
  versiones:
  - enunciado: 'Dados los siguientes enunciados, determiná qué conclusión se infiere de modo válido.

      Los aztecas rendían culto a una única deidad o eran politeístas. Pero no es cierto que rindieran culto a una
      única deidad.

      Seleccioná una opción y escribí el número en la grilla de resolución.'
    opciones:
      A: Los aztecas rendían culto a una única deidad y eran politeístas.
      B: Los aztecas no eran politeístas.
      C: Los aztecas eran politeístas.
      D: Si los aztecas no rendían culto a una única deidad, no eran politeístas.
    clave: C
    correctas:
    - Los aztecas eran politeístas.
    explicacion: 'En este ejercicio se te pide que elijas qué enunciado de la lista puede funcionar como la conclusión
      de un argumento válido dadas las premisas propuestas. Es importante tener en cuenta que los argumentos válidos
      se pueden reconocer de modos diferentes. Por un lado, porque no es posible que las premisas sean todas verdaderas
      y la conclusión falsa. Por otro lado, podemos atender a su estructura: si al seleccionar la conclusión reconocemos
      alguno de los esquemas presentados oportunamente en el material de lectura, tales como el Modus ponens, Modus
      tollens, Silogismo disyuntivo, Instanciación del universal, etc., sabemos que estamos frente a una forma válida.
      En este caso, hay un único enunciado que se puede inferir en forma válida, donde el argumento resultante es
      un caso de Silogismo disyuntivo.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2026_A.pdf
      instancia: 1er Parcial
      cuatrimestre: 1C 2026
      tema: 1
      consigna: 7
- id: q-9ba46b03
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - 1C 2026
  versiones:
  - enunciado: 'Dada la siguiente deducción:

      1. Si el pueblo toba tiene su propia lengua originaria, entonces esa lengua es aglutinante. [Premisa]

      2. Si la lengua toba es aglutinante, entonces puede expresar una oración compleja en una sola palabra. [Premisa]

      3. El pueblo toba tiene su propia lengua originaria. [Premisa]

      4. La lengua toba es aglutinante. [Modus ponens, 1 y 3]

      5. Si el pueblo toba tiene su propia lengua originaria, la lengua toba puede expresar una oración compleja
      en una sola palabra. [*]

      Determiná cuál es la justificación para la línea marcada con asterisco [*]. Seleccioná una opción y escribí
      el número en la grilla de resolución.'
    opciones:
      A: Silogismo disyuntivo, 1 y 2
      B: Silogismo hipotético, 1 y 2
      C: Simplificación, 1
      D: Adjunción, 1 y 2
      E: Modus tollens, 2 y 3
    clave: B
    correctas:
    - Silogismo hipotético, 1 y 2
    explicacion: El paso señalado se obtiene por Silogismo hipotético. Recordá que en un Silogismo hipotético se
      concluye una oración condicional a partir de dos premisas, también condicionales, tales que el consecuente
      de una coincide con el antecedente de la otra, permitiendo encadenarlas. Aplicando dicha regla, se puede deducir
      "Si el pueblo toba tiene su propia lengua originaria, la lengua toba puede expresar una oración compleja en
      una sola palabra" a partir de las premisas "Si el pueblo toba tiene su propia lengua originaria, entonces
      esa lengua es aglutinante" y "Si la lengua toba es aglutinante, entonces puede expresar una oración compleja
      en una sola palabra".
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2026_A.pdf
      instancia: 1er Parcial
      cuatrimestre: 1C 2026
      tema: 1
      consigna: 8
- id: q-035268db
  tipo: simple
  puntos: null
  veces_tomada: 2
  cuatrimestres:
  - 1C 2026
  - 2C 2026
  versiones:
  - enunciado: Dados los siguientes argumentos, determiná cuál de ellos es un argumento inductivo por analogía (A)
      y cuál es un silogismo inductivo (S). Escribí el número correspondiente al argumento inductivo por analogía
      donde dice "A" en la grilla de resolución.
    opciones:
      A: Todos los pueblos originarios que mantuvieron sus lenguas ancestrales conservaron también prácticas rituales
        tradicionales. La comunidad mapuche ha mantenido su lengua ancestral. Por lo tanto, la comunidad mapuche
        conserva prácticas rituales tradicionales.
      B: La mayoría de los pueblos originarios que mantuvieron sus lenguas ancestrales conservaron también prácticas
        rituales tradicionales. La comunidad mapucheha mantenido su lengua ancestral. Por lo tanto, la comunidad
        mapuche conserva prácticas rituales tradicionales.
      C: Las comunidades quechua, aymara y mapuche son pueblos originarios de América del Sur y desarrollaron técnicas
        agrícolas complejas adaptadas a su entorno. Por lo tanto, todos los pueblos originarios de América del Sur
        desarrollaron técnicas agrícolas complejas adaptadas a su entorno.
      D: Las comunidades quechua y mapuche son pueblos originarios de América del Sur y desarrollaron técnicas agrícolas
        complejas adaptadas a su entorno. Por lo tanto, la comunidad aymara desarrolló técnicas agrícolas complejas
        adaptadas a su entorno, puesto que es un pueblo originario de América del Sur.
    clave: D
    correctas:
    - Las comunidades quechua y mapuche son pueblos originarios de América del Sur y desarrollaron técnicas agrícolas
      complejas adaptadas a su entorno. Por lo tanto, la comunidad aymara desarrolló técnicas agrícolas complejas
      adaptadas a su entorno, puesto que es un pueblo originario de América del Sur.
    explicacion: 'Los silogismos inductivos son aquellos que parten de una generalización estadística o probabilística,
      subsumen un caso particular en ella y concluyen que ese caso cumple con lo establecido por la generalización.
      En este ejercicio, el silogismo inductivo es el argumento que parte de que "la mayoría de los pueblos originarios
      que mantuvieron sus lenguas ancestrales conservaron también prácticas rituales tradicionales", subsume a la
      comunidad mapuche en esa generalización, y concluye que dicha comunidad conserva prácticas rituales tradicionales.
      Los argumentos inductivos por analogía son aquellos en que se comparan varios casos que se asemejan en una
      o más propiedades, para inferir que uno de ellos tiene además otra propiedad que los demás comparten. En este
      ejercicio, la analogía es el argumento que compara a las comunidades quechua y mapuche, constata que comparten
      ser pueblos originarios de América del Sur y haber desarrollado técnicas agrícolas complejas, y concluye que
      la comunidad aymara, que también es un pueblo originario de América del Sur, desarrolló igualmente esas técnicas.
      Los otros dos argumentos no corresponden a ninguno de estos tipos: el que parte de "todos los pueblos originarios…"
      es un argumento deductivo, y el que concluye que "todos los pueblos originarios de América del Sur desarrollaron
      técnicas agrícolas complejas" es un argumento inductivo por enumeración incompleta.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2026_A.pdf
      instancia: 1er Parcial
      cuatrimestre: 1C 2026
      tema: 1
      consigna: 9A
  - enunciado: Dados los siguientes argumentos, determiná cuál de ellos es un argumento inductivo por analogía (A)
      y cuál es un silogismo inductivo (S). Escribí el número correspondiente al argumento inductivo por analogía
      donde dice "A" en la grilla de resolución.
    opciones:
      A: El pulmón izquierdo de la paciente está envuelto por la membrana pleural, dado que los pulmones de la paciente
        son sanos y que todos los pulmones sanos están envueltos en esa membrana.
      B: Este paciente del hospital no posee una buena irrigación sanguínea en sus manos, puesto que es un adulto
        mayor y el 90% de los adultos mayores no tienen una buena irrigación sanguínea en sus manos.
      C: Las venas transportan sangre y son elásticas. Además, las arteriolas comparten las mismas características
        que las venas. Por lo tanto, las arterias son elásticas, puesto que también transportan sangre.
      D: La arteria femoral transporta sangre oxigenada, y las arterias braquial y carótida también. De lo que se
        infiere que todas las arterias transportan sangre oxigenada.
    clave: C
    correctas:
    - Las venas transportan sangre y son elásticas. Además, las arteriolas comparten las mismas características
      que las venas. Por lo tanto, las arterias son elásticas, puesto que también transportan sangre.
    explicacion: Los silogismos inductivos son aquellos que parten de una generalización estadística o probabilística,
      subsumen un caso particular en ella y concluyen que ese caso cumple con lo establecido por la generalización.
      En este ejercicio, el silogismo inductivo es el argumento que parte de que "el 90% de los adultos mayores
      no tienen una buena irrigación sanguínea en sus manos", subsume a un paciente específico a esa generalización,
      y concluye que no posee una buena irrigacíon sanguínea en sus manos. Los argumentos inductivos por analogía
      son aquellos en que se comparan varios casos que se asemejan en una o más propiedades, para inferir que uno
      de ellos tiene además otra propiedad que los demás comparten. En este ejercicio, la analogía es el argumento
      que compara las venas, las arterias y las arteriolas, constata que comparten el transportar sangre, y concluye
      que las arterias también son elásticas. Los otros dos argumentos no corresponden a ninguno de estos tipos,
      pues son una enumeración incompleta y una instanciación del universal (argumento deductivo).
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2026_C.pdf
      instancia: 1er Parcial
      cuatrimestre: 2C 2026
      tema: 1
      consigna: 9A
