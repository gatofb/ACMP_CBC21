- id: q-bfc42986
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - 1C 2026
  versiones:
  - enunciado: 'Leé el siguiente enunciado y determiná cuál de las siguientes opciones explica el fenómeno a partir
      de la teoría de la selección natural de Darwin. Seleccioná una opción y escribí el número en la grilla de
      resolución.

      Los perros son capaces de digerir la mayoría de los alimentos que consumen los humanos, a diferencia de otros
      cánidos como los lobos o los chacales.'
    opciones:
      A: Los perros fueron diseñados para digerir los alimentos que consumen los humanos para poder ser domesticados
        con éxito. Este diseño permitió que humanos y perros se encontrasen en la historia y constituyeran una sociedad
        biológica exitosa mutuamente beneficiosa, aportando al equilibrio natural.
      B: Todas las especies tienden a parecerse a los humanos, que son la forma más perfecta de la naturaleza. Los
        perros, aunque son estructuralmente muy distintos a los humanos, son aptos para digerir el mismo tipo de
        alimentos, lo que los hace ideales para convivir con humanos.
      C: Entre los antepasados de los perros contemporáneos, algunos individuos nacieron con la variación que les
        permitía digerir los alimentos que los grupos humanos consumían. Esta particularidad les permitió alimentarse
        de las sobras que los humanos dejaban atrás, lo que a su vez mejoró su supervivencia y les permitió dejar
        mayor descendencia. Tras varias generaciones, el rasgo se generalizó a todos los perros.
      D: Los antepasados de los perros contemporáneos comenzaron a seguir a los grupos humanos de la época en busca
        de las sobras que dejaban atrás. Al exponerse a este tipo de alimentos, con el tiempo, fueron adquiriendo
        la capacidad de digerirlos correctamente, lo que les permitió adaptarse a ese ambiente particular. La capacidad
        adquirida de digerir los alimentos fue heredada a su descedencia.
    clave: C
    correctas:
    - Entre los antepasados de los perros contemporáneos, algunos individuos nacieron con la variación que les permitía
      digerir los alimentos que los grupos humanos consumían. Esta particularidad les permitió alimentarse de las
      sobras que los humanos dejaban atrás, lo que a su vez mejoró su supervivencia y les permitió dejar mayor descendencia.
      Tras varias generaciones, el rasgo se generalizó a todos los perros.
    explicacion: En este ejercicio se te pide que señales la explicación darwiniana de un rasgo específico. Lo característico
      de las explicaciones por selección natural es poner en relación la eficacia de los rasgos para cumplir ciertas
      funciones en un determinado ambiente con la aptitud del organismo que posee dichos rasgos. Los organismos
      más aptos, a su vez, dejan mayor descendencia que los menos aptos, por lo que en las sucesivas generaciones
      aumenta la proporción de organismos que presentan esos rasgos adaptativos.
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2026_A.pdf
      instancia: 1er Parcial
      cuatrimestre: 1C 2026
      tema: 1
      consigna: 2
