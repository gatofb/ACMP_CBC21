      instancia: 1er Parcial
      cuatrimestre: 1C 2025
      tema: 1
      consigna: 7
    - archivo: 1erParcial_2025_A.pdf
      instancia: 1er Parcial
      cuatrimestre: 1C 2025
      tema: 2
      consigna: 7
- id: q-90a2d487
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: Determiná cuál de los siguientes argumentos es inválido. Seleccioná una opción y escribí el número
      en la grilla de resolución.
    opciones:
      A: Si el león de las cavernas caza herbívoros, entonces vive en el bosque. No es cierto que el león de las
        cavernas viva en el bosque. Por lo tanto, no caza herbívoros.
      B: El tigre dientes de sable vive en grupo o es solitario. Pero no es cierto que el tigre dientes de sable
        sea solitario. Por lo tanto, vive en grupo.
      C: Si el rinoceronte lanudo pertenece a la megafauna prehistórica, entonces se extinguió hace 30.000 años.
        Y pertenece a la megafauna prehistórica, lo cual prueba que se se extiguió hace 30.000 años.
      D: El rinoceronte lanudo tiene pelaje o cuernos. Por consiguiente, tiene pelaje.
    clave: D
    correctas:
    - El rinoceronte lanudo tiene pelaje o cuernos. Por consiguiente, tiene pelaje.
    explicacion: 'En este ejercicio se te pide que reconozcas un argumento inválido. Los argumentos inválidos se
      pueden reconocer de modos diferentes. Por un lado, porque resulta concebible que las premisas sean verdaderas
      y la conclusión no. Por otro lado, si atendemos a su estructura, y reconocemos un argumento inductivo o una
      falacia, sabremos que estamos frente a una forma inválida. En este caso el único argumento inválido es de
      la forma A o B. Por consiguiente, A. Recordá lo siguiente: lo que hace que un argumento sea válido o inválido
      no es que sus premisas y conclusión sean de hecho verdaderas o falsas; lo que lo hace válido o inválido es
      su forma. En particular, un argumento inválido puede tener premisas verdaderas y una conclusión verdadera.'
    fuente_clave: explicaciones
