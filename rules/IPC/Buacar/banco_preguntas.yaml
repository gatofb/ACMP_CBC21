- id: q-45a31907
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: Otro modo de clasificar los enunciados es agruparlos en tautologías, contradicciones o contingencias.
      Identificá cuál de los siguientes enunciados es una tautología. Seleccioná una opción y escribí el número
      en la grilla de resolución.
    opciones:
      A: Los dinosaurios eran animales terrestres y no eran animales terrestres.
      B: Si los dinosaurios eran animales terrestres entonces eran animales terrestres.
      C: Los dinosaurios eran animales terrestres pero también acuáticos.
      D: Los dinosaurios eran animales terrestres.
    clave: B
    correctas:
    - Si los dinosaurios eran animales terrestres entonces eran animales terrestres.
    explicacion: 'En este ejercicio se pide que reconozcas una tautología. Para ello es importante tener en cuenta
      que:

      - Las tautologías son aquellos enunciados que son necesariamente verdaderos, no son meras verdades, sino que
      por la forma de la oración, sea como sea el mundo, será verdadera.

      - Las contradicciones son necesariamente falsas.

      -A diferencia de las tautologías y las contradicciones, las contingencias son enunciados que tal vez sean
      verdaderos o tal vez falsos, pero no son necesariamente ninguna de las dos cosas. Aun enunciados que nos parecen
      obviamente verdaderos serán contingentes si su verdad depende de cuestiones empíricas y no de la estructura
      misma de la oración. En este ejercicio tenemos un condicional que siempre tendrá antecedente y consecuente
      con el mismo valor de verdad, dado que el mismo enunciado funciona como antecedente y consecuente. De modo
      que, independientemente de que los dinosaurios sean animales terrestres o no, dicha oración condicional será
      necesariamente verdadera.'
    fuente_clave: explicaciones
    apariciones:
