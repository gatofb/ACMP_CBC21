- id: q-c6c5b40a
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: 'Los enunciados se clasifican según su alcance y ello determina sus condiciones de verdad. Dado el
      siguiente enunciado determiná en qué situación resultaría falso. Seleccioná una opción y escribí el número
      en la grilla de resolución.

      Todos los ictiosaurios son carnívoros.'
    opciones:
      A: Si encontramos un animal que es un tiranosaurio y solo se alimenta solo de vegetales.
      B: Si encontramos un animal que es un tiranosaurio y se alimenta de carne.
      C: Si encontramos un animal que es un ictiosaurio y solo se alimenta de vegetales.
      D: Si encontramos un animal que es un ictiosaurio y se alimenta de carne.
    clave: C
    correctas:
    - Si encontramos un animal que es un ictiosaurio y solo se alimenta de vegetales.
    explicacion: El enunciado propuesto es un enunciado universal. Para que un enunciado universal sea falso, basta
      con que encontremos un caso de un miembro del conjunto al que se refiere el enunciado que no posea la propiedad
      asignada. En este caso, el único caso incompatible con el enunciado es aquel en el que un animal es un ictiosaurio
      y se alimenta solo de vegetales.
    fuente_clave: explicaciones
