- id: q-02b0d8ed
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - Final 02/2025
  versiones:
  - enunciado: Indique cuál de las siguientes afirmaciones expresa una tesis sostenida por el falsacionismo de Popper,
      pero rechazada por el empirismo lógico representado por Hempel. Seleccione una opción y escriba el número
      en la grilla de resolución.
    opciones:
      A: La ciencia progresa aproximándose a la verdad.
      B: La ciencia progresa mediante la justificación inductiva de sus hipótesis, que se van complejizando y extendiendo
        su ámbito de aplicación.
      C: La ciencia progresa por medio de la eliminación de teorías falsas, sin alcanzar la verdad definitivamente.
      D: No hay un desarrollo continuo y progresivo del conocimiento científico.
    clave: C
    correctas:
    - La ciencia progresa por medio de la eliminación de teorías falsas, sin alcanzar la verdad definitivamente.
    explicacion: Tanto Popper como Hempel consideran que hay un desarrollo continuo del conocimiento científico,
      que se acerca progresivamente a la verdad. Sin embargo, conciben este progreso de modo diferente. Según el
      empirismo lógico representado por Hempel, las hipótesis pueden ser confirmadas al aumentar su probabilidad
      por medio de la inducción. En consecuencia, el progreso científico consiste en un proceso acumulativo en el
      que las teorías reciben la justificación inductiva confirmatoria que les confiere un alto grado de probabilidad.
      Por su parte, Popper rechaza la posibilidad de confirmar una hipótesis de este modo y sostiene que, cuando
      la contrastación es favorable, la hipótesis es aceptada provisoriamente por resistir los intentos de refutación
      llevados a cabo. Consiguientemente, en este último caso el progreso científico se concibe como un avance (paulatino
      pero nunca definitivo) hacia la verdad mediante el proceso de eliminación de teorías falsas.
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2025_A.pdf
      instancia: Final
      cuatrimestre: Final 02/2025
      tema: 1
      consigna: 6
    - archivo: Final_2025_A.pdf
      instancia: Final
      cuatrimestre: Final 02/2025
      tema: 2
      consigna: 6
- id: q-044944dd
  tipo: vf_justificada
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - Final 02/2025
  versiones:
  - enunciado: 'Determine si el siguiente enunciado es verdadero o falso y por qué según la epistemología de Kuhn.
      Seleccione una opción y escriba el número en la grilla de resolución.

      El período de crisis sobreviene en cuanto aparece una anomalía.'
    opciones:
      A: El enunciado es falso porque la crisis se produce cuando hay muchos enigmas sin resolver.
      B: El enunciado es falso porque para que se produzca la crisis es necesario que las anomalías se generalicen
        y radicalicen.
      C: El enunciado es verdadero porque una anomalía genera la proliferación de nuevos paradigmas rivales.
      D: El enunciado es verdadero porque la aparición de una anomalía genera la pérdida de confianza en el paradigma
        vigente.
    clave: B
    correctas:
    - El enunciado es falso porque para que se produzca la crisis es necesario que las anomalías se generalicen
      y radicalicen.
    explicacion: Una anomalía es un problema que el paradigma no puede resolver. Sin embargo, una sola anomalía
      no alcanza para generar la pérdida de confianza en el paradigma vigente y generar la crisis, ya que la comunidad
      científica podría encontrar una manera de transformarla en un enigma, es decir, en un problema que pueda ser
      resuelto con los recursos del paradigma. Es cuando estas anomalías persisten y se radicalizan que sobreviene
      la crisis.
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2025_A.pdf
      instancia: Final
      cuatrimestre: Final 02/2025
      tema: 1
      consigna: 7
    - archivo: Final_2025_A.pdf
      instancia: Final
      cuatrimestre: Final 02/2025
      tema: 2
      consigna: 7
- id: q-c0f1059d
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - Final 02/2025
  versiones:
  - enunciado: 'A. Determine si el siguiente enunciado es verdadero (V) o falso (F) según la teoría feminista del
      punto de vista. Escriba "V" o "F" donde dice "A" en la grilla de resolución.

      En el estudio de las desigualdades de género, las perspectivas de las mujeres y de los varones pueden alcanzar
      profundidades semejantes.'
    opciones:
      A: Verdadero (V)
      B: Falso (F)
    clave: B
    correctas:
    - Falso (F)
    explicacion: Para la teoría del punto de vista, la perspectiva de las mujeres es epistémicamente privilegiada
      porque revela las regularidades fundamentales que subyacen a los fenómenos sociales y psicosociales en los
      que el género está involucrado. Lo que parece natural y necesario desde la perspectiva dominante resulta contingente
      e históricamente dado desde la perspectiva de las oprimidas. La teoría del punto de vista parte de la primacía
      epistémica de la perspectiva de las mujeres (y en general de otros grupos oprimidos) sobre la perspectiva
      dominante de los varones. La razón de esta primacía radica en que las mujeres tienen un acceso privilegiado
      a las relaciones sociales opresivas en las que se hallan insertas y son capaces de mostrar que estas relaciones
      opresivas no son resultado de la naturaleza y la necesidad sino de la historia contingente, y por ello pueden
      ser modificadas.
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2025_A.pdf
      instancia: Final
      cuatrimestre: Final 02/2025
      tema: 1
      consigna: 8A
    - archivo: Final_2025_A.pdf
      instancia: Final
      cuatrimestre: Final 02/2025
      tema: 2
      consigna: 8A
