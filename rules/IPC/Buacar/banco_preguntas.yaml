  versiones:
  - enunciado: Al estudiar los enunciados, los distinguimos por su alcance. Dados los siguientes cuatro enunciados
      determiná cuál de ellos es un enunciado universal. Seleccioná una opción y escribí el número en la grilla
      de resolución.
    opciones:
      A: El 80% de los tuátaras que nacen son machos.
      B: Todos los tuátaras son reptiles.
      C: Algunos tuátaras viven más de 100 años.
      D: Henry, el tuátara, vive en Nueva Zelanda.
    clave: B
    correctas:
