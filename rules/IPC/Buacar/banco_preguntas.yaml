    explicacion: 'En este ejercicio se pide que determines si el enunciado pertenece al ámbito de la ciencia empírica
      según la posición del falsacionismo. Para ello, es importante que tengas presente que de acuerdo con esta
      corriente, para que un enunciado pertenezca al ámbito de la ciencia empírica debe ser falsable, esto es, debe
      tener contenido empírico y debe ser posible formular contra él enunciados básicos que funcionen como falsadores
      potenciales. Recordá que los falsadores potenciales son enunciados existenciales, singulares, incompatibles
      con la hipótesis y lógicamente posibles. De lo anterior se sigue que algunos enunciados o afirmaciones no
      son falsables: (i) los enunciados de las ciencias formales, (ii) las afirmaciones metafísicas y (iii) los
      enunciados probabilísticos. El enunciado de este ejercicio pertenece a las ciencias formales.'
