      por enumeración incompleta (E) o silogismo inductivo (S). Escriba "D", "A", "E" o "S" en el casillero "A"
      de la grilla de resolución.

      Argumento del ejercicio 1: Si Brasil es el país con más copas del mundo ganadas, entonces ganó 5 mundiales.
      En efecto, si es el país con más copas del mundo ganadas, entonces es el único que ganó en 4 continentes.
      Y si Brasil es el único país que ganó en 4 continentes, entonces ganó 5 mundiales.'
    opciones:
