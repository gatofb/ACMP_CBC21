- id: q-be391510
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - Final 07/2026
  - Final 12/2024
  versiones:
  - enunciado: Indique cuál de las siguientes afirmaciones expresa una tesis compartida por Darwin y Lamarck. Seleccione
      una opción y escriba el número en la grilla de resolución.
    opciones:
      A: Las especies fueron creadas con sus rasgos actuales y no se modifican a lo largo del tiempo.
      B: Los rasgos de las especies se van modificando a lo largo del tiempo, lo que posibilita el surgimiento de
        nuevas especies.
      C: En la medida en que transcurre el tiempo, las especies tienden a complejizarse.
      D: La selección natural explica la adaptación de las especies al ambiente.
    clave: B
    correctas:
    - Los rasgos de las especies se van modificando a lo largo del tiempo, lo que posibilita el surgimiento de nuevas
      especies.
    explicacion: Si bien propusieron mecanismos evolutivos distintos (Darwin defendió la selección natural como
      principio evolutivo general mientras que Lamarck sostuvo que los organismos tienden a volverse más complejos)
      ambos son autores evolucionistas. El evolucionismo implica que los rasgos de los organismos se transforman
      y dan lugar a nuevas especies a lo largo del tiempo, en contraposición al fijismo característico del creacionismo
      medieval.
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2024_D.pdf
      instancia: Final
      cuatrimestre: Final 12/2024
      tema: 1
      consigna: 3
  - enunciado: Indique cuál de las siguientes afirmaciones expresa una tesis compartida por Darwin y Lamarck. Seleccione
      una opción y escriba el número en la grilla de resolución.
    opciones:
      A: Las variaciones de rasgos únicamente surgen como respuesta al ambiente en el que se vive.
      B: Las distintas especies evolucionan en una escala de complejidad creciente que tiende al progreso.
      C: Las distintas especies actuales están emparentadas entre sí por descender de ancestros comunes.
      D: A lo largo de las sucesivas generaciones, las especies se transforman.
    clave: D
    correctas:
    - A lo largo de las sucesivas generaciones, las especies se transforman.
    explicacion: 'Ambos autores son evolucionistas, es decir, sostienen que las especies se transforman a lo largo
      del tiempo. Sin embargo, propusieron mecanismos evolutivos distintos: Lamarck sostuvo que las variaciones
      de rasgos surgen como respuesta al ambiente en el que se vive, mientras que Darwin consideraba que algunas
      variaciones son aleatorias. Por otra parte, Lamarck creía que las especies tienden a volverse más complejas
      a medida que evolucionan siguiendo una escala de progreso creciente, mientras que Darwin rechazó esta idea
      y sostuvo que las especies actuales descienden de ancestros comunes.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2026_B.pdf
      instancia: Final
      cuatrimestre: Final 07/2026
      tema: 1
      consigna: 3
- id: q-c7163e5f
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - Final 12/2024
  versiones:
  - enunciado: 'Dado el siguiente explanans:

      - Los mares que experimentan un aumento de temperatura sufren la proliferación de algas nocivas y la migración
      de especies.

      - El Caribe es un mar que experimenta un aumento de temperatura.

      Determine qué explanandum se puede inferir con la ley y la condición antecedente brindadas y seleccione la
      afirmación que caracteriza correctamente la explicación construida.

      A. Identifique el explanandum. Seleccione una opción y escriba el número en el casillero "A" de la grilla
      de resolución.'
    opciones:
      A: El Caribe sufre la proliferación de algas nocivas pero no sufre la migración de especies.
      B: El Caribe sufre la proliferación de algas nocivas y el blanqueamiento de corales.
      C: El Caribe sufre la proliferación de algas nocivas y la migración de especies.
      D: Es probable que el Caribe sufra la proliferación de algas nocivas.
    clave: C
    correctas:
    - El Caribe sufre la proliferación de algas nocivas y la migración de especies.
    explicacion: De acuerdo con el modelo de cobertura legal, el explanans contiene leyes (que deben ser estadísticas
      o probabilísticas en las explicaciones estadístico-inductivas y universales en las explicaciones nomológico-deductivas).
      Además, esas leyes están acompañadas por enunciados que describen las condiciones iniciales o antecedentes
      (que son aquellos factores sin los cuales no habría sucedido el fenómeno a explicar). En la explicación de
      este ejercicio la ley contenida en el explanans es universal. El enunciado de la opción 3 es el explanandum
      que se deduce a partir de dicha ley universal y la condición antecedente. Por ende, la explicación es nomológico-deductiva.
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2024_D.pdf
      instancia: Final
      cuatrimestre: Final 12/2024
      tema: 1
      consigna: 4A
