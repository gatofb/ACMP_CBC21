      instancia: 2do Parcial
      cuatrimestre: 1C 2025
      tema: 2
      consigna: 6
- id: q-d1980388
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: 'Lea el siguiente caso y determine de qué tipo de manifestación del androcentrismo y el sexismo en
      ciencia se trata. Seleccione una opción y escriba el número en la grilla de resolución.

      Sophie Germain (1776-1831) fue una brillante matemática francesa. Su trabajo incluye un inicio de solución
      al último teorema de Fermat, un detallado estudio sobre las reglas matemáticas que guían el comportamiento
      de las vibraciones sobre materiales elásticos y variadas discusiones con los más grandes matemáticos de su
      tiempo (incluidos Karl Friedrich Gauss y Adrien Marie Legendre). Pese a su gran reconocimiento y a los éxitos
      cosechados, la carrera de Germain estuvo marcada por los obstáculos que la sociedad de su tiempo le impuso:
      nunca pudo estudiar en instituciones formales de enseñanza, que estaban exclusivamente reservadas para varones,
      por lo que fue una autodidacta en matemáticas y tuvo que buscar tutores privados para profundizar su conocimiento.
      Su familia hizo todo lo posible por evitar que se dedicase a su pasión, llegando a dejarla sin luz, calefacción
      y ropa por las noches para que no pudiera estudiar ni siquiera a escondidas.'
    opciones:
      A: Teorías sexistas
      B: Aplicaciones sexistas
      C: Exclusión y marginalización
      D: Omisiones selectivas en la historia de la ciencia/efecto Matilda
    clave: C
    correctas:
    - Exclusión y marginalización
    explicacion: 'El androcentrismo y el sexismo en ciencia se manifiestan de diversas maneras. En el ejercicio
      se trata de la manifestación que llamamos "exclusión y marginalización": las historiadoras, sociólogas y antropólogas
      feministas han mostrado que a lo largo de la historia las mujeres han sido privadas de la posibilidad de formarse
      y ejercer la actividad científica. En ocasiones, esta exclusión se da de manera explícita y legal, como las
      prohibiciones para estudiar en la universidad y ejercer la actividad científica. También hay formas de exclusión
      menos explícitas, como la creencia social en que hay carreras "de varones" y "de mujeres". E incluso en los
      casos en los que las mujeres logran acceder sin trabas a la carrera científica, es frecuente que padezcan
      otras formas de marginalización: por ejemplo, progresar académicamente menos que sus pares varones aún con
      los mismos méritos.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: 2doParcial_2025_A.pdf
      instancia: 2do Parcial
      cuatrimestre: 1C 2025
      tema: 1
      consigna: 7
    - archivo: 2doParcial_2025_A.pdf
      instancia: 2do Parcial
      cuatrimestre: 1C 2025
      tema: 2
      consigna: 7
- id: q-5da98e52
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: Indique cuál de las siguientes afirmaciones expresa una tesis sostenida por la teoría feminista del
      punto de vista y, a la vez, rechazada por el empirismo feminista. Seleccione una opción y escriba el número
      en la grilla de resolución.
    opciones:
      A: Las mujeres no poseen una perspectiva unificada por el hecho de ser mujeres.
      B: Solo la perspectiva de las mujeres permite mostrar que las desigualdades de género no son naturales sino
        social y culturalmente construidas.
      C: El pluralismo y la crítica intersubjetiva en el seno de la comunidad científica permite detectar sesgos
        en la investigación.
      D: La lógica y la evidencia son herramientas suficientes para elegir entre teorías rivales.
    clave: B
    correctas:
    - Solo la perspectiva de las mujeres permite mostrar que las desigualdades de género no son naturales sino social
      y culturalmente construidas.
    explicacion: La teoría del punto de vista parte de la primacía epistémica de la perspectiva de las mujeres (y
      en general de otros grupos oprimidos) sobre la perspectiva dominante de los varones. La razón de esta primacía
      radica en que las mujeres tienen un acceso privilegiado a las relaciones sociales opresivas en las que se
      hallan colectivamente insertas y son capaces de mostrar que estas relaciones opresivas no son resultado de
      la naturaleza y la necesidad sino de la historia contingente, y por ello pueden ser modificadas. En cambio,
      el empirismo feminista sostiene que la elección de teorías depende de la evidencia disponible y la lógica
      de la investigación científica, tal y como sostenían los empiristas lógicos. Además, reconocen que una comunidad
      científica plural y abierta a la discusión posibilita la objetividad científica.
    fuente_clave: explicaciones
    apariciones:
    - archivo: 2doParcial_2025_A.pdf
      instancia: 2do Parcial
      cuatrimestre: 1C 2025
      tema: 1
      consigna: 8
    - archivo: 2doParcial_2025_A.pdf
      instancia: 2do Parcial
      cuatrimestre: 1C 2025
      tema: 2
      consigna: 8
- id: q-cf764045
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: 'Lea la siguiente caracterización de un proyecto de investigación y decida si el practicismo daría
      prioridad al financiamiento del mismo y por qué. Seleccione una opción y escriba el número en la grilla de
      resolución.

      Un equipo de investigadores del Instituto de Agrobiotecnología del Litoral (IAL), dependiente del CONICET
      y la Universidad Nacional del Litoral, en colaboración con el Ministerio de Ciencia, Tecnología e Innovación,
      ha desarrollado una variedad de trigo genéticamente modificada que es tolerante a las sequías, conocida como
      "HB4". Este desarrollo fue aprobado para su cultivo y consumo tras la validación por parte de organismos regulatorios.
      El proyecto permitirá fortalecer la posición del país en materia de innovación tecnológica y permitirá sostener
      la producción como parte de una estrategia de adaptación al cambio climático.'
    opciones:
      A: No, porque este tipo de desarrollos responden a intereses económicos y productivos, lo cual no debería
        ser la prioridad de la ciencia.
      B: Sí, porque el desarrollo del trigo HB4 tiene un impacto directo en la producción agrícola y responde a
        necesidades concretas de la sociedad.
      C: Sí, porque desarrollar variedades de trigo genéticamente modificadas contribuye a ampliar nuestro conocimiento
        de la estructura genética de los alimentos.
      D: No, porque desarrollar variedades de trigo genéticamente modificadas no contribuye al avance de la ciencia
        básica, a la cual debería darse prioridad.
    clave: B
    correctas:
    - Sí, porque el desarrollo del trigo HB4 tiene un impacto directo en la producción agrícola y responde a necesidades
      concretas de la sociedad.
    explicacion: La perspectiva practicista afirma que se debe priorizar el financiamiento de la ciencia aplicada,
      ya que la ciencia debe estar explícitamente al servicio de la sociedad. Por lo tanto, desde ese punto de vista,
      la investigación científica debe contribuir directamente a resolver problemas prácticos vinculados al desarrollo
      económico y social del país. En el caso propuesto, el desarrollo mencionado contribuye directamente a estos
      objetivos.
    fuente_clave: explicaciones
    apariciones:
    - archivo: 2doParcial_2025_A.pdf
      instancia: 2do Parcial
      cuatrimestre: 1C 2025
      tema: 1
      consigna: 9
    - archivo: 2doParcial_2025_A.pdf
      instancia: 2do Parcial
      cuatrimestre: 1C 2025
      tema: 2
      consigna: 9
- id: q-1bf58062
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: 'Dado el siguiente conjunto de enunciados:

      Premisa 1: ..............................................................

      Premisa 2: Estudiar gusanos gigantes en ecosistemas subterráneos permite comprender mejor la biodiversidad
      y la evolución de especies desconocidas.

      Conclusión: Es correcto invertir recursos públicos en investigar gusanos gigantes en ecosistemas subterráneos.

      Seleccione cuál de los siguientes enunciados es la premisa valorativa implícita necesaria para que se siga
      el juicio evaluativo establecido en la conclusión. Seleccione una opción y escriba el número en la grilla
      de resolución.'
    opciones:
      A: Es correcto investigar especies desconocidas si esto ayuda a conocer mejor la vida en el planeta.
      B: Es correcto invertir recursos públicos para comprender mejor la biodiversidad y la evolución de especies
        desconocidas.
      C: La inversión pública en ciencia debe centrarse en la protección del medioambiente.
      D: Invertir recursos públicos permite comprender mejor la biodiversidad y la evolución de especies desconocidas.
    clave: B
    correctas:
    - Es correcto invertir recursos públicos para comprender mejor la biodiversidad y la evolución de especies desconocidas.
    explicacion: En un argumento donde se concluye una afirmación normativa, necesitamos que las premisas incluyan
      una premisa valorativa (es decir, un juicio de valor) y no solo juicios de hecho, para que no nos encontremos
      con un salto desde lo que “es” hacia lo que “debe ser”. En el ejercicio, las opciones 1, 2 y 3 son juicios
      de valor. Sin embargo, la opción 2 ("es correcto invertir recursos públicos para comprender mejor la biodiversidad
      y la evolución de especies desconocidas") es la única que permite, a partir de la premisa 2 de la consigna,
      inferir la conclusión. De las otras dos opciones normativas, no se puede deducir el deber específico de “invertir
      recursos públicos en investigar gusanos gigantes en ecosistemas subterráneos”. Por último, la opción 4 no
      es un juicio de valor, por lo cual, de intentar inferir una conclusión normativa a partir de ella (y la premisa
      2), caeríamos en una "falacia naturalista".
    fuente_clave: explicaciones
    apariciones:
    - archivo: 2doParcial_2025_A.pdf
      instancia: 2do Parcial
      cuatrimestre: 1C 2025
      tema: 1
      consigna: 10
    - archivo: 2doParcial_2025_A.pdf
      instancia: 2do Parcial
      cuatrimestre: 1C 2025
      tema: 2
      consigna: 10
- id: q-a511d9b2
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: 'Identifique la consecuencia observacional del caso presentado en el ejercicio 1. Lea las opciones
      presentadas en la parte "A", seleccione la opción correcta y escriba en la grilla de resolución el número
      de la opción seleccionada.

      Caso del ejercicio 1:

      ¿La ficción nos vuelve más empáticos? El estudio de las emociones tiene una larga historia; distintos aspectos
      genéticos, culturales, psicológicos y sociales fueron objeto de innumerables estudios científicos. Los investigadores
      David Kidd y Emanuele Castano se propusieron investigar si la lectura de relatos de ficción mejora las habilidades
      empáticas. Para ello, realizaron el siguiente experimento. Al inicio del estudio se les tomó a los participantes
      el test de lectura de la mente en los ojos (RMET), un test donde los participantes deben reconocer, viendo
      fotografías de distintos rostros, las emociones que están experimentando las personas fotografiadas, y de
      acuerdo a la cantidad de reconocimientos correctos reciben un puntaje. Un mayor puntaje en el RMET indica
      mejores habilidades empáticas. Después se los dividió en dos grupos. A los participantes de uno de los grupos
      se les asignó aleatoriamente la lectura de uno de tres textos breves de ficción, por ejemplo, un cuento de
      Anton Chéjov, mientras que a los participantes del otro grupo se les asignó uno de tres textos breves de no
      ficción, como artículos de diario. Luego de la lectura, todos los participantes completaron nuevamente el
      test RMET y se compararon los resultados. Se registró un mayor aumento en los resultados del RMET con respecto
      a los iniciales para el grupo que había leído los textos de ficción que para el grupo que no.'
    opciones:
      A: El puntaje del RMET disminuirá con respecto al inicial para las personas empáticas que lean textos de ficción.
      B: El puntaje en el RMET aumentará con respecto al inicial en mayor proporción para el grupo que lea los textos
        de ficción que para el que lea textos de no ficción.
      C: La lectura de relatos de ficción, en comparación con textos no ficcionales, es preferida por las personas
        más empáticas.
      D: Un mayor puntaje en el RMET indica mejores habilidades empáticas.
      E: Distintos aspectos genéticos, culturales, psicológicos y sociales influyen en las habilidades empáticas
        de las personas.
      F: La lectura de relatos de ficción mejora las habilidades empáticas.
    clave: B
    correctas:
    - El puntaje en el RMET aumentará con respecto al inicial en mayor proporción para el grupo que lea los textos
      de ficción que para el que lea textos de no ficción.
    explicacion: En este ejercicio se pide que identifiques la consecuencia observacional del caso de investigación
      presentado. Para ello, es importante tener en cuenta que la consecuencia observacional es un enunciado empírico
      básico que expresa lo que cabe esperar a la luz de la hipótesis principal, dadas las condiciones iniciales
      en las que se lleva a cabo el experimento y la hipótesis auxiliar que se asume.
    fuente_clave: explicaciones
    apariciones:
    - archivo: 2doParcial_2025_A.pdf
      instancia: 2do Parcial
      cuatrimestre: 1C 2025
      tema: 2
      consigna: 2
- id: q-07ec65d4
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: 'Lea el siguiente enunciado y determine cuál de las siguientes opciones explica el fenómeno a partir
      de la teoría de Lamarck. Escriba en la grilla de resolución el número de la opción seleccionada.

      Los búhos tienen una visión muy potente.'
    opciones:
      A: Entre los ancestros de los búhos, aquellos con una visión más potente resultaron más aptos para alimentarse
        y reproducirse, lo que produjo una mayor presencia de ese rasgo entre sus descendientes.
      B: Los búhos fueron creados siguiendo un arquetipo común al conjunto de las aves rapaces nocturnas; puesto
        que todas las aves pertenecientes a esa clase deben ser eficaces en el vuelo rapaz, cuentan con una visión
        potente.
      C: Para las sucesivas generaciones de los ancestros de los búhos, ejercitar la visión resultaba indispensable
        para cazar; esto hizo que adquirieran una visión cada vez mejor en el curso de sus vidas y heredaran ese
        rasgo a sus descendientes.
      D: Los rasgos de los búhos varían aleatoriamente a lo largo de los años. En algún momento azarosamente aparecieron
        búhos con una visión más potente, lo cual representó una ventaja a la hora de sobrevivir. Por esa razón
        ese rasgo fue heredado a sucesivas generaciones.
    clave: C
    correctas:
    - Para las sucesivas generaciones de los ancestros de los búhos, ejercitar la visión resultaba indispensable
      para cazar; esto hizo que adquirieran una visión cada vez mejor en el curso de sus vidas y heredaran ese rasgo
      a sus descendientes.
    explicacion: 'En este ejercicio se te pide que señales la explicación lamarckiana de un rasgo específico. La
      teoría lamarckiana de la evolución reconoce dos mecanismos generales: la tendencia general a la complejidad
      y la herencia de las características adquiridas por uso o desuso. En este caso, Lamarck sostendría que la
      razón por la que determinados organismos presentan un mayor grado de complejidad que otros se debe a la tendencia
      general. En la medida en que transcurre el tiempo, todas las especies se vuelven más complejas independientemente
      del ambiente.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: 2doParcial_2025_A.pdf
      instancia: 2do Parcial
      cuatrimestre: 1C 2025
      tema: 2
      consigna: 3
- id: q-fad053d0
  tipo: simple
