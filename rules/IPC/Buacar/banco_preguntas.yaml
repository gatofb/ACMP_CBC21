- id: q-7edcc0bb
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - Final 12/2024
  versiones:
  - enunciado: 'Dado el siguiente caso de investigación, identifique la hipótesis fundamental y la hipótesis auxiliar.
      Escriba en la grilla de resolución el número de la opción seleccionada como hipótesis fundamental donde dice
      "HF" y el número de la opción seleccionada como hipótesis auxiliar donde dice "HA".

      ¿Todo tiempo pasado fue mejor? Según Terence Mitchell y Leigh Thompson cuando recordamos el pasado, nuestro
      cerebro tiende a suavizar los aspectos negativos y a resaltar los positivos de modo creciente a medida que
      pasa el tiempo. Para probar esto, los investigadores hicieron un experimento: un grupo de personas compartieron
      unas vacaciones. Luego de que las vacaciones habían terminado, les pidieron a los participantes que recordaran
      y evaluaran su viaje en tres etapas diferentes: la etapa 1 fue una semana después del viaje, la 2 seis meses
      después, y la 3 un año después. Para ello se les pidió a los participantes que completaran el cuestionario
      “PANAS” que evalúa los niveles de emociones positivas y negativas que una persona puede haber experimentado
      en relación con un evento pasado, como por ejemplo las vacaciones. Los investigadores asumieron que cuanto
      mayor es el puntaje en el cuestionario PANAS, mayor es la importancia que los participantes les dan a los
      aspectos negativos y cuanto menor es el puntaje, menor importancia le dan a esos aspectos. En los cuestionarios
      se registró mayor puntaje en la etapa 1 que en la 2 y 3.

      ¿Cuál es la hipótesis fundamental? (casillero "HF")'
    opciones:
      A: Se registrará mayor puntaje en el cuestionario PANAS en la etapa 3 que en la 1 y 2.
      B: Los recuerdos de las vacaciones se evalúan en tres etapas.
      C: Cuando recordamos el pasado, nuestro cerebro tiende a suavizar los aspectos negativos y a resaltar los
        positivos de modo creciente a medida que pasa el tiempo.
      D: Todo tiempo pasado fue mejor.
      E: Se registrará mayor puntaje en el cuestionario PANAS en la etapa 1 que en la 2 y 3.
      F: Cuanto mayor es el puntaje en el cuestionario PANAS, mayor es la importancia que los participantes les
        dan a los aspectos negativos y cuanto menor es el puntaje, la importancia dada a aspectos negativos es menor.
    clave: C
    correctas:
    - Cuando recordamos el pasado, nuestro cerebro tiende a suavizar los aspectos negativos y a resaltar los positivos
      de modo creciente a medida que pasa el tiempo.
    explicacion: En este ejercicio se pide que identifiques la hipótesis fundamental y la hipótesis auxilar del
      caso de investigación presentado. Para ello, es importante tener en cuenta que las hipótesis son enunciados
      generales. La hipótesis fundamental es aquella que guía la investigación y que es puesta a prueba en el experimento.
      En cambio, la hipótesis auxiliar es una hipótesis que cuenta con apoyo independiente previo y que se utiliza
      en la contrastación como conocimiento presupuesto.
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2024_D.pdf
      instancia: Final
      cuatrimestre: Final 12/2024
      tema: 1
      consigna: 5HF
