- id: q-e6bb5df1
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - Final 02/2025
  versiones:
  - enunciado: 'Lea el siguiente fragmento periodístico. Teniendo en cuenta los debates sobre ética científica,
      determine cuál de las opciones es más representativa de la postura anticientificista. Seleccione una opción
      y escriba el número en la grilla de resolución.

      En 2013, en Estados Unidos, se lanzó la Iniciativa BRAIN, un proyecto científico cuyo objetivo es acelerar
      el desarrollo y la aplicación de tecnologías avanzadas para estudiar el cerebro. Su misión principal es desarrollar
      herramientas capaces de mapear la actividad cerebral en tiempo real y comprender cómo las redes neuronales
      generan pensamientos, emociones, comportamientos y cómo se relacionan con enfermedades neurológicas. Rafael
      Yuste, uno de sus impulsores, ha advertido que estos avances presentan importantes desafíos éticos, ya que
      la neurotecnología desarrollada podría ser utilizada para manipular o interferir en la actividad cerebral,
      comprometiendo aspectos como la privacidad mental y la libertad de decisión de las personas.'
    opciones:
      A: Los científicos producen conocimientos en ciencia básica y aplicada que nos permiten mapear la actividad
        cerebral en tiempo real y entender cómo las redes neuronales generan pensamientos, emociones, comportamientos
        y cómo están relacionadas con las enfermedades neurológicas. A partir de estos descubrimientos se pueden
        desarrollar neurotecnologías que podrían tener efectos negativos en la privacidad mental o en la autonomía
        de las decisiones de las personas. Sin embargo, la responsabilidad de estas consecuencias recae exclusivamente
        en quienes desarrollan y aplican dichas tecnologías.
      B: El objetivo del proyecto BRAIN fue transformar el estudio del cerebro humano mediante la creación de herramientas
        y tecnologías innovadoras para entender más profundamente el funcionamiento de las neuronas y los circuitos
        cerebrales. Los científicos no deberían cargar con la responsabilidad sobre los usos de sus descubrimientos,
        dado que la responsabilidad de cómo se aplican esos conocimientos recae exclusivamente en las empresas o
        Estados que los utilicen para ciertos propósitos.
      C: El uso o mal uso de las neurotecnologías derivadas de las investigaciones del proyecto BRAIN debe estar
        regulado por los Estados. En este sentido, mientras los científicos actúen conforme a las leyes de sus países,
        están cumpliendo con su responsabilidad ética. En este contexto, el cumplimiento de la ley es suficiente
        para asegurar que los descubrimientos científicos sean utilizados de manera responsable.
      D: El desarrollo tecnocientífico, en este caso el proyecto de mapear el cerebro y desarrollar neurotecnología
        para su medición y manipulación, puede poner en riesgo la autonomía y privacidad de las personas. No es
        posible separar el desarrollo de la investigación de sus posibles aplicaciones, y los científicos no pueden
        eludir su responsabilidad si los resultados de su trabajo se utilizan con fines éticamente cuestionables.
    clave: D
    correctas:
    - El desarrollo tecnocientífico, en este caso el proyecto de mapear el cerebro y desarrollar neurotecnología
      para su medición y manipulación, puede poner en riesgo la autonomía y privacidad de las personas. No es posible
      separar el desarrollo de la investigación de sus posibles aplicaciones, y los científicos no pueden eludir
      su responsabilidad si los resultados de su trabajo se utilizan con fines éticamente cuestionables.
    explicacion: Según la postura anticientificista, el desarrollo científico y el uso tecnológico de los descubrimientos
      son indisociables. La posición anticientificista sostiene que deberíamos hablar de "tecnociencia" como una
      esfera común que reúne ambas dimensiones. Por lo tanto, los científicos que llevan adelante investigaciones
      (incluso en áreas altamente abstractas) no son menos responsables que quienes desarrollan tecnologías y aplicaciones
      concretas.
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2025_A.pdf
      instancia: Final
      cuatrimestre: Final 02/2025
      tema: 1
      consigna: 9
    - archivo: Final_2025_A.pdf
      instancia: Final
      cuatrimestre: Final 02/2025
      tema: 2
      consigna: 9
- id: q-c9b8fd18
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - Final 02/2025
  versiones:
  - enunciado: 'A. Indique qué tipo de problema relevante para la integridad científica se ve reflejado en el caso
      que se relata a continuación. Seleccione una opción y escriba el número en el casillero "A" de la grilla de
      resolución.

      Wei-Hock Soon es conocido por sus estudios que desafiaron el consenso científico sobre el cambio climático,
      argumentando que el calentamiento global se debía principalmente a la actividad solar, y no a las emisiones
      de gases de efecto invernadero causadas por actividades humanas. Durante años, Soon publicó varios artículos
      muy influyentes en la política pública de EUA que minimizaban el impacto del CO2 en el cambio climático, lo
      que atrajo atención en los círculos de negacionistas climáticos y en algunos sectores de la industria. Sin
      embargo, en 2015 se reveló que Soon había recibido más de 1.2 millones de dólares en financiamiento no revelado
      de empresas vinculadas a la industria de los combustibles fósiles, como ExxonMobil y la Southern Company,
      una gran empresa de energía. Si bien no se trata de un delito, causó un fuerte polémica el hecho de que Soon
      no hubiera declarado esta fuente de financiamiento en sus publicaciones académicas.'
    opciones:
      A: Acceso a la información
      B: Incentivos perversos
      C: Revisión de pares
      D: Conflictos de interés
    clave: D
    correctas:
    - Conflictos de interés
    explicacion: Los conflictos de interés se producen cuando una investigación está financiada por una persona
      u organismo que tiene un interés propio en que la investigación produzca algún resultado determinado. Esto
      es lo que ocurrió en este caso. Es habitual, hoy en día, que los científicos declaren de dónde obtuvieron
      su financiamiento, aunque esto por sí solo no alcanza para despejar conflictos de interés, porque no es fácil
      conocer los intereses de las organizaciones que los financian. En cualquier caso, está claro que hay un problema
      ético si los resultados de una investigación están decididos de antemano por la persona o institución que
      otorga el financiamiento.
