  versiones:
  - enunciado: 'Determiná si el siguiente enunciado es verdadero (V) o falso (F) según la teoría de la selección
      natural de Darwin.

      Todos los rasgos de los organismos se mantienen invariables de generación en generación.

      Seleccioná la opción que justifica tu respuesta y escribí el número donde dice "B" en la grilla de resolución.'
    opciones:
      A: Los rasgos de los organismos aumentan las chances de supervivencia y reproducción, y perduran en el tiempo.
      B: Surgen variaciones por una necesidad adaptativa, como resultado del uso o desuso de ciertos órganos.
      C: Existen variaciones de rasgos que se producen azarosamente y muchas de ellas pueden heredarse.
      D: Los rasgos de los organismos están determinados por un plan inteligente de una vez y para siempre.
    clave: C
    correctas:
    - Existen variaciones de rasgos que se producen azarosamente y muchas de ellas pueden heredarse.
    explicacion: En este ejercicio se pide que, en la parte A, determines si un enunciado es verdadero o falso según
      la teoría de la selección natural de Darwin y luego, en la parte B, elijas la oración que justifica tu respuesta.
      El enunciado presentado es falso según la teoría de Darwin, y la justificación es que existe variación entre
      los individuos de una misma especie, y parte de esas variaciones puede heredarse.
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2026_C.pdf
      instancia: 1er Parcial
      cuatrimestre: 2C 2026
      tema: 1
      consigna: 1B
- id: q-04a27fe1
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - 2C 2026
  versiones:
  - enunciado: 'Leé el siguiente enunciado y determiná cuál de las siguientes opciones explica el fenómeno a partir
      de la teoría de la selección natural de Darwin. Seleccioná una opción y escribí el número en la grilla de
      resolución.

      Los pingüinos presentan alas cortas y rígidas, lo que les permite nadar con gran eficacia.'
    opciones:
      A: Los pingüinos fueron diseñados y creados para habitar ambientes marinos fríos, por lo que presentan alas
        cortas y rígidas especialmente aptas para su uso en el agua y para obtener alimento con eficacia, junto
        con otras características corporales orientadas a ese mismo fin.
      B: Entre los ancestros de los pingüinos, aquellos que tenían alas más cortas y rígidas, nadaban con mayor
        eficacia y lograban obtener más alimento, por lo que resultaron más aptos para sobrevivir en ambientes marinos
        y dejaron mayor descendencia, que heredó ese rasgo.
      C: La forma actual de las alas de los pingüinos es el resultado de un proceso intencional de cría selectiva
        realizado en el pasado por seres humanos que valoraban a los individuos más aptos en el agua, favoreciendo
        su reproducción hasta fijar ese rasgo en la especie.
      D: Los ancestros de los pingüinos, al habitar ambientes marinos, dejaron de usar sus alas para volar. Por
        falta de uso, esas estructuras se fueron atrofiando, volviéndose más cortas. Esa característica adquirida
        fue luego heredada por su descendencia.
    clave: B
    correctas:
    - Entre los ancestros de los pingüinos, aquellos que tenían alas más cortas y rígidas, nadaban con mayor eficacia
      y lograban obtener más alimento, por lo que resultaron más aptos para sobrevivir en ambientes marinos y dejaron
      mayor descendencia, que heredó ese rasgo.
    explicacion: En este ejercicio se te pide que señales la explicación darwiniana de un rasgo específico. Lo característico
      de las explicaciones por selección natural es poner en relación la eficacia de los rasgos para cumplir ciertas
      funciones en un determinado ambiente con la aptitud del organismo que posee dichos rasgos. Los organismos
      más aptos, a su vez, dejan mayor descendencia que los menos aptos, por lo que en las sucesivas generaciones
      aumenta la proporción de organismos que presentan esos rasgos adaptativos.
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2026_C.pdf
      instancia: 1er Parcial
      cuatrimestre: 2C 2026
      tema: 1
      consigna: 2
- id: q-7df4ac4b
  tipo: multiple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - 2C 2026
  versiones:
  - enunciado: 'Dado el siguiente argumento, indicá cuáles son los enunciados que cumplen el rol de premisas. Seleccioná
      dos opciones y escribí los números en la grilla de resolución.

      Las neuronas tienen una función especializada, debido a que las neuronas son células y todas las células tienen
      una función especializada.'
    opciones:
      A: Todas las células tienen una función especializada.
      B: Debido a que son células.
      C: Las neuronas tienen una función especializada.
      D: Las neuronas son células.
    clave:
    - A
    - D
    correctas:
    - Todas las células tienen una función especializada.
    - Las neuronas son células.
    explicacion: 'Para identificar la respuesta es importante recordar que hay ciertas expresiones que, cuando están,
      nos ayudan a identificar las premisas y la conclusión de un argumento. En el libro las llamamos "indicadores
      de premisa" e "indicadores de conclusión", respectivamente. En el argumento dado hay un indicador de premisa
      ("debido a que"). Es importante recordar dos cosas: (i) tanto las premisas como la conclusión se deben enunciar
      de manera completa, y (ii) los indicadores nunca forman parte de las premisas o la conclusión.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2026_C.pdf
      instancia: 1er Parcial
      cuatrimestre: 2C 2026
      tema: 1
      consigna: 4
- id: q-6d1870ff
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - 2C 2026
  versiones:
  - enunciado: 'Dados los siguientes enunciados VERDADEROS:

      - Esta neurona tiene dendritas.

      - Estas dendritas reciben información de otras neuronas.

      Determiná cuál de los siguientes enunciados complejos es VERDADERO. Seleccioná una opción y escribí el número
      en la grilla de resolución.'
    opciones:
      A: Si esta neurona tiene dendritas, entonces estas dendritas reciben información de otras neuronas.
      B: Esta neurona no tiene dendritas aunque estas dendritas reciban información de otras neuronas.
      C: Estas dendritas no reciben información de otras neuronas o esta neurona no tiene dendritas.
      D: Estas dendritas no reciben información de otras neuronas.
    clave: A
    correctas:
    - Si esta neurona tiene dendritas, entonces estas dendritas reciben información de otras neuronas.
    explicacion: 'En este ejercicio tuviste que evaluar el valor veritativo de una conjunción, una negación, una
      disyunción y un condicional:

      1. Las conjunciones pueden expresarse con “y”, “,”, “además”, “pero”. Las negaciones con “no”, “no es cierto
      que”. Los condicionales con “si… entonces” y las disyunciones con “o”, “o bien … o bien”.

      2. Las conjunciones son verdaderas sólo en el caso en que ambos conyuntos sean verdaderos, esto es, basta
      que uno de los enunciados combinados por la conjunción sea falso para que el enunciado complejo resulte falso.

      3. Cuando una oración es verdadera, su negación es falsa y, a la inversa, cuando una oración es falsa, su
      negación resultará verdadera.

      4. Las oraciones condicionales son falsas únicamente cuando el antecedente es verdadero y el consecuente falso,
      en el resto de los casos son verdaderas.

      5. Hay dos tipos de disyunciones, las inclusivas y las exclusivas. Expresiones como “o bien… o bien” sugieren
      que se trata de una disyunción exclusiva, en cambio la mera presencia de una “o” nos conduce a pensar que
      es inclusiva. Cuando ambas partes son falsas, la disyunción entre ambas es falsa, no importa el tipo de disyunción
      del cual se trate. Por el contrario, cuando uno de los disyuntos es verdadero y el otro falso, la disyunción
      es verdadera. El caso en que ambos tipos de disyunciones arrojan valores diferentes es aquel en que ambos
      disyuntos son verdaderos. Si la disyunción es inclusiva, la oración compleja será verdadera; si es exclusiva,
      será falsa.

      En este caso, la opción correcta es un enunciado condicional que es verdadero ya que tiene antecedente y consecuente
      verdaderos.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2026_C.pdf
      instancia: 1er Parcial
      cuatrimestre: 2C 2026
      tema: 1
      consigna: 5
- id: q-306b5f7b
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - 2C 2026
  versiones:
  - enunciado: 'Completá el siguiente enunciado para que sea una tautología. Seleccioná una opción y escribí el
      número en la grilla de resolución.

      Las neuronas son células que tienen núcleo...'
    opciones:
      A: pero no lo tienen.
      B: si tienen dendritas.
      C: o no lo tienen.
      D: o dendritas.
    clave: C
    correctas:
    - o no lo tienen.
    explicacion: 'Las tautologías son aquellos enunciados que son necesariamente verdaderos por la forma del enunciado:
      sea como sea el mundo, el enunciado será verdadero. Del mismo modo, las contradicciones son necesariamente
      falsas. A diferencia de las tautologías y las contradicciones, las contingencias son enunciados que pueden
      ser verdaderos o falsos, pero no son necesariamente ninguna de las dos cosas. Enunciados que nos parecen obviamente
      verdaderos serán contingentes si su verdad depende de cuestiones empíricas y no de la estructura misma de
      la oración. Así, el enunciado “La capital de Argentina es Buenos Aires y queda en el centro del país” es verdadero
      pero es meramente contingente: si el proyecto de trasladar la capital a Viedma hubiera resultado exitoso,
      aquel enunciado hoy hubiera sido falso. De modo semejante, el enunciado “Los dinosaurios eran reptiles y no
      se extinguieron” es un enunciado falso pero contingente: si las cosas hubieran resultado diferentes, ese enunciado
      podría haber resultado verdadero en la actualidad. Notá que esto no ocurre con las tautologías y las contradicciones,
      no importa cómo hubieran resultado las cosas, el enunciado “Buenos Aires es y no es la capital de Argentina”
      no puede ser verdadero porque es una contradicción y el enunciado “Buenos Aires es o no es la capital de Argentina”
      no puede ser falso porque es una tautología. En este caso, dado que se trata de una disyunción cuyos disyuntos
      son un enunciado y su negación, obtenemos una tautología.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2026_C.pdf
      instancia: 1er Parcial
      cuatrimestre: 2C 2026
      tema: 1
      consigna: 6
- id: q-a698a2c5
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - 2C 2026
  versiones:
  - enunciado: 'Dados los siguientes enunciados, determiná qué conclusión se infiere de modo válido.

      Si las personas emitiésemos luz a través de nuestros poros, entonces seríamos capaces de iluminar una habitación
      oscura con nuestra piel. Pero no podemos iluminar una habitación solo con nuestra piel.

      Seleccioná una opción y escribí el número en la grilla de resolución.'
    opciones:
      A: Las personas seríamos capaces de iluminar una habitación oscura con nuestra piel.
      B: Si las personas no emitimos luz a través de nuestros poros, entonces no podemos iluminar una habitación
        solo con nuestra piel.
      C: Las personas no emitimos luz a través de nuestros poros.
      D: Las personas emitimos luz a través de nuestros poros.
    clave: C
    correctas:
    - Las personas no emitimos luz a través de nuestros poros.
    explicacion: 'En este ejercicio se te pide que elijas qué enunciado de la lista puede funcionar como la conclusión
      de un argumento válido dadas las premisas propuestas. Es importante tener en cuenta que los argumentos válidos
      se pueden reconocer de modos diferentes. Por un lado, porque no es posible que las premisas sean todas verdaderas
      y la conclusión falsa. Por otro lado, podemos atender a su estructura: si al seleccionar la conclusión reconocemos
      alguno de los esquemas presentados oportunamente en el material de lectura, tales como el Modus ponens, Modus
      tollens, Silogismo disyuntivo, Instanciación del universal, etc., sabemos que estamos frente a una forma válida.
      En este caso, hay un único enunciado que se puede inferir en forma válida, donde el argumento resultante es
      un caso de Modus tollens.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2026_C.pdf
      instancia: 1er Parcial
      cuatrimestre: 2C 2026
      tema: 1
      consigna: 7
- id: q-e605f40d
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - 2C 2026
  versiones:
  - enunciado: 'Dada la siguiente deducción:

      1. La bilis es producida por el páncreas o por el hígado. [Premisa]

      2. Si la bilis es producida por el hígado, entonces se almacena en la vesícula biliar. [Premisa]

      3. [*] [Premisa]

      4. La bilis es producida por el hígado. [Silogismo disyuntivo, 1 y 3]

      5. La bilis se almacena en la vesícula biliar. [Modus ponens, 2 y 4]

      Determiná cuál es la premisa faltante en la línea marcada con asterisco [*]. Seleccioná una opción y escribí
      el número en la grilla de resolución.'
    opciones:
      A: La bilis es producida por el páncreas.
      B: La bilis no es producida por el páncreas.
      C: La bilis no se almacena en la vesícula biliar.
      D: La bilis no es producida por el hígado.
      E: La bilis es producida por el páncreas y por el hígado.
    clave: B
    correctas:
    - La bilis no es producida por el páncreas.
    explicacion: La premisa faltante es "La bilis no es producida por el páncreas". Recordá que, en un Silogismo
      disyuntivo, se parte de una disyunción y de la negación de uno de los disyuntos como premisas, y a partir
      de ellas se concluye el disyunto restante. Aplicando esta regla, a partir de las premisas 1 y 3, se puede
      deducir correctamente "La bilis es producida por el hígado".
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2026_C.pdf
      instancia: 1er Parcial
      cuatrimestre: 2C 2026
      tema: 1
      consigna: 8
- id: q-eefd6b56
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - 2C 2026
  versiones:
  - enunciado: 'Determiná qué premisa sirve para fortalecer el siguiente argumento inductivo sin que deje de ser
      un argumento inductivo por enumeración incompleta. Seleccioná una opción y escribí el número en la grilla
      de resolución.

      El estómago, el intestino delgado y el esófago son órganos del tracto digestivo humano y tienen paredes recubiertas
      de tejido muscular liso. Por lo tanto, todos los órganos del tracto digestivo humano tienen paredes recubiertas
      de tejido muscular liso.'
    opciones:
      A: El intestino grueso forma parte del tracto digestivo humano y tiene paredes recubiertas de tejido muscular
        liso.
      B: Algunos órganos del tracto digestivo humano no tienen paredes recubiertas de tejido muscular liso.
      C: Todos los órganos del tracto digestivo humano tienen paredes recubiertas de tejido muscular liso.
      D: El apéndice tiene paredes recubiertas de tejido muscular liso.
    clave: A
    correctas:
    - El intestino grueso forma parte del tracto digestivo humano y tiene paredes recubiertas de tejido muscular
      liso.
    explicacion: Un argumento inductivo por enumeración incompleta parte de la presencia de una propiedad en una
      muestra y concluye la presencia de esa propiedad en todo el conjunto al cual los casos de esa muestra pertenecen.
      El argumento inductivo más fuerte será aquel en el cual la muestra a partir de la cual se generaliza en la
      conclusión sea mayor. Tené en cuenta que, para que el argumento siga siendo inductivo, la muestra no puede
      ser igual al conjunto sobre el que se realiza la generalización.
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2026_C.pdf
      instancia: 1er Parcial
      cuatrimestre: 2C 2026
      tema: 1
      consigna: 10
- id: q-f488c556
  tipo: simple
  puntos: null
  veces_tomada: 2
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: 'A. Dado el siguiente caso de investigación, identifique la hipótesis fundamental. Escriba el número
      de la opción seleccionada en el casillero "1 A" de la grilla de resolución.

      ¿La ficción nos vuelve más empáticos? El estudio de las emociones tiene una larga historia; distintos aspectos
      genéticos, culturales, psicológicos y sociales fueron objeto de innumerables estudios científicos. Los investigadores
      David Kidd y Emanuele Castano se propusieron investigar si la lectura de relatos de ficción mejora las habilidades
      empáticas. Para ello, realizaron el siguiente experimento. Al inicio del estudio se les tomó a los participantes
      el test de lectura de la mente en los ojos (RMET), un test donde los participantes deben reconocer, viendo
      fotografías de distintos rostros, las emociones que están experimentando las personas fotografiadas, y de
      acuerdo a la cantidad de reconocimientos correctos reciben un puntaje. Un mayor puntaje en el RMET indica
      mejores habilidades empáticas. Después se los dividió en dos grupos. A los participantes de uno de los grupos
      se les asignó aleatoriamente la lectura de uno de tres textos breves de ficción, por ejemplo, un cuento de
      Anton Chéjov, mientras que a los participantes del otro grupo se les asignó uno de tres textos breves de no
      ficción, como artículos de diario. Luego de la lectura, todos los participantes completaron nuevamente el
      test RMET y se compararon los resultados. Se registró un mayor aumento en los resultados del RMET con respecto
      a los iniciales para el grupo que había leído los textos de ficción que para el grupo que no.'
    opciones:
      A: El puntaje del RMET disminuirá con respecto al inicial para las personas empáticas que lean textos de ficción.
      B: Distintos aspectos genéticos, culturales, psicológicos y sociales influyen en las habilidades empáticas
        de las personas.
      C: La lectura de relatos de ficción mejora las habilidades empáticas.
      D: El puntaje en el RMET aumentará con respecto al inicial en mayor proporción para el grupo que lea los textos
        de ficción que para el que lea textos de no ficción.
      E: Un mayor puntaje en el RMET indica mejores habilidades empáticas.
      F: La lectura de relatos de ficción, en comparación con textos no ficcionales, es preferida por las personas
        más empáticas.
    clave: C
    correctas:
    - La lectura de relatos de ficción mejora las habilidades empáticas.
    explicacion: En este ejercicio se pide que identifiques la hipótesis fundamental del caso de investigación presentado.
      Para ello, es importante tener en cuenta que las hipótesis son enunciados generales. La hipótesis fundamental
      es aquella que guía la investigación y que es puesta a prueba en el experimento.
    fuente_clave: explicaciones
    apariciones:
    - archivo: 2doParcial_2025_A.pdf
      instancia: 2do Parcial
      cuatrimestre: 1C 2025
      tema: 1
      consigna: 1A
    - archivo: 2doParcial_2025_A.pdf
      instancia: 2do Parcial
      cuatrimestre: 1C 2025
      tema: 2
      consigna: 1A
