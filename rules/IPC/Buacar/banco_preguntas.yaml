- id: q-9440cc21
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: 'Lea el siguiente enunciado y determine cuál de las siguientes opciones explica el fenómeno a partir
      de la teoría de la selección natural de Darwin. Escriba en la grilla de resolución el número de la opción
      seleccionada.

      Los búhos tienen una visión muy potente.'
    opciones:
      A: Para las sucesivas generaciones de los ancestros de los búhos, ejercitar la visión resultaba indispensable
        para cazar; esto hizo que adquirieran una visión cada vez mejor en el curso de sus vidas y heredaran ese
        rasgo a sus descendientes.
      B: Entre los ancestros de los búhos, aquellos con una visión más potente resultaron más aptos para alimentarse
        y reproducirse, lo que produjo una mayor presencia de ese rasgo entre sus descendientes.
      C: Los búhos fueron creados siguiendo un arquetipo común al conjunto de las aves rapaces nocturnas; puesto
        que todas las aves pertenecientes a esa clase deben ser eficaces en el vuelo rapaz, cuentan con una visión
        potente.
      D: Disponer de una visión potente representa el grado máximo en la línea evolutiva de los animales, por esa
        razón en cada una de las etapas evolutivas los búhos van mejorando este rasgo y su visión se vuelve cada
        vez más potente.
    clave: B
    correctas:
    - Entre los ancestros de los búhos, aquellos con una visión más potente resultaron más aptos para alimentarse
      y reproducirse, lo que produjo una mayor presencia de ese rasgo entre sus descendientes.
    explicacion: En este ejercicio se te pide que señales la explicación darwiniana de un rasgo específico. Lo característico
      de las explicaciones por selección natural es poner en relación la eficacia de los rasgos para cumplir ciertas
      funciones en un determinado ambiente con la aptitud del organismo que posee dichos rasgos. Los organismos
      más aptos, a su vez, dejan mayor descendencia que los menos aptos, por lo que en las sucesivas generaciones
      aumenta la proporción de organismos que presentan esos rasgos adaptativos.
    fuente_clave: explicaciones
    apariciones:
    - archivo: 2doParcial_2025_A.pdf
      instancia: 2do Parcial
      cuatrimestre: 1C 2025
      tema: 1
      consigna: 3
