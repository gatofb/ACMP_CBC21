- id: q-02f72b02
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - Final 02/2025
  versiones:
  - enunciado: 'Dado el siguiente argumento, determine cuáles son las premisas y cuál es la conclusión. Seleccione
      una opción y escriba el número en la grilla de resolución.

      Países Bajos, India y Bangladesh tienen progresivos aumentos del nivel del mar y están en riesgo de sufrir
      inundaciones. Luego, Argentina está en riesgo de sufrir inundaciones, pues tiene progresivos aumentos del
      nivel del mar.'
    opciones:
      A: 'Premisa: Argentina tiene progresivos aumentos del nivel del mar.

        Premisa: Argentina está en riesgo de sufrir inundaciones.

        Conclusión: Países Bajos, India y Bangladesh tienen progresivos aumentos del nivel del mar y están en riesgo
        de sufrir inundaciones.'
      B: 'Premisa: Países Bajos, India y Bangladesh tienen progresivos aumentos del nivel del mar y están en riesgo.

        Premisa: Pues Argentina tiene progresivos aumentos del nivel del mar.

        Conclusión: Luego, Argentina está en riesgo de sufrir inundaciones.'
      C: 'Premisa: Países Bajos, India y Bangladesh tienen progresivos aumentos del nivel del mar y están en riesgo
        de sufrir inundaciones.

        Premisa: Argentina está en riesgo de sufrir inundaciones.

        Conclusión: Argentina tiene progresivos aumentos del nivel del mar.'
      D: 'Premisa: Países Bajos, India y Bangladesh tienen progresivos aumentos del nivel del mar y están en riesgo
        de sufrir inundaciones.

        Premisa: Argentina tiene progresivos aumentos del nivel del mar.

        Conclusión: Argentina está en riesgo de sufrir inundaciones.'
    clave: D
    correctas:
    - 'Premisa: Países Bajos, India y Bangladesh tienen progresivos aumentos del nivel del mar y están en riesgo
      de sufrir inundaciones.

      Premisa: Argentina tiene progresivos aumentos del nivel del mar.

      Conclusión: Argentina está en riesgo de sufrir inundaciones.'
    explicacion: 'Para identificar la respuesta es importante recordar que hay ciertas expresiones que, cuando están,
      nos ayudan a identificar las premisas y la conclusión de un argumento; en el libro las llamamos indicadores
      de premisa y de conclusión, respectivamente. En el argumento dado encontramos "pues" como indicador de premisa
      y "luego" como indicador de conclusión. Es importante recordar dos cosas: (i) tanto las premisas como la conclusión
      se deben enunciar de manera completa, y (ii) los indicadores nunca forman parte de las premisas o la conclusión
      (por esas dos razones es incorrecta la opción 2).'
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2025_A.pdf
      instancia: Final
      cuatrimestre: Final 02/2025
      tema: 2
      consigna: 1
- id: q-89da5b3c
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - Final 02/2025
  versiones:
  - enunciado: 'A. Determine si el argumento del ejercicio 1 es deductivo (D) o inductivo (I). Escriba "D" o "I"
      en el casillero "A" de la grilla de resolución.

      Argumento del ejercicio 1: Países Bajos, India y Bangladesh tienen progresivos aumentos del nivel del mar
      y están en riesgo de sufrir inundaciones. Luego, Argentina está en riesgo de sufrir inundaciones, pues tiene
      progresivos aumentos del nivel del mar.'
    opciones:
      A: Deductivo (D)
      B: Inductivo (I)
    clave: B
    correctas:
    - Inductivo (I)
    explicacion: 'Los argumentos deductivos se pueden reconocer de modos diferentes. Por un lado, porque si suponemos
      que ambas premisas son verdaderas, la conclusión es necesariamente verdadera. Por otro lado, podemos atender
      a su estructura: si reconocemos alguna estructura de las presentadas en el material de lectura, tales como
      el Modus Ponens, Modus Tollens, silogismo hipotético, etc., sabemos que estamos frente a una forma válida.
      Respecto de los argumentos inductivos, resulta concebible que las premisas sean verdaderas y la conclusión
      no. Si atendemos a su estructura, y reconocemos alguna de las estructuras presentadas en el material, como
      el argumento inductivo por enumeración incompleta, por analogía o el silogismo inductivo, sabemos que estamos
      frente a una forma inválida. En este caso el argumento es un argumento inductivo, específicamente un argumento
      inductivo por analogía, por lo que sus premisas establecen con probabilidad la conclusión.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2025_A.pdf
      instancia: Final
      cuatrimestre: Final 02/2025
      tema: 2
      consigna: 2A
