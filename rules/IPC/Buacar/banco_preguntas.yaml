- id: q-7b8d0d09
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - Final 07/2026
  - Final 12/2024
  versiones:
  - enunciado: Indique cuál de las siguientes afirmaciones expresa una tesis compartida por el empirismo lógico,
      representado por Hempel, y el falsacionismo de Popper. Seleccione una opción y escriba el número en la grilla
      de resolución.
    opciones:
      A: La creación de nuevas hipótesis involucra factores que no pueden ser reconstruidos lógicamente.
      B: La justificación de las hipótesis se realiza únicamente a través de argumentos deductivos.
      C: La formulación de nuevas hipótesis se realiza por medio de la inducción.
      D: La justificación de las hipótesis requiere el uso de argumentos deductivos e inductivos.
    clave: A
    correctas:
    - La creación de nuevas hipótesis involucra factores que no pueden ser reconstruidos lógicamente.
    explicacion: Tanto el empirismo lógico representado por Hempel como el falsacionismo de Popper sostienen que
      el proceso de generación de hipótesis no puede ser analizado mediante reconstrucción lógica. Los procesos
      por los cuales evaluamos una hipótesis, en cambio, sí pueden ser analizados mediante reconstrucción racional.
      Para el empirismo lógico representado por Hempel, debemos emplear la inducción para dicha evaluación, pero
      para Popper solo debemos usar razonamientos deductivos en este proceso. Ambos acuerdan, también, en que es
      necesario ofrecer un criterio para decidir cuáles hipótesis pertenecen a la ciencia empírica y cuáles no.
      Sin embargo, cada uno ofrece un criterio diferente. Mientras que el empirismo lógico representado por Hempel
      sostiene que el criterio que debe cumplir la hipótesis es su traducibilidad a un lenguaje observacional, Popper
      sostiene que el criterio a cumplir es la falsabilidad (es decir, la posibilidad de formular falsadores potenciales).
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2024_D.pdf
      instancia: Final
      cuatrimestre: Final 12/2024
      tema: 1
      consigna: 6
  - enunciado: Indique cuál de las siguientes afirmaciones expresa una tesis compartida por el empirismo lógico,
      representado por Hempel, y el falsacionismo de Popper. Seleccione una opción y escriba el número en la grilla
      de resolución.
    opciones:
      A: Todo enunciado no científico debe calificarse como sin sentido.
      B: Cuando la contrastación no es favorable, la hipótesis es refutada.
      C: El progreso científico es un proceso puramente acumulativo de teorías verdaderas.
      D: Es posible verificar una hipótesis universal mediante la observación.
    clave: B
    correctas:
    - Cuando la contrastación no es favorable, la hipótesis es refutada.
    explicacion: Esta afirmación expresa una tesis compartida por el empirismo lógico y el falsacionismo porque
      ambas corrientes se inscriben dentro de la denominada "filosofía clásica de la ciencia" y adoptan el modelo
      hipotético-deductivo como base para analizar la contrastación. Cuando una consecuencia observacional resulta
      ser falsa tras la contrastación empírica, aplicando la regla del Modus Tollens, se refuta o niega también
      el conjunto de enunciados del cual se dedujo dicha consecuencia. Así, ambos autores coinciden en que el resultado
      negativo de una contrastación empírica tiene la fuerza lógica para llevar a la comunidad científica a reformular
      o desechar el conjunto de enunciados puestos a prueba.
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2026_B.pdf
      instancia: Final
      cuatrimestre: Final 07/2026
      tema: 1
      consigna: 6
- id: q-f67bb93e
  tipo: vf_justificada
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - Final 12/2024
  versiones:
  - enunciado: 'Determine si el siguiente enunciado es verdadero o falso y por qué según la epistemología de Kuhn.
      Seleccione una opción y escriba el número en la grilla de resolución.

      Durante el período pre-científico, la comunidad científica trabaja bajo varios paradigmas simultáneamente.'
    opciones:
      A: El enunciado es falso porque durante el período pre-científico impera un solo paradigma.
      B: El enunciado es falso porque en el período pre-científico aun no se ha formado una comunidad científica.
      C: El enunciado es verdadero porque durante el período pre-científico hay competencia de paradigmas rivales.
      D: El enunciado es verdadero porque el período pre-científico surge de la desconfianza en el paradigma vigente.
    clave: B
    correctas:
    - El enunciado es falso porque en el período pre-científico aun no se ha formado una comunidad científica.
    explicacion: Durante el período pre-científico, para Kuhn, lxs científicxs de la disciplina trabajan en escuelas
      rivales y aún no se han unificado en una comunidad científica. Por lo tanto, en este período aún no ha surgido
      ningún paradigma.
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2024_D.pdf
      instancia: Final
      cuatrimestre: Final 12/2024
      tema: 1
      consigna: 7
