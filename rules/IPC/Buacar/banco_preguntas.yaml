- id: q-168b899e
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: 'Complete la siguiente oración de modo que el enunciado resulte correcto según la epistemología de
      Kuhn. Seleccione una opción y escriba el número en la grilla de resolución.

      Las anomalías en la ciencia normal son...'
    opciones:
      A: casos y experiencias problemáticas que no pueden resolverse en el marco del paradigma vigente.
      B: irrelevantes para el desarrollo de la ciencia.
      C: pruebas definitivas de la falsedad del paradigma.
      D: problemas fácilmente resolubles con las herramientas del paradigma vigente.
    clave: A
    correctas:
    - casos y experiencias problemáticas que no pueden resolverse en el marco del paradigma vigente.
    explicacion: 'Según la epistemología de Kuhn, las anomalías son problemas o fenómenos que no pueden resolverse
      dentro del marco del paradigma vigente y que, al acumularse, pueden generar una crisis que lleve a un cambio
      de paradigma. Las anomalías no son irrelevantes, sino todo lo contrario: son fundamentales para la dinámica
      del cambio científico. No constituyen pruebas "definitivas de falsedad", pues los paradigmas no se consideran
      falsos, ni se abandonan automáticamente, ante la aparición de ciertos problemas.'
    fuente_clave: explicaciones
    apariciones:
