  - Final 12/2024
  versiones:
  - enunciado: 'Dado el siguiente argumento, determine cuáles son las premisas y cuál es la conclusión. Seleccione
      una opción y escriba el número en la grilla de resolución.

      Podemos inferir que si se queman combustibles fósiles, aumenta la temperatura. En primer lugar, si se queman
      combustibles fósiles, crece la emisión de gases de efecto invernadero. En segundo lugar, si crece la emisión
      de gases de efecto invernadero, aumenta la temperatura.'
    opciones:
      A: 'Premisa: Si crece la emisión de gases de efecto invernadero, aumenta la temperatura.

        Premisa: Si se queman combustibles fósiles, aumenta la temperatura.

        Conclusión: Si se queman combustibles fósiles, crece la emisión de gases de efecto invernadero.'
      B: 'Premisa: Si se queman combustibles fósiles, crece la emisión de gases de efecto invernadero.

        Premisa: Si crece la emisión de gases de efecto invernadero, aumenta la temperatura.

        Conclusión: Si se queman combustibles fósiles, aumenta la temperatura.'
      C: 'Premisa: Si se queman combustibles fósiles, crece la emisión de gases de efecto invernadero.

        Premisa: Si se queman combustibles fósiles, aumenta la temperatura.

        Conclusión: Si crece la emisión de gases de efecto invernadero, aumenta la temperatura.'
      D: 'Premisa: En primer lugar, si se queman combustibles fósiles, crece la emisión de gases.

        Premisa: En segundo lugar, si crece la emisión de gases, aumenta la temperatura.

        Conclusión: Podemos inferir que si se queman combustibles fósiles, aumenta la temperatura.'
    clave: B
    correctas:
    - 'Premisa: Si se queman combustibles fósiles, crece la emisión de gases de efecto invernadero.

      Premisa: Si crece la emisión de gases de efecto invernadero, aumenta la temperatura.

      Conclusión: Si se queman combustibles fósiles, aumenta la temperatura.'
    explicacion: 'Para identificar la respuesta es importante recordar que hay ciertas expresiones que, cuando están,
      nos ayudan a identificar las premisas y la conclusión de un argumento; en el libro las llamamos indicadores
      de premisa y de conclusión, respectivamente. En el argumento dado encontramos "en primer lugar", "en segundo
      lugar" como indicadores de premisa, y tenemos "podemos inferir que" como indicador de conclusión. Es importante
      recordar dos cosas: (i) tanto las premisas como la conclusión se deben enunciar de manera completa, y (ii)
      los indicadores nunca forman parte de las premisas o la conclusión (por esas dos razones es incorrecta la
      opción 4).'
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2024_D.pdf
      instancia: Final
      cuatrimestre: Final 12/2024
      tema: 1
      consigna: 1
- id: q-5099e342
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - Final 12/2024
  versiones:
  - enunciado: 'A. Determine si el argumento del ejercicio 1 es deductivo (D) o inductivo (I). Escriba "D" o "I"
      en el casillero "A" de la grilla de resolución.

      Argumento del ejercicio 1: Podemos inferir que si se queman combustibles fósiles, aumenta la temperatura.
      En primer lugar, si se queman combustibles fósiles, crece la emisión de gases de efecto invernadero. En segundo
      lugar, si crece la emisión de gases de efecto invernadero, aumenta la temperatura.'
    opciones:
      A: Deductivo (D)
      B: Inductivo (I)
    clave: A
    correctas:
    - Deductivo (D)
    explicacion: 'Los argumentos deductivos se pueden reconocer de modos diferentes. Por un lado, porque si suponemos
      que ambas premisas son verdaderas, la conclusión es necesariamente verdadera. Por otro lado, podemos atender
      a su estructura: si reconocemos alguna estructura de las presentadas en el material de lectura, tales como
      el Modus Ponens, Modus Tollens, silogismo hipotético, etc., sabemos que estamos frente a una forma válida.
      Respecto de los argumentos inductivos, resulta concebible que las premisas sean verdaderas y la conclusión
      no. Si atendemos a su estructura, y reconocemos alguna de las estructuras presentadas en el material, como
      el argumento inductivo por enumeración incompleta, por analogía o el silogismo inductivo, sabemos que estamos
      frente a una forma inválida. En este caso el argumento es un argumento deductivo, específicamente un silogismo
      hipotético, por lo que sus premisas establecen de modo concluyente la conclusión.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2024_D.pdf
      instancia: Final
      cuatrimestre: Final 12/2024
      tema: 1
      consigna: 2A
