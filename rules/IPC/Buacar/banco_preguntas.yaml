- id: q-74fb6847
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - Final 02/2025
  versiones:
  - enunciado: 'Dado el siguiente argumento, determine cuáles son las premisas y cuál es la conclusión. Seleccione
      una opción y escriba el número en la grilla de resolución.

      Si se están derritiendo los glaciares de los polos, entonces aumenta el nivel del mar en Argentina. Se sigue
      que aumenta el nivel del mar en Argentina, debido a que se están derritiendo los glaciares de los polos.'
    opciones:
      A: 'Premisa: Si se están derritiendo los glaciares de los polos, entonces aumenta el nivel del mar en Argentina.

        Premisa: Debido a que se están derritiendo los glaciares de los polos.

        Conclusión: Se sigue que aumenta el nivel del mar.'
      B: 'Premisa: Si se están derritiendo los glaciares de los polos, entonces aumenta el nivel del mar en Argentina.

        Premisa: Aumenta el nivel del mar en Argentina.

        Conclusión: Se están derritiendo los glaciares de los polos.'
      C: 'Premisa: Si se están derritiendo los glaciares de los polos, entonces aumenta el nivel del mar en Argentina.

        Premisa: Se están derritiendo los glaciares de los polos.

        Conclusión: Aumenta el nivel del mar en Argentina.'
      D: 'Premisa: Se están derritiendo los glaciares de los polos.

        Premisa: Aumenta el nivel del mar en Argentina.

        Conclusión: Si se están derritiendo los glaciares de los polos, entonces aumenta el nivel del mar en Argentina.'
    clave: C
    correctas:
    - 'Premisa: Si se están derritiendo los glaciares de los polos, entonces aumenta el nivel del mar en Argentina.

      Premisa: Se están derritiendo los glaciares de los polos.

      Conclusión: Aumenta el nivel del mar en Argentina.'
    explicacion: 'Para identificar la respuesta es importante recordar que hay ciertas expresiones que, cuando están,
      nos ayudan a identificar las premisas y la conclusión de un argumento; en el libro las llamamos indicadores
      de premisa y de conclusión, respectivamente. En el argumento dado encontramos "debido a que" como indicador
      de premisa y "se sigue que" como indicador de conclusión. Es importante recordar dos cosas: (i) tanto las
      premisas como la conclusión se deben enunciar de manera completa, y (ii) los indicadores nunca forman parte
      de las premisas o la conclusión (por esas dos razones es incorrecta la opción 1).'
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2025_A.pdf
      instancia: Final
      cuatrimestre: Final 02/2025
      tema: 1
      consigna: 1
- id: q-6a806735
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - Final 02/2025
  versiones:
  - enunciado: 'A. Determine si el argumento del ejercicio 1 es deductivo (D) o inductivo (I). Escriba "D" o "I"
      en el casillero "A" de la grilla de resolución.

      Argumento del ejercicio 1: Si se están derritiendo los glaciares de los polos, entonces aumenta el nivel del
      mar en Argentina. Se sigue que aumenta el nivel del mar en Argentina, debido a que se están derritiendo los
      glaciares de los polos.'
    opciones:
      A: Deductivo (D)
      B: Inductivo (I)
    clave: A
    correctas:
    - Deductivo (D)
    explicacion: 'Los argumentos deductivos se pueden reconocer de modos diferentes. Por un lado, porque si suponemos
      que ambas premisas son verdaderas, la conclusión es necesariamente verdadera. Por otro lado, podemos atender
      a su estructura: si reconocemos alguna estructura de las presentadas en el material de lectura, tales como
      el Modus Ponens, Modus Tollens, silogismo hipotético, etc., sabemos que estamos frente a una forma válida.
      Respecto de los argumentos inductivos, resulta concebible que las premisas sean verdaderas y la conclusión
      no. Si atendemos a su estructura, y reconocemos alguna de las estructuras presentadas en el material, como
      el argumento inductivo por enumeración incompleta, por analogía o el silogismo inductivo, sabemos que estamos
      frente a una forma inválida. En este caso el argumento es un argumento deductivo, específicamente un Modus
      Ponens, por lo que sus premisas establecen de modo concluyente la conclusión.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2025_A.pdf
      instancia: Final
      cuatrimestre: Final 02/2025
      tema: 1
      consigna: 2A
