  versiones:
  - enunciado: Indique cuál de las siguientes afirmaciones expresa una tesis rechazada por Darwin y Lamarck. Seleccione
      una opción y escriba el número en la grilla de resolución.
    opciones:
      A: La adaptación de los organismos se explica por selección natural.
      B: Todas las especies proceden de uno o de unos pocos ancestros en común.
      C: La adaptación de los organismos al ambiente se explica por la herencia de caracteres adquiridos por uso
        y desuso.
      D: Las especies son fijas, no sufren modificaciones a lo largo del tiempo.
    clave: D
