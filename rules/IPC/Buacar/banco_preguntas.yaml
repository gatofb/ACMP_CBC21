- id: q-45811cc7
  tipo: simple
  puntos: null
  veces_tomada: 1
  cuatrimestres:
  - Final 07/2026
  versiones:
  - enunciado: 'Dado el siguiente caso de investigación, identifique la hipótesis fundamental. Escriba el número
      de la opción seleccionada como hipótesis fundamental donde dice "HF" en la grilla de resolución.

      La capacidad de las plantas para percibir su entorno y responder a él resulta fundamental para su supervivencia.
      Son conocidas, por ejemplo, las respuestas de las plantas a la luz. Dado que la mayoría de las plantas que
      tienen flores dependen de otros organismos polinizadores para su reproducción, resulta interesante la investigación
      de las interacciones entre plantas y polinizadores. Investigadores de la Universidad de Tel Aviv postularon
      que las plantas manifiestan una respuesta rápida al sonido que producen sus polinizadores. Más específicamente,
      propusieron que las plantas de Oenothera drummondii aumentan la concentración de azúcar en su néctar al detectar
      el zumbido de las abejas. Para evaluarlo, dividieron una selección de plantas de Oenothera drummondii en dos
      grupos y expusieron a cada uno a una condición sonora diferente durante 3 minutos. El grupo A estuvo en silencio,
      mientras que el grupo B estuvo expuesto a la reproducción de una grabación de zumbido de abeja. Se basaron
      para esto en estudios acústicos que muestran que el zumbido de las abejas y la reproducción de grabaciones
      del zumbido emiten vibraciones sonoras similares. Pasados los 3 minutos, extrajeron el néctar de las flores
      y utilizaron un refractómetro digital para medir la concentración de azúcar en el néctar.'
    opciones:
      A: Las plantas de Oenothera drummondii aumentan la concentración de azúcar en su néctar al detectar el zumbido
        de las abejas.
      B: El zumbido de las abejas y la reproducción de grabaciones del zumbido emiten vibraciones sonoras similares.
      C: La concentración de azúcar medida en el néctar de las plantas del grupo B será mayor que la medida en las
        del grupo A.
      D: La mayoría de las plantas que tienen flores dependen de otros organismos polinizadores para su reproducción.
      E: Las plantas de Oenothera drummondii producirán néctar con alta concentración de azúcar.
      F: Las plantas del grupo A producirán más néctar que las del grupo B.
    clave: A
    correctas:
    - Las plantas de Oenothera drummondii aumentan la concentración de azúcar en su néctar al detectar el zumbido
      de las abejas.
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2026_B.pdf
      instancia: Final
      cuatrimestre: Final 07/2026
      tema: 1
      consigna: 5A
