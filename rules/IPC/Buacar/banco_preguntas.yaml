- id: q-6534a7d0
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - Final 02/2025
  versiones:
  - enunciado: 'Dado el siguiente explanans:

      - El 85% de los ecosistemas que experimentan alteraciones en sus ciclos biológicos, geográficos y químicos,
      sufre cambios significativos en su temperatura y en sus patrones de lluvia.

      - El ecosistema del Chaco argentino experimenta alteraciones en sus ciclos biológicos, geográficos y químicos.

      Determine qué explanandum se puede inferir con la ley y la condición antecedente brindadas y seleccione la
      afirmación que caracteriza correctamente la explicación construida.

      A. Identifique el explanandum. Seleccione una opción y escriba el número en el casillero "A" de la grilla
      de resolución.'
    opciones:
      A: El ecosistema del Chaco argentino sufre cambios significativos en el ciclo del agua, del carbono y del
        nitrógeno.
      B: El ecosistema del Chaco argentino no sufre cambios significativos en su temperatura y en sus patrones de
        lluvia.
      C: El ecosistema del Chaco argentino sufre cambios significativos en su temperatura y en sus patrones de lluvia.
      D: Todo ecosistema es regulado por ciclos naturales que permiten la circulación de elementos esenciales entre
        sus partes componentes.
    clave: C
    correctas:
    - El ecosistema del Chaco argentino sufre cambios significativos en su temperatura y en sus patrones de lluvia.
    explicacion: De acuerdo con el modelo de cobertura legal, el explanans contiene leyes (que deben ser estadísticas
      o probabilísticas en las explicaciones estadístico-inductivas y universales en las explicaciones nomológico-deductivas).
      Además, esas leyes están acompañadas por enunciados que describen las condiciones iniciales o antecedentes
