    explicacion: Si bien propusieron mecanismos evolutivos distintos (Darwin defendió la selección natural como
      principio evolutivo general mientras que Lamarck sostuvo que los organismos tienden a volverse más complejos)
      ambos son autores evolucionistas. Es decir, ambos sostuvieron que los organismos se transforman y dan lugar
      a nuevas especies a lo largo del tiempo, en contraposición al fijismo característico del creacionismo medieval.
