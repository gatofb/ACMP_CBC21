- id: q-93292820
  tipo: multiple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: 'Dado el siguiente argumento, indicá cuáles son sus premisas. Seleccioná dos opciones y escribí los
      números en la grilla de resolución.

      El tiranosaurio rex tenía dientes que medían hasta 30 cm de largo. Por otro lado, los del megalodón medían
      hasta 18 cm de largo. Por consiguiente, los carnívoros prehistóricos tenían mordidas letales.'
    opciones:
      A: Los dientes del megalodón medían hasta 18 cm de largo.
      B: Los del tiranosaurio rex medían hasta 30 cm de largo.
      C: Los carnívoros prehistóricos tenían mordidas letales.
      D: El tiranosaurio rex tenía dientes que medían hasta 30 cm de largo.
    clave:
    - A
    - D
    correctas:
    - Los dientes del megalodón medían hasta 18 cm de largo.
    - El tiranosaurio rex tenía dientes que medían hasta 30 cm de largo.
    explicacion: 'Para identificar la respuesta es importante recordar que hay ciertas expresiones que, cuando están,
      nos ayudan a identificar las premisas y la conclusión de un argumento. En el libro las llamamos indicadores
      de premisa y de conclusión, respectivamente. En el argumento dado hay un indicador de conclusión, a saber,
      "por consiguiente". Es importante recordar dos cosas: (i) tanto las premisas como la conclusión se deben enunciar
      de manera completa, y (ii) los indicadores nunca forman parte de las premisas o la conclusión.'
    fuente_clave: explicaciones
    apariciones:
