- id: q-14bb2e89
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - Final 02/2025
  versiones:
  - enunciado: 'Dado el siguiente caso de investigación, identifique la hipótesis fundamental y la consecuencia
      observacional. Escriba en la grilla de resolución el número de la opción seleccionada como hipótesis fundamental
      donde dice "HF" y el número de la opción seleccionada como consecuencia observacional donde dice "CO".

      Para adquirir nuestra lengua materna, debemos ser capaces de distinguir las proferencias en esa lengua de
      aquellas en lenguas extranjeras. Investigadores de la Escuela de Estudios Superiores en Ciencias Sociales
      quisieron probar que esta capacidad ya está presente en los bebés a una edad muy temprana. Para eso, realizaron
      un experimento sobre 40 bebés de cuatro días de edad provenientes de familias francesas. Un primer grupo de
      estos bebés fue expuesto a una grabación de un relato en la cual la primera parte estaba en ruso y la segunda
      parte estaba en inglés. El segundo grupo escuchó otra grabación en la cual la primera parte del relato estaba
      en ruso y la segunda parte estaba en francés. Mientras escuchaban las grabaciones, todos los bebés usaron
      chupetes con sensores que registraban el ritmo de la succión. Los investigadores asumieron que cuando los
      bebés sienten interés o curiosidad frente a un estímulo aumentan el ritmo de succión. Así, esperaban observar
      una mayor aceleración del ritmo de succión al escuchar la grabación en los bebés del segundo grupo que en
      los bebés del primer grupo. Efectivamente, observaron que en el segundo grupo el ritmo aumentó entre 10 y
      20 succiones por minuto cuando la grabación cambiaba de ruso a francés, mientras que en el primer grupo no
      se observaron variaciones de ritmo significativas.

      ¿Cuál es la hipótesis fundamental? (casillero "HF")'
    opciones:
      A: Los chupetes tienen sensores que registran el cambio de lengua en las grabaciones.
      B: Habrá una aceleración del ritmo de succión similar en los bebés del segundo grupo y en los bebés del primer
        grupo.
      C: Para adquirir nuestra lengua materna, debemos ser capaces de distinguir las proferencias en esa lengua
        de aquellas en lenguas extranjeras.
      D: Los sensores de los chupetes registrarán una mayor aceleración del ritmo de succión al escuchar la grabación
        en los bebés del segundo grupo que en los bebés del primer grupo.
      E: La capacidad de distinguir proferencias en la lengua materna de proferencias en lenguas extranjeras está
        presente en los bebés a una edad muy temprana.
      F: Cuando los bebés sienten interés o curiosidad frente a un estímulo aumentan el ritmo de succión.
    clave: E
    correctas:
    - La capacidad de distinguir proferencias en la lengua materna de proferencias en lenguas extranjeras está presente
      en los bebés a una edad muy temprana.
    explicacion: En este ejercicio se pide que identifiques la hipótesis fundamental y la consecuencia observacional
      del caso de investigación presentado. Para ello, es importante tener en cuenta que las hipótesis son enunciados
      generales. La hipótesis fundamental es aquella que guía la investigación y que es puesta a prueba en el experimento.
      En cambio, la consecuencia observacional es un enunciado empírico básico que expresa lo que cabe esperar a
      la luz de la hipótesis fundamental, dadas las condiciones iniciales en las que se lleva a cabo el experimento
      y la/s hipótesis auxiliar/es que se asume/n.
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2025_A.pdf
      instancia: Final
      cuatrimestre: Final 02/2025
      tema: 2
      consigna: 5HF
