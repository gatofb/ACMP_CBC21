- id: q-761bfbac
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - Final 12/2024
  versiones:
  - enunciado: 'Lea el siguiente fragmento periodístico. Teniendo en cuenta los debates sobre ética científica,
      determine cuál de las opciones es más representativa de la postura cientificista. Seleccione una opción y
      escriba el número en la grilla de resolución.

      Diversas investigaciones en neurociencia han demostrado que cuando las personas son expuestas a recompensas
      impredecibles sus niveles de dopamina, un neurotransmisor clave relacionado con el placer y la motivación,
      aumentan significativamente en comparación a cuando son expuestas a recompensas predecibles. La imprevisibilidad
      genera una mayor sensación de anticipación y emoción, lo que motiva a las personas a continuar buscando la
      próxima recompensa, aunque esta sea incierta. Estos descubrimientos han sido aplicados, por ejemplo, en el
      diseño de aplicaciones y videojuegos que incorporan mecanismos de recompensas impredecibles, como los "cofres"
      (loot boxes), con el objetivo de mantener a los usuarios o jugadores más “enganchados”. Sin embargo, algunos
      expertos advierten que este tipo de estrategias pueden generar comportamientos adictivos, similares a los
      observados en personas con adicción al juego (ludopatía).'
    opciones:
      A: Los descubrimientos realizados por neurocientíficos sobre el sistema de recompensa y las funciones de la
        dopamina representan grandes avances en nuestra comprensión del cerebro. Sin embargo, si estos hallazgos
        son utilizados por empresas para diseñar aplicaciones o videojuegos con fines éticamente cuestionables,
        como mantener al usuario más tiempo enganchado aprovechando sus vulnerabilidades cerebrales, la responsabilidad
        recae exclusivamente en estas empresas. Los científicos no deben asumir responsabilidades por los usos posteriores
        o potenciales de sus descubrimientos, ya que su papel es únicamente producir conocimiento.
      B: Las investigaciones neurocientíficas orientadas a comprender mejor el sistema de recompensa del cerebro
        y el papel de la dopamina han facilitado el desarrollo de aplicaciones y videojuegos con potenciales efectos
        adictivos, lo que pone en riesgo la salud mental de los usuarios. No es posible separar el desarrollo de
        la investigación científica de sus posibles aplicaciones, y los científicos no pueden eludir la responsabilidad
        si los resultados de su trabajo se utilizan para fines éticamente cuestionables.
      C: El uso o mal uso de los conocimientos sobre el sistema de recompensa del cerebro que provengan de investigaciones
        neurocientíficas debe estar regulado por los Estados. Mientras los científicos actúen conforme a las leyes
        vigentes en sus países, están cumpliendo con su responsabilidad ética.
      D: Los avances tecnológicos basados en estudios de neurociencia pueden generar un impacto considerable en
        la sociedad, como cuando afectan negativamente la salud mental de los usuarios de videojuegos o aplicaciones.
        Decidir cuáles áreas del conocimiento deben priorizarse en la investigación y con qué fines se aplicarán
        no es solo una tarea para empresarios, científicos o tecnólogos, sino que compete a toda la sociedad. La
        ciencia y sus aplicaciones deben ser discutidas en un proceso democrático que incluya a todos los sectores
        sociales.
    clave: A
    correctas:
    - Los descubrimientos realizados por neurocientíficos sobre el sistema de recompensa y las funciones de la dopamina
      representan grandes avances en nuestra comprensión del cerebro. Sin embargo, si estos hallazgos son utilizados
      por empresas para diseñar aplicaciones o videojuegos con fines éticamente cuestionables, como mantener al
      usuario más tiempo enganchado aprovechando sus vulnerabilidades cerebrales, la responsabilidad recae exclusivamente
      en estas empresas. Los científicos no deben asumir responsabilidades por los usos posteriores o potenciales
      de sus descubrimientos, ya que su papel es únicamente producir conocimiento.
    explicacion: El cientificismo es la posición según la cual el conocimiento científico es valorativamente neutral,
      y los valores entran en juego solo cuando discutimos sobre el uso de este conocimiento. Por consiguiente,
      la evaluación ética solo tiene lugar al momento de la aplicación, en la medida en que otros (empresas, gobiernos,
      etc.) deciden aplicar un desarrollo científico con algún fin (en cuyo caso, se convierten en directos responsables
      por sus consecuencias).
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2024_D.pdf
      instancia: Final
      cuatrimestre: Final 12/2024
      tema: 1
      consigna: 9
- id: q-367ffa24
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - Final 12/2024
  versiones:
  - enunciado: 'A. Indique qué tipo de problema relevante para la integridad científica se ve reflejado en el caso
      que se relata a continuación. Seleccione una opción y escriba el número en el casillero "A" de la grilla de
      resolución.

      ExxonMobil, una de las mayores compañías petroleras del mundo, ha estado en el centro de una controversia
      debido a su conocimiento y manejo de la información relacionada con el cambio climático. Un reciente análisis
      realizado por la publicación Carbon Brief investigó nada menos que 900 artículos publicados, todos los cuales
      arrojan dudas sobre el cambio climático, o incluso niegan que exista. Tras concluir esta investigación, descubrieron
      que 9 de cada 10 de los autores más prolíficos tenían algún tipo de conexión con Exxon Mobil. Los resultados
      mostraron que, de los 938 artículos citados, 186 habían sido escritos por sólo diez hombres, y entre ellos
      destacaba el Dr. Sherwood B. Idso, autor principal de 67 de ellos. Idso es el presidente del Centro para el
      Estudio del Dióxido de Carbono y el Cambio Global, un grupo de estudios financiado por ExxonMobil. El segundo
      más prolífico fue el Dr. Patrick J. Michaels, miembro del Cato Institute, que recibe aproximadamente el 40%
      de su financiación de la industria petrolera.'
    opciones:
      A: Acceso a la información
      B: Incentivos perversos
      C: Revisión de pares
      D: Conflictos de interés
    clave: D
    correctas:
    - Conflictos de interés
    explicacion: Los conflictos de interés se producen cuando una investigación está financiada por una persona
      u organismo que tiene un interés propio en que la investigación produzca algún resultado determinado. Esto
      es lo que ocurrió en este caso. Es habitual, hoy en día, que los científicos declaren de dónde obtuvieron
      su financiamiento, pero esto por sí solo no alcanza para despejar conflictos de interés, porque no es fácil
      conocer los intereses de las organizaciones que los financian. En cualquier caso, está claro que hay un problema
      ético si los resultados de una investigación están decididos de antemano por la persona o institución que
      otorga el financiamiento.
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2024_D.pdf
      instancia: Final
      cuatrimestre: Final 12/2024
      tema: 1
      consigna: 10A
