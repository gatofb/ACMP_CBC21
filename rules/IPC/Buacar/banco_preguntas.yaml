- id: q-a87176ed
  tipo: simple
  puntos: 1
  veces_tomada: 2
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: 'Tras clasificar los distintos tipos de argumentos inductivos establecimos criterios específicos
      para su evaluación. Atendiendo a esto, determiná qué premisa sirve para fortalecer el siguiente argumento
      inductivo sin que deje de ser un argumento inductivo por enumeración incompleta. Seleccioná una opción y escribí
      el número en la grilla de resolución.

      El mamut y el rinoceronte lanudo, al igual que el mastodonte, eran depredadores. Por lo tanto, es probable
      que todos los animales grandes de la Edad de Hielo fueran depredadores, dado que el mamut, el rinoceronte
      lanudo y el mastodonte eran animales grandes de la Edad de Hielo.'
    opciones:
      A: El mamut, el rinoceronte lanudo y el mastodonte constituyen las únicas tres especies de animales grandes
        de la Edad de Hielo.
      B: El megaterio no era depredador.
      C: El tigre dientes de sable, que era un animal grande de la Edad de hielo, era depredador.
      D: La hiena de las cavernas era un animal depredador.
    clave: C
    correctas:
    - El tigre dientes de sable, que era un animal grande de la Edad de hielo, era depredador.
    explicacion: Un argumento inductivo por enumeración incompleta parte de la presencia de una propiedad en una
      muestra y concluye la presencia de esa propiedad en todo el conjunto al cual los casos de esa muestra pertenecen.
      El argumento inductivo más fuerte será aquel en el cual la muestra a partir de la cual se generaliza en la
      conclusión sea mayor. Ten en cuenta que, para que el argumento siga siendo inductivo, la muestra no puede
      ser igual al conjunto sobre el que se realiza la generalización.
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2025_A.pdf
      instancia: 1er Parcial
