- id: q-a2d4caaa
  tipo: simple
  puntos: null
  veces_tomada: 2
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: 'Dado el explanandum: Este pez puso huevas en el río.

      Complete la siguiente explicación de modo que resulte una explicación nomológico deductiva. Escriba en la
      grilla de resolución el número de la opción seleccionada como ley donde dice "L" y el número de la opción
      seleccionada como condición antecedente donde dice "CA".

      L (ley):'
    opciones:
      A: La mayoría de los salmones ponen huevas en el río.
      B: Si este pez está en etapa de reproducción, entonces puso huevas en el río.
      C: Este pez es un salmón.
      D: Este pez está en etapa de reproducción.
      E: Los salmones ponen huevas en los ríos.
    clave: E
    correctas:
    - Los salmones ponen huevas en los ríos.
    explicacion: De acuerdo con el modelo de cobertura legal el explanans contendrá por lo menos una ley. En este
      caso, por tratarse de una explicación nomológico-deductiva, dicha ley debe ser universal. Además, esas leyes
      estarán acompañadas por enunciados que describen las condiciones iniciales o antecedentes (que son aquellos
      factores específicos que fueron suficientes para la ocurrencia del fenómeno en cuestión). En este caso, para
      explicar por qué "este pez puso huevas en el río", el único par de enunciados que pueden funcionar como ley
      y condición antecedente son "Los salmones ponen huevas en los ríos" y "Este pez es un salmón", respectivamente.
      Por otro lado, hay que recordar que las leyes son enunciados generales que describen una regularidad empíricamente
      constatada. Por eso, un enunciado condicional acerca de un individuo, como el de la opción 2, no es una ley
      y no puede formar parte de una explicación de este tipo.
    fuente_clave: explicaciones
    apariciones:
