      tener presente que en todo argumento hay enunciados que se ofrecen como razones (las premisas) a favor de
      otro que se pretende concluir o establecer (la conclusión). Recordá que hay ciertas expresiones que, cuando
      están, nos ayudan a distinguir las premisas de la conclusión. En el libro de la cátedra las denominamos “indicador
      de premisa” e “indicador de conclusión”. En este caso, el indicador "por lo tanto" ayuda a identificar la
      conclusión.
