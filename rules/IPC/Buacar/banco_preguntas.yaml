- id: q-8df558d0
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - Final 07/2026
  versiones:
  - enunciado: 'Lea el caso que se propone a continuación:

      Un país costero cuya economía depende principalmente de la pesca se propone otorgar financiamiento a una gran
      iniciativa científica. El comité científico se debate entre el financiamiento en ciencia básica que estudie
      las corrientes oceánicas profundas y la biodiversidad marina, y la inversión en ciencia aplicada que desarrolle
      innovaciones tecnológicas para optimizar la pesca sustentable y reducir la sobreexplotación de la fauna marina
      local. En una reunión del comité científico, una investigadora con una postura cientificista interviene en
      la discusión.

      ¿Qué sostendría esta investigadora desde su perspectiva cientificista? Seleccione una opción y escriba el
      número en la grilla de resolución.'
    opciones:
      A: Defendería la postura de que deben destinarse los recursos exclusivamente a desarrollar innovaciones tecnológicas
        que sirvan a una pesca sustentable, lo que promovería el desarrollo social y económico del país en el corto
        y mediano plazo.
      B: Sugeriría dar prioridad a la investigación en ciencia básica, ya que las investigaciones que profundizan
        el conocimiento del mundo natural son valiosas en sí mismas, independientemente de sus resultados inmediatos.
      C: Diría que el comité científico no tiene competencia para decidir, ya que toda inversión vinculada al sistema
        productivo debe ser determinada por criterios políticos, no científicos.
      D: Recomendaría que los fondos se distribuyan en tercios para que se incluyan disciplinas como la filosofía
        y la historia, ya que son las únicas capaces de pensar críticamente las consecuencias ambientales y sociales
        de la sobreexplotación de la fauna marina.
    clave: B
    correctas:
    - Sugeriría dar prioridad a la investigación en ciencia básica, ya que las investigaciones que profundizan el
      conocimiento del mundo natural son valiosas en sí mismas, independientemente de sus resultados inmediatos.
    explicacion: 'Para un cientificista, el progreso científico proviene de la investigación básica, independientemente
      de su utilidad inmediata. Desde esta perspectiva, la ciencia tiene un valor intrínseco y debe orientarse por
      sus propias preguntas y métodos, no por demandas prácticas, sociales o políticas. Por eso, incluso cuando
      no haya beneficios tangibles a corto plazo, la investigación teórica sigue siendo prioritaria: es el motor
      auténtico del avance científico y la condición de posibilidad de cualquier aplicación futura.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2026_B.pdf
      instancia: Final
      cuatrimestre: Final 07/2026
      tema: 1
      consigna: 9
- id: q-c2aed077
  tipo: simple
  puntos: null
  veces_tomada: 1
  cuatrimestres:
  - Final 07/2026
  versiones:
  - enunciado: 'Indique qué tipo de problema relevante para la integridad científica se ve reflejado en el caso
      que se relata a continuación. Seleccione una opción y escriba el número en el casillero "A" de la grilla de
      resolución.

      En febrero de 1998, el médico Andrew Wakefield publicó una investigación preliminar en la revista The Lancet
      que sugería un vínculo causal entre la vacuna triple viral (sarampión, paperas y rubéola) y el autismo. Allí
      se analizaban 11 niños vacunados que habían desarrollado problemas gastrointestinales y una inflamación en
      el cerebro. La comunidad científica demoró varios años en descartar ese supuesto vínculo a partir de diversos
      estudios. Sobre Wakefield, se conoció que previo a la publicación de su artículo había solicitado la patente
      de una vacuna alternativa que competía con la vacuna triple viral, lo que lo motivó a adulterar el estudio.
      Años más tarde, The Lancet retiró el artículo de su revista argumentando que las conclusiones del estudio
      eran falsas.'
    opciones:
      A: Ineficiencia del sistema de revisión por pares
      B: Incentivos perversos
      C: Conflictos de interés
    clave: C
    correctas:
    - Conflictos de interés
    explicacion: Los conflictos de interés se producen cuando una investigación está financiada por una persona
      u organismo que tiene un interés propio en que la investigación produzca algún resultado determinado. Esto
      es lo que ocurrió en este caso. Es habitual, hoy en día, que los científicos declaren de dónde obtuvieron
      su financiamiento, pero esto por sí solo no alcanza para despejar conflictos de interés, porque no es fácil
      conocer los intereses de las organizaciones que los financian. En cualquier caso, está claro que hay un problema
      ético si los resultados de una investigación están influenciados por la persona o institución que otorga el
      financiamiento.
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2026_B.pdf
      instancia: Final
      cuatrimestre: Final 07/2026
      tema: 1
      consigna: 10A
