- id: q-4d9cf6a7
  tipo: simple
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: 'Los argumentos están compuestos por enunciados. Estos enunciados pueden combinarse mediante expresiones
      lógicas dando lugar a enunciados complejos. Dados los siguientes enunciados verdaderos:

      - Los dinosaurios tenían extremidades verticales.

      - Los dinosaurios eran animales vertebrados.

      Determiná cuál de los siguientes enunciados complejos es verdadero. Seleccioná una opción y escribí el número
      en la grilla de resolución.'
    opciones:
      A: Los dinosaurios no tenían extremidades verticales pero eran animales vertebrados.
      B: Si los dinosaurios tenían extremidades verticales, eran animales vertebrados.
      C: Los dinosaurios no tenían extremidades verticales o no eran animales vertebrados.
      D: Los dinosaurios no tenían extremidades verticales.
    clave: B
    correctas:
    - Si los dinosaurios tenían extremidades verticales, eran animales vertebrados.
    explicacion: 'En este ejercicio tuviste que evaluar el valor veritativo de una conjunción, una negación, una
      disyunción y un condicional:

      1. Las conjunciones pueden expresarse con “y”, “,”, “además”, “pero”. Las negaciones con “no”, “ no es cierto
      que”. Los condicionales con “si… entonces” y las disyunciones con “o”, “ o bien … o bien”.

      2. Las conjunciones son verdaderas sólo en el caso en que ambos conyuntos sean verdaderos, esto es, basta
      que uno de los enunciados combinados por la conjunción sea falso, para que el enunciado complejo resulte falso.

      3. Cuando un enunciado es verdadero, su negación es falsa y, a la inversa, cuando un enunciado es falso, su
      negación resultará verdadera.

      4. Los enunciados condicionales son falsos únicamente cuando el antecedente es verdadero y el consecuente
      falso, en el resto de los casos son verdaderos.

      5. Hay dos tipos de disyunciones, las inclusivas y las exclusivas. Expresiones como “o bien… o bien” sugieren
      que se trata de una disyunción exclusiva, en cambio la mera presencia de una “o” nos conduce a pensar que
      es inclusiva. Cuando ambas partes son falsas, la disyunción entre ambas es falsa, no importa el tipo de disyunción
      del cual se trate. Por el contrario, cuando uno de los disyuntos es verdadero y el otro falso, la disyunción
      es verdadera. El caso en que ambos tipos de disyunciones arrojan valores diferentes es aquel en que ambos
      disyuntos son verdaderos. Si la disyunción es inclusiva, el enunciado complejo será verdadero; si es exclusiva,
      será falso.

      En este ejercicio el enunciado complejo verdadero es el condicional, dado que tiene antecedente y consecuente
      verdaderos.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2025_A.pdf
      instancia: 1er Parcial
      cuatrimestre: 1C 2025
      tema: 1
      consigna: 3
- id: q-83d71439
  tipo: simple
