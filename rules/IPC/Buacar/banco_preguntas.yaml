    explicacion: En este ejercicio se te pide que reconozcas un tipo de enunciado, en este caso, un enunciado universal.
      Los enunciados universales son aquellos que afirman algo respecto de todos los miembros de un conjunto. Así,
      la respuesta es "Todos los tuátaras son reptiles".
