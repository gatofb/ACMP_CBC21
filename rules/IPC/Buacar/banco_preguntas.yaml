  versiones:
  - enunciado: Determiná cuál de los siguientes fragmentos es un argumento. Seleccioná una opción y escribí el número
      en la grilla de resolución.
    opciones:
      A: En primer lugar, la base de la organización social de los mapuches es el lof, formado por familias con
        antepasados comunes. En segundo lugar, en tiempos de conflicto, varios lof se unen para formar un rehue
        liderado por un jefe militar llamado toqui. Finalmente, ante problemas mayores como invasiones o epidemias,
        los rehues se agrupan en aillarehues.
      B: Durante la ceremonia religiosa del guillatún en la que se agradece y se pide por el bienestar y la unión,
        la comunidad primero dispone un lugar sagrado llamado ngillatuwe instalando un tronco en su centro. Luego,
        una vez preparado el espacio, proceden a realizar bailes rituales y entregar diversas ofrendas para solicitar
        a la divinidad beneficios, como el aumento del ganado o lluvias abundantes.
      C: Los huilliches son parte del pueblo mapuche. Se ubicaron históricamente en el área comprendida entre el
        río Toltén y la Isla Grande de Chiloé, en el actual territorio chileno. Hablan la lengua mapudungún pero
        con variaciones locales de vocabulario y pronunciación.
      D: Si la comunidad organiza la ceremonia del guillatún, entonces se realizan bailes rituales acompañados de
        oraciones y se entregan ofrendas para pedir beneficios como lluvias o el aumento del ganado.
      E: Si una persona habla mapudungún, entonces es parte del pueblo mapuche. Dado que los huilliches usan esa
        lengua, en consecuencia son considerados parte del pueblo mapuche.
    clave: E
    correctas:
    - Si una persona habla mapudungún, entonces es parte del pueblo mapuche. Dado que los huilliches usan esa lengua,
