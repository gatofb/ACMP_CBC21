- id: q-e0b267b5
  tipo: vf_justificada
  puntos: 1
  veces_tomada: 1
  cuatrimestres:
  - Final 07/2026
  versiones:
  - enunciado: 'Determine si el siguiente enunciado es verdadero o falso y por qué según la epistemología de Kuhn.
      Seleccione una opción y escriba el número en la grilla de resolución.

      Ante la aparición de anomalías, la comunidad científica abandona inmediatamente el paradigma vigente e inicia
      la búsqueda de uno nuevo.'
    opciones:
      A: El enunciado es verdadero porque las anomalías se definen precisamente como aquellos problemas que el paradigma
        vigente no puede resolver.
      B: El enunciado es falso porque las anomalías se definen como problemas que se presentan en el período de
        ciencia normal y que el paradigma enfrenta con sus herramientas.
      C: El enunciado es falso porque las anomalías desencadenan un período de crisis que no siempre culmina en
        el abandono del paradigma.
      D: El enunciado es verdadero porque, ante la aparición de una anomalía, los científicos pierden inmediamente
        la confianza en la capacidad del paradigma de resolver problemas.
    clave: C
    correctas:
    - El enunciado es falso porque las anomalías desencadenan un período de crisis que no siempre culmina en el
      abandono del paradigma.
    explicacion: 'Según Kuhn, las anomalías son problemas que se resisten a ser explicados por el aparato teórico
      y metodológico con el que se desarrolla la ciencia normal: al multiplicarse y profundizarse, generan en la
      comunidad científica un escepticismo respecto de la viabilidad del paradigma vigente. Sin embargo, durante
      el período de crisis podría encontrarse alguna vía no explorada que destrabe la resolución de esos problemas
      y permita recuperar la confianza en el paradigma, de modo que no toda crisis culmina con su reemplazo. El
      abandono del paradigma no es, por tanto, una consecuencia automática ni inmediata de la aparición de anomalías.'
    fuente_clave: explicaciones
    apariciones:
    - archivo: Final_2026_B.pdf
      instancia: Final
      cuatrimestre: Final 07/2026
      tema: 1
      consigna: 7
