      tener presente que en todo argumento hay enunciados que se ofrecen como razones, las premisas, a favor de
      otro que se pretende concluir o establecer, la conclusión,. Recordá que hay ciertas expresiones que, cuando
      están, nos ayudan a distinguir las premisas de la conclusión. En el libro de la cátedra las denominamos “indicadores
      de premisa” e “indicadores de conclusión”. En este caso, el indicador "dado que" ayuda a identificar una de
