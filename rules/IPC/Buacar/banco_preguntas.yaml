- id: q-2e20b161
  tipo: simple
  puntos: null
  veces_tomada: 2
  cuatrimestres:
  - 1C 2025
  versiones:
  - enunciado: 'Al presentar los argumentos inductivos distinguimos tres tipos: por enumeración incompleta, por
      analogía y silogismos inductivos. Dado el siguiente conjunto de enunciados:

      El tiranosaurio era un dinosaurio carnívoro y tenía garras afiladas.

      El velociraptor era un dinosaurio carnívoro y tenía garras afiladas.

      ..............................................................

      ..............................................................

      Seleccioná cuáles de los siguientes enunciados corresponden respectivamente a la premisa faltante y a la conclusión,
      de modo tal que resulte un argumento inductivo por analogía. Escribí en la grilla de resolución la opción
      seleccionada como premisa donde dice "P" y la opción seleccionada como conclusión donde dice "C".

      P (premisa faltante):'
    opciones:
      A: El estegosaurio era un dinosaurio carnívoro.
      B: El tiranosaurio era un dinosaurio carnívoro.
      C: La mayoría de los dinosaurios carnívoros tenían garras afiladas.
      D: Todos los dinosaurios carnívoros tenían garras afiladas.
      E: El estegosaurio tenía garras afiladas.
    clave: A
    correctas:
    - El estegosaurio era un dinosaurio carnívoro.
    explicacion: Los argumentos inductivos por analogía son aquellos en que comparamos varios casos y constatamos
      que los mismos se asemejan en una o más propiedades, para inferir, a partir de ahí, que uno de esos casos
      tiene además otra propiedad que los otros comparten. En este caso, partimos de comparar tres dinousaurios
      y constatar que se asemejan en ciertos aspectos, para concluir que uno de esos también se asemeja en un nuevo
      aspecto que los otros dos comparten. Hay dos soluciones posibles para este ejercicio. Una solución es tomar
      "El estegosaurio era un dinosaurio carnívoro" como premisa y "El estegosaurio tenía garras afiladas" como
      conclusión. La otra solución es, a la inversa, tomar "El estegosaurio era un dinosaurio carnívoro" como conclusión
      y "El estegosaurio tenía garras afiladas" como premisa.
    fuente_clave: explicaciones
    apariciones:
    - archivo: 1erParcial_2025_A.pdf
      instancia: 1er Parcial
      cuatrimestre: 1C 2025
      tema: 1
