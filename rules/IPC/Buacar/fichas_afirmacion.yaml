- id: kuhn.periodo-precientifico
  eje: conceptos
  autor: Thomas Kuhn
  fuente: Material de la cátedra (capítulo pendiente)
  tema: El período pre-científico
  afirmacion: Para Kuhn, en el período pre-científico los científicos de la disciplina trabajan en escuelas
    rivales y todavía no se unificaron en una comunidad científica; por eso aún no surgió ningún paradigma.
  puntos:
  - En el período pre-científico, quienes investigan trabajan en escuelas rivales.
  - Todavía no se formó una comunidad científica unificada.
  - Por eso, en este período aún no surgió ningún paradigma.
  - Es falso que en el período pre-científico la comunidad científica trabaje bajo varios paradigmas a
    la vez.
  trampas:
  - texto: '"Es falso porque durante el período pre-científico impera un solo paradigma."'
    error: motivo_equivocado
    por_que: 'El veredicto está bien, pero el motivo no: en esta etapa no hay ningún paradigma todavía.'
  - texto: '"Es verdadero porque durante el período pre-científico hay competencia de paradigmas rivales."'
    error: concepto_vecino
    por_que: 'Lo que compiten son escuelas, no paradigmas: en esta etapa todavía no surgió ninguno.'
  - texto: '"Es verdadero porque el período pre-científico surge de la desconfianza en el paradigma vigente."'
    error: concepto_vecino
    por_que: 'Describe la crisis: en el pre-científico no hay un paradigma vigente del cual desconfiar.'
  pregunta_guia: Antes de la primera etapa de ciencia normal, ¿hay ya una comunidad científica y un paradigma,
    o solo escuelas que compiten?
  explicacion_modelo: 'Es falso, porque en el período pre-científico todavía no se formó una comunidad
    científica. Para Kuhn, en esa etapa los investigadores trabajan en escuelas rivales y aún no surgió
    ningún paradigma. Tienta "es verdadero porque hay competencia de paradigmas rivales", pero lo que
    compite en esa etapa son escuelas: todavía no hay ningún paradigma, ni uno ni varios.'
