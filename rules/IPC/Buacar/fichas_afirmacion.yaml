- id: evolucion.variacion-heredable
  eje: conceptos
  autor: Darwin y la evolución
  fuente: Material de la cátedra (capítulo pendiente)
  tema: La variación heredable entre generaciones
  afirmacion: 'Según la teoría de la selección natural, los organismos no son idénticos a sus progenitores:
    entre los individuos de una especie hay variaciones, muchas azarosas y muchas heredables, que generan
    diferencias de aptitud, y sobre ellas actúa la selección natural favoreciendo a los más aptos.'
  puntos:
  - Es falso que los organismos sean idénticos a sus progenitores.
  - Es falso que todos los rasgos de los organismos se mantengan invariables de generación en generación.
  - De una generación a otra suele haber diferencias, y sobre ellas actúa la selección natural.
  - Existe variación entre los individuos de una misma especie, y parte de esas variaciones puede heredarse.
  - Hay variaciones de rasgos que se producen azarosamente, y muchas de ellas pueden heredarse.
  - Las variaciones generan diferencias en la aptitud de los organismos, y la selección natural favorece
    a los más aptos.
  trampas:
  - texto: '"Surgen variaciones por una necesidad adaptativa, como resultado del uso o desuso de ciertos
      órganos."'
    error: concepto_vecino
    por_que: Es la explicación de Lamarck; para Darwin muchas variaciones son azarosas, no respuestas
      a una necesidad.
  - texto: '"La evolución hace que cada generación sea ligeramente más compleja que la anterior."'
    error: concepto_vecino
    por_que: Es la tendencia a la complejidad de Lamarck, no la selección natural.
  - texto: '"La selección natural garantiza que cada generación sea totalmente distinta a la anterior."'
    error: absoluto_falso
    por_que: Hay diferencias, no generaciones totalmente distintas; y la selección actúa sobre las variaciones,
      no las garantiza.
  - texto: '"La preservación de las especies exige que la descendencia sea idéntica a los ancestros."'
    error: concepto_vecino
    por_que: 'Es una idea fijista: para Darwin la variación entre generaciones es lo que hace posible
      la selección.'
  - texto: '"Los rasgos de los organismos están determinados por un plan inteligente de una vez y para
      siempre."'
    error: concepto_vecino
    por_que: 'Es creacionismo fijista: niega la variación y la transformación de las especies.'
  - texto: '"Los rasgos de los organismos aumentan las chances de supervivencia y reproducción, y perduran
      en el tiempo."'
    error: media_verdad
    por_que: 'Algunos rasgos dan ventaja, pero de ahí no se sigue que no varíen: la justificación tiene
      que hablar de variación heredable.'
  pregunta_guia: Si cada hijo fuera idéntico a sus padres, ¿sobre qué actuaría la selección natural? ¿De
    dónde salen las diferencias y por qué importa que se hereden?
  explicacion_modelo: Es falso que los organismos sean idénticos a sus progenitores. Para Darwin, entre
    los individuos de una especie hay variaciones, muchas azarosas y muchas heredables, que generan diferencias
    de aptitud; sobre esas diferencias actúa la selección natural. Tienta "surgen variaciones por una
    necesidad adaptativa, por uso o desuso", porque también niega que los rasgos sean invariables, pero
    esa es la explicación de Lamarck, no la de Darwin.
