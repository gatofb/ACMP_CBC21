- id: evolucion.explicar-un-rasgo
  eje: conceptos
  autor: Darwin y la evolución
  fuente: Material de la cátedra (capítulo pendiente)
  tema: Explicar un rasgo por selección natural (y distinguirlo de la explicación de Lamarck)
  afirmacion: 'Una explicación por selección natural relaciona la eficacia de un rasgo para cumplir una
    función en un ambiente con la aptitud de quien lo tiene: entre los ancestros había variación, los
    que tenían el rasgo dejaron más descendencia y, con las generaciones, el rasgo se volvió más frecuente.
    La de Lamarck, en cambio, apela al uso o desuso durante la vida y a la herencia de lo adquirido.'
  puntos:
  - Lo característico de las explicaciones por selección natural es relacionar la eficacia de los rasgos
    para cumplir ciertas funciones en un ambiente con la aptitud del organismo que los posee.
  - Los organismos más aptos dejan mayor descendencia que los menos aptos, y por eso en las sucesivas
    generaciones aumenta la proporción de organismos con el rasgo adaptativo.
  - La explicación darwiniana parte de una variación que ya estaba entre los ancestros (algunos individuos
    nacieron con el rasgo); no dice que cada individuo lo haya adquirido.
  - 'La teoría de Lamarck reconoce dos mecanismos: la tendencia general a la complejidad y la herencia
    de las características adquiridas por uso o desuso.'
  - 'La explicación lamarckiana de un rasgo dice que usarlo (o dejar de usarlo) durante la vida lo modificó
    y que esa modificación se heredó: los ancestros de los búhos ejercitaron la visión, la mejoraron y
    se la heredaron a sus descendientes.'
  trampas:
  - texto: Diseño o creación ("Los perros fueron diseñados para...", "Los pingüinos fueron diseñados y
      creados...", "Los búhos fueron creados siguiendo un arquetipo...").
    error: concepto_vecino
    por_que: 'Es una explicación creacionista: no hay variación ni selección, sino un plan previo.'
  - texto: Uso y desuso con herencia de lo adquirido ("al exponerse a esos alimentos fueron adquiriendo
      la capacidad...", "por falta de uso las alas se atrofiaron...").
    error: concepto_vecino
    por_que: 'Es la explicación de Lamarck: el rasgo se adquiere durante la vida y se hereda, sin selección.'
  - texto: Cría selectiva intencional hecha por seres humanos que valoraban a los individuos más aptos.
    error: concepto_vecino
    por_que: 'Es selección artificial: en la selección natural no hay nadie que elija con una intención.'
  - texto: Tendencia a la perfección o al progreso ("todas las especies tienden a parecerse a los humanos,
      la forma más perfecta", "la visión potente es el grado máximo de la línea evolutiva").
    error: concepto_vecino
    por_que: Supone una meta o una escala de progreso; la selección natural explica el rasgo por su ventaja
      en un ambiente.
  - texto: Cuando se pide la explicación de Lamarck, elegir la de variación al azar y ventaja para sobrevivir.
    error: concepto_vecino
    por_que: Esa es la explicación darwiniana; Lamarck explica el rasgo por el uso y la herencia de lo
      adquirido.
  pregunta_guia: ¿El rasgo ya estaba en algunos individuos y se volvió más frecuente porque dejaron más
    descendencia, o cada individuo lo fue adquiriendo con el uso y lo heredó?
  explicacion_modelo: 'La explicación darwiniana de las alas del pingüino es que, entre sus ancestros,
    los que tenían alas más cortas y rígidas nadaban mejor, conseguían más alimento y dejaron más descendencia,
    que heredó ese rasgo. El criterio: variación previa, ventaja en ese ambiente, más descendencia y aumento
    del rasgo en las generaciones siguientes. Tienta la opción de que las alas se atrofiaron por falta
    de uso y eso se heredó, pero esa es la explicación de Lamarck: el rasgo se adquiere durante la vida
    y no hay selección.'
