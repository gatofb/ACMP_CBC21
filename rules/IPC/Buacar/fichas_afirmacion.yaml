- id: feminismo.exclusion-y-marginalizacion
  eje: conceptos
  autor: Epistemología feminista
  fuente: Material de la cátedra (capítulo pendiente)
  tema: Exclusión y marginalización de las mujeres en la ciencia
  afirmacion: 'Una de las manifestaciones del androcentrismo y el sexismo en ciencia es la exclusión y
    marginalización: a lo largo de la historia, las mujeres fueron privadas de la posibilidad de formarse
    y de ejercer la actividad científica, de manera explícita y legal o por vías menos explícitas.'
  puntos:
  - El androcentrismo y el sexismo en ciencia se manifiestan de diversas maneras; una de ellas es la exclusión
    y marginalización.
  - Historiadoras, sociólogas y antropólogas feministas mostraron que las mujeres fueron privadas de la
    posibilidad de formarse y de ejercer la ciencia.
  - La exclusión puede ser explícita y legal (prohibirles estudiar en la universidad o ejercer la ciencia)
    o menos explícita (la creencia en carreras "de varones" y "de mujeres").
  - 'Aun cuando acceden a la carrera científica, puede haber marginalización: progresar menos que sus
    pares varones con los mismos méritos.'
  - El caso de Sophie Germain, que no pudo estudiar en instituciones reservadas a varones y tuvo que formarse
    sola, es exclusión y marginalización.
  trampas:
  - texto: Omisiones selectivas en la historia de la ciencia / efecto Matilda.
    error: concepto_vecino
    por_que: Apunta a que se borre o no se reconozca el aporte de una mujer; en el caso, Germain tuvo
      reconocimiento y el obstáculo fue poder formarse.
  - texto: Teorías sexistas.
    error: concepto_vecino
    por_que: Apunta al contenido de las teorías científicas, no a quién puede formarse y hacer ciencia.
  - texto: Aplicaciones sexistas.
    error: concepto_vecino
    por_que: Apunta a los usos de la ciencia, no al acceso de las mujeres a la formación científica.
  pregunta_guia: ¿El problema del caso está en el contenido de una teoría, en sus usos, en que se borró
    el aporte de una mujer o en que no la dejaron formarse ni ejercer?
  explicacion_modelo: 'Es exclusión y marginalización: Sophie Germain no pudo estudiar en las instituciones
    formales, reservadas a varones, y tuvo que formarse sola y con tutores privados. Esa manifestación
    del androcentrismo y el sexismo consiste en privar a las mujeres de formarse y ejercer la ciencia,
    por ley o por vías más sutiles. Tienta el efecto Matilda porque se trata de una científica del pasado,
    pero el caso aclara que tuvo gran reconocimiento: el problema no fue el olvido de su obra, sino el
    acceso.'
  recurso_ubaxxi: pendiente
  preguntas:
  - q-d1980388
  estado: borrador
  notas: 'La explicación oficial solo define "exclusión y marginalización"; las descripciones de teorías
    sexistas, aplicaciones sexistas y efecto Matilda en los por_que son generales: validarlas con el texto
    de la cátedra.'
- id: integridad.conflictos-de-interes
  eje: conceptos
  autor: Ética e integridad científica
  fuente: Material de la cátedra (capítulo pendiente)
  tema: Conflictos de interés
  afirmacion: Hay conflicto de interés cuando una investigación está financiada por alguien con un interés
    propio en que produzca un resultado determinado, o cuando quien investiga tiene intereses que tensionan
    la objetividad de su estudio; declarar el financiamiento ayuda, pero no alcanza para despejarlo.
  puntos:
  - Los conflictos de interés se producen cuando una investigación está financiada por una persona u organismo
    que tiene un interés propio en que produzca algún resultado determinado.
  - También hay conflicto de interés cuando quien investiga tiene intereses propios, por ejemplo comerciales,
    que ponen en tensión la objetividad de su estudio.
  - Es habitual declarar de dónde viene el financiamiento, pero eso solo no alcanza para despejar los
    conflictos de interés, porque no es fácil conocer los intereses de quienes financian.
  - No divulgar el financiamiento arroja dudas sobre la integridad científica de quien investiga.
  - Hay un problema ético si los resultados de una investigación están decididos de antemano, o influenciados,
    por quien la financia.
  trampas:
  - texto: Incentivos perversos ("tenían incentivos para generar muchas publicaciones y ganar posiciones",
      "la exigencia de publicar en revistas prestigiosas incentiva el fraude").
    error: concepto_vecino
    por_que: Eso viene de la presión del sistema académico por publicar; en estos casos el problema es
      el interés en un resultado determinado.
  - texto: '"Las publicaciones no pasaron por revisión de pares."'
    error: dato_inventado
    por_que: 'El caso no dice nada sobre la revisión: lo que destaca es quién financió a los autores.'
  - texto: '"Las fallas en la revisión por pares permitieron publicar datos fraudulentos" (caso Wakefield).'
    error: verdad_general
    por_que: Suena razonable, pero el caso pone el foco en la patente que motivó a Wakefield a adulterar
      el estudio.
  - texto: Acceso a la información ("la comunidad no tenía acceso a las bases de datos / a la información
      estadística / a los estudios").
    error: dato_inventado
    por_que: 'El caso no dice que faltaran datos: lo que pesó fue el interés de quien financiaba o investigaba.'
  - texto: '"Las revistas académicas tenían incentivos para publicar los artículos que contradecían el
      consenso científico."'
    error: dato_inventado
    por_que: 'El caso no habla de las revistas: el problema es el financiamiento no declarado de Soon.'
  pregunta_guia: ¿Quién pagó la investigación o quién gana con su resultado? ¿Ese interés puede torcer
    lo que el estudio concluye?
  explicacion_modelo: 'En el caso de Soon hay un conflicto de interés: recibió financiamiento no declarado
    de empresas de combustibles fósiles, interesadas en que se minimizara el papel del CO2, y no divulgarlo
    arroja dudas sobre su integridad. Hay conflicto de interés cuando quien financia, o el propio investigador,
    tiene interés en que la investigación llegue a cierto resultado. Tienta "incentivos perversos", pero
    esos vienen de la presión por publicar, no de un interés en un resultado determinado.'
  recurso_ubaxxi: pendiente
  preguntas:
  - q-367ffa24
  - q-303b55a7
  - q-c9b8fd18
  - q-dbae671c
  - q-c2aed077
  - q-1ac6b712
  estado: borrador
  notas: 'La explicación oficial, igual en los tres casos, define el conflicto de interés por el financiamiento;
    en el caso Wakefield el interés es del propio investigador (una patente) y la clave lo cuenta igual
    como conflicto de interés. Las definiciones de incentivos perversos, revisión de pares y acceso a
    la información no están en las explicaciones oficiales: validarlas con el texto de la cátedra.'
- id: etica.cientificismo-y-responsabilidad
  eje: conceptos
  autor: Ética e integridad científica
  fuente: Material de la cátedra (capítulo pendiente)
  tema: 'Cientificismo y anticientificismo: la responsabilidad por los usos de la ciencia'
  afirmacion: El cientificismo sostiene que el conocimiento científico es valorativamente neutral y que
    la ética recién entra en juego en su aplicación, cuya responsabilidad es de quienes deciden aplicarlo.
    El anticientificismo sostiene que investigación y aplicación son indisociables (la "tecnociencia")
    y que los científicos no pueden eludir su responsabilidad.
  puntos:
  - Para el cientificismo, el conocimiento científico es valorativamente neutral; los valores entran en
    juego solo cuando se discute el uso de ese conocimiento.
  - Por eso, para el cientificismo, la evaluación ética tiene lugar al momento de la aplicación, y los
    responsables son quienes deciden aplicar el conocimiento (empresas, gobiernos); el papel del científico
    es producir conocimiento.
  - 'Para el anticientificismo, el desarrollo científico y el uso tecnológico de los descubrimientos son
    indisociables: hay que hablar de "tecnociencia" como una esfera común.'
  - Para el anticientificismo, los científicos que investigan, incluso en áreas muy abstractas, no son
    menos responsables que quienes desarrollan tecnologías y aplicaciones.
  trampas:
  - texto: Al pedir la postura anticientificista, la opción que reconoce los riesgos pero deja la responsabilidad
      "exclusivamente" en quienes desarrollan y aplican las tecnologías.
    error: media_verdad
    por_que: 'Arranca reconociendo los riesgos, pero concluye como el cientificismo: separa al científico
      de los usos.'
  - texto: Elegir la postura contraria ("no es posible separar la investigación de sus aplicaciones" como
      cientificista, o "la responsabilidad es exclusivamente de empresas o Estados" como anticientificista).
    error: concepto_vecino
    por_que: 'Confunde las dos posturas: separar ciencia y aplicación es cientificista; unirlas es anticientificista.'
  - texto: '"El uso debe estar regulado por los Estados; mientras los científicos cumplan la ley, cumplen
      con su responsabilidad ética."'
    error: verdad_general
    por_que: Suena razonable, pero reducir la ética a cumplir la ley no es la tesis de ninguna de las
      dos posturas.
  - texto: '"Decidir qué áreas priorizar y con qué fines compete a toda la sociedad, en un proceso democrático"
      como postura cientificista.'
    error: concepto_vecino
    por_que: El cientificismo ve la ciencia como neutral y deja la ética para la aplicación; esta opción
      somete la propia investigación a la discusión social.
  pregunta_guia: ¿La opción separa la producción de conocimiento de su aplicación y deja la ética para
    después, o dice que son inseparables y que el científico también es responsable?
  explicacion_modelo: La postura cientificista es la que dice que los descubrimientos sobre la dopamina
    son un avance y que, si una empresa los usa para enganchar usuarios, la responsabilidad es exclusivamente
    de esa empresa. El cientificismo ve la ciencia como neutral y deja la ética para el momento de la
    aplicación; el anticientificismo une investigación y aplicación en una sola tecnociencia. Tienta la
    opción de "regulado por los Estados", pero reducir la responsabilidad a cumplir la ley no es la tesis
    cientificista.
  recurso_ubaxxi: pendiente
  preguntas:
  - q-761bfbac
  - q-e6bb5df1
  estado: borrador
- id: etica.ciencia-basica-o-aplicada
  eje: conceptos
  autor: Ética e integridad científica
  fuente: Material de la cátedra (capítulo pendiente)
  tema: 'Qué investigación financiar: cientificismo y practicismo'
  afirmacion: El cientificismo prioriza la ciencia básica, porque el conocimiento tiene valor en sí mismo
    y la ciencia debe guiarse por sus propias preguntas; el practicismo prioriza la ciencia aplicada,
    porque la ciencia debe estar explícitamente al servicio de la sociedad y resolver problemas del desarrollo
    económico y social del país.
  puntos:
  - El practicismo afirma que se debe priorizar el financiamiento de la ciencia aplicada, porque la ciencia
    debe estar explícitamente al servicio de la sociedad.
  - Para el practicismo, la investigación debe contribuir directamente a resolver problemas prácticos
    vinculados al desarrollo económico y social del país (como el trigo HB4, tolerante a la sequía).
  - Para el cientificismo, el progreso científico proviene de la investigación básica, independientemente
    de su utilidad inmediata.
  - Para el cientificismo, la ciencia tiene un valor intrínseco y debe orientarse por sus propias preguntas
    y métodos, no por demandas prácticas, sociales o políticas; la investigación básica es la condición
    de posibilidad de cualquier aplicación futura.
  trampas:
  - texto: 'Practicismo: "No, porque estos desarrollos responden a intereses económicos y productivos,
      que no deberían ser la prioridad de la ciencia".'
    error: cambio_de_palabra
    por_que: 'Invierte la postura: para el practicismo, contribuir al desarrollo económico y social es
      justamente la prioridad.'
  - texto: 'Practicismo: "Sí, porque amplía nuestro conocimiento de la estructura genética de los alimentos".'
    error: motivo_equivocado
    por_que: El sí está bien, pero el motivo (ampliar el conocimiento) es cientificista; el practicista
      mira el impacto en necesidades concretas.
  - texto: 'Practicismo: "No, porque no contribuye al avance de la ciencia básica, a la que debería darse
      prioridad".'
    error: concepto_vecino
    por_que: Esa es la postura cientificista.
  - texto: 'Cientificismo: destinar los recursos exclusivamente a innovaciones tecnológicas para una pesca
      sustentable.'
    error: concepto_vecino
    por_que: 'Esa es la postura practicista: prioriza la aplicación por su beneficio social y económico.'
  - texto: 'Cientificismo: "el comité no tiene competencia; la inversión debe decidirse con criterios
      políticos, no científicos".'
    error: concepto_vecino
    por_que: El cientificismo defiende que la ciencia se oriente por sus propias preguntas, no por criterios
      políticos.
  - texto: 'Cientificismo: repartir los fondos en tercios para incluir filosofía e historia, "las únicas"
      capaces de pensar críticamente.'
    error: dato_inventado
    por_que: Ninguna de las posturas del debate propone ese reparto, y el "las únicas" es una generalización
      sin sustento.
  pregunta_guia: ¿La postura valora la investigación por el conocimiento que produce en sí mismo, o por
    cuánto resuelve problemas concretos de la sociedad?
  explicacion_modelo: Desde el practicismo, sí habría que priorizar el trigo HB4, porque tiene un impacto
    directo en la producción agrícola y responde a necesidades concretas de la sociedad. El practicismo
    pide financiar la ciencia aplicada que resuelva problemas del desarrollo económico y social; el cientificismo,
    en cambio, prioriza la ciencia básica por su valor intrínseco. Tienta "sí, porque amplía nuestro conocimiento
    de la estructura genética", que acierta el sí, pero con un motivo cientificista.
  recurso_ubaxxi: pendiente
  preguntas:
  - q-cf764045
  - q-8df558d0
  estado: borrador
- id: etica.premisa-valorativa
  eje: conceptos
  autor: Ética e integridad científica
  fuente: Material de la cátedra (capítulo pendiente)
  tema: La premisa valorativa y la falacia naturalista
  afirmacion: Para llegar a una conclusión normativa (lo que se debe hacer), las premisas tienen que incluir
    un juicio de valor y no solo juicios de hecho; si no, se salta de lo que "es" a lo que "debe ser"
    y se cae en una falacia naturalista.
  puntos:
  - Un argumento con conclusión normativa necesita una premisa valorativa (un juicio de valor), no solo
    juicios de hecho.
  - 'Concluir un deber a partir de juicios de hecho es saltar del "es" al "debe ser": una falacia naturalista.'
  - La premisa valorativa implícita correcta es la que, junto con la premisa de hecho, permite inferir
    exactamente la conclusión.
  - 'Para eso tiene que unir lo que dice la premisa de hecho ("comprender mejor la biodiversidad y la
    evolución...") con el deber específico de la conclusión ("invertir recursos públicos"): "Es correcto
    invertir recursos públicos para comprender mejor la biodiversidad y la evolución de especies desconocidas".'
  trampas:
  - texto: '"Invertir recursos públicos permite comprender mejor la biodiversidad y la evolución de especies
      desconocidas."'
    error: concepto_vecino
    por_que: 'Es un juicio de hecho, no de valor: concluir un deber a partir de él es una falacia naturalista.'
  - texto: '"Es correcto investigar especies desconocidas si esto ayuda a conocer mejor la vida en el
      planeta."'
    error: media_verdad
    por_que: 'Es un juicio de valor, pero no habla de invertir recursos públicos: de él no se deduce el
      deber específico de la conclusión.'
  - texto: '"La inversión pública en ciencia debe centrarse en la protección del medioambiente."'
    error: dato_inventado
    por_que: Es valorativa, pero mete un fin (el medioambiente) que no conecta la premisa con la conclusión.
  pregunta_guia: ¿Qué juicio de valor hace falta para que, junto con el dato de la premisa 2, se siga
    exactamente la conclusión?
  explicacion_modelo: 'La premisa implícita es "Es correcto invertir recursos públicos para comprender
    mejor la biodiversidad y la evolución de especies desconocidas". Una conclusión normativa necesita
    un juicio de valor entre las premisas, y ese juicio tiene que unir el hecho de la premisa 2 con el
    deber de la conclusión. Tienta "Invertir recursos públicos permite comprender mejor la biodiversidad",
    que se parece mucho, pero es un juicio de hecho: concluir un deber desde ahí es una falacia naturalista.'
  recurso_ubaxxi: pendiente
  preguntas:
  - q-1bf58062
  estado: borrador
  notas: La ficha usa "falacia naturalista" como la explicación oficial, para el salto del "es" al "debe
    ser"; en filosofía moral el nombre viene de Moore y no coincide exactamente con ese salto. Enseñar
    el sentido de la cátedra.
