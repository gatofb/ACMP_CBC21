- id: evolucion.darwin-y-lamarck
  eje: conceptos
  autor: Darwin y la evolución
  fuente: Material de la cátedra (capítulo pendiente)
  tema: 'Darwin y Lamarck: lo que comparten y lo que los separa'
  afirmacion: 'Darwin y Lamarck propusieron mecanismos evolutivos distintos, pero los dos son evolucionistas:
    sostienen que las especies se transforman a lo largo del tiempo y dan lugar a especies nuevas, en
    contra del fijismo del creacionismo medieval.'
  puntos:
  - 'Ambos son evolucionistas: los rasgos de las especies se modifican a lo largo del tiempo, lo que posibilita
    el surgimiento de nuevas especies.'
  - 'A lo largo de las sucesivas generaciones, las especies se transforman: es una tesis compartida.'
  - Ambos rechazan el fijismo del creacionismo medieval, según el cual las especies son fijas y no se
    modifican.
  - 'Es solo de Darwin: la selección natural como principio evolutivo general, que algunas variaciones
    sean aleatorias y que las especies actuales desciendan de ancestros comunes.'
  - 'Es solo de Lamarck: que las variaciones surjan como respuesta al ambiente, que las especies tiendan
    a volverse más complejas en una escala de progreso y la herencia de caracteres adquiridos por uso
    y desuso.'
  trampas:
  - texto: '"Las especies fueron creadas con sus rasgos actuales y no se modifican a lo largo del tiempo"
      como tesis compartida.'
    error: concepto_vecino
    por_que: Es el fijismo creacionista, justamente lo que los dos rechazan.
  - texto: '"Las especies tienden a complejizarse" o "evolucionan en una escala de complejidad creciente
      que tiende al progreso" como tesis compartida.'
    error: hecho_equivocado
    por_que: Es de Lamarck; Darwin rechazó la escala de progreso.
  - texto: '"La selección natural explica la adaptación de las especies al ambiente" como tesis compartida
      o rechazada por ambos.'
    error: hecho_equivocado
    por_que: Es la tesis central de Darwin; Lamarck propuso otros mecanismos.
  - texto: '"Las variaciones de rasgos únicamente surgen como respuesta al ambiente en el que se vive."'
    error: hecho_equivocado
    por_que: Es de Lamarck; para Darwin algunas variaciones son aleatorias.
  - texto: '"Las especies actuales descienden de ancestros comunes" como tesis compartida o rechazada
      por ambos.'
    error: hecho_equivocado
    por_que: 'Es de Darwin: Lamarck no la comparte y Darwin no la rechaza.'
  - texto: '"La adaptación se explica por la herencia de caracteres adquiridos por uso y desuso" como
      tesis rechazada por ambos.'
    error: hecho_equivocado
    por_que: 'Es el mecanismo que propuso Lamarck: él no lo rechaza.'
  pregunta_guia: ¿Qué idea tienen que aceptar los dos para ser evolucionistas, y qué mecanismo es propio
    de cada uno?
  explicacion_modelo: 'La tesis compartida es que, a lo largo de las generaciones, las especies se transforman
    y dan lugar a especies nuevas: los dos son evolucionistas, contra el fijismo creacionista. Lo que
    los separa es el mecanismo: Darwin propone la selección natural sobre variaciones en parte aleatorias
    y la descendencia de ancestros comunes; Lamarck, la tendencia a la complejidad y la herencia de lo
    adquirido por uso y desuso. Tienta "las especies tienden a complejizarse" porque suena evolucionista,
    pero es solo de Lamarck.'
  recurso_ubaxxi: pendiente
