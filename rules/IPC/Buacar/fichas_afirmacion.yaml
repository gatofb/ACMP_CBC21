- id: contrastacion.consecuencia-observacional
  eje: conceptos
  autor: Contrastación de hipótesis
  fuente: Material de la cátedra (capítulo pendiente)
  tema: Cómo identificar la consecuencia observacional
  afirmacion: La consecuencia observacional es un enunciado empírico básico que expresa lo que cabe esperar
    en el experimento a la luz de la hipótesis fundamental, dadas las condiciones iniciales y las hipótesis
    auxiliares que se asumen.
  puntos:
  - La consecuencia observacional es un enunciado empírico básico (singular o muestral), no una hipótesis
    general.
  - Expresa lo que cabe esperar a la luz de la hipótesis fundamental, dadas las condiciones iniciales
    del experimento y la o las hipótesis auxiliares.
  - Se deduce de la hipótesis y expresa un hecho que debería suceder si la hipótesis fuera verdadera.
  - 'Habla de lo que se va a registrar en este experimento, con sus grupos y su instrumento, y en la dirección
    que predice la hipótesis: "La concentración de azúcar medida en el néctar de las plantas del grupo
    B será mayor que la medida en las del grupo A".'
  trampas:
  - texto: Elegir la hipótesis fundamental ("Las plantas de Oenothera aumentan la concentración de azúcar
      al detectar el zumbido", "La lectura de ficción mejora la empatía").
    error: concepto_vecino
    por_que: 'Es general: es de donde se deduce la consecuencia observacional, no la consecuencia misma.'
  - texto: Elegir la hipótesis auxiliar ("El zumbido y su grabación emiten vibraciones similares", "Un
      mayor puntaje en el RMET indica más empatía").
    error: concepto_vecino
    por_que: Es conocimiento presupuesto, general y con apoyo previo; no dice qué se va a observar.
  - texto: Una predicción invertida ("El puntaje del RMET disminuirá...", "Habrá una aceleración similar
      en los dos grupos").
    error: cambio_de_palabra
    por_que: Dice lo contrario de lo que se espera si la hipótesis fundamental es verdadera.
  - texto: '"Las plantas de Oenothera drummondii producirán néctar con alta concentración de azúcar."'
    error: media_verdad
    por_que: 'Menciona la variable correcta, pero no compara los grupos: la hipótesis predice un aumento
      con el zumbido, no un nivel alto en general.'
  - texto: '"Las plantas del grupo A producirán más néctar que las del grupo B."'
    error: cambio_de_palabra
    por_que: Cambia concentración de azúcar por cantidad de néctar e invierte los grupos.
  - texto: '"La lectura de relatos de ficción es preferida por las personas más empáticas."'
    error: cambio_de_palabra
    por_que: Invierte la relación entre lectura y empatía, y además es un enunciado general.
  pregunta_guia: Si la hipótesis fundamental fuera verdadera, ¿qué debería registrarse en este experimento,
    con estos grupos y este instrumento?
  explicacion_modelo: 'En el caso de las plantas, la consecuencia observacional es "La concentración de
    azúcar medida en el néctar de las plantas del grupo B será mayor que la medida en las del grupo A".
    Es un enunciado observacional sobre este experimento: lo que se espera si la hipótesis es verdadera,
    dadas las condiciones (silencio contra zumbido grabado) y la auxiliar (la grabación vibra como una
    abeja). Tienta la hipótesis fundamental porque dice lo mismo en general, pero justamente por ser general
    no es la consecuencia observacional: es de donde se la deduce.'
  recurso_ubaxxi: pendiente
  preguntas:
  - q-a511d9b2
  - q-b1a206da
  - q-935c0858
