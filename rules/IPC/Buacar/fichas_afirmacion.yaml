- id: ciencia-formal.no-falsable
  eje: conceptos
  autor: Ciencia empírica y formal
  fuente: Material de la cátedra (capítulo pendiente)
  tema: Por qué los enunciados formales no son ciencia empírica para el falsacionismo
  afirmacion: 'Para el falsacionismo, un enunciado pertenece a la ciencia empírica si es falsable: si
    tiene contenido empírico y se pueden formular contra él enunciados básicos que funcionen como falsadores
    potenciales. Los enunciados de las ciencias formales, como los de la geometría, no los tienen.'
  puntos:
  - 'Según el falsacionismo, para pertenecer a la ciencia empírica un enunciado debe ser falsable: tener
    contenido empírico y admitir falsadores potenciales.'
  - Los falsadores potenciales son enunciados existenciales, singulares, incompatibles con la hipótesis
    y lógicamente posibles.
  - 'No son falsables: los enunciados de las ciencias formales, las afirmaciones metafísicas y los enunciados
    probabilísticos.'
  - '"Las rectas paralelas nunca se tocan" es un enunciado de las ciencias formales: no pertenece a la
    ciencia empírica porque no tiene falsadores potenciales.'
  trampas:
  - texto: Responder que sí pertenece a la ciencia empírica, porque parece hablar de algo que se podría
      observar.
    error: concepto_vecino
    por_que: 'Es un enunciado de la geometría, una ciencia formal: no tiene contenido empírico ni falsadores
      potenciales.'
  - texto: '"...porque no puede traducirse al lenguaje observacional."'
    error: concepto_vecino
    por_que: La traducibilidad al lenguaje observacional es el criterio del empirismo lógico; el del falsacionismo
      es la falsabilidad.
  - texto: '"...porque está confirmado."'
    error: concepto_vecino
    por_que: La confirmación no es el criterio del falsacionismo, y estar confirmado no sacaría a un enunciado
      de la ciencia empírica.
  - texto: '"...porque es poco probable."'
    error: concepto_vecino
    por_que: La probabilidad no decide la demarcación; lo que importa es si hay falsadores potenciales.
  pregunta_guia: ¿Qué enunciado singular, observable y lógicamente posible podría contradecir esta afirmación?
    Si no hay ninguno, ¿a qué tipo de ciencia pertenece?
  explicacion_modelo: No pertenece a la ciencia empírica, porque no tiene falsadores potenciales. Para
    el falsacionismo, un enunciado es empírico si se pueden formular contra él enunciados básicos (existenciales,
    singulares, incompatibles con él y lógicamente posibles); "Las rectas paralelas nunca se tocan" es
    un enunciado de la geometría, una ciencia formal, y no los tiene. Tienta "porque no puede traducirse
    al lenguaje observacional", pero ese es el criterio de demarcación del empirismo lógico, no el de
    Popper.
  recurso_ubaxxi: pendiente
  preguntas:
  - q-f4377362
  - q-643a24a4
  estado: borrador
  notas: 'El falsacionismo de Popper no tiene categoría propia en la lista de autores: esta ficha va en
    "Ciencia empírica y formal" porque evalúa la demarcación; la comparación Hempel-Popper va en "Empirismo
    lógico".'
- id: empirismo-logico.hempel-y-popper
  eje: conceptos
  autor: Empirismo lógico
  fuente: Material de la cátedra (capítulo pendiente)
  tema: Qué comparten y en qué se diferencian Hempel y Popper
  afirmacion: 'El empirismo lógico (Hempel) y el falsacionismo (Popper) coinciden en que la invención
    de hipótesis no se reconstruye lógicamente, en que una contrastación desfavorable refuta y en que
    la ciencia progresa de forma continua hacia la verdad. Se separan en la contrastación favorable: para
    Hempel confirma por inducción; para Popper solo vale la deducción y la ciencia avanza eliminando teorías
    falsas.'
  puntos:
  - Ambos sostienen que la creación de nuevas hipótesis involucra factores que no pueden reconstruirse
    lógicamente; lo que sí se reconstruye racionalmente es su evaluación.
  - 'Ambos adoptan el modelo hipotético-deductivo: si la consecuencia observacional resulta falsa, por
    modus tollens se refuta el conjunto de enunciados del que se dedujo.'
  - Ambos piensan un desarrollo continuo del conocimiento científico que se acerca progresivamente a la
    verdad.
  - 'Para Hempel, la evaluación usa la inducción: la contrastación favorable confirma la hipótesis, aumenta
    su probabilidad, y el progreso es acumulativo.'
  - 'Para Popper, solo se usan razonamientos deductivos: la contrastación favorable no confirma, la hipótesis
    se acepta provisoriamente por resistir la refutación, y la ciencia progresa eliminando teorías falsas,
    sin alcanzar la verdad definitivamente.'
  - 'Ambos buscan un criterio de demarcación, pero distinto: la traducibilidad a un lenguaje observacional
    (Hempel) y la falsabilidad (Popper).'
  trampas:
  - texto: '"La justificación de las hipótesis se realiza únicamente a través de argumentos deductivos"
      como tesis compartida.'
    error: hecho_equivocado
    por_que: Es solo de Popper; Hempel usa también la inducción para confirmar.
  - texto: '"La justificación de las hipótesis requiere argumentos deductivos e inductivos" como tesis
      compartida.'
    error: hecho_equivocado
    por_que: Es de Hempel; Popper rechaza la inducción en la evaluación de hipótesis.
  - texto: '"La formulación de nuevas hipótesis se realiza por medio de la inducción."'
    error: concepto_vecino
    por_que: 'Ninguno lo sostiene: para los dos, la invención de hipótesis no se reconstruye lógicamente.'
  - texto: '"La ciencia progresa aproximándose a la verdad" como tesis solo de Popper.'
    error: hecho_equivocado
    por_que: La sostienen los dos; la diferencia está en cómo se progresa.
  - texto: '"La ciencia progresa mediante la justificación inductiva de sus hipótesis" como tesis de Popper.'
    error: hecho_equivocado
    por_que: Es la visión de Hempel; Popper rechaza la confirmación inductiva.
  - texto: '"No hay un desarrollo continuo y progresivo del conocimiento científico."'
    error: concepto_vecino
    por_que: 'Ninguno de los dos lo sostiene: ambos ven un desarrollo continuo; la idea de rupturas es
      de Kuhn.'
  - texto: '"Es posible verificar una hipótesis universal mediante la observación."'
    error: concepto_vecino
    por_que: 'Confunde confirmar con verificar: Hempel habla de aumentar la probabilidad, no de verificar,
      y Popper lo rechaza.'
  - texto: '"El progreso científico es un proceso puramente acumulativo de teorías verdaderas" o "Todo
      enunciado no científico es sin sentido" como tesis compartidas.'
    error: hecho_equivocado
    por_que: 'Popper no sostiene ninguna de las dos: rechaza la acumulación por confirmación y no dice
      que lo no científico carezca de sentido.'
  pregunta_guia: ¿Qué piensan los dos sobre cómo se inventan las hipótesis y qué pasa cuando una contrastación
    sale mal? ¿En qué se separan cuando la contrastación sale bien?
  explicacion_modelo: 'Una tesis compartida es que, cuando la contrastación no es favorable, la hipótesis
    queda refutada: los dos analizan la contrastación con el modelo hipotético-deductivo y el modus tollens.
    También comparten que la invención de hipótesis no se reconstruye lógicamente. La diferencia está
    en la contrastación favorable: para Hempel confirma por inducción; para Popper no confirma, y la ciencia
    avanza eliminando teorías falsas. Tienta "la justificación es únicamente deductiva", pero eso es solo
    de Popper.'
  recurso_ubaxxi: pendiente
  preguntas:
  - q-7b8d0d09
  - q-02b0d8ed
  estado: borrador
  notas: Que Popper no considera "sin sentido" los enunciados no científicos y que la idea de un desarrollo
    discontinuo es de Kuhn son datos generales; las explicaciones oficiales no lo dicen. Validar cómo
    lo plantea la cátedra.
- id: kuhn.anomalias-y-crisis
  eje: conceptos
  autor: Thomas Kuhn
  fuente: Material de la cátedra (capítulo pendiente)
  tema: Anomalías, crisis y abandono del paradigma
  afirmacion: 'Para Kuhn, las anomalías son problemas que no pueden resolverse en el marco del paradigma
    vigente. Una sola no produce la crisis: la crisis llega cuando las anomalías persisten, se generalizan
    y se radicalizan, y ni siquiera la crisis termina siempre en el abandono del paradigma.'
  puntos:
  - Las anomalías son casos y experiencias problemáticas que no pueden resolverse en el marco del paradigma
    vigente.
  - 'No son irrelevantes: al acumularse pueden generar una crisis que lleve a un cambio de paradigma.'
  - Una sola anomalía no alcanza para la crisis, porque la comunidad podría transformarla en un enigma,
    un problema resoluble con los recursos del paradigma.
  - La crisis sobreviene cuando las anomalías persisten, se generalizan y se radicalizan, y generan escepticismo
    sobre la viabilidad del paradigma.
  - 'No toda crisis culmina en el reemplazo del paradigma: puede aparecer una vía no explorada que permita
    recuperar la confianza.'
  - 'Las anomalías no son pruebas definitivas de falsedad: los paradigmas no se consideran falsos ni se
    abandonan automáticamente.'
  trampas:
  - texto: '"Las anomalías son problemas fácilmente resolubles con las herramientas del paradigma vigente."'
    error: concepto_vecino
    por_que: Eso describe a los enigmas; las anomalías son justamente los problemas que el paradigma no
      logra resolver.
  - texto: '"Las anomalías son pruebas definitivas de la falsedad del paradigma."'
    error: concepto_vecino
    por_que: Es una lectura de refutación al estilo de Popper; para Kuhn los paradigmas no se declaran
      falsos ni se abandonan automáticamente.
  - texto: '"Las anomalías son irrelevantes para el desarrollo de la ciencia."'
    error: cambio_de_palabra
    por_que: 'Es al revés: al acumularse son las que pueden llevar a la crisis y al cambio de paradigma.'
  - texto: '"Es falso porque la crisis se produce cuando hay muchos enigmas sin resolver."'
    error: concepto_vecino
    por_que: El veredicto está bien, pero confunde enigmas con anomalías.
  - texto: '"Es falso porque las anomalías son problemas que el paradigma enfrenta con sus herramientas."'
    error: concepto_vecino
    por_que: El veredicto está bien, pero define a la anomalía como si fuera un enigma.
  - texto: '"Es verdadero porque la aparición de una anomalía genera la pérdida de confianza en el paradigma
      vigente."'
    error: media_verdad
    por_que: 'Las anomalías erosionan la confianza, pero una sola no alcanza: tienen que generalizarse
      y radicalizarse.'
  - texto: '"Es verdadero porque las anomalías se definen como los problemas que el paradigma vigente
      no puede resolver."'
    error: media_verdad
    por_que: La definición es correcta, pero de ahí no se sigue el abandono inmediato del paradigma.
  - texto: '"...los científicos pierden inmediatamente la confianza en el paradigma."'
    error: absoluto_falso
    por_que: 'El "inmediatamente" es el error: la pérdida de confianza es gradual y la crisis puede revertirse.'
  pregunta_guia: ¿Qué diferencia a una anomalía de un enigma? ¿Alcanza con una anomalía para que haya
    crisis, y la crisis termina siempre en un paradigma nuevo?
  explicacion_modelo: 'Es falso que la crisis llegue apenas aparece una anomalía. Para Kuhn, una anomalía
    es un problema que el paradigma no puede resolver, pero una sola no alcanza: la comunidad todavía
    puede convertirla en un enigma. La crisis llega cuando las anomalías persisten, se generalizan y se
    radicalizan, y aun así no siempre termina en el abandono del paradigma. Tienta "es verdadero porque
    una anomalía genera la pérdida de confianza": parte de algo cierto, pero le da a una sola anomalía
    un efecto que solo tienen muchas.'
