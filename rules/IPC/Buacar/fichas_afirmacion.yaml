- id: feminismo.punto-de-vista
  eje: conceptos
  autor: Epistemología feminista
  fuente: Material de la cátedra (capítulo pendiente)
  tema: La teoría feminista del punto de vista
  afirmacion: 'La teoría del punto de vista sostiene la primacía epistémica de la perspectiva de las mujeres
    (y de otros grupos oprimidos) sobre la perspectiva dominante de los varones: por su situación tienen
    un acceso privilegiado a las relaciones sociales opresivas y pueden mostrar que no son naturales ni
    necesarias, sino históricas y contingentes, y por eso modificables.'
  puntos:
  - La perspectiva de las mujeres, y en general de otros grupos oprimidos, tiene primacía epistémica sobre
    la perspectiva dominante de los varones.
  - Es verdadero que la situación social de las mujeres, como grupo desfavorecido, les da un acceso epistémicamente
    privilegiado a los objetos de conocimiento social y político.
  - Es verdadero que incluir las perspectivas de las mujeres en los estudios de género favorece la detección
    de las desigualdades.
  - Es falso que, al estudiar las desigualdades de género, las perspectivas de mujeres y varones puedan
    alcanzar profundidades semejantes.
  - La perspectiva de las mujeres revela las regularidades fundamentales que subyacen a los fenómenos
    sociales en los que interviene el género; la perspectiva dominante solo capta regularidades superficiales.
  - Lo que desde la perspectiva dominante parece natural y necesario, desde la de las oprimidas se ve
    contingente e histórico.
  - El privilegio vale cuando se estudian los fenómenos sociales que involucran al grupo desfavorecido,
    no en cualquier tema.
  - 'Tesis del punto de vista que el empirismo feminista rechaza: solo la perspectiva de las mujeres permite
    mostrar que las desigualdades de género no son naturales, sino construidas social y culturalmente.'
  - El empirismo feminista, en cambio, sostiene que la elección de teorías depende de la evidencia y la
    lógica, y que una comunidad científica plural y abierta a la discusión posibilita la objetividad.
  trampas:
  - texto: '"En el estudio de cualquier tema la opinión de las mujeres es epistémicamente superior a la
      de otros grupos."'
    error: absoluto_falso
    por_que: El privilegio se limita a los fenómenos sociales que involucran al grupo desfavorecido, no
      a cualquier tema.
  - texto: '"La detección de las desigualdades está garantizada por el método científico" o "la profundidad
      es semejante gracias al método científico".'
    error: concepto_vecino
    por_que: Supone un método neutral que iguala a todos; para el punto de vista, la posición social de
      quien conoce sí importa.
  - texto: '"Las desigualdades de género son evidentes, por lo que varones y mujeres las pueden detectar
      por igual."'
    error: verdad_general
    por_que: Suena razonable, pero para el punto de vista la perspectiva dominante ve como natural lo
      que es opresivo.
  - texto: '"La profundidad de los estudios está en función de los valores personales y no del grupo al
      que se pertenece."'
    error: concepto_vecino
    por_que: Lo que da el privilegio es la posición social del grupo, no los valores de cada persona.
  - texto: '"Los puntos de vista de los varones y de las mujeres son incomparables."'
    error: dato_inventado
    por_que: 'La teoría sí los compara: uno capta las regularidades fundamentales y el otro, solo las
      superficiales.'
  - texto: '"La participación de sujetos diversos favorece la objetividad al someter los sesgos a la crítica
      en una comunidad plural" o "la lógica y la evidencia bastan para elegir entre teorías".'
    error: concepto_vecino
    por_que: Son tesis del empirismo feminista, no del punto de vista.
  - texto: '"La identidad es cambiante y debe rechazarse una categoría unificada como la mujer" o "las
      mujeres no poseen una perspectiva unificada".'
    error: concepto_vecino
    por_que: Niega la perspectiva común de las mujeres, que es justamente en lo que se apoya el punto
      de vista.
  - texto: '"La ciencia debe alcanzar una representación única de la realidad con evidencia neutral e
      independiente del sujeto."'
    error: concepto_vecino
    por_que: 'Es la idea tradicional de objetividad que el punto de vista discute: para esta teoría la
      situación del sujeto sí cuenta.'
  pregunta_guia: ¿Por qué, para esta teoría, quien ocupa una posición desfavorecida ve algo que la perspectiva
    dominante no ve? ¿En qué temas vale ese privilegio?
  explicacion_modelo: Es falso que mujeres y varones puedan alcanzar profundidades semejantes al estudiar
    las desigualdades de género. Para la teoría del punto de vista, la perspectiva de las mujeres como
    grupo desfavorecido revela las regularidades fundamentales de esos fenómenos, mientras que la dominante
    solo capta las superficiales, porque ve como natural lo que es histórico. Tienta la opción del pluralismo
    y la crítica dentro de una comunidad diversa, pero esa es la tesis del empirismo feminista, no la
    del punto de vista.
  recurso_ubaxxi: pendiente
