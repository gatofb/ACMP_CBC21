  q-9440cc21:
    - fuente: 32d6de6617
      enunciado: >-
        Read the following statement and determine which of the following options explains the phenomenon in
        terms of Darwin's theory of natural selection.

        Owls have very powerful vision.
      opciones:
        A: >-
          For successive generations of the owls' ancestors, exercising their vision was indispensable for
          hunting; this made them acquire increasingly better vision over the course of their lives and pass
          that trait on to their descendants.
        B: >-
          Among the owls' ancestors, those with more powerful vision turned out to be fitter to feed and
          reproduce, which produced a greater presence of that trait among their descendants.
        C: >-
          Owls were created following an archetype common to all nocturnal birds of prey; since all birds
          belonging to that class must be effective at predatory flight, they have powerful vision.
        D: >-
          Having powerful vision represents the highest degree in the evolutionary line of animals; for that
          reason, at each evolutionary stage owls keep improving this trait and their vision becomes more and
          more powerful.
      explicacion: >-
        In this exercise you are asked to identify the Darwinian explanation of a specific trait. What is
        characteristic of explanations by natural selection is that they relate the effectiveness of traits in
        performing certain functions in a given environment to the fitness of the organism that has those
        traits. The fitter organisms, in turn, leave more offspring than the less fit ones, so that over
        successive generations the proportion of organisms showing those adaptive traits increases.
  q-f4377362:
    - fuente: 7222f8f4b6
      enunciado: >-
        A. Determine whether the following statement belongs to the domain of empirical science according to
        the position of falsificationism.

        Parallel lines never meet.
      opciones:
        A: 'Yes'
        B: 'No'
      explicacion: >-
        In this exercise you are asked to determine whether the statement belongs to the domain of empirical
        science according to the position of falsificationism. To do so, keep in mind that according to this
        school of thought, for a statement to belong to the domain of empirical science it must be
        falsifiable, that is, it must have empirical content and it must be possible to formulate against it
        basic statements that function as potential falsifiers. Remember that potential falsifiers are
        existential, singular statements that are incompatible with the hypothesis and logically possible. It
        follows from the above that some statements or claims are not falsifiable: (i) the statements of the
        formal sciences, (ii) metaphysical claims, and (iii) probabilistic statements. The statement in this
        exercise belongs to the formal sciences.
