  q-74fb6847:
    - fuente: c93cd62a75
      enunciado: >-
        Given the following argument, determine which are the premises and which is the conclusion.

        If the polar glaciers are melting, then the sea level in Argentina rises. It follows that the sea
        level in Argentina rises, because the polar glaciers are melting.
      opciones:
        A: |-
          Premise: If the polar glaciers are melting, then the sea level in Argentina rises.
          Premise: Because the polar glaciers are melting.
          Conclusion: It follows that the sea level rises.
        B: |-
          Premise: If the polar glaciers are melting, then the sea level in Argentina rises.
          Premise: The sea level in Argentina rises.
          Conclusion: The polar glaciers are melting.
        C: |-
          Premise: If the polar glaciers are melting, then the sea level in Argentina rises.
          Premise: The polar glaciers are melting.
          Conclusion: The sea level in Argentina rises.
        D: |-
          Premise: The polar glaciers are melting.
          Premise: The sea level in Argentina rises.
          Conclusion: If the polar glaciers are melting, then the sea level in Argentina rises.
      explicacion: >-
        To identify the answer, it is important to remember that there are certain expressions that, when
        present, help us identify the premises and the conclusion of an argument; in the book we call them
        premise indicators and conclusion indicators, respectively. In the given argument we find "because" as
        a premise indicator and "it follows that" as a conclusion indicator. It is important to remember two
        things: (i) both the premises and the conclusion must be stated in full, and (ii) indicators are never
        part of the premises or the conclusion (for these two reasons option 1 is incorrect).
  q-6a806735:
    - fuente: 4a8fb874fa
      enunciado: >-
        A. Determine whether the argument in exercise 1 is deductive (D) or inductive (I).

        Argument in exercise 1: If the polar glaciers are melting, then the sea level in Argentina rises. It
        follows that the sea level in Argentina rises, given that the polar glaciers are melting.
      opciones:
        A: Deductive (D)
        B: Inductive (I)
      explicacion: >-
        Deductive arguments can be recognized in different ways. On the one hand, because if we assume that
        both premises are true, the conclusion is necessarily true. On the other hand, we can look at their
        structure: if we recognize one of the structures presented in the reading material, such as Modus
        Ponens, Modus Tollens, hypothetical syllogism, etc., we know we are dealing with a valid form. As for
        inductive arguments, it is conceivable that the premises are true and the conclusion is not. If we
        look at their structure and recognize one of the structures presented in the material, such as the
        inductive argument by incomplete enumeration, by analogy, or the inductive syllogism, we know we are
        dealing with an invalid form. In this case the argument is a deductive argument, specifically a Modus
        Ponens, so its premises establish the conclusion conclusively.
