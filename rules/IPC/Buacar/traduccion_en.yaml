  q-721c81e6:
    - fuente: 59fa04dd31
      enunciado: >-
        Given the following argument, indicate which statements play the role of premises. Select two options.

        If Brazil is the country with the most World Cups won, then it won 5 World Cups. Indeed, if it is the
        country with the most World Cups won, then it is the only one that won on 4 continents. And if Brazil
        is the only country that won on 4 continents, then it won 5 World Cups.
      opciones:
        A: If Brazil is the only country that won on 4 continents, then it won 5 World Cups.
        B: If Brazil is the country with the most World Cups won, then it won 5 World Cups.
        C: >-
          If Brazil is the country with the most World Cups won, then it is the only one that won on 4
          continents.
        D: If Brazil won 5 World Cups, then it is the country with the most World Cups won.
      explicacion: >-
        To identify the answer, it is important to remember that there are certain expressions that, when
        present, help us identify the premises and the conclusion of an argument; in the book we call them
        premise indicators and conclusion indicators, respectively. In the given argument we find "indeed" and
        "and" as premise indicators. It is important to remember two things: (i) both the premises and the
        conclusion must be stated in full, and (ii) indicators never form part of the premises or the
        conclusion.
  q-d90510cf:
    - fuente: 5567f56c6b
      enunciado: >-
        Determine whether the argument in exercise 1 is deductive (D), inductive by analogy (A), inductive by
        incomplete enumeration (E), or an inductive syllogism (S).

        Argument in exercise 1: If Brazil is the country with the most World Cups won, then it won 5 World
        Cups. Indeed, if it is the country with the most World Cups won, then it is the only one that won on 4
        continents. And if Brazil is the only country that won on 4 continents, then it won 5 World Cups.
      opciones:
        A: Deductive (D)
        B: Inductive by analogy (A)
        C: Inductive by incomplete enumeration (E)
        D: Inductive syllogism (S)
      explicacion: >-
        Deductive arguments can be recognized in different ways. On the one hand, because if we assume that
        their premises are true, the conclusion cannot be false. On the other hand, we can pay attention to
        their structure: if we recognize one of the forms presented in the reading material, such as Modus
        Ponens, Modus Tollens, hypothetical syllogism, etc., we know that we are dealing with a valid
        argument. In contrast, in inductive arguments, the premises can be true and, even so, the conclusion
        can turn out to be false. Although they are not valid, the premises offer a certain degree of support
        or probability to the conclusion. If we pay attention to their structure and recognize one of the
        structures presented in the material, such as the inductive argument by incomplete enumeration, by
        analogy, or the inductive syllogism, we know that we are dealing with an inductive argument. In this
        case it is a deductive argument, specifically a hypothetical syllogism, so its premises establish the
        conclusion conclusively.
  q-59e6a878:
    - fuente: 82dc3180a7
      enunciado: >-
        Determine whether the argument in exercise 1 is deductive (D), inductive by analogy (A), inductive by
        incomplete enumeration (E) or an inductive syllogism (S).

        Argument in exercise 1: If Brazil is the country with the most World Cups won, then it won 5 World
