        on 4 continents. And if Brazil is the only country that has won on 4 continents, then it won 5 World
        Cups.

        Select the option that justifies your answer.
      opciones:
        A: >-
          Because it starts from a statistical or probabilistic statement and a case, from which it is
          inferred that the case conforms to what the statistical generalization establishes.
        B: >-
          Because the premises start from the similarity among several cases with respect to one or more
          properties, and then it is inferred that one of those cases also has another property that the
          others share.
        C: Because the premises establish the conclusion conclusively.
        D: >-
          Because the premises enumerate a series of cases in which a certain phenomenon is verified, and on
          that basis it is generalized to all cases of that type.
      explicacion: >-
        Deductive arguments can be recognized in different ways. On the one hand, because if we assume that
