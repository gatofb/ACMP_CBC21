  q-a87176ed:
    - fuente: 59a531517a
      enunciado: >-
        After classifying the different types of inductive arguments, we established specific criteria for
        evaluating them. With this in mind, determine which premise strengthens the following inductive
        argument without it ceasing to be an inductive argument by incomplete enumeration.

        The mammoth and the woolly rhinoceros, like the mastodon, were predators. Therefore, it is probable
        that all large animals of the Ice Age were predators, given that the mammoth, the woolly rhinoceros
        and the mastodon were large animals of the Ice Age.
      opciones:
        A: >-
          The mammoth, the woolly rhinoceros and the mastodon are the only three species of large animals of
          the Ice Age.
        B: The megatherium was not a predator.
        C: The saber-toothed tiger, which was a large animal of the Ice Age, was a predator.
        D: The cave hyena was a predatory animal.
      explicacion: >-
        An inductive argument by incomplete enumeration starts from the presence of a property in a sample and
        concludes that this property is present in the whole set to which the cases in that sample belong. The
        strongest inductive argument will be the one in which the sample from which the conclusion generalizes
        is the largest. Keep in mind that, for the argument to remain inductive, the sample cannot be the same
        as the set over which the generalization is made.
