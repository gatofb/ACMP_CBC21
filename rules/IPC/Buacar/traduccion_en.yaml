  q-07ec65d4:
    - fuente: a22e943d61
      enunciado: >-
        Read the following statement and determine which of the following options explains the phenomenon
        based on Lamarck's theory.

        Owls have very powerful vision.
      opciones:
        A: >-
          Among the ancestors of owls, those with more powerful vision turned out to be fitter to feed and
          reproduce, which produced a greater presence of that trait among their descendants.
        B: >-
          Owls were created following an archetype common to all nocturnal birds of prey; since all birds
          belonging to that class must be effective at predatory flight, they have powerful vision.
        C: >-
          For the successive generations of the ancestors of owls, exercising their vision was indispensable
          for hunting; this made them acquire increasingly better vision over the course of their lives and
          pass that trait on to their descendants.
        D: >-
          The traits of owls vary randomly over the years. At some point, by chance, owls with more powerful
          vision appeared, which represented an advantage for survival. For that reason, that trait was passed
          on to successive generations.
      explicacion: >-
        In this exercise you are asked to identify the Lamarckian explanation of a specific trait. The
        Lamarckian theory of evolution recognizes two general mechanisms: the general tendency toward
        complexity and the inheritance of characteristics acquired through use or disuse. In this case,
        Lamarck would hold that the reason why certain organisms present a greater degree of complexity than
        others is due to the general tendency. As time goes by, all species become more complex regardless of
        the environment.
  q-fad053d0:
    - fuente: b3ed3191cd
      enunciado: >-
        Given the following argument, determine which are the premises and which is the conclusion.

        We can infer that if fossil fuels are burned, the temperature rises. In the first place, if fossil
        fuels are burned, the emission of greenhouse gases increases. In the second place, if the emission of
        greenhouse gases increases, the temperature rises.
      opciones:
        A: |-
          Premise: If the emission of greenhouse gases increases, the temperature rises.
          Premise: If fossil fuels are burned, the temperature rises.
          Conclusion: If fossil fuels are burned, the emission of greenhouse gases increases.
        B: |-
          Premise: If fossil fuels are burned, the emission of greenhouse gases increases.
          Premise: If the emission of greenhouse gases increases, the temperature rises.
          Conclusion: If fossil fuels are burned, the temperature rises.
        C: |-
          Premise: If fossil fuels are burned, the emission of greenhouse gases increases.
          Premise: If fossil fuels are burned, the temperature rises.
          Conclusion: If the emission of greenhouse gases increases, the temperature rises.
        D: |-
          Premise: In the first place, if fossil fuels are burned, the emission of gases increases.
          Premise: In the second place, if the emission of gases increases, the temperature rises.
          Conclusion: We can infer that if fossil fuels are burned, the temperature rises.
      explicacion: >-
        To identify the answer, it is important to remember that there are certain expressions that, when
        present, help us identify the premises and the conclusion of an argument; in the book we call them
        premise indicators and conclusion indicators, respectively. In the given argument we find "in the
        first place" and "in the second place" as premise indicators, and we have "we can infer that" as a
        conclusion indicator. It is important to remember two things: (i) both the premises and the conclusion
        must be stated in full, and (ii) indicators never form part of the premises or the conclusion (for
        these two reasons option 4 is incorrect).
  q-5099e342:
    - fuente: 2c9631a686
      enunciado: >-
        A. Determine whether the argument in exercise 1 is deductive (D) or inductive (I).

        Argument in exercise 1: We can infer that if fossil fuels are burned, the temperature rises. In the
        first place, if fossil fuels are burned, the emission of greenhouse gases increases. In the second
        place, if the emission of greenhouse gases increases, the temperature rises.
      opciones:
        A: Deductive (D)
        B: Inductive (I)
      explicacion: >-
        Deductive arguments can be recognized in different ways. On the one hand, because if we assume that
        both premises are true, the conclusion is necessarily true. On the other hand, we can look at their
        structure: if we recognize one of the structures presented in the reading material, such as Modus
        Ponens, Modus Tollens, hypothetical syllogism, etc., we know we are dealing with a valid form. As for
        inductive arguments, it is conceivable for the premises to be true and the conclusion not. If we look
        at their structure and recognize one of the structures presented in the material, such as the
        inductive argument by incomplete enumeration, by analogy, or the inductive syllogism, we know we are
        dealing with an invalid form. In this case the argument is a deductive argument, specifically a
        hypothetical syllogism, so its premises conclusively establish the conclusion.
  q-e914110f:
