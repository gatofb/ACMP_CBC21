  q-a2d4caaa:
    - fuente: d65b29f97a
      enunciado: |-
        Given the explanandum: This fish laid roe in the river.
        Complete the following explanation so that it is a deductive-nomological explanation.
        L (law):
      opciones:
        A: Most salmon lay roe in the river.
        B: If this fish is in its reproductive stage, then it laid roe in the river.
        C: This fish is a salmon.
        D: This fish is in its reproductive stage.
        E: Salmon lay roe in rivers.
      explicacion: >-
        According to the covering-law model, the explanans will contain at least one law. In this case, since
        it is a deductive-nomological explanation, that law must be universal. In addition, those laws will be
        accompanied by statements describing the initial or antecedent conditions (the specific factors that
        were sufficient for the phenomenon in question to occur). In this case, to explain why "this fish laid
        roe in the river", the only pair of statements that can function as law and antecedent condition are
        "Salmon lay roe in rivers" and "This fish is a salmon", respectively. On the other hand, remember that
        laws are general statements that describe an empirically verified regularity. For that reason, a
        conditional statement about an individual, like the one in option 2, is not a law and cannot be part
        of an explanation of this kind.
  q-5493accd:
    - fuente: 9e1504e9db
      enunciado: |-
        Given the explanandum: This fish laid roe in the river.
        Complete the following explanation so that it becomes a deductive-nomological explanation.
        AC (antecedent condition):
      opciones:
        A: Most salmon lay roe in the river.
        B: If this fish is in its reproductive stage, then it laid roe in the river.
        C: This fish is a salmon.
        D: This fish is in its reproductive stage.
        E: Salmon lay roe in rivers.
      explicacion: >-
        According to the covering-law model, the explanans will contain at least one law. In this case, since
        it is a deductive-nomological explanation, that law must be universal. In addition, these laws will be
        accompanied by statements describing the initial or antecedent conditions (the specific factors that
        were sufficient for the phenomenon in question to occur). In this case, to explain why "this fish laid
        roe in the river", the only pair of statements that can work as the law and the antecedent condition
        are "Salmon lay roe in rivers" and "This fish is a salmon", respectively. Also, remember that laws are
        general statements describing an empirically verified regularity. For this reason, a conditional
        statement about an individual, like the one in option 2, is not a law and cannot be part of an
        explanation of this type.
  q-168b899e:
    - fuente: 13ed608c5b
      enunciado: |-
        Complete the following sentence so that the statement is correct according to Kuhn's epistemology.
        Anomalies in normal science are...
      opciones:
        A: >-
          problematic cases and experiences that cannot be resolved within the framework of the prevailing
          paradigm.
        B: irrelevant to the development of science.
        C: definitive proof that the paradigm is false.
        D: problems easily solved with the tools of the prevailing paradigm.
      explicacion: >-
        According to Kuhn's epistemology, anomalies are problems or phenomena that cannot be resolved within
        the framework of the prevailing paradigm and that, as they accumulate, can produce a crisis leading to
        a paradigm change. Anomalies are not irrelevant. Quite the opposite: they are fundamental to the
        dynamics of scientific change. They are not "definitive proof of falsity", because paradigms are not
        regarded as false, nor are they automatically abandoned, when certain problems appear.
  q-d1980388:
    - fuente: 873476384d
      enunciado: >-
        Read the following case and determine which type of manifestation of androcentrism and sexism in
        science it is.

        Sophie Germain (1776-1831) was a brilliant French mathematician. Her work includes a first step toward
        a solution of Fermat's last theorem, a detailed study of the mathematical rules governing the behavior
        of vibrations on elastic materials, and various exchanges with the greatest mathematicians of her time
        (including Karl Friedrich Gauss and Adrien Marie Legendre). Despite her great recognition and the
        successes she achieved, Germain's career was marked by the obstacles that the society of her time
        placed on her: she was never able to study at formal educational institutions, which were reserved
        exclusively for men, so she was self-taught in mathematics and had to seek private tutors to deepen
        her knowledge. Her family did everything possible to keep her from pursuing her passion, even leaving
        her without light, heating and clothes at night so that she could not study, not even in secret.
      opciones:
        A: Sexist theories
        B: Sexist applications
        C: Exclusion and marginalization
        D: Selective omissions in the history of science/Matilda effect
      explicacion: >-
        Androcentrism and sexism in science show up in various ways. The exercise deals with the manifestation
        we call "exclusion and marginalization": feminist historians, sociologists and anthropologists have
        shown that throughout history women have been denied the possibility of training for and practicing
        scientific activity. Sometimes this exclusion is explicit and legal, such as prohibitions on studying
        at university and practicing scientific activity. There are also less explicit forms of exclusion,
        such as the social belief that there are "men's" and "women's" careers. And even when women manage to
        enter a scientific career without obstacles, they often suffer other forms of marginalization: for
        example, advancing academically less than their male peers even with the same merits.
  q-5da98e52:
    - fuente: bbdbba920b
      enunciado: >-
        Indicate which of the following statements expresses a thesis held by feminist standpoint theory and,
        at the same time, rejected by feminist empiricism.
      opciones:
        A: Women do not have a unified perspective by virtue of being women.
        B: >-
          Only women's perspective makes it possible to show that gender inequalities are not natural but
          socially and culturally constructed.
        C: >-
          Pluralism and intersubjective criticism within the scientific community make it possible to detect
          biases in research.
        D: Logic and evidence are sufficient tools for choosing between rival theories.
      explicacion: >-
        Standpoint theory starts from the epistemic primacy of women's perspective (and in general that of
        other oppressed groups) over the dominant perspective of men. The reason for this primacy is that
        women have privileged access to the oppressive social relations in which they are collectively
        embedded and are able to show that these oppressive relations are the result not of nature and
        necessity but of contingent history, and can therefore be changed. Feminist empiricism, by contrast,
        holds that theory choice depends on the available evidence and the logic of scientific research, as
        the logical empiricists held. In addition, feminist empiricists recognize that a plural scientific
        community open to discussion makes scientific objectivity possible.
  q-cf764045:
    - fuente: 0df92ea4a2
      enunciado: >-
        Read the following description of a research project and decide whether practicism would give priority
        to funding it, and why.

        A team of researchers from the Instituto de Agrobiotecnología del Litoral (IAL), which depends on
        CONICET and the Universidad Nacional del Litoral, in collaboration with the Ministerio de Ciencia,
        Tecnología e Innovación, has developed a drought-tolerant genetically modified variety of wheat known
        as "HB4". This development was approved for cultivation and consumption after validation by regulatory
        agencies. The project will strengthen the country's position in technological innovation and will help
        sustain production as part of a strategy for adapting to climate change.
      opciones:
        A: >-
          No, because developments of this kind respond to economic and productive interests, which should not
          be the priority of science.
        B: >-
          Yes, because the development of HB4 wheat has a direct impact on agricultural production and
          responds to concrete needs of society.
        C: >-
          Yes, because developing genetically modified wheat varieties contributes to broadening our knowledge
          of the genetic structure of food.
        D: >-
          No, because developing genetically modified wheat varieties does not contribute to the advancement
          of basic science, which should be given priority.
      explicacion: >-
        The practicist perspective holds that funding for applied science should be prioritized, since science
        must be explicitly at the service of society. Therefore, from this point of view, scientific research
        must contribute directly to solving practical problems linked to the country's economic and social
        development. In the case presented, the development mentioned contributes directly to these goals.
  q-1bf58062:
    - fuente: 32d6abe706
      enunciado: >-
        Given the following set of statements:

        Premise 1: ..............................................................

        Premise 2: Studying giant worms in underground ecosystems makes it possible to better understand the
        biodiversity and evolution of unknown species.

        Conclusion: It is right to invest public resources in researching giant worms in underground
        ecosystems.

        Select which of the following statements is the implicit value premise needed for the evaluative
        judgment stated in the conclusion to follow.
      opciones:
        A: It is right to research unknown species if this helps us better understand life on the planet.
        B: >-
          It is right to invest public resources to better understand the biodiversity and evolution of
          unknown species.
        C: Public investment in science should focus on protecting the environment.
        D: >-
          Investing public resources makes it possible to better understand the biodiversity and evolution of
          unknown species.
      explicacion: >-
        In an argument whose conclusion is a normative claim, the premises must include a value premise (that
        is, a value judgment) and not only factual judgments, so that we do not end up with a leap from what
        "is" to what "ought to be". In the exercise, options 1, 2 and 3 are value judgments. However, option 2
        ("it is right to invest public resources to better understand the biodiversity and evolution of
        unknown species") is the only one that, together with premise 2 of the prompt, allows the conclusion
        to be inferred. From the other two normative options, the specific duty to "invest public resources in
        researching giant worms in underground ecosystems" cannot be deduced. Finally, option 4 is not a value
        judgment, so if we tried to infer a normative conclusion from it (and premise 2), we would commit a
        "naturalistic fallacy".
