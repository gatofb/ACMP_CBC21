preguntas:
  q-7766f581:
    - fuente: e1405c1a66
      enunciado: >-
        A. We began Unit 1 by characterizing arguments. With this in mind, determine whether the following
        passage is an argument.

        If a mammoth had a lot of hair, then it lived in a cold environment. The Columbian mammoth did not
        live in cold environments and, therefore, it did not have a lot of hair.
      opciones:
        A: 'YES'
        B: 'NO'
      explicacion: >-
        In this exercise you are asked to determine whether the passage is an argument. To do so, it is
        important to keep in mind that every argument contains statements offered as reasons (the premises) in
        support of another statement that is meant to be concluded or established (the conclusion). Remember
        that certain expressions, when present, help us distinguish the premises from the conclusion. In the
        course textbook we call them “premise indicator” and “conclusion indicator”. In this case, the
        indicator "therefore" helps identify the conclusion.
  q-1123838a:
