        two arguments do not correspond to either of these types: the one that starts from "all the Indigenous
        peoples…" is a deductive argument, and the one that concludes that "all the Indigenous peoples of
        South America developed complex agricultural techniques" is an inductive argument by incomplete
        enumeration.
