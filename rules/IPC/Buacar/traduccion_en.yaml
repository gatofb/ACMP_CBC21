  q-761bfbac:
    - fuente: 09c6875bc0
      enunciado: >-
        Read the following newspaper excerpt. Taking into account the debates on scientific ethics, determine
        which of the options is most representative of the scientistic position.

        Various neuroscience studies have shown that when people are exposed to unpredictable rewards, their
        levels of dopamine, a key neurotransmitter related to pleasure and motivation, increase significantly
        compared to when they are exposed to predictable rewards. Unpredictability generates a greater sense
        of anticipation and excitement, which motivates people to keep seeking the next reward, even if it is
        uncertain. These findings have been applied, for example, in the design of apps and video games that
        incorporate unpredictable reward mechanisms, such as "chests" (loot boxes), with the aim of keeping
        users or players more “hooked.” However, some experts warn that these kinds of strategies can produce
        addictive behaviors, similar to those observed in people with gambling addiction (ludopathy).
      opciones:
        A: >-
          The discoveries made by neuroscientists about the reward system and the functions of dopamine
          represent great advances in our understanding of the brain. However, if these findings are used by
          companies to design apps or video games for ethically questionable purposes, such as keeping the
          user hooked longer by exploiting their brain vulnerabilities, the responsibility lies exclusively
          with these companies. Scientists should not take responsibility for the later or potential uses of
          their discoveries, since their role is solely to produce knowledge.
        B: >-
          Neuroscientific research aimed at better understanding the brain's reward system and the role of
          dopamine has facilitated the development of apps and video games with potentially addictive effects,
          which puts users' mental health at risk. It is not possible to separate the development of
          scientific research from its possible applications, and scientists cannot evade responsibility if
          the results of their work are used for ethically questionable purposes.
        C: >-
          The use or misuse of knowledge about the brain's reward system coming from neuroscientific research
          must be regulated by States. As long as scientists act in accordance with the laws in force in their
          countries, they are fulfilling their ethical responsibility.
        D: >-
          Technological advances based on neuroscience studies can have a considerable impact on society, as
          when they negatively affect the mental health of users of video games or apps. Deciding which areas
          of knowledge should be prioritized in research and for what purposes they will be applied is not
          only a task for business people, scientists or technologists, but concerns all of society. Science
          and its applications must be discussed in a democratic process that includes all social sectors.
      explicacion: >-
        Scientism is the position according to which scientific knowledge is value-neutral, and values come
        into play only when we discuss the use of this knowledge. Consequently, ethical evaluation takes place
        only at the moment of application, insofar as others (companies, governments, etc.) decide to apply a
        scientific development for some purpose (in which case they become directly responsible for its
        consequences).
  q-367ffa24:
    - fuente: a0974c1cef
      enunciado: >-
        A. Indicate what type of problem relevant to scientific integrity is reflected in the case described
        below.

        ExxonMobil, one of the largest oil companies in the world, has been at the center of a controversy due
        to its knowledge and handling of information related to climate change. A recent analysis carried out
        by the publication Carbon Brief examined no fewer than 900 published articles, all of which cast doubt
        on climate change, or even deny that it exists. After concluding this investigation, they found that 9
        out of 10 of the most prolific authors had some kind of connection with Exxon Mobil. The results
        showed that, of the 938 articles cited, 186 had been written by only ten men, and prominent among them
        was Dr. Sherwood B. Idso, lead author of 67 of them. Idso is the president of the Center for the Study
        of Carbon Dioxide and Global Change, a think tank funded by ExxonMobil. The second most prolific was
        Dr. Patrick J. Michaels, a member of the Cato Institute, which receives approximately 40% of its
        funding from the oil industry.
      opciones:
        A: Access to information
        B: Perverse incentives
        C: Peer review
        D: Conflicts of interest
      explicacion: >-
        Conflicts of interest arise when research is funded by a person or organization that has its own
        interest in the research producing a particular result. This is what happened in this case. Nowadays
        it is common for scientists to declare where they obtained their funding, but this alone is not enough
        to rule out conflicts of interest, because it is not easy to know the interests of the organizations
        that fund them. In any case, there is clearly an ethical problem if the results of a piece of research
        are decided in advance by the person or institution that provides the funding.
