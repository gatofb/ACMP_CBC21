        If we people emitted light through our pores, then we would be able to light up a dark room with our
        skin. But we cannot light up a room with our skin alone.
      opciones:
        A: We people would be able to light up a dark room with our skin.
        B: >-
          If we people do not emit light through our pores, then we cannot light up a room with our skin
