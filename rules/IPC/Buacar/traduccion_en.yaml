  q-02b0d8ed:
    - fuente: 64a477d75b
      enunciado: >-
        Indicate which of the following statements expresses a thesis held by Popper's falsificationism but
        rejected by the logical empiricism represented by Hempel.
      opciones:
        A: Science progresses by approaching the truth.
        B: >-
          Science progresses through the inductive justification of its hypotheses, which become more complex
          and extend their scope of application.
        C: >-
          Science progresses through the elimination of false theories, without definitively reaching the
          truth.
        D: There is no continuous and progressive development of scientific knowledge.
      explicacion: >-
        Both Popper and Hempel consider that there is a continuous development of scientific knowledge, which
        progressively approaches the truth. However, they conceive of this progress differently. According to
        the logical empiricism represented by Hempel, hypotheses can be confirmed as their probability
        increases through induction. Consequently, scientific progress consists of a cumulative process in
        which theories receive the confirmatory inductive justification that gives them a high degree of
        probability. Popper, for his part, rejects the possibility of confirming a hypothesis in this way and
        holds that, when the test is favorable, the hypothesis is provisionally accepted for having withstood
        the attempts at refutation carried out. Accordingly, in the latter case scientific progress is
        conceived as an advance (gradual but never definitive) toward the truth through the process of
        eliminating false theories.
  q-044944dd:
    - fuente: 4a538bce34
      enunciado: |-
        Determine whether the following statement is true or false and why, according to Kuhn's epistemology.
        The period of crisis sets in as soon as an anomaly appears.
      opciones:
        A: The statement is false because the crisis occurs when there are many unsolved puzzles.
        B: >-
          The statement is false because for the crisis to occur, the anomalies must become widespread and
          radicalized.
        C: The statement is true because an anomaly generates the proliferation of new rival paradigms.
        D: >-
          The statement is true because the appearance of an anomaly generates the loss of confidence in the
          prevailing paradigm.
      explicacion: >-
        An anomaly is a problem that the paradigm cannot solve. However, a single anomaly is not enough to
        cause the loss of confidence in the prevailing paradigm and bring about the crisis, since the
        scientific community could find a way to turn it into a puzzle, that is, into a problem that can be
        solved with the resources of the paradigm. It is when these anomalies persist and become radicalized
        that the crisis sets in.
  q-c0f1059d:
    - fuente: 2250aade82
      enunciado: >-
        A. Determine whether the following statement is true (T) or false (F) according to feminist standpoint
        theory.

        In the study of gender inequalities, the perspectives of women and of men can reach similar depths.
      opciones:
        A: True (T)
        B: False (F)
      explicacion: >-
        For standpoint theory, women's perspective is epistemically privileged because it reveals the
        fundamental regularities underlying the social and psychosocial phenomena in which gender is involved.
        What seems natural and necessary from the dominant perspective turns out to be contingent and
        historically given from the perspective of the oppressed. Standpoint theory starts from the epistemic
        primacy of women's perspective (and in general that of other oppressed groups) over the dominant
        perspective of men. The reason for this primacy is that women have privileged access to the oppressive
        social relations in which they are embedded and are able to show that these oppressive relations are
        not the result of nature and necessity but of contingent history, and can therefore be changed.
