  q-fc2eeff0:
    - fuente: 52a2ccef9e
      enunciado: >-
        Determine which premise serves to strengthen the following inductive argument without it ceasing to be
        an inductive argument by incomplete enumeration.

        The Qom and the Wichí, like the Aymara, maintained their ancestral languages. Therefore, it is
        probable that all the Indigenous peoples of South America have maintained their ancestral languages,
        given that the Qom, the Wichí and the Aymara are Indigenous peoples of South America.
      opciones:
        A: The Qom, the Wichí and the Aymara are the only Indigenous peoples of South America.
        B: The Quechua did not maintain their ancestral language.
        C: The Quechua, who are an Indigenous people of South America, maintained their ancestral language.
        D: The Diaguita maintained their ancestral language.
      explicacion: >-
        An inductive argument by incomplete enumeration starts from the presence of a property in a sample and
        concludes the presence of that property in the whole set to which the cases in that sample belong. The
        strongest inductive argument will be the one in which the sample from which the conclusion generalizes
        is larger. Keep in mind that, for the argument to remain inductive, the sample cannot be equal to the
        set over which the generalization is made.
  q-d67204df:
    - fuente: 7fcf6e8ca4
      enunciado: >-
        Determine whether the following statement is true (T) or false (F) according to Darwin's theory of
        natural selection.

        All the traits of organisms remain unchanged from generation to generation.
      opciones:
        A: True (T)
        B: False (F)
      explicacion: >-
        In this exercise you are asked, in part A, to determine whether a statement is true or false according
        to Darwin's theory of natural selection and then, in part B, to choose the sentence that justifies
        your answer. The statement presented is false according to Darwin's theory, and the justification is
        that there is variation among individuals of the same species, and some of those variations can be
        inherited.
  q-7b415d39:
    - fuente: e19069013b
      enunciado: >-
        Determine whether the following statement is true (T) or false (F) according to Darwin's theory of
        natural selection.

        All the traits of organisms remain unchanged from generation to generation.

        Select the option that justifies your answer.
      opciones:
        A: The traits of organisms increase the chances of survival and reproduction, and endure over time.
        B: Variations arise from an adaptive need, as a result of the use or disuse of certain organs.
        C: There are variations in traits that occur randomly, and many of them can be inherited.
        D: The traits of organisms are determined by an intelligent plan once and for all.
      explicacion: >-
        In this exercise you are asked, in part A, to determine whether a statement is true or false according
        to Darwin's theory of natural selection and then, in part B, to choose the sentence that justifies
        your answer. The statement presented is false according to Darwin's theory, and the justification is
        that there is variation among individuals of the same species, and some of those variations can be
        inherited.
  q-04a27fe1:
    - fuente: f74baedb46
      enunciado: >-
        Read the following statement and determine which of the following options explains the phenomenon
        based on Darwin's theory of natural selection.

        Penguins have short, stiff wings, which allow them to swim very efficiently.
      opciones:
        A: >-
          Penguins were designed and created to inhabit cold marine environments, which is why they have
          short, stiff wings especially suited for use in the water and for obtaining food efficiently, along
          with other bodily features aimed at that same end.
        B: >-
          Among the ancestors of penguins, those that had shorter and stiffer wings swam more efficiently and
          managed to obtain more food, so they turned out to be fitter to survive in marine environments and
          left more offspring, which inherited that trait.
        C: >-
          The current shape of penguins' wings is the result of an intentional process of selective breeding
          carried out in the past by human beings who valued the individuals fittest in the water, favoring
          their reproduction until that trait became fixed in the species.
        D: >-
          The ancestors of penguins, upon inhabiting marine environments, stopped using their wings to fly.
          Through lack of use, those structures gradually atrophied, becoming shorter. That acquired
          characteristic was then inherited by their offspring.
      explicacion: >-
        In this exercise you are asked to identify the Darwinian explanation of a specific trait. What is
        characteristic of explanations by natural selection is that they relate the effectiveness of traits in
        performing certain functions in a given environment to the fitness of the organism that has those
        traits. The fitter organisms, in turn, leave more offspring than the less fit ones, so over successive
        generations the proportion of organisms that have those adaptive traits increases.
  q-7df4ac4b:
    - fuente: 5b8a58155e
      enunciado: >-
        Given the following argument, indicate which statements play the role of premises. Select two options.

        Neurons have a specialized function, because neurons are cells and all cells have a specialized
        function.
      opciones:
        A: All cells have a specialized function.
        B: Because they are cells.
        C: Neurons have a specialized function.
        D: Neurons are cells.
      explicacion: >-
        To identify the answer, it is important to remember that certain expressions, when present, help us
        identify the premises and the conclusion of an argument. In the book we call them "premise indicators"
        and "conclusion indicators", respectively. In the given argument there is a premise indicator
        ("because"). It is important to remember two things: (i) both the premises and the conclusion must be
        stated in full, and (ii) indicators never form part of the premises or the conclusion.
  q-6d1870ff:
    - fuente: e2083fa69f
      enunciado: |-
        Given the following TRUE statements:
        - This neuron has dendrites.
        - These dendrites receive information from other neurons.
        Determine which of the following compound statements is TRUE.
      opciones:
        A: If this neuron has dendrites, then these dendrites receive information from other neurons.
        B: This neuron does not have dendrites although these dendrites receive information from other neurons.
        C: >-
          These dendrites do not receive information from other neurons or this neuron does not have
          dendrites.
        D: These dendrites do not receive information from other neurons.
      explicacion: >-
        In this exercise you had to evaluate the truth value of a conjunction, a negation, a disjunction and a
        conditional:

        1. Conjunctions can be expressed with “and”, “,”, “also”, “but”. Negations with “not”, “it is not true
        that”. Conditionals with “if… then” and disjunctions with “or”, “either… or”.

        2. Conjunctions are true only in the case where both conjuncts are true, that is, it is enough for one
        of the statements combined by the conjunction to be false for the compound statement to be false.

        3. When a sentence is true, its negation is false and, conversely, when a sentence is false, its
        negation will be true.

        4. Conditional sentences are false only when the antecedent is true and the consequent false; in all
        other cases they are true.

        5. There are two types of disjunction, inclusive and exclusive. Expressions such as “either… or”
        suggest that it is an exclusive disjunction, whereas the mere presence of an “or” leads us to think it
        is inclusive. When both parts are false, the disjunction between them is false, regardless of the type
        of disjunction involved. On the contrary, when one of the disjuncts is true and the other false, the
        disjunction is true. The case in which the two types of disjunction yield different values is the one
        in which both disjuncts are true. If the disjunction is inclusive, the compound sentence will be true;
        if it is exclusive, it will be false.

        In this case, the correct option is a conditional statement that is true since it has a true
        antecedent and a true consequent.
  q-306b5f7b:
    - fuente: 2d7b1c830c
      enunciado: |-
        Complete the following statement so that it is a tautology.
        Neurons are cells that have a nucleus...
      opciones:
        A: but they do not have one.
        B: if they have dendrites.
        C: or they do not have one.
        D: or dendrites.
      explicacion: >-
        Tautologies are those statements that are necessarily true because of the form of the statement:
        however the world may be, the statement will be true. Likewise, contradictions are necessarily false.
        Unlike tautologies and contradictions, contingencies are statements that can be true or false, but are
        not necessarily either. Statements that seem obviously true to us will be contingent if their truth
        depends on empirical matters and not on the very structure of the sentence. Thus, the statement “The
        capital of Argentina is Buenos Aires and it is located in the center of the country” is true but
        merely contingent: if the project to move the capital to Viedma had been successful, that statement
        would be false today. Similarly, the statement “Dinosaurs were reptiles and did not go extinct” is a
        false but contingent statement: if things had turned out differently, that statement could have turned
        out true today. Note that this does not happen with tautologies and contradictions: no matter how
        things had turned out, the statement “Buenos Aires is and is not the capital of Argentina” cannot be
        true because it is a contradiction, and the statement “Buenos Aires is or is not the capital of
        Argentina” cannot be false because it is a tautology. In this case, since it is a disjunction whose
        disjuncts are a statement and its negation, we obtain a tautology.
  q-a698a2c5:
