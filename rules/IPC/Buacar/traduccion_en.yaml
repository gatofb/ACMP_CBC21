  q-93292820:
    - fuente: 9763fc5afb
      enunciado: >-
        Given the following argument, indicate which are its premises. Select two options.

        The Tyrannosaurus rex had teeth that measured up to 30 cm long. On the other hand, those of the
        megalodon measured up to 18 cm long. Consequently, prehistoric carnivores had lethal bites.
      opciones:
        A: The megalodon's teeth measured up to 18 cm long.
        B: Those of the Tyrannosaurus rex measured up to 30 cm long.
        C: Prehistoric carnivores had lethal bites.
        D: The Tyrannosaurus rex had teeth that measured up to 30 cm long.
      explicacion: >-
        To identify the answer, it is important to remember that certain expressions, when present, help us
        identify the premises and the conclusion of an argument. In the book we call them premise indicators
        and conclusion indicators, respectively. In the given argument there is a conclusion indicator,
        namely, "consequently". It is important to remember two things: (i) both the premises and the
        conclusion must be stated in full, and (ii) indicators are never part of the premises or the
        conclusion.
  q-4d9cf6a7:
    - fuente: dd3469e155
      enunciado: >-
        Arguments are made up of statements. These statements can be combined by means of logical expressions,
        giving rise to complex statements. Given the following true statements:

        - Dinosaurs had vertical limbs.

        - Dinosaurs were vertebrate animals.

        Determine which of the following complex statements is true.
      opciones:
        A: Dinosaurs did not have vertical limbs but they were vertebrate animals.
        B: If dinosaurs had vertical limbs, they were vertebrate animals.
        C: Dinosaurs did not have vertical limbs or they were not vertebrate animals.
        D: Dinosaurs did not have vertical limbs.
      explicacion: >-
        In this exercise you had to evaluate the truth value of a conjunction, a negation, a disjunction and a
        conditional:

        1. Conjunctions can be expressed with “and”, “,”, “moreover”, “but”. Negations with “not”, “it is not
        true that”. Conditionals with “if… then” and disjunctions with “or”, “either … or”.

        2. Conjunctions are true only when both conjuncts are true; that is, it is enough for one of the
        statements combined by the conjunction to be false for the complex statement to be false.

        3. When a statement is true, its negation is false and, conversely, when a statement is false, its
        negation will be true.

        4. Conditional statements are false only when the antecedent is true and the consequent false; in all
        other cases they are true.

        5. There are two types of disjunctions, inclusive and exclusive. Expressions such as “either… or”
        suggest an exclusive disjunction, whereas the mere presence of an “or” leads us to think it is
        inclusive. When both parts are false, the disjunction between them is false, regardless of the type of
        disjunction. Conversely, when one of the disjuncts is true and the other false, the disjunction is
        true. The case in which the two types of disjunction yield different values is the one in which both
        disjuncts are true. If the disjunction is inclusive, the complex statement will be true; if it is
        exclusive, it will be false.

        In this exercise the true complex statement is the conditional, since it has a true antecedent and a
        true consequent.
  q-83d71439:
    - fuente: e4ab639574
      enunciado: >-
        When studying statements, we distinguish them by their scope. Given the following four statements,
        determine which of them is a universal statement.
      opciones:
        A: 80% of tuataras that are born are male.
        B: All tuataras are reptiles.
        C: Some tuataras live more than 100 years.
        D: Henry, the tuatara, lives in New Zealand.
      explicacion: >-
        In this exercise you are asked to recognize a type of statement, in this case, a universal statement.
        Universal statements are those that assert something about all the members of a set. Thus, the answer
        is "All tuataras are reptiles".
  q-c6c5b40a:
    - fuente: f311e46680
      enunciado: >-
        Statements are classified according to their scope, and this determines their truth conditions. Given
        the following statement, determine in which situation it would be false.

        All ichthyosaurs are carnivores.
      opciones:
        A: If we find an animal that is a tyrannosaur and feeds only on plants.
        B: If we find an animal that is a tyrannosaur and feeds on meat.
        C: If we find an animal that is an ichthyosaur and feeds only on plants.
        D: If we find an animal that is an ichthyosaur and feeds on meat.
      explicacion: >-
        The proposed statement is a universal statement. For a universal statement to be false, it is enough
        to find one case of a member of the set the statement refers to that does not have the assigned
        property. In this case, the only case incompatible with the statement is the one in which an animal is
        an ichthyosaur and feeds only on plants.
  q-45a31907:
    - fuente: 2ef0db0c7b
      enunciado: >-
        Another way of classifying statements is to group them into tautologies, contradictions or
        contingencies. Identify which of the following statements is a tautology.
      opciones:
        A: Dinosaurs were land animals and were not land animals.
        B: If dinosaurs were land animals then they were land animals.
        C: Dinosaurs were land animals but also aquatic ones.
        D: Dinosaurs were land animals.
      explicacion: >-
        In this exercise you are asked to recognize a tautology. To do so, it is important to keep in mind
        that:

        - Tautologies are statements that are necessarily true; they are not mere truths, but rather, because
        of the form of the sentence, however the world may be, it will be true.

        - Contradictions are necessarily false.

        -Unlike tautologies and contradictions, contingencies are statements that may be true or may be false,
        but are not necessarily either of the two. Even statements that seem obviously true to us will be
        contingent if their truth depends on empirical matters and not on the very structure of the sentence.
        In this exercise we have a conditional that will always have an antecedent and a consequent with the
        same truth value, given that the same statement works as both antecedent and consequent. So,
        regardless of whether dinosaurs are land animals or not, that conditional sentence will be necessarily
        true.
  q-7cfaa421:
    - fuente: a9c96683e9
      enunciado: >-
        When characterizing deductive arguments we introduced the notion of validity. Given the following
        statements, determine which conclusion is validly inferred.

        If mammoths have straight backs, then they appear with straight backs in cave paintings. But mammoths
        do not appear with straight backs in cave paintings.
      opciones:
        A: Mammoths do not appear in cave paintings.
        B: Mammoths have straight backs.
        C: Mammoths appear with a hump in cave paintings.
        D: Mammoths do not have straight backs.
      explicacion: >-
        In this exercise you are asked to choose which statement from the list can work as the conclusion of a
        valid argument given the proposed premises. Valid arguments can be recognized in different ways. On
        the one hand, because if we assume that the premises are all true, then we must necessarily admit that
        the conclusion is true as well. On the other hand, we can look at their structure: if we recognize one
        of the structures presented in the reading material, such as Modus Ponens, Modus Tollens, Disjunctive
        Syllogism, Universal Instantiation, etc., we know we are dealing with a valid form. In this case,
        option 4 is the only statement that can be validly inferred, since it is a case of Modus Tollens.
        Remember the following: what makes an argument valid or invalid is not whether its premises and
        conclusion are in fact true or false; what makes it valid or invalid is its form.
  q-90a2d487:
    - fuente: 9bc1b8de9e
      enunciado: Determine which of the following arguments is invalid.
      opciones:
        A: >-
          If the cave lion hunts herbivores, then it lives in the forest. It is not true that the cave lion
          lives in the forest. Therefore, it does not hunt herbivores.
        B: >-
          The saber-toothed tiger lives in groups or is solitary. But it is not true that the saber-toothed
          tiger is solitary. Therefore, it lives in groups.
        C: >-
          If the woolly rhinoceros belongs to the prehistoric megafauna, then it became extinct 30,000 years
          ago. And it belongs to the prehistoric megafauna, which proves that it became extinct 30,000 years
          ago.
        D: The woolly rhinoceros has fur or horns. Consequently, it has fur.
      explicacion: >-
        In this exercise you are asked to recognize an invalid argument. Invalid arguments can be recognized
        in different ways. On the one hand, because it is conceivable that the premises are true and the
        conclusion is not. On the other hand, if we look at their structure and recognize an inductive
        argument or a fallacy, we will know we are dealing with an invalid form. In this case the only invalid
        argument has the form A or B. Consequently, A. Remember the following: what makes an argument valid or
        invalid is not whether its premises and conclusion are in fact true or false; what makes it valid or
        invalid is its form. In particular, an invalid argument can have true premises and a true conclusion.
  q-2e20b161:
    - fuente: fce25ac31f
      enunciado: >-
        When presenting inductive arguments, we distinguished three types: incomplete enumeration, analogy and
        inductive syllogisms. Given the following set of statements:

        The tyrannosaurus was a carnivorous dinosaur and had sharp claws.

        The velociraptor was a carnivorous dinosaur and had sharp claws.

        ..............................................................

        ..............................................................

        Select which of the following statements correspond, respectively, to the missing premise and to the
        conclusion, so that the result is an inductive argument by analogy.

        P (missing premise):
      opciones:
        A: The stegosaurus was a carnivorous dinosaur.
        B: The tyrannosaurus was a carnivorous dinosaur.
        C: Most carnivorous dinosaurs had sharp claws.
        D: All carnivorous dinosaurs had sharp claws.
        E: The stegosaurus had sharp claws.
      explicacion: >-
        Inductive arguments by analogy are those in which we compare several cases and observe that they
        resemble each other in one or more properties, in order to infer from this that one of those cases
        also has another property that the others share. In this case, we start by comparing three dinosaurs
        and observing that they resemble each other in certain respects, in order to conclude that one of them
        also resembles the others in a new respect that the other two share. There are two possible solutions
        to this exercise. One solution is to take "The stegosaurus was a carnivorous dinosaur" as the premise
        and "The stegosaurus had sharp claws" as the conclusion. The other solution is the reverse: take "The
        stegosaurus was a carnivorous dinosaur" as the conclusion and "The stegosaurus had sharp claws" as the
        premise.
