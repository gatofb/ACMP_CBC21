  q-45811cc7:
    - fuente: 68e89c00e2
      enunciado: >-
        Given the following research case, identify the fundamental hypothesis.

        The ability of plants to perceive their environment and respond to it is fundamental to their
        survival. Plants' responses to light, for example, are well known. Since most flowering plants depend
        on other pollinating organisms for their reproduction, research into the interactions between plants
        and pollinators is of interest. Researchers at Tel Aviv University postulated that plants show a rapid
        response to the sound produced by their pollinators. More specifically, they proposed that Oenothera
        drummondii plants increase the sugar concentration of their nectar when they detect the buzzing of
        bees. To evaluate this, they divided a selection of Oenothera drummondii plants into two groups and
        exposed each one to a different sound condition for 3 minutes. Group A was kept in silence, while
        group B was exposed to the playback of a recording of bee buzzing. For this, they relied on acoustic
        studies showing that bee buzzing and the playback of recordings of the buzzing emit similar sound
        vibrations. After the 3 minutes, they extracted the nectar from the flowers and used a digital
        refractometer to measure the sugar concentration in the nectar.
      opciones:
        A: >-
          Oenothera drummondii plants increase the sugar concentration of their nectar when they detect the
          buzzing of bees.
        B: Bee buzzing and the playback of recordings of the buzzing emit similar sound vibrations.
        C: >-
          The sugar concentration measured in the nectar of the group B plants will be higher than that
          measured in the group A plants.
        D: Most flowering plants depend on other pollinating organisms for their reproduction.
        E: Oenothera drummondii plants will produce nectar with a high sugar concentration.
        F: The group A plants will produce more nectar than the group B plants.
  q-935c0858:
    - fuente: 198637934e
      enunciado: >-
        Given the following research case:

        The ability of plants to perceive their environment and respond to it is fundamental to their
        survival. Plants' responses to light, for example, are well known. Since most flowering plants depend
        on other pollinating organisms for their reproduction, research into the interactions between plants
        and pollinators is of interest. Researchers at Tel Aviv University postulated that plants show a rapid
        response to the sound produced by their pollinators. More specifically, they proposed that Oenothera
        drummondii plants increase the sugar concentration of their nectar when they detect the buzzing of
        bees. To evaluate this, they divided a selection of Oenothera drummondii plants into two groups and
        exposed each one to a different sound condition for 3 minutes. Group A was kept in silence, while
        group B was exposed to the playback of a recording of bee buzzing. For this, they relied on acoustic
        studies showing that bee buzzing and the playback of recordings of the buzzing emit similar sound
        vibrations. After the 3 minutes, they extracted the nectar from the flowers and used a digital
        refractometer to measure the sugar concentration in the nectar.

        What observational consequence is inferred in this case?
      opciones:
        A: >-
          Oenothera drummondii plants increase the sugar concentration of their nectar when they detect the
          buzzing of bees.
        B: Bee buzzing and the playback of recordings of the buzzing emit similar sound vibrations.
        C: >-
          The sugar concentration measured in the nectar of the group B plants will be higher than that
          measured in the group A plants.
        D: Most flowering plants depend on other pollinating organisms for their reproduction.
        E: Oenothera drummondii plants will produce nectar with a high sugar concentration.
        F: The group A plants will produce more nectar than the group B plants.
  q-e0b267b5:
    - fuente: 7a76008366
      enunciado: >-
        Determine whether the following statement is true or false, and why, according to Kuhn's epistemology.

        When anomalies appear, the scientific community immediately abandons the prevailing paradigm and
        begins the search for a new one.
      opciones:
        A: >-
          The statement is true because anomalies are defined precisely as those problems that the prevailing
          paradigm cannot solve.
        B: >-
          The statement is false because anomalies are defined as problems that arise during the period of
          normal science and that the paradigm tackles with its own tools.
        C: >-
          The statement is false because anomalies trigger a period of crisis that does not always end in the
          abandonment of the paradigm.
        D: >-
          The statement is true because, when an anomaly appears, scientists immediately lose confidence in
          the paradigm's ability to solve problems.
      explicacion: >-
        According to Kuhn, anomalies are problems that resist being explained by the theoretical and
        methodological apparatus with which normal science is carried out: as they multiply and deepen, they
        generate skepticism in the scientific community about the viability of the prevailing paradigm.
        However, during the period of crisis some unexplored path might be found that unblocks the solution of
        those problems and allows confidence in the paradigm to be restored, so not every crisis ends with its
        replacement. The abandonment of the paradigm is therefore neither an automatic nor an immediate
        consequence of the appearance of anomalies.
  q-ec909f2a:
    - fuente: 49f5fa9ec0
      enunciado: >-
        Determine whether the following statement is true (T) or false (F) according to feminist standpoint
        theory.

        Women's social situation, as a disadvantaged group, gives them epistemically privileged access to the
        objects of social and political knowledge.
      opciones:
        A: True (T)
        B: False (F)
      explicacion: >-
        Standpoint theory starts from the epistemic primacy of women's perspective (and, in general, that of
        other oppressed groups) over the dominant perspective of men. The reason for this primacy is that
        women have privileged access to the oppressive social relations in which they are embedded, and they
        are able to show that these oppressive relations are not the result of nature and necessity but of
        contingent history, and can therefore be changed.
  q-cbcffa53:
    - fuente: 2010d302e1
      enunciado: >-
        Determine whether the following statement is true (T) or false (F) according to feminist standpoint
        theory.

        Women's social situation, as a disadvantaged group, gives them epistemically privileged access to the
        objects of social and political knowledge.

        Select the option that justifies your answer.
      opciones:
        A: >-
          Because the participation of subjects with different social positions, including women, fosters
          objectivity by allowing individual biases to be subjected to criticism within a plural scientific
          community.
        B: >-
          Because the identity of subjects is changing and contingent, so a unified category such as “woman”
          must be rejected in favor of a plurality of identities.
        C: >-
          Because empirical science must achieve a single representation of reality based on the recording of
          observational evidence that is neutral and independent of the subject's situation.
        D: >-
          Because women's perspective makes it possible to reveal the fundamental regularities underlying the
          social phenomena in which gender is involved, which are invisible to the dominant perspective.
      explicacion: >-
        Standpoint theory starts from the epistemic primacy of women's perspective (and, in general, that of
        other oppressed groups) over the dominant perspective of men. The reason for this primacy is that
        women have privileged access to the oppressive social relations in which they are embedded, and they
        are able to show that these oppressive relations are not the result of nature and necessity but of
        contingent history, and can therefore be changed.
  q-8df558d0:
    - fuente: 5f5c4427d0
      enunciado: >-
        Read the following case:

        A coastal country whose economy depends mainly on fishing plans to fund a large scientific initiative.
        The scientific committee is torn between funding basic science to study deep ocean currents and marine
        biodiversity, and investing in applied science to develop technological innovations that optimize
        sustainable fishing and reduce the overexploitation of local marine fauna. At a meeting of the
        scientific committee, a researcher with a scientistic position joins the discussion.

        What would this researcher argue from her scientistic perspective?
      opciones:
        A: >-
          She would defend the position that resources should be allocated exclusively to developing
          technological innovations that serve sustainable fishing, which would promote the country's social
          and economic development in the short and medium term.
        B: >-
          She would suggest giving priority to basic science research, since research that deepens knowledge
          of the natural world is valuable in itself, regardless of its immediate results.
        C: >-
          She would say that the scientific committee has no authority to decide, since any investment linked
          to the productive system must be determined by political criteria, not scientific ones.
        D: >-
          She would recommend that the funds be split into thirds so that disciplines such as philosophy and
          history are included, since they are the only ones capable of thinking critically about the
          environmental and social consequences of the overexploitation of marine fauna.
      explicacion: >-
        For a scientistic thinker, scientific progress comes from basic research, regardless of its immediate
        usefulness. From this perspective, science has intrinsic value and must be guided by its own questions
        and methods, not by practical, social or political demands. Therefore, even when there are no tangible
        short-term benefits, theoretical research remains the priority: it is the true engine of scientific
        progress and the condition of possibility for any future application.
  q-c2aed077:
    - fuente: 62b8d80f4b
      enunciado: >-
        Indicate which type of problem relevant to scientific integrity is reflected in the case described
        below.

        In February 1998, the physician Andrew Wakefield published a preliminary study in the journal The
        Lancet suggesting a causal link between the MMR vaccine (measles, mumps and rubella) and autism. It
        analyzed 11 vaccinated children who had developed gastrointestinal problems and brain inflammation. It
        took the scientific community several years, through various studies, to rule out this supposed link.
        It came to light that, before publishing his article, Wakefield had applied for a patent on an
        alternative vaccine that competed with the MMR vaccine, which motivated him to falsify the study.
        Years later, The Lancet retracted the article from its journal, arguing that the study's conclusions
        were false.
      opciones:
        A: Inefficiency of the peer review system
        B: Perverse incentives
        C: Conflicts of interest
      explicacion: >-
        Conflicts of interest arise when research is funded by a person or organization that has its own
        interest in the research producing a particular result. This is what happened in this case. Nowadays
        it is common for scientists to declare where they obtained their funding, but this alone is not enough
        to rule out conflicts of interest, because it is not easy to know the interests of the organizations
        that fund them. In any case, it is clear that there is an ethical problem if the results of a research
        project are influenced by the person or institution providing the funding.
  q-1ac6b712:
    - fuente: d885b19c44
      enunciado: >-
        Indicate what type of problem relevant to scientific integrity is reflected in the case described
        below.

        In February 1998, the physician Andrew Wakefield published a preliminary study in the journal The
        Lancet suggesting a causal link between the MMR vaccine (measles, mumps and rubella) and autism. It
        analyzed 11 vaccinated children who had developed gastrointestinal problems and inflammation in the
        brain. It took the scientific community several years to rule out that supposed link through various
        studies. Regarding Wakefield, it came to light that before publishing his article he had applied for a
        patent on an alternative vaccine that competed with the MMR vaccine, which motivated him to falsify
        the study. Years later, The Lancet retracted the article from its journal, arguing that the study's
        conclusions were false.

        Select the option that justifies your answer.
      opciones:
        A: >-
          Because the pressure to publish articles in prestigious journals encourages researchers to resort to
          fraudulent mechanisms to carry out their research.
        B: >-
          Because failures in the peer review mechanisms, which ensure the rigor and quality of scientific
          research, allowed research based on fraudulent data to be published.
        C: >-
          Because access to the published studies on the link between the administration of the MMR vaccine
          and the presence of autism in children was not available to the scientific community.
        D: >-
          Because the person who carried out the research had an interest in discrediting the MMR vaccine and
          proposing an alternative, which put the objectivity of his study in tension with his commercial
          interests.
      explicacion: >-
        Conflicts of interest arise when research is funded by a person or organization that has its own
        interest in the research producing a particular result. This is what happened in this case. Nowadays
        it is common for scientists to declare where they obtained their funding, but this alone is not enough
        to clear up conflicts of interest, because it is not easy to know the interests of the organizations
        that fund them. In any case, it is clear that there is an ethical problem if the results of a research
        project are influenced by the person or institution that provides the funding.
fichas:
  argumentos.que-es-un-argumento:
    fuente: ef76ddba77
    tema: What an argument is
    autor: Arguments
    pregunta_guia: >-
      Is there a statement offered as a reason to accept another? What expression marks the premise or the
      conclusion?
  argumentos.premisas-y-conclusion:
    fuente: e1bdd43938
    tema: Identifying premises and conclusion
    autor: Arguments
    pregunta_guia: >-
      Which indicators appear, and which statement does each one mark? How does each statement read when
      written out in full and without the indicator?
  enunciados.valor-de-verdad-de-complejos:
    fuente: 9083d97d45
    tema: Truth value of compound statements
    autor: Statements
    pregunta_guia: What logical expression joins the parts? What value does each part have, counting the negations?
  enunciados.universales:
    fuente: d301f0e2f1
    tema: Universal statements and when they are false
    autor: Statements
    pregunta_guia: >-
      Does the statement speak about all the members of a set? What case would have to appear for it to be
      false?
  enunciados.tautologia-contradiccion-contingencia:
    fuente: a8022ed018
    tema: Tautologies, contradictions and contingencies
    autor: Statements
    pregunta_guia: >-
      Would the statement be true (or false) no matter what the world is like, just because of its form? Or
      does it depend on the facts?
  deductivos.deductivo-o-inductivo:
    fuente: 8f01ddd1cd
    tema: How to recognize a deductive argument (and an inductive one)
    autor: Deductive arguments
    pregunta_guia: >-
      If the premises were true, could the conclusion be false? Do you recognize any valid form or any
      inductive structure?
  deductivos.validez-depende-de-la-forma:
    fuente: f7ff32eb5c
    tema: 'Validity: which conclusion follows and which argument is invalid'
    autor: Deductive arguments
    pregunta_guia: What form do the premises have (conditional, disjunction, negation)? What valid schema completes them?
  deductivos.reglas-de-una-deduccion:
    fuente: f5e1d8e149
    tema: Justifying the steps of a deduction
    autor: Deductive arguments
    pregunta_guia: What form do the cited lines and the line obtained have? What rule connects the former with the latter?
  inductivos.analogia-o-silogismo-inductivo:
    fuente: 8925a17bbc
    tema: Distinguishing analogy, inductive syllogism and incomplete enumeration
    autor: Inductive arguments
    pregunta_guia: >-
      Does the argument compare similar cases, apply a statistical generalization to a case, or generalize
      from a sample? Does the general premise say "all" or "most"?
  inductivos.completar-una-analogia:
    fuente: 4e51d231b3
    tema: Building an argument by analogy
    autor: Inductive arguments
    pregunta_guia: >-
      What properties do the compared cases share? What is the new case, and what property is attributed to it
      in the conclusion?
  inductivos.fortalecer-enumeracion-incompleta:
    fuente: 635e018750
    tema: How to strengthen an incomplete enumeration
    autor: Inductive arguments
    pregunta_guia: >-
      Does the new premise add a case that belongs to the set and has the property? Is the sample still
      smaller than the set?
  explicacion.ley-y-condicion-antecedente:
    fuente: 787a7d4a3f
    tema: Law and antecedent condition in deductive-nomological explanation
    autor: Scientific explanation
    pregunta_guia: >-
      Which of the statements speaks about all the cases of a type, and which speaks about this case and
      connects it with what the law says?
  explicacion.inferir-el-explanandum:
    fuente: 82fd0293bb
    tema: How to infer the explanandum from the explanans
    autor: Scientific explanation
    pregunta_guia: >-
      What does the law say happens to all (or most) cases of a type, and what concrete case does the
      antecedent condition present?
  explicacion.nomologica-o-estadistica:
    fuente: 1205d86799
    tema: Deductive-nomological or inductive-statistical explanation
    autor: Scientific explanation
    pregunta_guia: >-
      Does the law in the explanans hold for all cases or for a percentage? Is the explanandum deduced, or
      does it only become probable?
  contrastacion.hipotesis-fundamental:
    fuente: 6b00c98c87
    tema: How to identify the fundamental hypothesis
    autor: Hypothesis testing
    pregunta_guia: >-
      What did the researchers set out to prove ("they wanted to prove that...", "they postulated that...")?
      Is that statement general, or does it only speak about what is going to be measured in this experiment?
  contrastacion.hipotesis-auxiliar:
    fuente: c0e9026af4
    tema: How to identify the auxiliary hypothesis
    autor: Hypothesis testing
    pregunta_guia: >-
      What do the researchers take as known ("they assumed that...", "they relied on studies that...") in
      order to interpret what their test or instrument measures?
  contrastacion.consecuencia-observacional:
    fuente: f2b8cf7ae0
    tema: How to identify the observational consequence
    autor: Hypothesis testing
    pregunta_guia: >-
      If the fundamental hypothesis were true, what should be recorded in this experiment, with these groups
      and this instrument?
  ciencia-formal.no-falsable:
    fuente: 36a32f165d
    tema: Why formal statements are not empirical science for falsificationism
    autor: Empirical and formal science
    pregunta_guia: >-
      What singular, observable and logically possible statement could contradict this claim? If there is
      none, what type of science does it belong to?
  empirismo-logico.hempel-y-popper:
    fuente: e7cb2a4af0
    tema: What Hempel and Popper share and how they differ
    autor: Logical empiricism
    pregunta_guia: >-
      What do both think about how hypotheses are invented and what happens when a test turns out badly? Where
      do they part ways when the test turns out well?
  kuhn.anomalias-y-crisis:
    fuente: 1bf0e6516c
    tema: Anomalies, crisis and abandonment of the paradigm
    autor: Thomas Kuhn
    pregunta_guia: >-
      What distinguishes an anomaly from a puzzle? Is one anomaly enough for there to be a crisis, and does
      the crisis always end in a new paradigm?
  kuhn.periodo-precientifico:
    fuente: 76b6f2efda
    tema: The pre-scientific period
    autor: Thomas Kuhn
    pregunta_guia: >-
      Before the first stage of normal science, is there already a scientific community and a paradigm, or
      only competing schools?
  evolucion.explicar-un-rasgo:
    fuente: 25175d56d3
    tema: Explaining a trait by natural selection (and telling it apart from Lamarck's explanation)
    autor: Darwin and evolution
    pregunta_guia: >-
      Was the trait already present in some individuals and did it become more frequent because they left more
      offspring, or did each individual gradually acquire it through use and pass it on?
  evolucion.darwin-y-lamarck:
    fuente: dfeef1f9b3
    tema: 'Darwin and Lamarck: what they share and what sets them apart'
    autor: Darwin and evolution
    pregunta_guia: What idea do both have to accept to be evolutionists, and which mechanism belongs to each one?
  evolucion.variacion-heredable:
    fuente: 38b48cf9b4
    tema: Heritable variation between generations
    autor: Darwin and evolution
    pregunta_guia: >-
      If every offspring were identical to its parents, what would natural selection act on? Where do the
      differences come from, and why does it matter that they are inherited?
  feminismo.punto-de-vista:
    fuente: 50e2aa3a8b
    tema: Feminist standpoint theory
    autor: Feminist epistemology
    pregunta_guia: >-
      Why, according to this theory, does someone in a disadvantaged position see something the dominant
      perspective does not see? On which topics does that privilege apply?
  feminismo.exclusion-y-marginalizacion:
    fuente: f57c5d65ad
    tema: Exclusion and marginalization of women in science
    autor: Feminist epistemology
    pregunta_guia: >-
      Is the problem in the case in the content of a theory, in its uses, in a woman's contribution having
      been erased, or in her not being allowed to train or practice?
  integridad.conflictos-de-interes:
    fuente: 2ef20c393c
    tema: Conflicts of interest
    autor: Ethics and scientific integrity
    pregunta_guia: >-
      Who paid for the research, or who gains from its result? Can that interest distort what the study
      concludes?
  etica.cientificismo-y-responsabilidad:
    fuente: bdcaa00974
    tema: 'Scientism and anti-scientism: responsibility for the uses of science'
    autor: Ethics and scientific integrity
    pregunta_guia: >-
      Does the option separate the production of knowledge from its application and leave ethics for later, or
      does it say they are inseparable and that the scientist is also responsible?
  etica.ciencia-basica-o-aplicada:
    fuente: e4319b213e
    tema: 'Which research to fund: scientism and practicism'
    autor: Ethics and scientific integrity
    pregunta_guia: >-
      Does the position value research for the knowledge it produces in itself, or for how much it solves
      concrete problems of society?
  etica.premisa-valorativa:
    fuente: b8a4e42b51
    tema: The value premise and the naturalistic fallacy
    autor: Ethics and scientific integrity
    pregunta_guia: >-
      What value judgment is needed so that, together with the fact in premise 2, the conclusion follows
      exactly?
