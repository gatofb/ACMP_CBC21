        that the variations observed from one generation to the next produce differences in the fitness of
        organisms, and natural selection operates by favoring the fittest organisms.
  q-bfc42986:
    - fuente: 7ff0fabc0a
      enunciado: >-
        Read the following statement and determine which of the following options explains the phenomenon on
        the basis of Darwin's theory of natural selection.

        Dogs are able to digest most of the foods that humans eat, unlike other canids such as wolves or
        jackals.
      opciones:
        A: >-
          Dogs were designed to digest the foods that humans eat so that they could be successfully
          domesticated. This design allowed humans and dogs to meet in history and form a successful, mutually
          beneficial biological partnership, contributing to the natural balance.
        B: >-
          All species tend to resemble humans, who are the most perfect form in nature. Dogs, although
          structurally very different from humans, are able to digest the same type of food, which makes them
          ideal for living with humans.
        C: >-
          Among the ancestors of contemporary dogs, some individuals were born with the variation that allowed
          them to digest the foods that human groups ate. This particularity allowed them to feed on the
          leftovers that humans left behind, which in turn improved their survival and allowed them to leave
          more offspring. After several generations, the trait became widespread among all dogs.
        D: >-
          The ancestors of contemporary dogs began to follow the human groups of the time in search of the
          leftovers they left behind. By being exposed to this type of food, over time, they gradually
          acquired the ability to digest it properly, which allowed them to adapt to that particular
          environment. The acquired ability to digest the food was inherited by their offspring.
      explicacion: >-
        In this exercise you are asked to identify the Darwinian explanation of a specific trait. What is
        characteristic of explanations by natural selection is that they relate the effectiveness of traits in
        performing certain functions in a given environment to the fitness of the organism that has those
        traits. The fitter organisms, in turn, leave more offspring than the less fit ones, so that over
        successive generations the proportion of organisms with those adaptive traits increases.
