        D: >-
          It is a deductive-nomological explanation because the law it contains in its explanans is universal
          and the explanandum is deduced from the explanans.
      explicacion: >-
        According to the covering-law model, the explanans contains laws (which must be statistical or
        probabilistic in inductive-statistical explanations and universal in deductive-nomological
        explanations). In addition, those laws are accompanied by statements that describe the initial or
        antecedent conditions (which are those factors without which the phenomenon to be explained would not
        have occurred). In the explanation in this exercise, the law contained in the explanans is universal.
        The statement in option 3 is the explanandum that is deduced from that universal law and the
        antecedent condition. Therefore, the explanation is deductive-nomological.
  q-7edcc0bb:
    - fuente: e17f587461
      enunciado: >-
        Given the following research case, identify the fundamental hypothesis and the auxiliary hypothesis.

        Were the old days always better? According to Terence Mitchell and Leigh Thompson, when we remember
        the past, our brain tends to soften the negative aspects and highlight the positive ones increasingly
        as time goes by. To test this, the researchers carried out an experiment: a group of people shared a
        vacation. After the vacation had ended, the participants were asked to remember and evaluate their
        trip at three different stages: stage 1 was one week after the trip, stage 2 six months after, and
        stage 3 one year after. To do so, the participants were asked to complete the “PANAS” questionnaire,
        which assesses the levels of positive and negative emotions a person may have experienced in relation
        to a past event, such as a vacation. The researchers assumed that the higher the score on the PANAS
        questionnaire, the greater the importance participants give to the negative aspects, and the lower the
        score, the less importance they give to those aspects. The questionnaires recorded a higher score at
        stage 1 than at stages 2 and 3.

        What is the fundamental hypothesis?
      opciones:
        A: A higher score on the PANAS questionnaire will be recorded at stage 3 than at stages 1 and 2.
        B: Memories of the vacation are evaluated in three stages.
        C: >-
          When we remember the past, our brain tends to soften the negative aspects and highlight the positive
          ones increasingly as time goes by.
        D: The old days were always better.
        E: A higher score on the PANAS questionnaire will be recorded at stage 1 than at stages 2 and 3.
        F: >-
          The higher the score on the PANAS questionnaire, the greater the importance participants give to the
          negative aspects, and the lower the score, the lower the importance given to negative aspects.
      explicacion: >-
        In this exercise you are asked to identify the fundamental hypothesis and the auxiliary hypothesis of
        the research case presented. To do so, it is important to keep in mind that hypotheses are general
        statements. The fundamental hypothesis is the one that guides the research and is put to the test in
        the experiment. By contrast, the auxiliary hypothesis is a hypothesis that has prior independent
        support and is used in the testing as presupposed knowledge.
