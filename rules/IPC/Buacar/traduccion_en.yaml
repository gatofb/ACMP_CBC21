    - fuente: fc656e0310
      enunciado: |-
        Complete the following statement so that it is a tautology.
        The Tehuelches had a horizontal social structure...
      opciones:
        A: if they did not have great hierarchical differences.
        B: but they did not have a horizontal social structure.
        C: or they did not have it.
        D: and many specialists in anthropology highlight it.
      explicacion: >-
        Tautologies are statements that are necessarily true; they are not mere truths, since they are true by
        virtue of their logical form, however the world may be. Contradictions are necessarily false. Unlike
        tautologies and contradictions, contingencies are statements that may be true or may be false, but are
        not necessarily either. Even statements that seem obviously true to us will be contingent if their
        truth depends on empirical matters and not on the very structure of the sentence. Thus, the statement
        “The capital of Argentina is Buenos Aires” is true but merely contingent: if the project to move the
        capital to Viedma had succeeded, that sentence would be false today. Similarly, the sentence “The
        dinosaurs did not go extinct” is a false but contingent sentence: if things had turned out
        differently, that sentence could have turned out true today. Note that this does not happen with
        tautologies and contradictions: no matter how things had turned out, the sentence “Buenos Aires is and
        is not the capital of Argentina” cannot be true because it is a contradiction, and the sentence
        “Buenos Aires is or is not the capital of Argentina” cannot be false because it is a tautology.
  q-ea5b7ff4:
    - fuente: e919e47c37
      enunciado: >-
        Given the following statements, determine which conclusion is validly inferred.

        The Aztecs worshipped a single deity or they were polytheists. But it is not true that they worshipped
        a single deity.
      opciones:
        A: The Aztecs worshipped a single deity and they were polytheists.
        B: The Aztecs were not polytheists.
        C: The Aztecs were polytheists.
        D: If the Aztecs did not worship a single deity, they were not polytheists.
      explicacion: >-
        In this exercise you are asked to choose which statement from the list can serve as the conclusion of
        a valid argument given the proposed premises. It is important to keep in mind that valid arguments can
        be recognized in different ways. On the one hand, because it is not possible for the premises to all
        be true and the conclusion false. On the other hand, we can look at their structure: if, when
        selecting the conclusion, we recognize one of the schemas presented in the reading material, such as
        Modus ponens, Modus tollens, Disjunctive syllogism, Universal instantiation, etc., we know we are
        dealing with a valid form. In this case, there is only one statement that can be validly inferred, and
        the resulting argument is a case of Disjunctive syllogism.
  q-9ba46b03:
    - fuente: c0336e0922
      enunciado: >-
        Given the following deduction:

        1. If the Toba people have their own native language, then that language is agglutinative. [Premise]

        2. If the Toba language is agglutinative, then it can express a complex sentence in a single word.
        [Premise]

        3. The Toba people have their own native language. [Premise]

        4. The Toba language is agglutinative. [Modus ponens, 1 and 3]

        5. If the Toba people have their own native language, the Toba language can express a complex sentence
        in a single word. [*]

        Determine the justification for the line marked with an asterisk [*].
      opciones:
        A: Disjunctive syllogism, 1 and 2
        B: Hypothetical syllogism, 1 and 2
        C: Simplification, 1
        D: Conjunction, 1 and 2
        E: Modus tollens, 2 and 3
      explicacion: >-
        The marked step is obtained by Hypothetical syllogism. Remember that in a Hypothetical syllogism a
        conditional sentence is concluded from two premises, also conditionals, such that the consequent of
        one matches the antecedent of the other, allowing them to be chained. Applying this rule, "If the Toba
        people have their own native language, the Toba language can express a complex sentence in a single
        word" can be deduced from the premises "If the Toba people have their own native language, then that
        language is agglutinative" and "If the Toba language is agglutinative, then it can express a complex
        sentence in a single word".
  q-035268db:
    - fuente: fdcf10c886
      enunciado: >-
        Given the following arguments, determine which of them is an inductive argument by analogy (A) and
        which is an inductive syllogism (S). Which is the inductive argument by analogy?
      opciones:
        A: >-
          All native peoples who maintained their ancestral languages also preserved traditional ritual
          practices. The Mapuche community has maintained its ancestral language. Therefore, the Mapuche
          community preserves traditional ritual practices.
        B: >-
          Most native peoples who maintained their ancestral languages also preserved traditional ritual
          practices. The Mapuche community has maintained its ancestral language. Therefore, the Mapuche
          community preserves traditional ritual practices.
        C: >-
          The Quechua, Aymara and Mapuche communities are native peoples of South America and developed
          complex agricultural techniques adapted to their environment. Therefore, all native peoples of South
          America developed complex agricultural techniques adapted to their environment.
        D: >-
          The Quechua and Mapuche communities are native peoples of South America and developed complex
          agricultural techniques adapted to their environment. Therefore, the Aymara community developed
          complex agricultural techniques adapted to its environment, since it is a native people of South
          America.
      explicacion: >-
        Inductive syllogisms are those that start from a statistical or probabilistic generalization, subsume
        a particular case under it, and conclude that this case meets what the generalization establishes. In
        this exercise, the inductive syllogism is the argument that starts from "most native peoples who
        maintained their ancestral languages also preserved traditional ritual practices", subsumes the
        Mapuche community under that generalization, and concludes that this community preserves traditional
        ritual practices. Inductive arguments by analogy are those in which several cases that are similar in
        one or more properties are compared, in order to infer that one of them also has another property that
        the others share. In this exercise, the analogy is the argument that compares the Quechua and Mapuche
        communities, notes that they share being native peoples of South America and having developed complex
        agricultural techniques, and concludes that the Aymara community, which is also a native people of
        South America, likewise developed those techniques. The other two arguments do not correspond to
        either of these types: the one that starts from "all native peoples…" is a deductive argument, and the
        one that concludes that "all native peoples of South America developed complex agricultural
        techniques" is an inductive argument by incomplete enumeration.
    - fuente: 0fc90c3318
      enunciado: >-
        Given the following arguments, determine which of them is an inductive argument by analogy (A) and
        which is an inductive syllogism (S). Which is the inductive argument by analogy?
      opciones:
        A: >-
          The patient's left lung is enveloped by the pleural membrane, given that the patient's lungs are
          healthy and that all healthy lungs are enveloped in that membrane.
        B: >-
          This hospital patient does not have good blood circulation in his hands, since he is an older adult
          and 90% of older adults do not have good blood circulation in their hands.
        C: >-
          Veins carry blood and are elastic. Moreover, arterioles share the same characteristics as veins.
          Therefore, arteries are elastic, since they also carry blood.
        D: >-
          The femoral artery carries oxygenated blood, and so do the brachial and carotid arteries. From which
          it is inferred that all arteries carry oxygenated blood.
      explicacion: >-
        Inductive syllogisms are those that start from a statistical or probabilistic generalization, subsume
        a particular case under it, and conclude that this case meets what the generalization establishes. In
        this exercise, the inductive syllogism is the argument that starts from "90% of older adults do not
        have good blood circulation in their hands", subsumes a specific patient under that generalization,
        and concludes that he does not have good blood circulation in his hands. Inductive arguments by
        analogy are those in which several cases that are similar in one or more properties are compared, in
        order to infer that one of them also has another property that the others share. In this exercise, the
        analogy is the argument that compares veins, arteries and arterioles, notes that they share carrying
        blood, and concludes that arteries are also elastic. The other two arguments do not correspond to
        either of these types, since they are an incomplete enumeration and a universal instantiation
        (deductive argument).
  q-9b743602:
    - fuente: 09ae14d6a3
      enunciado: >-
        Given the following arguments, determine which of them is an inductive argument by analogy (A) and
