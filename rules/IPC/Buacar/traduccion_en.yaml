  q-e6bb5df1:
    - fuente: 3e31073e85
      enunciado: >-
        Read the following newspaper excerpt. Taking into account the debates on scientific ethics, determine
        which of the options is most representative of the anti-scientistic position.

        In 2013, the BRAIN Initiative was launched in the United States, a scientific project whose goal is to
        accelerate the development and application of advanced technologies to study the brain. Its main
        mission is to develop tools capable of mapping brain activity in real time and understanding how
        neural networks generate thoughts, emotions and behaviors, and how they relate to neurological
        diseases. Rafael Yuste, one of its promoters, has warned that these advances pose major ethical
        challenges, since the neurotechnology developed could be used to manipulate or interfere with brain
        activity, compromising aspects such as people's mental privacy and freedom of decision.
      opciones:
        A: >-
          Scientists produce knowledge in basic and applied science that allows us to map brain activity in
          real time and understand how neural networks generate thoughts, emotions and behaviors, and how they
          are related to neurological diseases. From these discoveries, neurotechnologies can be developed
          that could have negative effects on people's mental privacy or on the autonomy of their decisions.
          However, responsibility for these consequences lies exclusively with those who develop and apply
          such technologies.
        B: >-
          The goal of the BRAIN project was to transform the study of the human brain through the creation of
          innovative tools and technologies to understand more deeply how neurons and brain circuits work.
          Scientists should not bear responsibility for the uses of their discoveries, since responsibility
          for how that knowledge is applied lies exclusively with the companies or States that use it for
          certain purposes.
        C: >-
          The use or misuse of neurotechnologies derived from the BRAIN project's research must be regulated
          by States. In this sense, as long as scientists act in accordance with the laws of their countries,
          they are fulfilling their ethical responsibility. In this context, compliance with the law is
          sufficient to ensure that scientific discoveries are used responsibly.
        D: >-
          Technoscientific development, in this case the project of mapping the brain and developing
          neurotechnology for measuring and manipulating it, can put people's autonomy and privacy at risk. It
          is not possible to separate the development of research from its possible applications, and
          scientists cannot evade their responsibility if the results of their work are used for ethically
          questionable purposes.
      explicacion: >-
        According to the anti-scientistic position, scientific development and the technological use of
        discoveries are inseparable. The anti-scientistic position holds that we should speak of
        "technoscience" as a common sphere that brings together both dimensions. Therefore, scientists who
        carry out research (even in highly abstract areas) are no less responsible than those who develop
        concrete technologies and applications.
  q-c9b8fd18:
    - fuente: 630b000fdc
      enunciado: >-
        A. Indicate what type of problem relevant to scientific integrity is reflected in the case described
        below.

        Wei-Hock Soon is known for his studies that challenged the scientific consensus on climate change,
        arguing that global warming was mainly due to solar activity, and not to greenhouse gas emissions
        caused by human activities. For years, Soon published several articles that were highly influential in
        US public policy and that downplayed the impact of CO2 on climate change, which drew attention in
        climate denial circles and in some sectors of industry. However, in 2015 it was revealed that Soon had
        received more than 1.2 million dollars in undisclosed funding from companies linked to the fossil fuel
        industry, such as ExxonMobil and the Southern Company, a large energy company. Although it is not a
        crime, the fact that Soon had not declared this source of funding in his academic publications caused
        a strong controversy.
      opciones:
        A: Access to information
        B: Perverse incentives
        C: Peer review
        D: Conflicts of interest
      explicacion: >-
        Conflicts of interest arise when a research project is funded by a person or organization that has its
        own interest in the research producing a certain result. This is what happened in this case. Nowadays
        it is common for scientists to declare where they obtained their funding, although this alone is not
        enough to rule out conflicts of interest, because it is not easy to know the interests of the
        organizations that fund them. In any case, it is clear that there is an ethical problem if the results
        of a research project are decided in advance by the person or institution that provides the funding.
