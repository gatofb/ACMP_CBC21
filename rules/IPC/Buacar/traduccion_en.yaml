  q-14bb2e89:
    - fuente: 5dd139d12c
      enunciado: >-
        Given the following research case, identify the fundamental hypothesis and the observational
        consequence.

        To acquire our mother tongue, we must be able to distinguish utterances in that language from those in
        foreign languages. Researchers at the École des Hautes Études en Sciences Sociales wanted to prove
        that this ability is already present in babies at a very early age. To do so, they carried out an
        experiment on 40 four-day-old babies from French families. A first group of these babies was exposed
        to a recording of a story in which the first part was in Russian and the second part was in English.
        The second group heard another recording in which the first part of the story was in Russian and the
        second part was in French. While they listened to the recordings, all the babies used pacifiers with
        sensors that recorded their sucking rate. The researchers assumed that when babies feel interest or
        curiosity toward a stimulus, they increase their sucking rate. Thus, they expected to observe a
        greater acceleration of the sucking rate while listening to the recording in the babies of the second
        group than in the babies of the first group. Indeed, they observed that in the second group the rate
        increased by between 10 and 20 sucks per minute when the recording switched from Russian to French,
        while in the first group no significant variations in rate were observed.

        What is the fundamental hypothesis?
      opciones:
        A: The pacifiers have sensors that record the change of language in the recordings.
        B: >-
          There will be a similar acceleration of the sucking rate in the babies of the second group and in
          the babies of the first group.
        C: >-
          To acquire our mother tongue, we must be able to distinguish utterances in that language from those
          in foreign languages.
        D: >-
          The pacifiers' sensors will record a greater acceleration of the sucking rate while listening to the
          recording in the babies of the second group than in the babies of the first group.
        E: >-
          The ability to distinguish utterances in the mother tongue from utterances in foreign languages is
          present in babies at a very early age.
        F: When babies feel interest or curiosity toward a stimulus, they increase their sucking rate.
      explicacion: >-
        In this exercise you are asked to identify the fundamental hypothesis and the observational
        consequence of the research case presented. To do so, it is important to keep in mind that hypotheses
        are general statements. The fundamental hypothesis is the one that guides the research and is put to
        the test in the experiment. By contrast, the observational consequence is a basic empirical statement
        that expresses what can be expected in light of the fundamental hypothesis, given the initial
        conditions under which the experiment is carried out and the auxiliary hypothesis/hypotheses that
        is/are assumed.
