  q-093bb0c4:
    - fuente: ea482c59cb
      enunciado: Indicate which of the following statements expresses a thesis rejected by Darwin and Lamarck.
      opciones:
        A: The adaptation of organisms is explained by natural selection.
        B: All species descend from one or a few common ancestors.
        C: >-
          The adaptation of organisms to the environment is explained by the inheritance of characteristics
          acquired through use and disuse.
        D: Species are fixed; they do not undergo modifications over time.
      explicacion: >-
        Although they proposed different evolutionary mechanisms (Darwin defended natural selection as a
        general evolutionary principle, while Lamarck held that organisms tend to become more complex), both
        are evolutionist authors. That is, both held that organisms transform and give rise to new species
        over time, in contrast to the fixism characteristic of medieval creationism.
  q-6534a7d0:
    - fuente: 31e8659c8f
      enunciado: >-
        Given the following explanans:

        - 85% of ecosystems that experience alterations in their biological, geographic and chemical cycles
        undergo significant changes in their temperature and rainfall patterns.

        - The ecosystem of the Argentine Chaco experiences alterations in its biological, geographic and
        chemical cycles.

        Determine which explanandum can be inferred from the given law and antecedent condition, and select
        the statement that correctly characterizes the explanation constructed.

        A. Identify the explanandum.
      opciones:
        A: >-
          The ecosystem of the Argentine Chaco undergoes significant changes in the water, carbon and nitrogen
          cycles.
        B: >-
          The ecosystem of the Argentine Chaco does not undergo significant changes in its temperature and
          rainfall patterns.
        C: >-
          The ecosystem of the Argentine Chaco undergoes significant changes in its temperature and rainfall
          patterns.
        D: >-
          Every ecosystem is regulated by natural cycles that allow essential elements to circulate among its
          component parts.
      explicacion: >-
        According to the covering-law model, the explanans contains laws (which must be statistical or
        probabilistic in inductive-statistical explanations and universal in deductive-nomological
        explanations). In addition, these laws are accompanied by statements describing the initial or
        antecedent conditions (those factors without which the phenomenon in question would not have
        occurred). In this exercise's explanation, the law contained in the explanans is statistical. The
        statement in option 3 is the explanandum that is inferred with probability from the statistical law
        and the antecedent condition. Therefore, the explanation is inductive-statistical.
  q-35672e54:
    - fuente: efb77cd775
      enunciado: >-
        Given the following explanans:

        - 85% of ecosystems that undergo alterations in their biological, geographical and chemical cycles
        experience significant changes in their temperature and rainfall patterns.

        - The ecosystem of the Argentine Chaco undergoes alterations in its biological, geographical and
        chemical cycles.

        Determine which explanandum can be inferred from the given law and antecedent condition, and select
        the statement that correctly characterizes the explanation constructed.

        B. What type of explanation is it and why?
      opciones:
        A: It is a deductive-nomological explanation because its explanandum is a universal law.
        B: >-
          It is a deductive-nomological explanation because it contains only universal laws in its explanans
          and the explanandum is deduced from the explanans.
        C: It is an inductive-statistical explanation because its explanandum is a probabilistic law.
        D: >-
          It is an inductive-statistical explanation because it contains at least one probabilistic law in its
          explanans and the explanandum is inferred from the explanans with a certain probability.
      explicacion: >-
        According to the covering-law model, the explanans contains laws (which must be statistical or
        probabilistic in inductive-statistical explanations and universal in deductive-nomological
        explanations). In addition, these laws are accompanied by statements describing the initial or
        antecedent conditions (which are those factors without which the phenomenon in question would not have
        occurred). In the explanation in this exercise, the law contained in the explanans is statistical. The
        statement in option 3 is the explanandum that is inferred with probability from the statistical law
        and the antecedent condition. Therefore, the explanation is inductive-statistical.
  q-1f7617b7:
    - fuente: 9a22aad4d6
      enunciado: >-
        Given the following research case, identify the fundamental hypothesis and the auxiliary hypothesis.

        To acquire our mother tongue, we must be able to distinguish utterances in that language from those in
        foreign languages. Researchers at the School for Advanced Studies in the Social Sciences wanted to
        test that this ability is already present in babies at a very early age. To do so, they carried out an
        experiment on 40 four-day-old babies from French families. A first group of these babies was exposed
        to a recording of a story in which the first part was in Russian and the second part was in English.
        The second group listened to another recording in which the first part of the story was in Russian and
        the second part was in French. While listening to the recordings, all the babies used pacifiers with
        sensors that recorded the sucking rate. The researchers assumed that when babies feel interest or
        curiosity in response to a stimulus, they increase their sucking rate. Thus, they expected to observe
        a greater acceleration of the sucking rate when listening to the recording in the babies of the second
        group than in the babies of the first group. Indeed, they observed that in the second group the rate
        increased by between 10 and 20 sucks per minute when the recording switched from Russian to French,
        while in the first group no significant variations in rate were observed.

        What is the fundamental hypothesis?
      opciones:
        A: >-
          The ability to distinguish utterances in the mother tongue from utterances in foreign languages is
          present in babies at a very early age.
        B: When babies feel interest or curiosity in response to a stimulus, they increase their sucking rate.
        C: >-
          To acquire our mother tongue, we must be able to distinguish utterances in that language from those
          in foreign languages.
        D: >-
          The pacifier sensors will record a greater acceleration of the sucking rate when listening to the
          recording in the babies of the second group than in the babies of the first group.
        E: The pacifiers have sensors that record the change of language in the recordings.
        F: >-
          There will be a similar acceleration of the sucking rate in the babies of the second group and in
          the babies of the first group.
      explicacion: >-
        In this exercise you are asked to identify the fundamental hypothesis and the auxiliary hypothesis of
        the research case presented. To do so, it is important to bear in mind that hypotheses are general
        statements. The fundamental hypothesis is the one that guides the research and is put to the test in
        the experiment. By contrast, the auxiliary hypothesis is a hypothesis that has prior independent
        support and is used in the test as presupposed knowledge.
