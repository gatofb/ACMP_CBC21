  q-7b8d0d09:
    - fuente: d90df61a2a
      enunciado: >-
        Indicate which of the following statements expresses a thesis shared by logical empiricism,
        represented by Hempel, and Popper's falsificationism.
      opciones:
        A: The creation of new hypotheses involves factors that cannot be logically reconstructed.
        B: The justification of hypotheses is carried out solely through deductive arguments.
        C: The formulation of new hypotheses is carried out by means of induction.
        D: The justification of hypotheses requires the use of deductive and inductive arguments.
      explicacion: >-
        Both logical empiricism represented by Hempel and Popper's falsificationism hold that the process of
        generating hypotheses cannot be analyzed through logical reconstruction. The processes by which we
        evaluate a hypothesis, by contrast, can be analyzed through rational reconstruction. For logical
        empiricism represented by Hempel, we must use induction for this evaluation, but for Popper we must
        use only deductive reasoning in this process. Both also agree that it is necessary to offer a
        criterion for deciding which hypotheses belong to empirical science and which do not. However, each
        offers a different criterion. While logical empiricism represented by Hempel holds that the criterion
        the hypothesis must meet is its translatability into an observational language, Popper holds that the
        criterion to be met is falsifiability (that is, the possibility of formulating potential falsifiers).
    - fuente: 6a4c94c162
      enunciado: >-
        Indicate which of the following statements expresses a thesis shared by logical empiricism,
        represented by Hempel, and Popper's falsificationism.
      opciones:
        A: Every non-scientific statement must be classified as meaningless.
        B: When the test is not favorable, the hypothesis is refuted.
        C: Scientific progress is a purely cumulative process of true theories.
        D: It is possible to verify a universal hypothesis through observation.
      explicacion: >-
        This statement expresses a thesis shared by logical empiricism and falsificationism because both
        currents belong to the so-called "classical philosophy of science" and adopt the hypothetico-deductive
        model as the basis for analyzing testing. When an observational consequence turns out to be false
        after empirical testing, by applying the rule of Modus Tollens, the set of statements from which that
        consequence was deduced is also refuted or negated. Thus, both authors agree that the negative result
        of an empirical test has the logical force to lead the scientific community to reformulate or discard
        the set of statements being tested.
  q-f67bb93e:
    - fuente: 59e291b242
      enunciado: >-
        Determine whether the following statement is true or false and why, according to Kuhn's epistemology.

        During the pre-scientific period, the scientific community works under several paradigms
        simultaneously.
      opciones:
        A: The statement is false because during the pre-scientific period a single paradigm prevails.
        B: >-
          The statement is false because in the pre-scientific period a scientific community has not yet been
          formed.
        C: >-
          The statement is true because during the pre-scientific period there is competition among rival
          paradigms.
        D: >-
          The statement is true because the pre-scientific period arises from distrust in the prevailing
          paradigm.
      explicacion: >-
        For Kuhn, during the pre-scientific period the scientists of the discipline work in rival schools and
        have not yet been unified into a scientific community. Therefore, no paradigm has yet emerged in this
        period.
  q-ef9ffdca:
    - fuente: de1eafa080
      enunciado: >-
        A. Determine whether the following statement is true (T) or false (F) according to feminist standpoint
        theory.

        The inclusion of women's perspectives in gender studies favors the detection of inequalities.
      opciones:
        A: True (T)
        B: False (F)
      explicacion: >-
        Standpoint theory starts from the epistemic primacy of women's perspective (and, in general, that of
        other oppressed groups) over the dominant perspective of men. The reason for this primacy is that
        women have privileged access to the oppressive social relations in which they are embedded and are
        able to show that these oppressive relations are not the result of nature and necessity but of
        contingent history, and can therefore be changed.
