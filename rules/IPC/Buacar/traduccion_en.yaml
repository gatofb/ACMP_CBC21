        be recognized in different ways. On the one hand, because it is not possible for the premises to all
        be true and the conclusion false. On the other hand, we can look at their structure: if, when
        selecting the conclusion, we recognize one of the schemas presented in the reading material, such as
        Modus ponens, Modus tollens, Disjunctive syllogism, Universal instantiation, etc., we know that we are
        dealing with a valid form. In this case, there is only one statement that can be validly inferred,
        where the resulting argument is a case of Modus tollens.
  q-e605f40d:
    - fuente: adcfd52671
      enunciado: |-
        Given the following deduction:
        1. Bile is produced by the pancreas or by the liver. [Premise]
        2. If bile is produced by the liver, then it is stored in the gallbladder. [Premise]
        3. [*] [Premise]
        4. Bile is produced by the liver. [Disjunctive syllogism, 1 and 3]
        5. Bile is stored in the gallbladder. [Modus ponens, 2 and 4]
        Determine which premise is missing on the line marked with an asterisk [*].
      opciones:
        A: Bile is produced by the pancreas.
        B: Bile is not produced by the pancreas.
        C: Bile is not stored in the gallbladder.
        D: Bile is not produced by the liver.
        E: Bile is produced by the pancreas and by the liver.
      explicacion: >-
        The missing premise is "Bile is not produced by the pancreas". Remember that a disjunctive syllogism
        takes as premises a disjunction and the negation of one of the disjuncts, and from them concludes the
        remaining disjunct. Applying this rule to premises 1 and 3, you can validly deduce "Bile is produced
        by the liver".
  q-eefd6b56:
    - fuente: 5838d30b99
      enunciado: >-
        Determine which premise strengthens the following inductive argument without it ceasing to be an
        inductive argument by incomplete enumeration.

        The stomach, the small intestine and the esophagus are organs of the human digestive tract and have
        walls lined with smooth muscle tissue. Therefore, all the organs of the human digestive tract have
        walls lined with smooth muscle tissue.
      opciones:
        A: >-
          The large intestine is part of the human digestive tract and has walls lined with smooth muscle
          tissue.
        B: Some organs of the human digestive tract do not have walls lined with smooth muscle tissue.
        C: All the organs of the human digestive tract have walls lined with smooth muscle tissue.
        D: The appendix has walls lined with smooth muscle tissue.
      explicacion: >-
        An inductive argument by incomplete enumeration starts from the presence of a property in a sample and
        concludes that the property is present in the whole set to which the cases in that sample belong. The
        strongest inductive argument is the one in which the sample from which the conclusion generalizes is
        larger. Keep in mind that, for the argument to remain inductive, the sample cannot be the same as the
        set over which the generalization is made.
  q-f488c556:
    - fuente: 7345dd6c62
      enunciado: >-
        A. Given the following research case, identify the fundamental hypothesis.

        Does fiction make us more empathetic? The study of emotions has a long history; various genetic,
        cultural, psychological and social aspects have been the subject of countless scientific studies. The
        researchers David Kidd and Emanuele Castano set out to investigate whether reading fiction improves
        empathic skills. To do so, they carried out the following experiment. At the start of the study, the
        participants took the Reading the Mind in the Eyes Test (RMET), a test in which participants must
        recognize, by looking at photographs of different faces, the emotions the people photographed are
        experiencing, and they receive a score according to the number of correct recognitions. A higher RMET
        score indicates better empathic skills. They were then divided into two groups. Participants in one
        group were randomly assigned to read one of three short fiction texts, for example, a story by Anton
        Chéjov, while participants in the other group were assigned one of three short non-fiction texts, such
        as newspaper articles. After reading, all participants completed the RMET again and the results were
        compared. A greater increase in RMET results relative to the initial ones was recorded for the group
        that had read the fiction texts than for the group that had not.
      opciones:
        A: >-
          The RMET score will decrease relative to the initial one for empathetic people who read fiction
          texts.
        B: Various genetic, cultural, psychological and social aspects influence people's empathic skills.
        C: Reading fiction improves empathic skills.
        D: >-
          The RMET score will increase relative to the initial one in a greater proportion for the group that
          reads the fiction texts than for the group that reads non-fiction texts.
        E: A higher RMET score indicates better empathic skills.
        F: Reading fiction, compared with non-fiction texts, is preferred by more empathetic people.
      explicacion: >-
        This exercise asks you to identify the fundamental hypothesis of the research case presented. To do
        so, keep in mind that hypotheses are general statements. The fundamental hypothesis is the one that
        guides the research and is put to the test in the experiment.
  q-fd74dda8:
    - fuente: 70c478e248
      enunciado: >-
        A. Given the following research case, identify the fundamental hypothesis.

        Does fiction make us more empathetic? The study of emotions has a long history; various genetic,
        cultural, psychological and social aspects have been the subject of countless scientific studies. The
        researchers David Kidd and Emanuele Castano set out to investigate whether reading fiction improves
        empathic abilities. To do so, they carried out the following experiment. At the start of the study,
        the participants were given the Reading the Mind in the Eyes Test (RMET), a test in which participants
        must recognize, by looking at photographs of different faces, the emotions that the people
        photographed are experiencing, and they receive a score according to the number of correct
        recognitions. A higher score on the RMET indicates better empathic abilities. They were then divided
        into two groups. The participants in one of the groups were randomly assigned to read one of three
        short fiction texts, for example, a short story by Anton Chéjov, while the participants in the other
        group were assigned one of three short non-fiction texts, such as newspaper articles. After the
        reading, all participants completed the RMET again and the results were compared. A greater increase
        in RMET results relative to the initial ones was recorded for the group that had read the fiction
        texts than for the group that had not.

        B. Indicate why the statement you chose as the fundamental hypothesis can function as such in this
        research case.
      opciones:
        A: >-
          Because it is a general statement that has independent empirical support and that is indispensable
          for deducing the observational consequence.
        B: >-
          Because it is a general statement proposed with the aim of saving the hypothesis being tested from
          refutation.
        C: Because it is a general statement that is put to the test in the research.
        D: >-
          Because it is a singular or sample statement that is deduced from the hypothesis and expresses a
          fact that should occur if the hypothesis were true.
      explicacion: >-
        In this exercise you are asked to identify the fundamental hypothesis of the research case presented.
        To do so, it is important to bear in mind that hypotheses are general statements. The fundamental
        hypothesis is the one that guides the research and that is put to the test in the experiment.
  q-47c45a68:
