  q-02f72b02:
    - fuente: 6125e03b14
      enunciado: >-
        Given the following argument, determine which are the premises and which is the conclusion.

        The Netherlands, India and Bangladesh have progressive rises in sea level and are at risk of flooding.
        Therefore, Argentina is at risk of flooding, since it has progressive rises in sea level.
      opciones:
        A: >-
          Premise: Argentina has progressive rises in sea level.

          Premise: Argentina is at risk of flooding.

          Conclusion: The Netherlands, India and Bangladesh have progressive rises in sea level and are at
          risk of flooding.
        B: |-
          Premise: The Netherlands, India and Bangladesh have progressive rises in sea level and are at risk.
          Premise: Since Argentina has progressive rises in sea level.
          Conclusion: Therefore, Argentina is at risk of flooding.
        C: >-
          Premise: The Netherlands, India and Bangladesh have progressive rises in sea level and are at risk
          of flooding.

          Premise: Argentina is at risk of flooding.

          Conclusion: Argentina has progressive rises in sea level.
        D: >-
          Premise: The Netherlands, India and Bangladesh have progressive rises in sea level and are at risk
          of flooding.

          Premise: Argentina has progressive rises in sea level.

          Conclusion: Argentina is at risk of flooding.
      explicacion: >-
        To identify the answer, it is important to remember that there are certain expressions that, when
        present, help us identify the premises and the conclusion of an argument; in the book we call them
        premise indicators and conclusion indicators, respectively. In the given argument we find "since" as a
        premise indicator and "therefore" as a conclusion indicator. It is important to remember two things:
        (i) both the premises and the conclusion must be stated in full, and (ii) indicators are never part of
        the premises or the conclusion (for these two reasons option 2 is incorrect).
  q-89da5b3c:
    - fuente: e946905ec2
      enunciado: >-
        A. Determine whether the argument in exercise 1 is deductive (D) or inductive (I).

        Argument in exercise 1: The Netherlands, India and Bangladesh have progressive rises in sea level and
        are at risk of flooding. Therefore, Argentina is at risk of flooding, since it has progressive rises
        in sea level.
      opciones:
        A: Deductive (D)
        B: Inductive (I)
      explicacion: >-
        Deductive arguments can be recognized in different ways. On the one hand, because if we suppose that
        both premises are true, the conclusion is necessarily true. On the other hand, we can look at their
        structure: if we recognize one of the structures presented in the reading material, such as Modus
        Ponens, Modus Tollens, hypothetical syllogism, etc., we know we are dealing with a valid form. As for
        inductive arguments, it is conceivable for the premises to be true and the conclusion not. If we look
        at their structure and recognize one of the structures presented in the material, such as the
        inductive argument by incomplete enumeration, by analogy or the inductive syllogism, we know we are
        dealing with an invalid form. In this case the argument is an inductive argument, specifically an
        inductive argument by analogy, so its premises establish the conclusion with probability.
