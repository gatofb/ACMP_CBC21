  q-5b72b665:
    - fuente: c944eadde8
      enunciado: >-
        Determine whether the following statement is true (T) or false (F) according to Darwin's theory of
        natural selection.

        Organisms are identical to their parents.
      opciones:
        A: True (T)
        B: False (F)
      explicacion: >-
        In this exercise you are asked, in part A, to determine whether a statement is true or false according
        to Darwin's theory of natural selection and then, in part B, to choose the sentence that justifies
        your answer. The statement presented is false according to Darwin's theory, and the justification is
        that the variations observed from one generation to the next produce differences in the fitness of
        organisms, and natural selection operates by favoring the fittest organisms.
  q-3656a4ae:
    - fuente: 7e469207cc
      enunciado: >-
        Determine whether the following statement is true (T) or false (F) according to Darwin's theory of
        natural selection.

        Organisms are identical to their parents.

        Select the option that justifies your answer.
      opciones:
        A: The preservation of species requires offspring to be identical to their ancestors.
        B: Evolution makes each generation slightly more complex than the previous one.
        C: Natural selection guarantees that each generation is completely different from the previous one.
        D: From one generation to the next there are usually differences on which natural selection acts.
      explicacion: >-
        In this exercise you are asked, in part A, to determine whether a statement is true or false according
        to Darwin's theory of natural selection and then, in part B, to choose the sentence that justifies
