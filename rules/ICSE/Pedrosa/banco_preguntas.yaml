        sociales o políticas y consagrarse a la evangelización de una sociedad excesivamente secularizada.
      D: Revisando sus anteriores posiciones, la Iglesia se propuso renunciar a la injerencia directa en las cuestiones
        sociales o políticas y consagrarse a la evangelización de una sociedad que juzgaba excesivamente volcada
        hacia la izquierda.
