- id: q-f8411670
  tipo: vf_justificada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
  - 2C 2024
  versiones:
  - enunciado: Según señala Nicolás Simone, en marzo de 1971, el ejército designó presidente al Gral. Agustín Lanusse
      para pactar una transición a la democracia. Los militares buscaban controlar el proceso y abrieron negociaciones
      con los partidos políticos, incluyendo al peronismo.
    opciones:
      A: Es falso, porque Agustín Lanusse nunca fue presidente ni en dictadura ni en democracia.
      B: Es falso, porque los militares en el poder no negocian nunca con la oposición y menos con los partidos
        políticos tradicionales.
      C: Es verdadero, porque los militares en el poder se sentían muy cercanos al peronismo, debido a que Perón
        había sido un militar de carrera casi toda su vida.
      D: Es verdadero, porque la propuesta consistía en que, a cambio de llamar a elecciones, Perón quedara excluido
        de las mismas. Los partidos rechazaron formalmente la invitación, pero aprovecharon la situación para tejer
        algunos acuerdos.
    clave: D
    correctas:
    - Es verdadero, porque la propuesta consistía en que, a cambio de llamar a elecciones, Perón quedara excluido
      de las mismas. Los partidos rechazaron formalmente la invitación, pero aprovecharon la situación para tejer
      algunos acuerdos.
    apariciones:
