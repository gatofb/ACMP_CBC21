        histórico.
      D: Eran medidas similares a las aplicadas entre 1955 y 1958, ya que el radicalismo se oponía a lo que planteaba
        el peronismo histórico.
      E: Las opciones correctas son la A y la B.
      F: Las opciones correctas son la A y la C.
