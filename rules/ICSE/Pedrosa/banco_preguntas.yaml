- id: q-146be346
  tipo: vf_justificada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
  - 2C 2024
  versiones:
  - enunciado: Según Margarita Batlle, en determinadas circunstancias los funcionarios públicos electos pueden (y
      deben) ser condicionados por personas sin representación popular electoral.
    opciones:
      A: Es falso, porque debe existir una subordinación de los funcionarios públicos no elegidos a aquellos elegidos
        popularmente.
      B: Es falso, porque funcionarios políticos no deben rendir cuentas ni ser controlados por instituciones como
        la justicia o los parlamentos
      C: Es verdadero, porque debe haber una persona o grupo que posea el poder (o pueda condicionarlo) sin haber
        sido electo de manera democrática, es decir, a través de elecciones.
      D: Es verdadero, porque debe existir una subordinación de funcionarios públicos electos a los designados por
        el presidente o el Congreso.
    clave: A
    correctas:
    - Es falso, porque debe existir una subordinación de los funcionarios públicos no elegidos a aquellos elegidos
      popularmente.
    apariciones:
    - archivo: 1er_Parcial_-_2do_C._2024_-_Tema_9.pdf
      instancia: 1er Parcial
      cuatrimestre: 2C 2024
      tema: 9
      consigna: 4
- id: q-a587b241
  tipo: vf_justificada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
  - 2C 2024
  versiones:
  - enunciado: En el video en que Eduardo Levy Yeyati entrevista a Pablo Gerchunoff, el entrevistado señala que,
      aunque Raúl Alfonsín dictara el indulto, el hecho de antes haber puesto a los comandantes presos, aunque sea
      solo por dos años, fue todo un logro de la joven democracia argentina.
    opciones:
      A: Es verdadero, porque la sanción de las leyes de Punto Final y Obediencia Debida les permitió a los militares
        ser liberados luego de la condena en el famoso juicio de 1985 y por ello acceder luego al indulto posterior.
      B: Es falso, porque los militares argentinos recién comenzaron a ser juzgados durante el gobierno de Néstor
        Kirchner en 2003.
      C: Es verdadero, porque debido a los levantamientos carapintadas y la sanción de las leyes de Punto Final
        y Obediencia Debida, de 1987, los miembros de las juntas condenados en 1985 abandonaron la prisión al final
        del mandato del presidente radical.
      D: Es falso, porque Alfonsín dejó la presidencia en 1989 con los comandantes presos y éstos recién fueron
        indultados poco después por el presidente peronista Carlos Menem.
    clave: D
    correctas:
    - Es falso, porque Alfonsín dejó la presidencia en 1989 con los comandantes presos y éstos recién fueron indultados
      poco después por el presidente peronista Carlos Menem.
    apariciones:
    - archivo: 1er_Parcial_-_2do_C._2024_-_Tema_9.pdf
      instancia: 1er Parcial
      cuatrimestre: 2C 2024
      tema: 9
      consigna: 6
- id: q-dd5df609
  tipo: combinada
