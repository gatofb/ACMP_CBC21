  versiones:
  - enunciado: 'Según Nicolás Simone, en las transiciones a la democracia los pactos entre los dirigentes de las
      elites de distintos partidos son importantes por diversos motivos. Entre ellos, porque:'
    opciones:
      A: Son una garantía para que los sectores nostálgicos del Régimen autoritario armen el nuevo Gobierno, que
        suceda la dictadura en retirada.
