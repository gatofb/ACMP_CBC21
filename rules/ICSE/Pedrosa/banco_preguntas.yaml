  versiones:
  - enunciado: 'En enero de 1989 un grupo terrorista asaltó el cuartel de La Tablada en el Gran Buenos Aires, y
      el Ejército encontró la ocasión para realizar una aplastante demostración de fuerza que culminó con el aniquilamiento
      de los asaltantes. Según Romero, esto implicó que:'
    opciones:
      A: El recuerdo del pasado de la represión ilegal volvió a la opinión pública que repudió sin fisuras el hecho
        y eso le dio aire político al gobierno de Alfonsín que había logrado juzgar a las juntas militares.
      B: Podía anticiparse que finalmente la cuestión militar abierta llevaría al olvido de los crímenes de la "guerra
        sucia" y el entierro de las ilusiones de la civilidad de 1983.
      C: El reconocimiento de la represión militar fuera el primer indicio del cambio de prioridades y valores en
        la opinión pública.
      D: El rechazo que la represión militar recogió por la acción fue un nuevo indicio del cambio de época que
        había comenzado en 1983.
      E: Las opciones correctas son la A y la B.
      F: Las opciones correctas son la B y la C.
      G: Las opciones correctas son la C y la D.
      H: Las opciones correctas son la A y la D.
    clave: F
    correctas:
    - Podía anticiparse que finalmente la cuestión militar abierta llevaría al olvido de los crímenes de la "guerra
      sucia" y el entierro de las ilusiones de la civilidad de 1983.
    - El reconocimiento de la represión militar fuera el primer indicio del cambio de prioridades y valores en la
      opinión pública.
