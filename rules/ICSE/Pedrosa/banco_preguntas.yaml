- id: q-25f11a44
  tipo: vf_justificada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
  - 2C 2025
  versiones:
  - enunciado: En el video en el que Eduardo Levy Yeyati entrevista a Pablo Gerchunoff sobre la figura de Raúl Alfonsín,
      Gerchunoff destaca que fue fundamental el decreto del Gobierno radical que habilitó al Consejo Supremo de
      las Fuerzas Armadas para juzgar a las Juntas militares.
    opciones:
      A: Es falso, porque los militares argentinos recién comenzaron a ser juzgados durante el Gobierno de Néstor
        Kirchner en 2003.
      B: Es falso, porque hubo un solo juicio a las Juntas militares y no fue el del Consejo Supremo de las Fuerzas
        Armadas.
      C: Es verdadero, porque el decreto mencionado por el entrevistado les permitió a los militares ser absueltos
        en primera instancia, y por ello acceder luego al indulto posterior que el mismo Alfonsín se vio obligado
        a dictar.
      D: Es verdadero, porque si Alfonsín no hubiera firmado el decreto que enviaba a las Juntas militares a ser
        juzgadas primero por sus propios pares, no hubiera existido el famoso juicio posterior.
    clave: D
    correctas:
    - Es verdadero, porque si Alfonsín no hubiera firmado el decreto que enviaba a las Juntas militares a ser juzgadas
      primero por sus propios pares, no hubiera existido el famoso juicio posterior.
    apariciones:
