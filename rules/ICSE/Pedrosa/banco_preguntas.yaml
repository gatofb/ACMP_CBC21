  versiones:
  - enunciado: Luis A. Romero sostiene que para 1975 el gobierno peronista se encaminaba hacia su final. El Rodrigazo
      —denominado así por el apellido del ministro de Economía del gobierno peronista, Celestino Rodrigo— desató
      una crisis económica que resultó imposible de controlar.
    opciones:
      A: Es verdadero, porque el Rodrigazo implicó "corridas" hacia el dólar, inflación galopante y la aparición
        de los mecanismos de indexación.
      B: Es verdadero, porque fue el primer default (suspensión del pago de la deuda externa) y el inicio de un
        aislamiento internacional del país y fuertes costos judiciales en el exterior.
      C: Es falso, porque el Rodrigazo fue un movimiento de protesta social surgido en la provincia de Santa Fe
        basado en los productores agrícolas.
      D: Es falso, porque en 1975 ya estaban gobernando los militares de la mano del Gral. Jorge R. Videla.
    clave: A
    correctas:
    - Es verdadero, porque el Rodrigazo implicó "corridas" hacia el dólar, inflación galopante y la aparición de
      los mecanismos de indexación.
