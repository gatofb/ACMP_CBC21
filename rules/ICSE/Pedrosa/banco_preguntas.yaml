  versiones:
  - enunciado: 'Según Enrique García, el Estado liberal se apoya en la creencia de leyes naturales del mercado (leyes
      de oferta y demanda y libre competencia) y en la iniciativa individual. Esto es así porque:'
    opciones:
      A: Se trata de un Estado interventor en la esfera económica que busca regular para que los mercados sean más
        eficientes.
      B: Es un Estado mínimo que concibe al mercado como el único capaz de asignar eficientemente los recursos.
      C: Los liberales creen que el espíritu de lucro individual promueve el beneficio personal y el mejoramiento
        del conjunto de la sociedad.
      D: Los liberales creen que el Estado podría ser un exitoso y eficiente empresario si fuera dirigido por personas
        que supieran de economía.
      E: Las opciones correctas son la A y la B.
      F: Las opciones correctas son la C y la D.
      G: Las opciones correctas son la B y la C.
      H: 'Las opciones correctas son la A, la B y la C. DNI:'
    clave: G
    correctas:
    - Es un Estado mínimo que concibe al mercado como el único capaz de asignar eficientemente los recursos.
    - Los liberales creen que el espíritu de lucro individual promueve el beneficio personal y el mejoramiento del
      conjunto de la sociedad.
    apariciones:
    - archivo: 1er_Parcial_-_2do_C._2024_-_Tema_9.pdf
      instancia: 1er Parcial
      cuatrimestre: 2C 2024
      tema: 9
      consigna: 7
- id: q-eb51cdff
  tipo: combinada
