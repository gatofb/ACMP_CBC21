- id: q-86349768
  tipo: combinada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
  - 2C 2024
  versiones:
  - enunciado: 'Según Romero, al asumir Alfonsín en 1983, debió optar entre tensar al máximo el polo de la civilidad
      (lo que implicaba confrontar con intereses establecidos, incluso entre sus apoyos) o, por otro lado, privilegiar
      soluciones consensuadas y evitar tantos conflictos. Por eso:'
    opciones:
      A: El gobierno radical eligió en general la segunda línea, y un resultado de eso fue el llamado Pacto de Olivos
        que Alfonsín logró consensuar con el peronismo.
      B: El gobierno radical se sostuvo firmemente en la primera línea los 4 años de su mandato presidencial, confrontando
        hasta el último día con sindicatos, militares, opositores y la Iglesia católica.
      C: El gobierno radical eligió en general la primera línea y hasta 1987 mantuvo la iniciativa, buscando caminos
        alternativos y presentando, ante cada contraste, nuevas propuestas.
      D: El gobierno radical eligió en general la primera línea, pero debió aceptar la segunda cuando algunos fuertes
        contratiempos le demostraron los límites de su poder.
      E: Las opciones correctas son la A y la D.
      F: Las opciones correctas son la B y la C.
      G: Las opciones correctas son la C y la D.
      H: Las opciones correctas son la A, la C y la D.
    clave: G
    correctas:
    - El gobierno radical eligió en general la primera línea y hasta 1987 mantuvo la iniciativa, buscando caminos
      alternativos y presentando, ante cada contraste, nuevas propuestas.
    - El gobierno radical eligió en general la primera línea, pero debió aceptar la segunda cuando algunos fuertes
