      B: El Gobierno, a diferencia del Estado, es una estructura de existencia permanente.
      C: El Gobierno está compuesto por quienes, en forma contingente y coyuntural, administran el Estado.
      D: El Estado, a diferencia del Gobierno, es una estructura de existencia permanente.
