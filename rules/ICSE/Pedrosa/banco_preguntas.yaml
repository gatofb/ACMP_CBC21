  versiones:
  - enunciado: 'Según Enrique García, el Estado de bienestar o benefactor se desarrolló en Occidente a partir de
      1945, es decir, con posterioridad a la Segunda Guerra Mundial (1939-1945). Esto ocurrió porque:'
    opciones:
      A: El Estado de bienestar fue la primera organización estatal exitosa por fuera del capitalismo que triunfó
        en Occidente.
      B: Con este tipo de Estado se buscaba retomar el rumbo del crecimiento y de la estabilidad social ante el
        avance del comunismo.
      C: Este tipo de Estado se conformó para dar solución a los efectos económicos y sociales que la guerra había
        provocado.
      D: El Estado de bienestar fue consecuencia del enorme éxito de la economía soviética, y por ello fue imitado
        por Occidente.
      E: Las opciones correctas son la A y la B.
      F: Las opciones correctas son la B y la C.
      G: Las opciones correctas son la C y la D.
      H: Las opciones correctas son la B, la C y la D.
    clave: F
    correctas:
    - Con este tipo de Estado se buscaba retomar el rumbo del crecimiento y de la estabilidad social ante el avance
      del comunismo.
    - Este tipo de Estado se conformó para dar solución a los efectos económicos y sociales que la guerra había
      provocado.
