      de adoptar en la práctica.
    opciones:
      A: Es falso, porque numerosos países han vivido en democracia en este siglo y en los anteriores.
      B: Es verdadero, porque significa que la democracia es un orden utópico e ideal al que no puede aspirar la
        sociedad.
      C: Es falso, porque no existen cuestiones utópicas para que los seres humanos organicen sus sociedades.
      D: Es verdadero, porque la única democracia verdadera es la que se registra en asambleas donde participan
        todos los ciudadanos.
