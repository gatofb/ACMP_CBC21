        política lo que los académicos elaboraban, resultó moderno, complejo y profundo.
      B: El peronismo logró rápidamente el control de la vida institucional y política en las universidades nacionales
        que ya mantenían desde los años 70.
      C: Dirigentes peronistas también recurrieron a ellos y la discusión política luego de finalizada la dictadura
        adquirió brillo y, en menor medida, profundidad.
      D: Las listas de concejales, diputados y senadores se repletaron de académicos e intelectuales dejando de
        lado a políticos tradicionales.
      E: Las opciones correctas son la A y la B.
      F: Las opciones correctas son la C y la D.
      G: Las opciones correctas son la A y la C.
      H: Las opciones correctas son la A, la B y la C.
