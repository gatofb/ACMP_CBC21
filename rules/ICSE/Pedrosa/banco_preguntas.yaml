  cuatrimestres:
  - 2C 2024
  versiones:
  - enunciado: 'Según Verónica Beyreuther, los regímenes dictatoriales excluyen cualquier posibilidad de división
      de los poderes del Estado, propios de la democracia o la República: los poderes legislativo, judicial y ejecutivo.'
    opciones:
      A: Es verdadero, porque el dictador retoma el modelo de las monarquías constitucionales, ocupando, desde un
        lugar de fuerza, el lugar del monarca.
      B: Es verdadero, porque en una dictadura la idea de un poder dividido, es decir compartido y con mecanismos
        que impidan la suma total en uno de los poderes, resulta inconducente.
      C: Es falso, porque aún en las dictaduras, el poder tiene que mostrar algunas formas de respeto al control
        que ejerce el Poder Legislativo sobre el Ejecutivo.
      D: Es falso, porque aún en las dictaduras, el poder tiene que mostrar respeto al control que ejerce el Poder
        Judicial sobre el Ejecutivo.
    clave: B
    correctas:
    - Es verdadero, porque en una dictadura la idea de un poder dividido, es decir compartido y con mecanismos que
      impidan la suma total en uno de los poderes, resulta inconducente.
