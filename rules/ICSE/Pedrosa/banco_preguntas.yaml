- id: q-3dda527d
  tipo: combinada
  puntos: 1.0
  veces_tomada: 1
  cuatrimestres:
  - 2C 2024
  versiones:
  - enunciado: 'Según Romero, el 1º de mayo de 1974, se llegó a la ruptura entre Perón y los Montoneros al abandonar
      éstos una Plaza de donde el propio Perón los expulsaba. Esto implicó que:'
    opciones:
      A: Perón reemplazara a los Montoneros por otro grupo de izquierda llamado Ejército Revolucionario del Pueblo
        (ERP).
      B: Los montoneros optaran por volver a la vieja táctica y pasaran a la clandestinidad. Hubo más asesinatos
        y secuestros espectaculares para mejorar sus finanzas.
      C: Los montoneros reaparecieran una vez más, apenas dos meses después, en los fantásticos funerales de Perón,
        y luego pretendieran asumir su herencia en forma fracasada.
      D: Que los Montoneros se aliaran a los militares golpistas para derrocar al viejo líder que los había expulsado
        de la plaza.
      E: Las opciones correctas son la A y la C.
      F: Las opciones correctas son la B y la C.
      G: Las opciones correctas son la A, la B y la C.
      H: Las opciones correctas son la B, la C y la D.
