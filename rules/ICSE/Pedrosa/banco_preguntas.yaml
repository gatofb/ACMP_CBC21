  versiones:
  - enunciado: 'Según consta en el texto sobre genocidio de Javier Hermo, las Naciones Unidas generaron una definición
      desde un punto de vista jurídico y político, al igual que años después con la Corte Penal Internacional. Entre
      los puntos centrales de la definición de “genocidio” se encontraban:'
