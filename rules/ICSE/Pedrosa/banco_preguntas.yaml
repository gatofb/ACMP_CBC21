- id: q-d47b26d4
  tipo: combinada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
  - 2C 2024
  versiones:
  - enunciado: 'Según Graciela Etchevest, la violencia terrorista ha cambiado desde las últimas décadas del siglo
      XX al siglo XXI. Esto se vio en que:'
    opciones:
      A: Con el nuevo siglo se sumaron grupos religiosos radicalizados cuyo accionar ha tenido un fuerte impacto
        en la agenda mundial, principalmente, de la mano del llamado “fundamentalismo islámico”.
      B: 'Con el nuevo siglo este nuevo tipo de terrorismo incorpora una novedad con respecto al que lo precede:
        su accionar se organiza a partir de grupos más pequeños, con un eficiente uso de herramientas tecnológicas
        y muchas veces ligadas a las redes sociales.'
      C: Los espacios para su acción se restringen al continente de origen; de hecho, a veces no tienen un país
        de origen y sus escenarios son regionales según la coyuntura y las posibilidades de organizarse.
      D: Los espacios para su acción se restringen al país de origen; de modo de maximizar los recursos y lograr
        un efecto más poderoso, como, por ejemplo, el ataque a las Torres Gemelas en Estados Unidos en 2001.
      E: Las opciones correctas son la A, y B.
      F: Las opciones correctas son la B, y D.
      G: Las opciones correctas son la C, y A.
      H: Las opciones correctas son la A, B y D.
    clave: E
    correctas:
    - Con el nuevo siglo se sumaron grupos religiosos radicalizados cuyo accionar ha tenido un fuerte impacto en
      la agenda mundial, principalmente, de la mano del llamado “fundamentalismo islámico”.
    - 'Con el nuevo siglo este nuevo tipo de terrorismo incorpora una novedad con respecto al que lo precede: su
      accionar se organiza a partir de grupos más pequeños, con un eficiente uso de herramientas tecnológicas y
      muchas veces ligadas a las redes sociales.'
