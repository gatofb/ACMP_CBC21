- id: q-85b635b6
  tipo: vf_justificada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
  - 1C 2024
  versiones:
  - enunciado: Luis A. Romero afirma que para 1975 el Gobierno peronista se acercaba a su final. El "Rodrigazo"
      había desatado una crisis económica que resultó imposible de dominar.
    opciones:
      A: Es falso, porque en 1975 ya estaban gobernando los militares de la mano del Gral. Jorge R. Videla.
      B: Es falso, porque el “Rodrigazo” fue un movimiento de protesta social surgido en Santa Fe, basado en los
        productores agrícolas.
      C: Es verdadero, porque fue el primer default (suspensión del pago de la deuda externa) y el inicio de un
        aislamiento internacional del país y fuertes costos judiciales en el exterior.
      D: Es verdadero, porque el “Rodrigazo” implicó la aparición de los mecanismos de indexación y, en general,
        escasas posibilidades para controlar la coyuntura desde el poder.
    clave: D
    correctas:
    - Es verdadero, porque el “Rodrigazo” implicó la aparición de los mecanismos de indexación y, en general, escasas
      posibilidades para controlar la coyuntura desde el poder.
    apariciones:
    - archivo: Recuperatorio_1er_Parcial_-_1er_C._2024_-_Tema_2.pdf
      instancia: Recuperatorio 1er Parcial
      cuatrimestre: 1C 2024
      tema: 2
      consigna: 1
- id: q-46512c49
  tipo: vf_justificada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
  - 1C 2024
  versiones:
  - enunciado: 'Según Romero, la ejecución de la transformación económica que planteaba la última dictadura abría
      un problema político, que ha expuesto Jorge Schvarzer: la conducción económica debía durar un tiempo bastante
      limitado para que la corrupción no se vuelva un tema endémico.'
    opciones:
      A: Es falso, porque la conducción económica debía durar en el poder un tiempo suficiente como para que los
        cambios fueran irreversibles.
      B: Es verdadero, porque la corrupción se había instalado desde tiempo atrás como la base que estructuraba
        toda la política argentina, y terminar con eso fue el motivo central por el cual los militares tomaron el
        poder.
      C: Es falso, porque el tiempo que durara la conducción económica no era tan relevante como la estabilidad
        de sus alianzas corporativas.
      D: Es verdadero, porque la mayoría de los militares tenían un proyecto neoliberal y se oponían al Ministro
        de Economía Martínez de Hoz, que venía de una tradición estatista y era sostenido solo por el presidente
        Videla.
    clave: A
    correctas:
    - Es falso, porque la conducción económica debía durar en el poder un tiempo suficiente como para que los cambios
      fueran irreversibles.
    apariciones:
    - archivo: Recuperatorio_1er_Parcial_-_1er_C._2024_-_Tema_2.pdf
      instancia: Recuperatorio 1er Parcial
      cuatrimestre: 1C 2024
      tema: 2
      consigna: 3
- id: q-ac0b8ed4
  tipo: vf_justificada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
  - 1C 2024
  versiones:
  - enunciado: Romero afirma que la ocupación de las Islas Malvinas en abril de 1982 era la solución para muchos
      de los problemas que tenía el gobierno en ese momento.
    opciones:
      A: Es verdadero, porque una acción militar para lo que llamaban "recuperar las islas”, permitiría ganar de
        un golpe la cuestionada legitimidad ante una sociedad visiblemente disconforme.
      B: 'Es verdadero, porque una acción militar en Malvinas tendría una gran ventaja: estaba lejos del continente
        y permitía distraer la atención del conflicto con el Gobierno brasileño por cuestiones vinculadas a importaciones
        y exportaciones.'
      C: Es falso, porque Malvinas era un reclamo importante de muchos argentinos y "recuperar las islas” podría
        llevar a la unificación de la población detrás del gobierno de Alfonsín, en un momento en que estaba muy
        debilitado políticamente.
      D: Es falso, porque el ímpetu bélico del entonces presidente Galtieri se vio estimulado por apoyos sociales
        que incluyeron movilizaciones callejeras a favor de su designación y liderazgo, como la marcha lanzada por
        la CGT el 30 de marzo de 1982.
    clave: A
    correctas:
    - Es verdadero, porque una acción militar para lo que llamaban "recuperar las islas”, permitiría ganar de un
      golpe la cuestionada legitimidad ante una sociedad visiblemente disconforme.
