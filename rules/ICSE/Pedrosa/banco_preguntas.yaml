  cuatrimestres:
  - 2C 2024
  versiones:
  - enunciado: 'Según Romero, la gran popularidad alcanzada por el presidente Alfonsín en distintos lugares del
      mundo, fue utilizada para afianzar y fortalecer las instituciones democráticas locales, todavía precarias.
      Con esos criterios se encararon algunas de las siguientes cuestiones pendientes a nivel internacional:'
    opciones:
      A: Con Chile por un diferendo en el Canal del Beagle.
      B: Con Uruguay, por el destino de unas papeleras a construirse en la costa del río Uruguay, cerca de la ciudad
