  versiones:
  - enunciado: 'Romero relata que la ley del divorcio de 1987 se aprobó durante el Gobierno del radical Raúl Alfonsín
      luego de una breve, pero muy intensa discusión. Esta intensidad estuvo relacionada con que:'
    opciones:
      A: Fue el punto culminante de la modernización cultural iniciada en 1983.
      B: Fue el momento en que se formalizó la ruptura de relaciones diplomáticas entre Argentina y el Vaticano.
      C: Los sectores tradicionales de la Iglesia católica se opusieron apelando a mecanismos habituales de presión
        y a otros más novedosos.
      D: Los sectores más tradicionales del partido radical intentaron oponerse bloqueando su tratamiento en el
        Congreso.
      E: Las opciones correctas son la A y la C.
      F: Las opciones correctas son la A y la B.
      G: Las opciones correctas son la C y la D.
      H: Las opciones correctas son la A, la C y la D.
    clave: E
    correctas:
    - Fue el punto culminante de la modernización cultural iniciada en 1983.
    - Los sectores tradicionales de la Iglesia católica se opusieron apelando a mecanismos habituales de presión
      y a otros más novedosos.
