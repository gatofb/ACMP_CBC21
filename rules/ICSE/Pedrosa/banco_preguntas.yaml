- id: q-8b79eae8
  tipo: combinada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
  - 1C 2024
  versiones:
  - enunciado: 'Romero señala que la Iglesia, que en 1981 se había definido por la democracia –aunque sin hacer
      la crítica de su relación con el gobierno militar–, fue evolucionando hacia una creciente hostilidad para
      con el gobierno radical encabezado por Alfonsín. Eso fue así porque:'
    opciones:
      A: Las autoridades eclesiásticas estaban irritadas por su escasa injerencia en el área de la enseñanza privada.
      B: Las autoridades eclesiásticas rechazaban el tono laico del discurso cultural que circulaba por las instituciones
        y los medios del Estado.
      C: 'Un sector de la Iglesia asumió el papel de censor social, con un discurso de combate. La democracia –decían–
        resultaba ser responsable de los males del siglo: el juego y las apuestas, las redes sociales y el multiculturalismo.'
