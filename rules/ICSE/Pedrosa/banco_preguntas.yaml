      C: Hizo una reivindicación de los aspectos éticos de la política y un discurso ganador, muy distinto del tradicional
        discurso radical, que atrajeron al partido a una masa de afiliados y simpatizantes.
      D: Durante el Proceso se distinguió del resto de los políticos, pues criticó a los militares con mucha energía
        y al mismo tiempo fue uno de los grandes promotores de la euforia popular durante la Guerra de Malvinas.
      E: Las opciones correctas son la A y la B.
