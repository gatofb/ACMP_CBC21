      y asumió la defensa de detenidos políticos y el reclamo por los desaparecidos.
    - Hizo una reivindicación de los aspectos éticos de la política y un discurso ganador, muy distinto del tradicional
      discurso radical, que atrajeron al partido a una masa de afiliados y simpatizantes.
