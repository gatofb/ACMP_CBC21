  versiones:
  - enunciado: 'Romero afirma que, entre 1975 y principios de 1976, diversos factores fueron creando las condiciones
      para la aceptación de un golpe de Estado que prometía restablecer el orden y asegurar el monopolio estatal
      de la fuerza. Entre ellos se puede mencionar:'
    opciones:
      A: La muerte presente cotidianamente, la acción espectacular de las organizaciones guerrilleras -que habían
        fracasado en dos grandes operativos contra unidades militares en el Gran Buenos Aires y en Formosa-.
      B: El terror sembrado por la Alianza Anticomunista Argentina (Triple A).
      C: La presencia constante y pública en el país del Partido Comunista soviético a través de financiamiento,
        propaganda y una nutrida militancia que hacían suponer la pronta apertura de un frente revolucionario.
      D: El terror sembrado por diversas bandas del crimen organizado, la mayoría de ellas vinculadas al narcotráfico.
      E: Las opciones correctas son la A y la B.
      F: Las opciones correctas son la A y la D.
      G: Las opciones correctas son la B y la D.
      H: Las opciones correctas son la C y la D.
    clave: E
