- id: q-17bf5e88
  tipo: vf_justificada
  puntos: 0.5
  veces_tomada: 2
  cuatrimestres:
  - 1C 2026
  versiones:
  - enunciado: Según Patricio Gómez Talavera es necesario observar una distinción importante entre Estado y gobierno.
    opciones:
      A: Es falso, porque los miembros del gobierno no tienen un mandato temporalmente determinado, a diferencia
        de los encargados de administrar la estructura burocrática del Estado que asumen con un mandato fijo de
        una cierta cantidad de años.
      B: Es verdadero, porque el Estado es una estructura de existencia permanente, aunque puede cambiar en sus
        formas.
      C: Es verdadero, porque el gobierno es una estructura de existencia permanente, aunque puede cambiar en sus
        formas.
      D: Es falso, porque los miembros del Estado tienen un mandato temporalmente determinado, tras el cual deberán
        dejar sus puestos a nuevos encargados de administrar la estructura burocrática del gobierno.
    clave: B
    correctas:
    - Es verdadero, porque el Estado es una estructura de existencia permanente, aunque puede cambiar en sus formas.
