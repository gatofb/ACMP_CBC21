  - enunciado: 'Según Romero, algunos de los acontecimientos más importantes de la transición en Argentina fueron
      los ocurridos en la Semana Santa de 1987, cuando un levantamiento militar puso a prueba la estabilidad democrática.
      Eso fue así porque:'
    opciones:
      A: Fue una sublevación de sectores militares que exigían el fin de los juicios contra los oficiales involucrados
        en la represión durante la dictadura militar que había terminado algunos años antes.
      B: El levantamiento fue sofocado inmediatamente con una intervención militar ordenada por el presidente Alfonsín,
        sin necesidad de mayores negociaciones.
      C: Fue un intento de golpe de Estado exitoso que obligó a Raúl Alfonsín a renunciar antes de completar su
        mandato.
      D: Fue un punto de inflexión en la relación entre el Gobierno y los militares, desembocando luego en la sanción
        de la Ley de Obediencia Debida.
      E: Las opciones correctas son la A y la B.
