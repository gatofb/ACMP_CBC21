- id: q-982eb0c5
  tipo: combinada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
  - 1C 2024
  versiones:
  - enunciado: 'Según Florencia Deich, el caso del presidente Arturo Frondizi y su reemplazo en 1963 es complejo
      para analizar a la hora de definir si fue un Golpe de Estado o una interrupción institucional. Esto es así
      porque:'
    opciones:
      A: Los militares finalmente decidieron quitar a Frondizi del poder y, en este sentido, su accionar fue exitoso
        porque lograron cumplir con todos sus objetivos, ya que colocaron una persona de las Fuerzas Armadas en
        la presidencia.
      B: La forma que tomaron los acontecimientos generó complicaciones a la hora de definir el tipo de régimen,
        ya que el presidente legítimo fue destituido por la presión militar, pero el que asumió en su lugar lo hizo
        respetando las reglas de sucesión previstas en la Constitución.
      C: Los militares finalmente decidieron quitar a Frondizi del poder y, en este sentido, su accionar fue exitoso;
        sin embargo, no lograron cumplir con todos sus objetivos, ya que no colocaron una persona de las Fuerzas
        Armadas en la presidencia.
      D: La forma que tomaron los acontecimientos no generó complicaciones a la hora de definir el tipo de régimen
        ya que, el presidente legítimo fue destituido por la presión militar, pero el que asumió en su lugar lo
        hizo respetando las reglas de sucesión previstas en la Constitución.
      E: Las opciones correctas son la A y la B.
      F: Las opciones correctas son la B y la C.
      G: Las opciones correctas son la C y la D.
      H: Las opciones correctas son la A y la D.
    clave: F
    correctas:
    - La forma que tomaron los acontecimientos generó complicaciones a la hora de definir el tipo de régimen, ya
      que el presidente legítimo fue destituido por la presión militar, pero el que asumió en su lugar lo hizo respetando
      las reglas de sucesión previstas en la Constitución.
    - Los militares finalmente decidieron quitar a Frondizi del poder y, en este sentido, su accionar fue exitoso;
