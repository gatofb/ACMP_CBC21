- id: q-b9349c41
  tipo: combinada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
  - 2C 2024
  versiones:
  - enunciado: 'Romero señala que, en septiembre de 1987, luego de la derrota electoral del presidente Raúl Alfonsín
      en las elecciones parlamentarias de medio término, la posición del gobierno se debilitó aceleradamente. Esto
      ocasionó que:'
    opciones:
      A: La inestabilidad y la sensación de falta de gobernabilidad fueran crecientes.
      B: El peronismo, apuntando con nuevo optimismo a las elecciones presidenciales de 1989, se negó a respaldar
        reformas cuyo costo social era evidente.
      C: La obligada reconciliación con las corporaciones, si bien supuso un fuerte deterioro de la imagen del gobierno
        radical ante la civilidad, rindió algunos de los frutos esperados en el terreno económico.
      D: El sector kirchnerista del peronismo tomase el control del partido con su posición más dura frente al debilitado
        gobierno de Alfonsín.
      E: Las opciones correctas son la A y la B.
      F: Las opciones correctas son la C y la B.
      G: Las opciones correctas son la A y la D.
      H: Las opciones correctas son la A, la B, la C y la D.
    clave: E
    correctas:
    - La inestabilidad y la sensación de falta de gobernabilidad fueran crecientes.
    - El peronismo, apuntando con nuevo optimismo a las elecciones presidenciales de 1989, se negó a respaldar reformas
      cuyo costo social era evidente.
    apariciones:
