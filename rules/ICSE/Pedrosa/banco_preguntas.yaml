- id: q-90304d80
  tipo: combinada
  puntos: 1.0
  veces_tomada: 1
  cuatrimestres:
  - 2C 2024
  versiones:
  - enunciado: 'Según Romero, al asumir la presidencia, Alfonsín proponía algunas distinciones lógicas sobre el
      legado militar pero, a la vez, eran difíciles de ser admitidas por la sociedad movilizada y, en particular,
      por las organizaciones de derechos humanos. Esto fue así porque:'
    opciones:
      A: Alfonsín pensaba que había que separar el juicio a los culpables del juzgamiento a la institución, que
        era parte del Estado.
      B: Alfonsín pensaba que había que evitar el juicio a los culpables porque implicaba atacar a toda la institución
        que era parte del Estado.
      C: Alfonsín no había condenado las violaciones a los derechos humanos en la dictadura y continuó esa línea
        durante su gobierno.
      D: Alfonsín pensaba que se debía concentrar el castigo en las cúpulas y aplicar al resto el criterio de la
        obediencia debida.
      E: Las opciones correctas son la A y la B.
      F: Las opciones correctas son la B y la C.
      G: Las opciones correctas son la C y la D.
      H: Las opciones correctas son la D y la A.
    clave: H
    correctas:
    - Alfonsín pensaba que se debía concentrar el castigo en las cúpulas y aplicar al resto el criterio de la obediencia
      debida.
    - Alfonsín pensaba que había que separar el juicio a los culpables del juzgamiento a la institución, que era
      parte del Estado.
    apariciones:
