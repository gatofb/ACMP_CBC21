  versiones:
  - enunciado: Según Max Povse, para ser híbrido, un régimen debe tener indicadores con valores tanto democráticos
      como autoritarios.
    opciones:
      A: Es verdadero, porque los regímenes políticos son pluralistas y ofrecen todo tipo de posibilidades ideológicas
        en su interior.
      B: Es falso, porque la democracia no tiene nada que ver con los sistemas autoritarios. Es uno o el otro.
      C: Es falso, porque eso no es híbrido, sino una poliarquía.
      D: Es verdadero, porque son casos donde hay elecciones libres, pero existe también una “cancha inclinada”
        en favor del partido de gobierno.
    clave: D
    correctas:
    - Es verdadero, porque son casos donde hay elecciones libres, pero existe también una “cancha inclinada” en
      favor del partido de gobierno.
