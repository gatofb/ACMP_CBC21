      instancia: Recuperatorio 1er Parcial
      cuatrimestre: 1C 2024
      tema: 2
      consigna: 5
- id: q-f86741b3
  tipo: vf_justificada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
  - 1C 2024
  versiones:
  - enunciado: En el video en que Eduardo Levy Yeyati entrevista a Pablo Gerchunoff, el entrevistado señala que
      a pesar de que Raúl Alfonsín no lograra resolver la cuestión militar en su mandato y dictara el indulto, mirándolo
      en perspectiva, haber puesto a los comandantes presos –aunque sea por dos años– fue todo un logro de la joven
      democracia argentina.
    opciones:
      A: Es verdadero, porque debido a los levantamientos carapintadas y la sanción de las Leyes de Punto Final
        y Obediencia Debida de 1987, los miembros de las Juntas condenados en 1985 abandonaron la prisión al final
        del mandato del presidente radical.
      B: Es falso, porque Alfonsín dejó la presidencia en 1989 con los comandantes presos y éstos recién fueron
        indultados poco después por el presidente peronista Carlos Menem.
      C: Es falso, porque los militares argentinos recién comenzaron a ser juzgados durante el gobierno de Néstor
        Kirchner en 2003.
      D: 'Es verdadero, porque la sanción de las Leyes de Punto Final y Obediencia Debida les permitió a los militares
        ser liberados luego de la condena en el famoso juicio de 1985 y, por ello, acceder luego al indulto posterior.
        DNI:'
    clave: B
    correctas:
    - Es falso, porque Alfonsín dejó la presidencia en 1989 con los comandantes presos y éstos recién fueron indultados
      poco después por el presidente peronista Carlos Menem.
