      C: Son una garantía de que los actores nostálgicos del Régimen autoritario no tendrán margen de maniobra para
        intentar un Golpe.
      D: La alianza de las elites forma una red de contención de las demandas de los empresarios que se habían beneficiado
        del Régimen anterior, y que no poseen grandes expectativas por el regreso de la democracia.
      E: Las opciones correctas son la A y la B.
