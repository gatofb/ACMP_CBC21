- id: q-e3444683
  tipo: combinada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
  - 2C 2024
  versiones:
  - enunciado: 'Romero señala que, en la dictadura asumida en 1976, se constituyó una facción más fuerte que las
      demás, pero que distaba de ser dominante, en torno a los generales Videla y Viola –su segundo en el Ejército-.
      Esto implicó que:'
    opciones:
      A: Estos jefes no reconocieran la necesidad de encontrar en el futuro alguna salida política. Así, mantenían
        fuertes conflictos con los dirigentes de los partidos políticos, que perseguidos día y noche por los militares,
        veían en ese grupo al sector menos civilizado.
      B: Estos jefes reconocían la necesidad de encontrar en el futuro alguna salida política. Así, mantenían comunicación
        con los dirigentes de los partidos políticos, que se ilusionaban creyendo ver en ellos al sector más civilizado.
      C: Estos jefes respaldaran a Martínez de Hoz, muy criticado por los militares más nacionalistas, que abundaban
        entre los cuadros jóvenes.
      D: Estos jefes no respaldaran a Martínez de Hoz, muy apoyado por los militares más liberales, que abundaban
        entre los cuadros jóvenes.
      E: Las opciones correctas son la A y la B.
      F: Las opciones correctas son la C y la B.
      G: Las opciones correctas son la A y la D.
      H: Las opciones correctas son la A, la B, la C y la D.
    clave: F
    correctas:
    - Estos jefes respaldaran a Martínez de Hoz, muy criticado por los militares más nacionalistas, que abundaban
      entre los cuadros jóvenes.
    - Estos jefes reconocían la necesidad de encontrar en el futuro alguna salida política. Así, mantenían comunicación
      con los dirigentes de los partidos políticos, que se ilusionaban creyendo ver en ellos al sector más civilizado.
