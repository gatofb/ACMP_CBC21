- id: q-7dfdd578
  tipo: vf_justificada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
  - 2C 2025
  versiones:
  - enunciado: Según Nicolás Simone, la transición es un lapso de tiempo que comienza cuando el régimen no democrático
      de un país comienza a retirarse y termina cuando un régimen democrático se impone, ya sin riesgo de ser derrocado.
    opciones:
      A: Es verdadero, porque la transición es como la poliarquía, formas en que se menciona y se describe al sistema
        democrático.
      B: Es falso, porque la transición no puede preverse exactamente, al ser un periodo donde la incertidumbre
        es la norma.
      C: Es verdadero, porque la transición, en sentido amplio, se consuma cuando no existe peligro de regresión
        autoritaria.
      D: Es falso, porque nunca una democracia se impone sin riesgo. Mientras haya militares, existirá siempre la
        posibilidad de golpes de Estado.
    clave: C
    correctas:
    - Es verdadero, porque la transición, en sentido amplio, se consuma cuando no existe peligro de regresión autoritaria.
    apariciones:
    - archivo: Recuperatorio_1er_Parcial_-_2do_C._2025_-_Tema_1.pdf
      instancia: Recuperatorio 1er Parcial
      cuatrimestre: 2C 2025
      tema: 1
      consigna: 2
- id: q-33de77a8
  tipo: vf_justificada
  puntos: 0.5
  veces_tomada: 1
  cuatrimestres:
