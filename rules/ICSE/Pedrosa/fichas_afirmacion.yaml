- id: romero.grinspun-1983
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: La política económica de Grinspun
  afirmacion: 'En el primer año del gobierno radical, la política económica del ministro Bernardo Grinspun
    se ajustó a las fórmulas dirigistas y redistributivas clásicas.

    '
  puntos:
  - Incluía el control estatal del crédito, del mercado de cambios y de los precios, y se completaba con
    importantes medidas de acción social.
  - Eran medidas similares a las aplicadas entre 1963 y 1966, ideas que el radicalismo compartía con el
    peronismo histórico.
  trampas:
  - texto: Empresarios y sindicalistas convergieron en el apoyo a esta política, siguiendo el modelo del
      Plan Gelbard de los años 70.
    error: hecho_equivocado
    por_que: No hubo ese apoyo; el acuerdo de Gelbard fue el Pacto Social de 1973, con el peronismo, y
      empresarios y CGT enfrentaron al gobierno radical.
  - texto: Eran medidas similares a las aplicadas entre 1955 y 1958, porque el radicalismo se oponía al
      peronismo histórico.
    error: anacronismo
    por_que: El período correcto es 1963–1966, el gobierno radical de Illia, con ideas que el radicalismo
      compartía con el peronismo histórico.
  pregunta_guia: ¿Qué herramientas usó Grinspun para manejar la economía y a qué gobierno anterior se
    parecían?
  explicacion_modelo: 'Romero caracteriza la política de Grinspun como dirigista y redistributiva: control
    estatal del crédito, los cambios y los precios, más acción social, al estilo de 1963–1966 (el gobierno
    de Illia), con ideas que el radicalismo compartía con el peronismo histórico. La opción de 1955–1958
    tienta porque también es una etapa antiperonista, pero es el período equivocado y además dice lo contrario:
    el radicalismo compartía, no se oponía.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-fe6feae2
  estado: borrador
- id: romero.fracaso-concertacion
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: Empresarios y CGT contra la concertación
  afirmacion: 'Empresarios y sindicalistas coincidieron en hacer fracasar la política de concertación
    sectorial a la que habían apostado Alfonsín y su equipo económico.

    '
  puntos:
  - La CGT se movilizó por razones sindicales y también políticas, porque era la columna vertebral de
    la oposición peronista.
  - Los empresarios cuestionaron el gasto y la intervención estatal, salvo las políticas que los beneficiaban
    directamente.
  trampas:
  - texto: Los empresarios nacionales se opusieron a la apertura total de las importaciones que planteaba
      el ministro de Economía de Alfonsín.
    error: hecho_equivocado
    por_que: El gobierno no planteó una apertura total; la crítica empresaria fue al gasto y a la intervención
      del Estado.
  - texto: Los sindicalistas encontraron en la movilización piquetera una aliada inesperada.
    error: anacronismo
    por_que: El movimiento piquetero surgió en la segunda mitad de los años 90, después del gobierno de
      Alfonsín.
  pregunta_guia: ¿Por qué razones se opusieron la CGT y los empresarios a la concertación de Alfonsín?
  explicacion_modelo: 'Según Romero, la concertación fracasó porque la CGT se movilizó por motivos sindicales
    y políticos (era la columna vertebral de la oposición peronista) y los empresarios cuestionaban el
    gasto y la intervención estatal, salvo cuando los beneficiaban. La opción de la apertura de importaciones
    tienta porque suena a conflicto empresario, pero le atribuye al gobierno una política que no tuvo.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-7c6990f8
  estado: borrador
- id: romero.politica-exterior-alfonsin
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: 'Política exterior: Beagle y Malvinas'
  afirmacion: 'La gran popularidad internacional de Alfonsín se usó para afianzar las instituciones democráticas,
    todavía precarias, y con ese criterio se encararon el conflicto con Chile por el Beagle y la cuestión
    Malvinas.

    '
  puntos:
  - La popularidad de Alfonsín en el mundo se usó para afianzar y fortalecer las instituciones democráticas,
    todavía precarias.
  - Con ese criterio se encaró el diferendo con Chile por el Canal de Beagle.
  - También la cuestión pendiente con Gran Bretaña por las Malvinas.
  trampas:
  - texto: Con Uruguay, por las papeleras a construirse cerca de Fray Bentos y Gualeguaychú.
    error: anacronismo
    por_que: El conflicto por las papeleras fue entre 2005 y 2010, durante los gobiernos kirchneristas.
  - texto: Con Brasil y Paraguay, por el contrabando y el terrorismo islámico en la triple frontera.
    error: anacronismo
    por_que: Ese tema entró en la agenda después de los atentados a la Embajada de Israel (1992) y a la
      AMIA (1994).
  pregunta_guia: ¿Qué conflictos internacionales pendientes encaró el gobierno de Alfonsín y con qué objetivo
    interno?
  explicacion_modelo: 'Romero dice que Alfonsín usó su prestigio internacional para fortalecer la democracia,
    todavía precaria, y que con ese criterio se encararon el Beagle con Chile y Malvinas con Gran Bretaña.
    Las otras dos opciones tientan porque son conflictos reales de la Argentina con sus vecinos, pero
    son de otra época: las papeleras son de los 2000 y la triple frontera entró en la agenda en los 90.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-eb51cdff
  estado: borrador
- id: romero.iglesia-vs-gobierno-radical
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: La Iglesia contra el gobierno radical
  afirmacion: 'La Iglesia, que en 1981 se había definido por la democracia sin criticar su relación con
    los militares, evolucionó hacia una creciente hostilidad con el gobierno de Alfonsín.

    '
  puntos:
  - En 1981 la Iglesia se había definido por la democracia, aunque sin hacer la crítica de su relación
    con el gobierno militar.
  - Estaba molesta por su escasa injerencia (menor a sus aspiraciones) en el área de la enseñanza privada.
  - Rechazaba el tono laico del discurso cultural que circulaba por las instituciones y los medios del
    Estado.
  trampas:
  - texto: Estaba molesta por su escasa injerencia en la asistencia social y en la educación pública.
    error: cambio_de_palabra
    por_que: El reclamo era por la enseñanza privada, no por la educación pública ni la asistencia social.
  - texto: Estaba molesta por el proyecto de despenalización del aborto que impulsaba el gobierno y que
      el Congreso rechazó.
    error: anacronismo
    por_que: El gobierno de Alfonsín no impulsó ese proyecto; el debate llegó al Congreso en 2018 y la
      ley se aprobó en 2020.
  - texto: Un sector de la Iglesia culpaba a la democracia de los males del siglo, como el juego, las
      redes sociales y el multiculturalismo.
    error: anacronismo
    por_que: Las redes sociales no existían en los años 80.
  - texto: Juan Pablo II quería dar batalla contra el líder católico argentino, el joven arzobispo Jorge
      Bergoglio.
    error: anacronismo
    por_que: Bergoglio fue arzobispo de Buenos Aires recién desde 1998.
  pregunta_guia: ¿Qué dos cosas del gobierno radical molestaban a la Iglesia, según Romero?
  explicacion_modelo: 'Según Romero, la Iglesia se volvió hostil al gobierno radical por dos motivos:
    tenía menos injerencia de la que aspiraba en la enseñanza privada y rechazaba el tono laico del discurso
    cultural del Estado. La opción de la "educación pública y la asistencia social" tienta porque repite
    casi la misma frase, pero cambia la palabra clave: era la enseñanza privada.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-8b79eae8
  - q-bdd1ef5c
  estado: borrador
  notas: 'Las opciones C y D de q-8b79eae8 podrían arrancar con algo que Romero sí dice (un sector que
    asume el papel de censor social; el cambio en el episcopado y la orientación de Juan Pablo II). Validar
    con el texto antes de enseñar esas primeras partes como verdaderas o falsas.

    '
- id: romero.ley-de-divorcio-1987
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: La ley de divorcio (1987)
  afirmacion: 'La ley de divorcio de 1987 se aprobó tras una discusión breve pero muy intensa: fue el
    punto culminante de la modernización cultural iniciada en 1983 y enfrentó la oposición de los sectores
    tradicionales de la Iglesia.

    '
  puntos:
  - Fue el punto culminante de la modernización cultural iniciada en 1983.
  - Los sectores tradicionales de la Iglesia se opusieron, con mecanismos habituales de presión y con
    otros más novedosos.
  trampas:
  - texto: Fue el momento en que se formalizó la ruptura de relaciones diplomáticas entre la Argentina
      y el Vaticano.
    error: dato_inventado
    por_que: No hubo ruptura; ese mismo año, en abril de 1987, Juan Pablo II visitó la Argentina.
  - texto: Los sectores más tradicionales del radicalismo intentaron bloquear su tratamiento en el Congreso.
    error: hecho_equivocado
    por_que: La oposición que destaca Romero vino de los sectores tradicionales de la Iglesia, no del
      radicalismo.
  pregunta_guia: ¿Por qué la discusión del divorcio fue tan intensa y quiénes se opusieron?
  explicacion_modelo: 'Romero explica la intensidad del debate porque la ley de divorcio fue el punto
    culminante de la modernización cultural iniciada en 1983 y porque los sectores tradicionales de la
    Iglesia la combatieron con presiones habituales y otras nuevas. La opción del radicalismo bloqueando
    la ley tienta porque habla de "sectores tradicionales", pero se equivoca de actor: los opositores
    eran de la Iglesia.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-9c3bd448
  estado: borrador
- id: romero.semana-santa-1987
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: Semana Santa de 1987
  afirmacion: 'El levantamiento militar de Semana Santa de 1987 puso a prueba la democracia, fue un punto
    de inflexión en la relación con los militares y terminó con la ilusión del poder ilimitado de la democracia.

    '
  puntos:
  - Fue una sublevación de sectores militares que exigían el fin de los juicios contra los oficiales involucrados
    en la represión.
  - Fue un punto de inflexión en la relación entre el gobierno y los militares, que desembocó en la sanción
    de la Ley de Obediencia Debida.
  - Con la Pascua de 1987 concluyó la ilusión del poder ilimitado de la democracia, porque Alfonsín perdió
    la exclusividad del liderazgo sobre la civilidad.
  trampas:
  - texto: El levantamiento fue sofocado inmediatamente por una intervención militar ordenada por Alfonsín,
      sin necesidad de negociaciones.
    error: hecho_equivocado
    por_que: Hubo negociación; Alfonsín fue a Campo de Mayo a hablar con los sublevados, y después se
      sancionó la Obediencia Debida.
  - texto: Fue un golpe de Estado exitoso que obligó a Alfonsín a renunciar antes de terminar su mandato.
    error: hecho_equivocado
    por_que: El levantamiento no derrocó al gobierno; Alfonsín entregó el poder anticipadamente en julio
      de 1989, en plena hiperinflación.
  - texto: Alfonsín perdió la exclusividad del liderazgo sobre el peronismo, la clase media o los radicales.
    error: cambio_de_palabra
    por_que: Romero habla de la civilidad, es decir, de la sociedad civil que lo había acompañado desde
      1983.
  pregunta_guia: ¿Qué pedían los militares sublevados, cómo se resolvió el levantamiento y qué cambió
    después para Alfonsín?
  explicacion_modelo: 'Según Romero, en Semana Santa los militares sublevados exigían terminar con los
    juicios, y el episodio fue un punto de inflexión que llevó a la Obediencia Debida; por eso concluyó
    la ilusión del poder ilimitado de la democracia y Alfonsín perdió la exclusividad del liderazgo sobre
    la civilidad. La opción del levantamiento "sofocado sin negociar" tienta porque la democracia sobrevivió,
    pero es falsa: hubo negociación y concesiones.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-531d10b3
  - q-6bb9129a
  estado: borrador
- id: romero.derrota-1987
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: La derrota de 1987 y el debilitamiento del gobierno
  afirmacion: 'Después de la derrota en las legislativas de septiembre de 1987, la posición del gobierno
    de Alfonsín se debilitó aceleradamente.

    '
  puntos:
  - La inestabilidad y la sensación de falta de gobernabilidad fueron crecientes.
  - El peronismo, que apuntaba con nuevo optimismo a las presidenciales de 1989, se negó a respaldar reformas
    cuyo costo social era evidente.
  trampas:
  - texto: La reconciliación obligada con las corporaciones deterioró la imagen del gobierno, pero rindió
      algunos frutos esperados en lo económico.
    error: media_verdad
    por_que: Arranca con algo verosímil, pero concluye algo falso porque no hubo frutos económicos y el
      proceso terminó en la hiperinflación de 1989.
  - texto: El sector kirchnerista del peronismo tomó el control del partido con una posición más dura
      frente a Alfonsín.
    error: anacronismo
    por_que: El kirchnerismo surgió en 2003; en 1987 el peronismo en ascenso era la Renovación de Cafiero.
  pregunta_guia: ¿Qué consecuencias tuvo para el gobierno perder las elecciones de 1987, y qué hizo el
    peronismo?
  explicacion_modelo: 'Romero dice que tras la derrota de 1987 crecieron la inestabilidad y la sensación
    de falta de gobernabilidad, y que el peronismo, entusiasmado con ganar en 1989, se negó a apoyar reformas
    con costo social. La opción de las corporaciones tienta porque empieza con algo creíble (el costo
    de imagen), pero termina mal: no hubo frutos económicos.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-b9349c41
  estado: borrador
  notas: Validar si Romero menciona el deterioro de imagen por la reconciliación con las corporaciones;
    el examen solo da por falsa la opción completa.
- id: romero.la-tablada-1989
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: La Tablada (1989)
  afirmacion: 'Tras el asalto al cuartel de La Tablada en enero de 1989, el Ejército hizo una aplastante
    demostración de fuerza, y la opinión pública la reconoció; fue el primer indicio de que la cuestión
    militar terminaría con el olvido de los crímenes y el fin de las ilusiones de 1983.

    '
  puntos:
  - En enero de 1989 un grupo armado asaltó el cuartel de La Tablada y el Ejército hizo una aplastante
    demostración de fuerza que culminó con el aniquilamiento de los asaltantes.
  - El reconocimiento que recibió la represión militar fue el primer indicio de un cambio de prioridades
    y valores en la opinión pública.
  - Podía anticiparse que la cuestión militar terminaría con la reivindicación de los militares, el olvido
    de los crímenes de la "guerra sucia" y el entierro de las ilusiones de la civilidad de 1983.
  trampas:
  - texto: Volvió el recuerdo de la represión ilegal, la opinión pública repudió el hecho sin fisuras
      y eso le dio aire al gobierno de Alfonsín.
    error: cambio_de_palabra
    por_que: Es al revés, porque la opinión pública reconoció la acción militar en lugar de repudiarla.
  - texto: El rechazo que recogió la represión militar fue un nuevo indicio del cambio de época iniciado
      en 1983.
    error: cambio_de_palabra
    por_que: No hubo rechazo sino reconocimiento, y eso indicaba el fin de las ilusiones de 1983, no su
      continuidad.
  pregunta_guia: ¿Cómo reaccionó la opinión pública ante la represión de La Tablada y qué anticipaba eso
    sobre la cuestión militar?
  explicacion_modelo: 'Según Romero, el reconocimiento que la sociedad le dio a la represión en La Tablada
    fue el primer indicio de un cambio de valores, y permitía anticipar que la cuestión militar terminaría
    con el olvido de los crímenes de la "guerra sucia" y el fin de las ilusiones de 1983. Las opciones
    sobre el "repudio" tientan porque es lo que uno esperaría de una sociedad democrática, pero invierten
    lo que dice el autor: hubo reconocimiento, no rechazo.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-131b96a5
  estado: borrador
