- id: deich.frondizi-guido
  eje: conceptos
  autor: Florencia Deich
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: 'Caída de Frondizi: ¿golpe o interrupción institucional?'
  afirmacion: 'Según Deich, el reemplazo de Frondizi es difícil de clasificar: el presidente legítimo
    fue destituido por presión militar, pero quien asumió lo hizo respetando la sucesión constitucional,
    así que los militares lograron sacarlo sin cumplir todos sus objetivos, porque no pusieron a un militar
    en la presidencia.

    '
  puntos:
  - El caso de Frondizi es complejo para definir si fue un golpe de Estado o una interrupción institucional.
  - El presidente legítimo fue destituido por la presión militar, pero el que asumió en su lugar respetó
    las reglas de sucesión previstas en la Constitución.
  - Los militares lograron quitar a Frondizi del poder, pero no cumplieron todos sus objetivos, porque
    no colocaron a una persona de las Fuerzas Armadas en la presidencia.
  trampas:
  - texto: Los militares cumplieron todos sus objetivos, porque colocaron a una persona de las Fuerzas
      Armadas en la presidencia.
    error: cambio_de_palabra
    por_que: 'Invierte la afirmación correcta: no pusieron a un militar; asumió un civil por la línea
      de sucesión.'
  - texto: La forma de los acontecimientos no generó complicaciones para definir el tipo de régimen.
    error: cambio_de_palabra
    por_que: 'Niega justo lo que plantea Deich: la sucesión constitucional después de la presión militar
      complica la clasificación.'
  pregunta_guia: Según Deich, ¿qué tuvo de golpe y qué tuvo de sucesión constitucional la salida de Frondizi?
    ¿Por qué eso complica clasificarla?
  explicacion_modelo: 'Son correctas las dos que señalan la ambigüedad. Según Deich, a Frondizi lo sacó
    la presión militar, pero su reemplazante asumió respetando la sucesión constitucional y no fue un
    militar: por eso cuesta decidir si fue un golpe o una interrupción institucional. Las opciones tramposas
    repiten las mismas frases con un cambio ("sí pusieron a un militar", "no generó complicaciones"):
    hay que leer cada palabra.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-982eb0c5
  estado: borrador
  notas: 'El enunciado del examen dice "su reemplazo en 1963", pero Frondizi fue destituido en marzo de
    1962 y lo reemplazó José María Guido, presidente provisional del Senado. No corregimos el examen:
    validar con el texto de Deich qué fecha usa. El nombre de Guido no aparece en el examen.

    '
- id: video.sudafrica-comision-verdad
  eje: videos
  autor: 'Video de la cátedra: Transición a la democracia en Sudáfrica'
  fuente: Video del campus UBA XXI (pendiente de identificar)
  tema: Comisión de Verdad y Reconciliación
  afirmacion: 'Según el video, la Comisión de Verdad y Reconciliación de Sudáfrica adoptó un enfoque de
    justicia restaurativa: impulsó el reencuentro entre víctimas y victimarios, con un papel central de
    la comunidad, como catarsis colectiva y para combatir la ignorancia sobre lo sucedido. A cambio, al
    privilegiar la verdad, sacrificó en gran medida la justicia y la reparación a las víctimas.

    '
  puntos:
  - Se diferencia de otras comisiones de América Latina y África porque adoptó un enfoque de justicia
    restaurativa.
  - Impulsó las bases del reencuentro entre víctimas y victimarios, otorgando un papel preponderante a
    la comunidad.
  - Ese reencuentro sirvió de catarsis colectiva.
  - También sirvió para sacar a la población de su ignorancia sobre lo sucedido.
  - Al privilegiar el acceso a la información en pos de la verdad, se sacrificó en gran medida la justicia
    y la reparación a las víctimas; no logró condenas variadas y ejemplares.
  trampas:
  - texto: Es verdadero que logró condenas ejemplares, porque las víctimas las consideraron suficientes
      y muestran que la verdad puede alcanzarse en una transición.
    error: hecho_equivocado
    por_que: No hubo condenas ejemplares; el costo de privilegiar la verdad fue sacrificar justicia y
      reparación.
  - texto: Es falso, porque en Sudáfrica, como en el resto de África, no hubo revisiones judiciales del
      apartheid ni de otras violaciones de derechos humanos.
    error: motivo_equivocado
    por_que: El veredicto es correcto, pero el motivo generaliza a todo el continente y no es el del video,
      que habla de privilegiar la verdad sobre la justicia.
  - texto: Es verdadero, porque la Comisión innovó en las formas de clasificar y castigar los delitos
      y sentó jurisprudencia.
    error: dato_inventado
    por_que: El video no le atribuye innovaciones penales; destaca su enfoque restaurativo, no punitivo.
  - texto: Es verdadero, porque las leyes de Obediencia Debida y Punto Final impidieron que los condenados
      cumplieran su condena.
    error: hecho_equivocado
    por_que: Esas son leyes argentinas; no tienen nada que ver con Sudáfrica.
  - texto: El reencuentro entre víctimas y victimarios se basó en la aplicación irrestricta de la justicia
      penal, imitando el proceso argentino que terminó con la cárcel de los culpables.
    error: concepto_vecino
    por_que: Confunde la justicia restaurativa con la justicia penal o retributiva; la Comisión no se
      basó en el castigo.
  pregunta_guia: ¿Qué buscaba la Comisión de Verdad y Reconciliación en lugar del castigo penal? ¿Qué
    se ganó y qué se sacrificó con ese enfoque?
  explicacion_modelo: 'Es falso que haya logrado condenas ejemplares. Según el video, la Comisión privilegió
    la búsqueda de la verdad y el reencuentro entre víctimas y victimarios (justicia restaurativa), y
    en ese camino sacrificó en gran medida la justicia y la reparación. La opción "es falso porque en
    toda África no hubo revisiones judiciales" tienta porque tiene el veredicto correcto, pero el motivo
    es otro.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-c6c17dc6
  - q-59323001
  estado: borrador
- id: video.transiciones-conflicto-armado
  eje: videos
  autor: 'Video de la cátedra: Transición a la democracia'
  fuente: Video del campus UBA XXI (pendiente de identificar)
  tema: Transiciones en contextos de conflicto armado
  afirmacion: 'Según el video, entre las transiciones en contextos de conflicto armado se distinguen las
    que ocurren mientras el conflicto sigue en curso y las que se dan tras una humillación militar que
    no llega a ser una derrota total.

    '
  puntos:
  - Hay transiciones que tienen lugar en casos en que un conflicto armado continúa en curso.
  - Hay transiciones en las que se ha producido una humillación militar, pero no una derrota total.
  trampas:
  - texto: Transiciones en las que hubo un cambio de régimen entre los sectores "duros" y "blandos" del
      conflicto armado.
    error: concepto_vecino
    por_que: Mezcla la distinción entre "duros" y "blandos" de un régimen autoritario con los tipos de
      transición que distingue el video.
  - texto: Transiciones en las que el régimen político se asimila a partir del bando victorioso en un
      conflicto armado.
    error: dato_inventado
    por_que: No es uno de los tipos de transición que el examen da por correctos.
  pregunta_guia: ¿Qué tipos de transición distingue el video según cómo esté el conflicto armado (en curso,
    humillación, derrota)?
  explicacion_modelo: 'Son correctas la del conflicto en curso y la de la humillación militar sin derrota
    total. Esos son los tipos que distingue el video para transiciones con conflicto armado. La de "duros"
    y "blandos" tienta porque usa vocabulario de las transiciones, pero esos son sectores dentro de un
    régimen autoritario, no un tipo de transición en conflicto armado.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-7b8ffb27
  estado: borrador
  notas: 'El video puede distinguir otros tipos que el examen no tomó. La explicación de "duros y blandos"
    usa vocabulario general de los estudios de transición: confirmar si aparece en el video o en el texto
    de Simone.

    '
- id: video.gerchunoff-alfonsin
  eje: videos
  autor: 'Video de la cátedra: entrevista de Eduardo Levy Yeyati a Pablo Gerchunoff'
  fuente: Video del campus UBA XXI (pendiente de identificar)
  tema: 'Alfonsín: juicio a las Juntas, indulto y 1985'
  afirmacion: 'Según Gerchunoff, el decreto que mandó a las Juntas a ser juzgadas primero por el Consejo
    Supremo de las Fuerzas Armadas hizo posible el juicio posterior; Alfonsín dejó el poder en 1989 con
    los comandantes presos, que después indultó Menem; y 1985 fue su punto de inflexión, porque juntó
    el Juicio a las Juntas con el éxito del Plan Austral.

    '
  puntos:
  - Fue fundamental el decreto del gobierno radical que habilitó al Consejo Supremo de las Fuerzas Armadas
    para juzgar a las Juntas; sin ese paso previo no hubiera existido el famoso juicio posterior.
  - Alfonsín dejó la presidencia en 1989 con los comandantes presos; fueron indultados poco después por
    el presidente peronista Carlos Menem.
  - El indulto no lo dictó Alfonsín.
  - 1985 es el punto de inflexión porque aúna el Juicio a las Juntas, gran momento de la institucionalidad
    democrática, con el mayor éxito del Plan Austral.
  - El éxito del Plan Austral le permitió a Alfonsín ganar las elecciones intermedias de 1985.
  trampas:
  - texto: Las leyes de Punto Final y Obediencia Debida permitieron liberar a los militares condenados
      en 1985 y que accedieran luego al indulto.
    error: hecho_equivocado
    por_que: Esas leyes frenaron nuevos juicios; los comandantes condenados en 1985 siguieron presos hasta
      los indultos de Menem.
  - texto: Por los levantamientos carapintadas y las leyes de 1987, los miembros de las Juntas condenados
      en 1985 salieron de prisión al final del mandato de Alfonsín.
    error: hecho_equivocado
    por_que: Alfonsín terminó su mandato con los comandantes presos; los liberaron los indultos de Menem.
  - texto: Los militares argentinos recién empezaron a ser juzgados con Néstor Kirchner en 2003.
    error: anacronismo
    por_que: El Juicio a las Juntas fue en 1985, durante el gobierno de Alfonsín.
  - texto: Hubo un solo juicio a las Juntas y no fue el del Consejo Supremo de las Fuerzas Armadas.
    error: media_verdad
    por_que: Es cierto que el juicio de 1985 no fue el del Consejo Supremo, pero según Gerchunoff sin
      ese paso previo no habría existido.
  - texto: El decreto permitió que los militares fueran absueltos en primera instancia y accedieran al
      indulto que Alfonsín se vio obligado a dictar.
    error: hecho_equivocado
    por_que: Alfonsín no indultó a los comandantes; los indultos fueron de Menem.
  - texto: 1985 es el punto de inflexión por el pacto con el peronismo renovador y el Plan Primavera.
    error: anacronismo
    por_que: El Plan Primavera es de 1988; el plan exitoso de 1985 fue el Austral.
  - texto: 1985 es el punto de inflexión porque coincide con la película "1985", que compitió por los
      Oscar.
    error: dato_inventado
    por_que: La película es muy posterior y no es el motivo que da Gerchunoff.
  pregunta_guia: Según Gerchunoff, ¿qué paso previo hizo posible el Juicio a las Juntas? ¿Quién indultó
    a los comandantes? ¿Qué dos cosas se juntan en 1985?
  explicacion_modelo: 'Es falso que Alfonsín haya dictado el indulto. Según Gerchunoff, Alfonsín dejó
    la presidencia en 1989 con los comandantes presos y los indultó poco después Carlos Menem. Las opciones
    que hablan de Punto Final y Obediencia Debida tientan porque son leyes de Alfonsín sobre la cuestión
    militar, pero no liberaron a los comandantes ya condenados.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-a587b241
  - q-f86741b3
  - q-25f11a44
  - q-8bf9f5aa
  estado: borrador
  notas: 'Que Punto Final (diciembre de 1986) y Obediencia Debida (junio de 1987) no alcanzaron a los
    comandantes ya condenados es un dato general: confirmar cómo lo dice el video. Una opción del examen
    fecha las dos leyes en 1987; Punto Final es de 1986. El enunciado dice "presos aunque sea por dos
    años": verificar en el video a qué período se refiere Gerchunoff.

    '
- id: romero.cordobazo-1969
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: El Cordobazo (1969)
  afirmacion: 'Según Romero, en el Cordobazo de 1969 la movilización social se expresó de maneras diversas:
    el estallido estuvo precedido por una fuerte agitación sindical y por una ola de protestas estudiantiles.

    '
  puntos:
  - Antes del estallido hubo una fuerte agitación sindical en Córdoba, donde se concentraban las principales
    fábricas automotrices.
  - El estallido fue precedido por una ola de protestas estudiantiles en distintas universidades, algunas
    fuertemente reprimidas.
  trampas:
  - texto: Los inmigrantes fueron actores centrales de las protestas, buscando inserción laboral y la
      nacionalización.
    error: anacronismo
    por_que: La gran inmigración fue entre fines del siglo XIX y 1930; en 1969 los protagonistas fueron
      obreros industriales y estudiantes.
  - texto: La multitud que controló la ciudad tenía consignas precisas y líderes que coordinaban las acciones.
    error: dato_inventado
    por_que: El examen da por falso que hubiera consignas precisas y una conducción que coordinara a la
      multitud.
  pregunta_guia: ¿Qué venía pasando en las fábricas y en las universidades de Córdoba antes de mayo de
    1969?
  explicacion_modelo: 'Las correctas son la agitación sindical y las protestas estudiantiles: según Romero,
    el Cordobazo fue precedido por conflictos en las automotrices cordobesas y por protestas universitarias
    reprimidas. La opción de la multitud con consignas precisas y líderes tienta porque parece describir
    una gran movilización, pero el examen la da por falsa; y la de los inmigrantes es un anacronismo.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-64c6848f
  estado: borrador
  notas: 'Validar con el texto cómo describe Romero a la multitud (si habla explícitamente de falta de
    consignas o de conducción). La ficha solo afirma que el examen da por falsa esa opción.

    '
- id: romero.montoneros-vuelta-de-peron
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: Montoneros ante la vuelta de Perón
  afirmacion: 'Según Romero, los Montoneros traducían con habilidad las palabras de Perón mientras estaba
    exiliado en Madrid, pero su vuelta al país les planteó un problema: Perón hablaba de la “ortodoxia
    peronista”, no del socialismo.

    '
  puntos:
  - Los Montoneros elaboraron la teoría del “cerco” o del “entorno”, que supuestamente impedía a Perón
    conocer la verdadera voluntad de su pueblo.
  - De vuelta en el país, Perón empezó a hablar inequívocamente de la “ortodoxia peronista”, que poco
    tenía que ver con la versión “socialista”.
  trampas:
  - texto: Perón empezó a recordar sus orígenes socialistas, que poco tenían que ver con la “ortodoxia
      peronista”.
    error: cambio_de_palabra
    por_que: 'Invierte la frase correcta: Perón reivindicaba la ortodoxia peronista, no un origen socialista.'
  - texto: Perón abandonó su discurso de derecha denunciando a los “apresurados” e infiltrados de la Triple
      A.
    error: hecho_equivocado
    por_que: Los “apresurados” e “infiltrados” que denunciaba Perón eran de la izquierda peronista; la
      Triple A era un grupo de derecha.
  pregunta_guia: Cuando Perón volvió y habló en primera persona, ¿qué decía y cómo lo explicaban los Montoneros?
  explicacion_modelo: 'Las correctas son la teoría del “cerco” y la ortodoxia peronista. Según Romero,
    con Perón en el país los Montoneros ya no podían “traducirlo”: él hablaba de ortodoxia y ellos inventaron
    que un entorno le impedía ver la voluntad del pueblo. La opción de los “orígenes socialistas” tienta
    porque usa las mismas palabras, pero está invertida.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-a9c42bff
  estado: borrador
- id: romero.ruptura-plaza-1974
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: Ruptura entre Perón y Montoneros (1/5/1974)
  afirmacion: 'Según Romero, el 1º de mayo de 1974 los Montoneros se fueron de la Plaza de Mayo, de donde
    Perón los expulsaba, y se consumó la ruptura: volvieron a la clandestinidad y, tras la muerte de Perón,
    intentaron sin éxito asumir su herencia.

    '
  puntos:
  - Los Montoneros volvieron a la vieja táctica y pasaron a la clandestinidad, con más asesinatos y secuestros
    espectaculares para mejorar sus finanzas.
  - Reaparecieron apenas dos meses después en los funerales de Perón y luego pretendieron asumir su herencia,
    en forma fracasada.
  trampas:
  - texto: Perón reemplazó a los Montoneros por otro grupo de izquierda, el Ejército Revolucionario del
      Pueblo (ERP).
    error: hecho_equivocado
    por_que: El ERP era una guerrilla marxista no peronista y nunca fue aliado de Perón.
  - texto: Los Montoneros se aliaron con militares golpistas para derrocar a Perón.
    error: dato_inventado
    por_que: No hubo tal alianza; Perón murió en ejercicio de la presidencia el 1 de julio de 1974.
  pregunta_guia: Después de que Perón los echó de la Plaza, ¿qué camino tomaron los Montoneros y qué pasó
    con ellos cuando Perón murió?
  explicacion_modelo: 'Las correctas son el pase a la clandestinidad y la reaparición en los funerales
    de Perón. Según Romero, tras la ruptura de mayo de 1974 los Montoneros volvieron a la violencia clandestina
    y, muerto Perón dos meses después, quisieron quedarse con su herencia sin lograrlo. La opción del
    ERP tienta porque también es una guerrilla de izquierda, pero no era peronista ni aliada de Perón.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-3dda527d
  estado: borrador
- id: romero.programa-reconstruccion
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: Programa de Reconstrucción y Liberación Nacional
  afirmacion: 'Según Romero, el programa económico que Perón presentó en su tercera presidencia era acorde
    con los cambios ya consolidados en la estructura económica: intervencionista, y no orientado al “socialismo
    nacional”.

    '
  puntos:
  - A pesar de los relatos predominantes en el peronismo, no había nada en el programa que indicara una
    orientación hacia el “socialismo nacional”.
  - Fueron medidas fuertemente intervencionistas y, en menor medida, nacionalistas y distribucionistas.
  trampas:
  - texto: El Estado se propuso una gran reducción de gastos, de empleados públicos y de empresas estatales
      para bajar el déficit.
    error: hecho_equivocado
    por_que: Eso describe un plan de ajuste; el programa de Perón era fuertemente intervencionista.
  - texto: El programa tenía una clara orientación hacia el “socialismo nacional”, el discurso predominante
      en el peronismo y en su juventud.
    error: media_verdad
    por_que: El “socialismo nacional” era el discurso de la juventud peronista, pero el programa económico
      no iba en esa dirección.
  pregunta_guia: ¿Qué tipo de medidas tenía el programa económico de Perón y en qué se diferenciaba de
    lo que decía la juventud peronista?
  explicacion_modelo: 'Las correctas son las dos que hablan de intervencionismo y de ausencia de “socialismo
    nacional”. Según Romero, el programa acompañaba la estructura económica ya consolidada: mucho intervencionismo
    y, en menor medida, nacionalismo y distribución. La opción del “socialismo nacional” tienta porque
    ese era el relato de la juventud, pero no era lo que proponía el programa.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-c5f34ee0
  estado: borrador
- id: romero.isabel-presidencia
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: La presidencia de Isabel Perón
  afirmacion: 'Según Romero, Isabel Perón parodió las fórmulas y los gestos de Perón para capitalizar
    su herencia simbólica, pero su política se apartó totalmente de la que él había trazado en sus últimos
    años.

    '
  puntos:
  - Su política se apartó totalmente de la que había trazado Perón en sus últimos años.
  - 'Se propuso homogeneizar el gobierno: colocó a amigos y rompió una a una las alianzas que había tejido
    Perón.'
  trampas:
  - texto: Su política continuó la de Perón en sus últimos años, con cambios solo discursivos para mostrar
      su propio liderazgo.
    error: cambio_de_palabra
    por_que: 'Invierte la idea de Romero: lo que imitaba eran los gestos; la política se apartó totalmente.'
  - texto: Isabel y los sindicalistas no coincidían en ningún punto de la agenda social heredada de Perón.
    error: absoluto_falso
    por_que: El “en ningún punto” es una generalización que el examen da por falsa.
  pregunta_guia: ¿Qué imitaba Isabel de Perón y en qué se diferenciaba su forma de gobernar?
  explicacion_modelo: 'Las correctas son que su política se apartó totalmente de la de Perón y que rompió
    sus alianzas para homogeneizar el gobierno. Según Romero, Isabel copiaba los gestos del líder, pero
    no su política. La opción de la continuidad con “cambios solo discursivos” tienta porque parece explicar
    la imitación, pero dice exactamente lo contrario.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-fa22a484
  estado: borrador
- id: romero.represion-antes-del-golpe
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: La represión ilegal antes de 1976
  afirmacion: 'Según Romero, la represión ilegal de las Fuerzas Armadas no empezó con el golpe de 1976:
    ya se observaba durante el gobierno de Isabel Perón (1974–1976).

    '
  puntos:
  - Desde febrero de 1975 el Ejército, convocado por Isabel Perón, asumió la tarea de reprimir a la guerrilla
    en Tucumán.
  - Con la muerte de Perón, los grupos guerrilleros pasaron a la clandestinidad y potenciaron la violencia
    política.
  trampas:
  - texto: Las guerrillas vinculadas al Partido Radical y a Raúl Alfonsín se hicieron fuertes en la provincia
      de Buenos Aires.
    error: dato_inventado
    por_que: No hubo guerrillas radicales; las principales eran Montoneros (peronista) y el ERP (marxista).
  - texto: La represión en el sur en 1975, la “Patagonia Rebelde”, fue el primer acto de represión ilegal
      contra la guerrilla.
    error: anacronismo
    por_que: La Patagonia Rebelde fue la represión de huelgas rurales en Santa Cruz en 1920–1922, no en
      1975.
  pregunta_guia: ¿Qué hizo el Ejército en Tucumán en 1975 y quién lo convocó?
  explicacion_modelo: 'Las correctas son el operativo en Tucumán y el pase de la guerrilla a la clandestinidad
    tras la muerte de Perón. Según Romero, la represión ilegal empezó en democracia: en febrero de 1975
    Isabel convocó al Ejército contra la guerrilla tucumana. La opción de la “Patagonia Rebelde” tienta
    porque es una represión famosa en el sur, pero ocurrió medio siglo antes.

    '
  recurso_ubaxxi: pendiente
