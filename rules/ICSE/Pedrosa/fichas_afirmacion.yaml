- id: romero.condiciones-golpe-1976
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: Por qué se aceptó el golpe de 1976
  afirmacion: 'Según Romero, entre 1975 y principios de 1976 la violencia cotidiana creó las condiciones
    para que se aceptara un golpe que prometía restablecer el orden y asegurar el monopolio estatal de
    la fuerza.

    '
  puntos:
  - La muerte estaba presente cotidianamente, con acciones espectaculares de las organizaciones guerrilleras,
    que habían fracasado en dos grandes operativos contra unidades militares en el Gran Buenos Aires y
    en Formosa.
  - El terror sembrado por la Alianza Anticomunista Argentina (Triple A).
  trampas:
  - texto: La presencia constante y pública del Partido Comunista soviético, con financiamiento, propaganda
      y militancia, hacía prever un frente revolucionario.
    error: dato_inventado
    por_que: Romero explica el clima por la guerrilla local y la Triple A, no por una intervención soviética.
  - texto: El terror sembrado por bandas del crimen organizado vinculadas al narcotráfico.
    error: dato_inventado
    por_que: 'La violencia de esos años era política: guerrilla y Triple A, no narcotráfico.'
  pregunta_guia: ¿Qué tipos de violencia hacían que en 1975 parte de la sociedad esperara un golpe “que
    pusiera orden”?
  explicacion_modelo: 'Las correctas son la violencia guerrillera y el terror de la Triple A. Según Romero,
    esa violencia de los dos lados hizo que muchos aceptaran un golpe que prometía orden y el monopolio
    estatal de la fuerza. La opción del Partido Comunista soviético tienta porque habla de “frente revolucionario”,
    pero es un dato que el texto no sostiene.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-68b7e0de
  estado: borrador
- id: romero.proceso-donde-residia-el-poder
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: 'El Proceso: dónde residía el poder'
  afirmacion: 'Según Romero, la primera cuestión oscura del Proceso de Reorganización Nacional (desde
    marzo de 1976) era dónde residía realmente el poder: el presidente estaba limitado por los jefes de
    las tres armas, y convivían un Estado terrorista clandestino y otro visible.

    '
  puntos:
  - La autoridad del presidente (al principio el primero entre sus pares, y luego ni siquiera eso) resultó
    controlada y limitada por los jefes de las tres armas.
  - Coexistieron un Estado terrorista clandestino, encargado de la represión, y otro visible, sujeto a
    las normas establecidas por las propias autoridades del Proceso.
  trampas:
  - texto: 'Es falso: el poder residía en la Junta de comandantes, que centralizaba las funciones ejecutivas,
      legislativas y judiciales.'
    error: media_verdad
    por_que: 'La Junta existía, pero el poder no estaba claro ni centralizado: esa era justamente la cuestión
      oscura.'
  - texto: 'Es verdadero: hubo un Estado terrorista visible y público, encargado de la represión y de
      las políticas sociales, culturales y económicas.'
    error: cambio_de_palabra
    por_que: La represión estaba a cargo de un Estado clandestino; lo visible era el otro Estado, el que
      seguía normas.
  - texto: 'Es verdadero: hubo solo un Estado terrorista, visible y público, que no estaba sujeto ni siquiera
      a las normas de las propias autoridades.'
    error: cambio_de_palabra
    por_que: Romero habla de dos Estados que coexistían; el terrorista era clandestino, no visible.
  - texto: 'Es falso: por la tradición presidencialista y la unidad de mando militar, la autoridad del
      presidente nunca fue discutida por sus pares.'
    error: absoluto_falso
    por_que: La autoridad del presidente sí estuvo controlada y limitada por los jefes de las tres armas.
  pregunta_guia: 'En el Proceso, ¿quién mandaba de verdad: el presidente, la Junta o cada fuerza? ¿Y qué
    parte del Estado actuaba a la vista y cuál en las sombras?'
  explicacion_modelo: 'Es verdadero. Según Romero, el poder era una cuestión oscura porque el presidente,
    primero entre pares y después ni eso, estaba limitado por los jefes de las tres armas, y porque convivían
    un Estado terrorista clandestino y otro visible y normado. La opción del Estado terrorista “visible
    y público” tienta porque usa las palabras del texto, pero las invierte: lo terrorista era lo clandestino.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-b9eb9f76
  estado: borrador
  notas: 'La pregunta tiene dos claves distintas según la versión (presidente limitado por las tres armas
    en 2026; coexistencia de los dos Estados en 2024). Las dos son afirmaciones de Romero sobre el mismo
    punto y la ficha enseña ambas.

    '
- id: romero.proceso-faccion-videla-viola
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: La facción de Videla y Viola
  afirmacion: 'Según Romero, en la dictadura de 1976 la facción de Videla y Viola fue la más fuerte, aunque
    no dominante: buscaba una futura salida política y respaldaba a Martínez de Hoz frente a los militares
    nacionalistas.

    '
  puntos:
  - Reconocían la necesidad de encontrar en el futuro una salida política y mantenían comunicación con
    los dirigentes de los partidos, que se ilusionaban viendo en ellos al sector más civilizado.
  - Respaldaban a Martínez de Hoz, muy criticado por los militares más nacionalistas, que abundaban entre
    los cuadros jóvenes.
  trampas:
  - texto: No reconocían la necesidad de una salida política y tenían fuertes conflictos con los partidos,
      que los veían como el sector menos civilizado.
    error: cambio_de_palabra
    por_que: 'Invierte la frase: sí buscaban una salida política y los partidos los veían como los más
      civilizados.'
  - texto: No respaldaban a Martínez de Hoz, que era muy apoyado por los militares más liberales de los
      cuadros jóvenes.
    error: cambio_de_palabra
    por_que: Videla y Viola sostenían a Martínez de Hoz; quienes lo criticaban eran los nacionalistas.
  pregunta_guia: ¿Qué relación tenían Videla y Viola con los partidos políticos y con el ministro Martínez
    de Hoz?
  explicacion_modelo: 'Las correctas son que buscaban una salida política y que respaldaban a Martínez
    de Hoz. Según Romero, era la facción más fuerte, pero no dominaba: los nacionalistas, muchos entre
    los oficiales jóvenes, criticaban al ministro. Las dos opciones falsas son la misma frase con el sentido
    invertido: hay que leer bien el “no”.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-e3444683
  estado: borrador
- id: romero.proceso-transformacion-economica
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: La transformación económica y el problema del tiempo (Schvarzer)
  afirmacion: 'Según Romero, retomando a Jorge Schvarzer, la transformación económica de la última dictadura
    abría un problema político: la conducción económica debía durar lo suficiente como para que los cambios
    fueran irreversibles.

    '
  puntos:
  - La conducción económica debía durar en el poder un tiempo suficiente como para que los cambios fueran
    irreversibles.
  trampas:
  - texto: La conducción económica debía durar un tiempo limitado para que la corrupción no se volviera
      endémica.
    error: cambio_de_palabra
    por_que: 'El problema era el inverso: necesitaba tiempo largo para volver irreversibles los cambios.'
  - texto: La corrupción estructuraba toda la política y terminar con ella fue el motivo central del golpe.
    error: dato_inventado
    por_que: Romero no plantea la corrupción como el motivo del golpe ni como el problema de la conducción
      económica.
  - texto: El tiempo no era tan relevante como la estabilidad de sus alianzas corporativas.
    error: verdad_general
    por_que: Puede sonar razonable, pero para Romero y Schvarzer el problema central era justamente el
      tiempo.
  - texto: La mayoría de los militares eran neoliberales y se oponían a un Martínez de Hoz estatista,
      sostenido solo por Videla.
    error: cambio_de_palabra
    por_que: 'Es al revés: Martínez de Hoz era el liberal y lo criticaban los militares nacionalistas.'
  pregunta_guia: ¿Por qué la transformación económica de Martínez de Hoz necesitaba que la conducción
    económica durara mucho tiempo?
  explicacion_modelo: 'Es falso. Según Romero, siguiendo a Schvarzer, el problema era el contrario: la
    conducción económica tenía que durar lo suficiente para que los cambios no pudieran revertirse. La
    opción de la corrupción tienta porque suena a crítica de la época, pero no es el argumento del texto;
    y la del Martínez de Hoz “estatista” invierte a los actores.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-46512c49
  estado: borrador
- id: romero.iglesia-y-dictadura
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: La Iglesia ante el debilitamiento de la dictadura
  afirmacion: 'Según Romero, la Iglesia Católica cambió su comportamiento a medida que la dictadura de
    1976 se debilitaba: amplió sus preocupaciones a los derechos individuales y la política y se replanteó
    su injerencia directa.

    '
  puntos:
  - Desde 1979 sus preocupaciones por las cuestiones morales o la familia se extendieron hacia los derechos
    individuales y la política.
  - Revisando sus posiciones, se propuso renunciar a la injerencia directa en cuestiones sociales o políticas
    y consagrarse a evangelizar una sociedad excesivamente secularizada.
  trampas:
  - texto: La Iglesia mantuvo desde 1983 una actitud fuertemente opositora liderada por el joven cura
      Jorge Bergoglio.
    error: dato_inventado
    por_que: Romero no habla de ningún liderazgo de Bergoglio, y la dictadura terminó en diciembre de
      1983.
  - texto: Se propuso evangelizar una sociedad que juzgaba excesivamente volcada hacia la izquierda.
    error: cambio_de_palabra
    por_que: 'Es la frase correcta con una palabra cambiada: la sociedad le parecía excesivamente secularizada,
      no de izquierda.'
  pregunta_guia: ¿Qué temas empezaron a preocupar a la Iglesia desde 1979 y cómo quería relacionarse con
    la sociedad?
  explicacion_modelo: 'Las correctas son la ampliación de sus preocupaciones desde 1979 y la evangelización
    de una sociedad secularizada. Según Romero, al debilitarse la dictadura la Iglesia miró los derechos
    individuales y la política, y replanteó su injerencia directa. La trampa más tentadora es la sociedad
    “volcada hacia la izquierda”: es la misma frase con una sola palabra cambiada.

    '
  recurso_ubaxxi: pendiente
  preguntas:
