# Fichas de afirmación — ICSE, Cátedra Pedrosa (1er parcial).
# Formato y reglas: rules/01_formato_fichas.md. Validar con scripts/validar_fichas.py.
# Estado: borrador. Escritas a partir de los exámenes; falta contrastarlas con la bibliografía.

- id: povse.gobierno-vs-regimen
  eje: conceptos
  autor: Max Povse
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Cambio de gobierno y cambio de régimen
  afirmacion: 'Cambiar de gobierno no es lo mismo que cambiar de régimen político: un régimen puede mantenerse
    aunque cambie el gobierno.

    '
  puntos:
  - Es falso que un cambio de gobierno sea lo mismo que un cambio de régimen político.
  - Un régimen puede mantenerse, aunque cambie el gobierno.
  trampas:
  - texto: Es verdadero, porque no puede haber un mismo gobierno que transite regímenes políticos diferentes.
    error: absoluto_falso
    por_que: Gobierno y régimen son planos distintos; el "no puede haber" cierra una posibilidad que la
      distinción deja abierta.
  - texto: Es verdadero, porque cuando cambia el presidente necesariamente cambia el régimen.
    error: absoluto_falso
    por_que: Cambiar al presidente cambia el gobierno; el régimen puede seguir siendo el mismo.
  - texto: Es falso, porque para que haya un cambio de régimen no debe cambiar el gobierno.
    error: motivo_equivocado
    por_que: El veredicto está bien, pero el motivo inventa una condición; lo que importa es que el régimen
      puede durar más que un gobierno.
  pregunta_guia: ¿Qué cambia cuando cambia el gobierno y qué tiene que cambiar para que cambie el régimen?
  explicacion_modelo: 'Es falso. Según Povse, gobierno y régimen no son lo mismo: un régimen puede mantenerse
    aunque cambie el gobierno, por ejemplo cuando asume otro presidente dentro de las mismas reglas. La
    opción tentadora es "Es falso, porque para que haya un cambio de régimen no debe cambiar el gobierno":
    tiene el veredicto correcto, pero el motivo es inventado.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-aeea6199
  estado: borrador
- id: povse.totalitarismo
  eje: conceptos
  autor: Max Povse
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Regímenes totalitarios
  afirmacion: 'Los regímenes totalitarios extienden su control a todos los aspectos de la vida de la población,
    incluida la acción política, y exigen una movilización continua de adhesión al líder.

    '
  puntos:
  - Debe existir una continua movilización de la población que demuestre su adhesión al líder.
  - Se controla e influye en las formas de accionar político.
  trampas:
  - texto: Se controla todo, excepto las cuestiones de la vida privada e íntima.
    error: media_verdad
    por_que: Arranca bien ("se controla todo"), pero el control totalitario alcanza todos los aspectos
      de la vida, también lo privado.
  - texto: La libertad de la sociedad civil no es reducida, pero sí es observada con atención.
    error: concepto_vecino
    por_que: Describe un régimen que vigila sin suprimir; en el totalitarismo la libertad de la sociedad
      civil sí se reduce.
  pregunta_guia: ¿Hasta dónde llega el control de un régimen totalitario y qué le pide a la población?
  explicacion_modelo: 'Las correctas son las de la movilización continua de adhesión al líder y el control
    de las formas de accionar político. Para Povse el totalitarismo extiende su control a todos los aspectos
    de la vida. La trampa más tentadora es "se controla todo, excepto la vida privada": empieza bien,
    pero ese "excepto" contradice justamente la idea de control total.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-5bf42cf6
  estado: borrador
- id: povse.regimen-hibrido
  eje: conceptos
  autor: Max Povse
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Regímenes híbridos
  afirmacion: 'Un régimen es híbrido cuando combina indicadores democráticos y autoritarios: hay elecciones
    libres, pero con una "cancha inclinada" a favor del partido de gobierno.

    '
  puntos:
  - Para ser híbrido, un régimen debe tener indicadores con valores tanto democráticos como autoritarios.
  - Son casos donde hay elecciones libres, pero existe también una "cancha inclinada" en favor del partido
    de gobierno.
  trampas:
  - texto: Es verdadero, porque los regímenes políticos son pluralistas y ofrecen todo tipo de posibilidades
      ideológicas en su interior.
    error: motivo_equivocado
    por_que: El veredicto está bien, pero el pluralismo ideológico no explica la mezcla de rasgos democráticos
      y autoritarios.
  - texto: Es falso, porque la democracia no tiene nada que ver con los sistemas autoritarios; es uno
      o el otro.
    error: absoluto_falso
    por_que: La categoría de régimen híbrido existe justamente porque hay casos intermedios.
  - texto: Es falso, porque eso no es híbrido, sino una poliarquía.
    error: concepto_vecino
    por_que: Poliarquía es el nombre que Dahl le da a la democracia real; no es un régimen mixto.
  pregunta_guia: ¿Qué rasgos democráticos y qué rasgos autoritarios conviven en un régimen híbrido?
  explicacion_modelo: 'Es verdadero. Según Povse, un régimen híbrido mezcla indicadores democráticos y
    autoritarios: hay elecciones libres, pero la competencia está inclinada a favor del partido de gobierno.
    La opción tentadora es la de la poliarquía, pero ese término nombra a la democracia real, no a una
    mezcla entre democracia y autoritarismo.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-33de77a8
  estado: borrador
  notas: La expresión "cancha inclinada" suele atribuirse a Levitsky y Way; validar si Povse la cita así.
- id: gomez-talavera.estado-vs-gobierno
  eje: conceptos
  autor: Patricio Gómez Talavera
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Estado y gobierno
  afirmacion: 'El Estado es una estructura de existencia permanente, aunque puede cambiar en sus formas;
    el gobierno está compuesto por quienes, en forma contingente y coyuntural, administran el Estado.

    '
  puntos:
  - Es necesario distinguir entre Estado y gobierno.
  - El Estado es una estructura de existencia permanente, aunque puede cambiar en sus formas.
  - El gobierno está compuesto por quienes, en forma contingente y coyuntural, administran el Estado.
  trampas:
  - texto: El gobierno es una estructura de existencia permanente, a diferencia del Estado.
    error: cambio_de_palabra
    por_que: Invierte los términos; lo permanente es el Estado y lo transitorio es el gobierno.
  - texto: El Estado está compuesto por quienes, en forma contingente y coyuntural, administran el gobierno.
    error: cambio_de_palabra
    por_que: Invierte los términos; es el gobierno el que administra coyunturalmente el Estado.
  - texto: Los miembros del gobierno no tienen un mandato temporal, a diferencia de la burocracia del
      Estado, que tiene mandato fijo.
    error: cambio_de_palabra
    por_que: Al revés; quienes gobiernan son los que están por un tiempo, mientras el Estado permanece.
  - texto: Los miembros del Estado tienen un mandato temporal, tras el cual dejan sus puestos a la burocracia
      del gobierno.
    error: cambio_de_palabra
    por_que: Pone lo temporal del lado del Estado y la estructura del lado del gobierno; es exactamente
      al revés.
  pregunta_guia: ¿Qué es lo que permanece y qué es lo que cambia cuando hay elecciones?
  explicacion_modelo: 'Es verdadero. Según Gómez Talavera, el Estado es una estructura permanente, aunque
    cambien sus formas, y el gobierno son quienes lo administran de manera contingente y coyuntural. Todas
    las trampas usan la misma frase con Estado y gobierno intercambiados: hay que fijarse a cuál de los
    dos le atribuyen la permanencia.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-17bf5e88
  - q-8b7be805
  estado: borrador
- id: yannuzzi.ciudadania-arendt
  eje: conceptos
  autor: Nadia Yannuzzi
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Ciudadanía como derecho a tener derechos (Arendt)
  afirmacion: 'Siguiendo a Hannah Arendt, la ciudadanía puede entenderse desde una perspectiva conceptual:
    los derechos se obtienen a través de complejos procesos históricos, signados por la violencia y por
    intereses diversos y opuestos.

    '
  puntos:
  - Hay otra forma de entender la ciudadanía, desde una perspectiva conceptual, además de la jurídica.
  - Los derechos se obtienen a través de complejos procesos históricos signados por la violencia y los
    intereses diversos y opuestos.
  trampas:
  - texto: Es falso, porque la ciudadanía solo es posible entenderla desde una perspectiva jurídica entre
      el Estado y la sociedad.
    error: absoluto_falso
    por_que: El "solo" niega justamente la perspectiva conceptual que plantea la autora.
  - texto: Es falso, porque la ciudadanía es el derecho a tener derechos, lo que implica que es un área
      de fuertes consensos.
    error: media_verdad
    por_que: Arranca con la fórmula de Arendt, pero concluye al revés; los derechos se conquistan en procesos
      conflictivos, no por consenso.
  - texto: Es verdadero, porque los derechos se obtienen a través de complejos procesos económicos signados
      por la lucha de clases y la redistribución del ingreso.
    error: verdad_general
    por_que: Suena razonable, pero la autora habla de procesos históricos con violencia e intereses opuestos,
      no de una explicación económica.
  pregunta_guia: Según esta perspectiva, ¿cómo se consiguen los derechos, por acuerdo o a través de conflictos?
  explicacion_modelo: 'Es verdadero. Para Yannuzzi, siguiendo a Arendt, la ciudadanía también se entiende
    desde una perspectiva conceptual: los derechos se obtienen en procesos históricos complejos, atravesados
    por la violencia y por intereses opuestos. La trampa más tentadora usa "el derecho a tener derechos",
    pero de ahí saca que es un área de consensos, y es lo contrario.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-9f2e3ca3
  estado: borrador
  notas: El examen solo menciona "el derecho a tener derechos" dentro de una opción falsa; validar que
    Yannuzzi use esa fórmula de Arendt.
- id: yannuzzi.individuacion
  eje: conceptos
  autor: Nadia Yannuzzi
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Individuación y repliegue a lo privado
  afirmacion: 'Entre los efectos del proceso de individuación se destaca el repliegue del individuo a
    la esfera privada, porque siente que no tiene injerencia en los asuntos públicos.

    '
  puntos:
  - Uno de los efectos del proceso de individuación es el repliegue del individuo a la esfera privada.
  - Los individuos se repliegan porque sienten no tener injerencia en los asuntos públicos.
  trampas:
  - texto: Es falso, porque siempre el ámbito de pertenencia del individuo es la esfera privada.
    error: absoluto_falso
    por_que: El "siempre" borra la idea de repliegue, que supone un movimiento desde lo público hacia
      lo privado.
  - texto: Es falso, porque nadie se salva solo.
    error: verdad_general
    por_que: Es una frase hecha, no un argumento de la autora, y además da el veredicto equivocado.
  - texto: Es verdadero, porque el proceso de individuación deriva en el sálvese quien pueda.
    error: motivo_equivocado
    por_que: El veredicto está bien, pero el motivo de la autora es la sensación de no tener injerencia
      en lo público.
  pregunta_guia: ¿Por qué el individuo se retira de lo público según la autora?
  explicacion_modelo: 'Es verdadero. Según Yannuzzi, la individuación lleva a que las personas se replieguen
    a la esfera privada porque sienten que no tienen injerencia en los asuntos públicos. La opción tentadora
    es la del "sálvese quien pueda": acierta el veredicto, pero cambia el motivo por una frase hecha.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-883542ff
  estado: borrador
- id: simone.democracia-representativa
  eje: conceptos
  autor: Nicolás Simone
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Democracia representativa
  afirmacion: 'La democracia representativa se alcanza cuando los ciudadanos eligen a un pequeño grupo
    de personas para que tomen decisiones en su nombre y diseñen un gobierno que exprese la voluntad de
    la mayoría.

    '
  puntos:
  - La democracia representativa se alcanza cuando los ciudadanos eligen a un pequeño grupo de personas
    para que tomen decisiones en su nombre.
  - Los ciudadanos eligen a otros para que diseñen un gobierno que exprese la voluntad de la mayoría.
  trampas:
  - texto: Es falso, porque la democracia representativa busca oponerse al poder de pequeños grupos sobre
      el pueblo.
    error: verdad_general
    por_que: Suena a ideal democrático, pero en la representación el pueblo justamente delega en un grupo
      reducido.
  - texto: Es falso, porque la democracia representativa se alcanza cuando los ciudadanos toman en su
      poder las grandes decisiones del Estado.
    error: concepto_vecino
    por_que: Eso describe la democracia directa, no la representativa.
  - texto: Es verdadero, porque un grupo de personas a partir de la democracia directa diseña un gobierno
      que exprese la voluntad de la mayoría.
    error: concepto_vecino
    por_que: Mezcla democracia directa con representativa; en la representativa los ciudadanos eligen
      a quienes deciden.
  pregunta_guia: En la democracia representativa, ¿quién toma las decisiones y quién lo elige?
  explicacion_modelo: 'Es verdadero. Según Simone, en la democracia representativa los ciudadanos eligen
    a otros para que decidan en su nombre y armen un gobierno que exprese la voluntad de la mayoría. Las
    trampas más tentadoras confunden la representativa con la directa, donde los propios ciudadanos toman
    las decisiones.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-61539aa3
  estado: borrador
- id: simone.transicion
  eje: conceptos
  autor: Nicolás Simone
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Qué es una transición
  afirmacion: 'La transición es el lapso que comienza cuando el régimen no democrático empieza a retirarse
    y termina cuando un régimen democrático se impone sin riesgo de ser derrocado; en sentido amplio,
    se consuma cuando no existe peligro de regresión autoritaria.

    '
  puntos:
  - La transición comienza cuando el régimen no democrático de un país comienza a retirarse.
  - Termina cuando un régimen democrático se impone, ya sin riesgo de ser derrocado.
  - En sentido amplio, la transición se consuma cuando no existe peligro de regresión autoritaria.
  trampas:
  - texto: Es verdadero, porque la transición es como la poliarquía, formas en que se describe al sistema
      democrático.
    error: concepto_vecino
    por_que: La transición es un proceso entre dos regímenes; la poliarquía es un tipo de régimen democrático.
  - texto: Es falso, porque la transición no puede preverse exactamente, al ser un periodo donde la incertidumbre
      es la norma.
    error: media_verdad
    por_que: Que haya incertidumbre no impide definir cuándo empieza y cuándo termina la transición.
  - texto: Es falso, porque nunca una democracia se impone sin riesgo; mientras haya militares, siempre
      existirá la posibilidad de golpes de Estado.
    error: absoluto_falso
    por_que: El "nunca" y el "siempre" niegan la idea de consolidación que forma parte de la definición.
  pregunta_guia: ¿Qué marca el comienzo y qué marca el final de una transición?
  explicacion_modelo: 'Es verdadero. Para Simone, la transición empieza cuando el régimen no democrático
    se retira y termina cuando la democracia se impone sin riesgo de ser derrocada, es decir, cuando ya
    no hay peligro de regresión autoritaria. La opción tentadora es la de la incertidumbre: puede describir
    el período, pero no refuta la definición.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-7dfdd578
  estado: borrador
- id: simone.pactos-elites
  eje: conceptos
  autor: Nicolás Simone
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Pactos de élites en la transición
  afirmacion: 'En las transiciones, los pactos entre las élites de distintos partidos contienen las demandas
    sociales que surgen con el regreso de la democracia y le quitan margen de maniobra a los nostálgicos
    del régimen autoritario.

    '
  puntos:
  - La alianza de las élites forma una red de contención de las demandas de la sociedad, que salen a la
    luz por las expectativas que produce el regreso de la democracia.
  - Los pactos son una garantía de que los actores nostálgicos del régimen autoritario no tendrán margen
    de maniobra para intentar un golpe.
  trampas:
  - texto: Son una garantía para que los sectores nostálgicos del régimen autoritario armen el nuevo gobierno
      que suceda a la dictadura.
    error: cambio_de_palabra
    por_que: Invierte el sentido; los pactos sirven para dejar sin margen a los nostálgicos, no para darles
      el gobierno.
  - texto: La alianza de las élites contiene las demandas de los empresarios beneficiados por el régimen
      anterior, que no tienen grandes expectativas por la democracia.
    error: cambio_de_palabra
    por_que: Cambia "la sociedad" por "los empresarios"; lo que se contiene son las demandas sociales
      que despierta la vuelta de la democracia.
  pregunta_guia: ¿Para qué les sirve a los partidos ponerse de acuerdo durante una transición?
  explicacion_modelo: 'Según Simone, los pactos de élites cumplen dos funciones: contienen las demandas
    de una sociedad con grandes expectativas por la vuelta de la democracia y dejan sin margen a los nostálgicos
    del autoritarismo para intentar un golpe. Las trampas usan las mismas frases con una pieza cambiada:
    los nostálgicos que arman el gobierno o los empresarios en lugar de la sociedad.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-c4cc8c1e
  estado: borrador
- id: simone.lanusse-gan-1971
  eje: conceptos
  autor: Nicolás Simone
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Lanusse y la salida electoral de 1971
  afirmacion: 'En marzo de 1971 el ejército designó presidente a Agustín Lanusse para pactar una transición
    controlada: proponía llamar a elecciones a cambio de que Perón quedara excluido.

    '
  puntos:
  - En marzo de 1971 el ejército designó presidente al general Agustín Lanusse para pactar una transición
    a la democracia.
  - Los militares buscaban controlar el proceso y abrieron negociaciones con los partidos políticos, incluido
    el peronismo.
  - La propuesta era llamar a elecciones a cambio de que Perón quedara excluido de ellas.
  - Los partidos rechazaron formalmente la invitación, pero aprovecharon la situación para tejer algunos
    acuerdos.
  trampas:
  - texto: Es falso, porque Agustín Lanusse nunca fue presidente ni en dictadura ni en democracia.
    error: hecho_equivocado
    por_que: Lanusse fue presidente de facto entre 1971 y 1973.
  - texto: Es falso, porque los militares en el poder nunca negocian con la oposición, y menos con los
      partidos tradicionales.
    error: absoluto_falso
    por_que: El "nunca" choca con el caso mismo; en 1971 los militares abrieron negociaciones con los
      partidos.
  - texto: Es verdadero, porque los militares se sentían muy cercanos al peronismo, ya que Perón había
      sido militar de carrera.
    error: motivo_equivocado
    por_que: El veredicto está bien, pero negociaban para controlar la salida, y la propuesta era justamente
      excluir a Perón.
  pregunta_guia: ¿Qué ofrecían los militares en 1971 y qué condición le ponían a esa salida?
  explicacion_modelo: 'Es verdadero. Según Simone, Lanusse fue designado para pactar una transición controlada:
    se llamaría a elecciones, pero con Perón excluido; los partidos rechazaron formalmente la invitación,
    aunque tejieron acuerdos. La opción tentadora dice que los militares eran cercanos al peronismo: acierta
    el veredicto, pero la condición era dejar afuera a Perón.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-f8411670
  estado: borrador
  notas: El nombre histórico de la propuesta es el Gran Acuerdo Nacional (GAN); el examen no lo menciona.
    Validar si Simone lo nombra.
- id: petrino.populismo-america-latina
  eje: conceptos
  autor: Laura Petrino
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Populismo y América Latina
  afirmacion: 'El populismo está intrínsecamente ligado a la historia y al presente latinoamericano, con
    figuras como Getúlio Vargas y Juan Domingo Perón, pero no es exclusivo de la región: también es un
    fenómeno poderoso en países centrales con democracias altamente institucionalizadas.

    '
  puntos:
  - El populismo es una expresión política intrínsecamente ligada a la historia y al presente latinoamericano.
  - Es falso que esté intrínsecamente ligado a la historia y al presente europeo.
  - Ejemplos de esta forma de entender el poder son figuras que marcaron nuestra geografía, como el brasileño
    Getúlio Vargas y Juan Domingo Perón.
  - Las características de nuestra región no son las únicas condiciones propicias para el populismo; también
    es un fenómeno poderoso en países centrales con democracias altamente institucionalizadas.
  trampas:
  - texto: El populismo es europeo; sus ejemplos son Mussolini y Hitler, que luego fueron imitados en
      América Latina.
    error: concepto_vecino
    por_que: Confunde populismo con fascismo y nazismo; los ejemplos de la autora son Vargas y Perón.
  - texto: Es verdadero que es europeo, porque la democracia se origina en Grecia y Roma.
    error: concepto_vecino
    por_que: Habla del origen de la democracia, no del populismo.
  - texto: Es falso que sea europeo, porque el populismo no reconoce fronteras a la hora de explicar sus
      orígenes.
    error: motivo_equivocado
    por_que: El veredicto está bien, pero para la autora el populismo está ligado a la historia latinoamericana.
  - texto: Es falso que sea latinoamericano, porque el populismo es más común en Asia y África.
    error: dato_inventado
    por_que: La autora no plantea eso; ubica sus ejemplos paradigmáticos en América Latina.
  - texto: Es verdadero que es latinoamericano, porque lo representan figuras como Augusto Pinochet y
      Jorge Rafael Videla.
    error: concepto_vecino
    por_que: Pinochet y Videla encabezaron dictaduras militares, no movimientos populistas.
  - texto: Es falso que la región sea la única condición, porque el populismo también es poderoso en países
      comunistas con democracias poco institucionalizadas.
    error: cambio_de_palabra
    por_que: Cambia "países centrales con democracias altamente institucionalizadas" por "países comunistas
      con democracias poco institucionalizadas".
  - texto: Es verdadero que la región es la única condición, porque las "instituciones informales" propias
      de América Latina abren el camino al populismo.
    error: verdad_general
    por_que: Suena a explicación razonable, pero la autora sostiene que el populismo también surge en
      países centrales.
  - texto: Es verdadero que la región es la única condición, porque todos los casos de populismo provienen
      de América Latina.
    error: absoluto_falso
    por_que: El "todos" choca con los casos de países centrales con democracias institucionalizadas.
  pregunta_guia: ¿Dónde ubica la autora los ejemplos clásicos de populismo y en qué otros países aparece
    hoy?
  explicacion_modelo: 'Para Petrino, el populismo está ligado a la historia latinoamericana: sus figuras
    paradigmáticas son Vargas y Perón. Por eso es falso que sea un fenómeno europeo, y también es falso
    que solo pueda surgir en nuestra región, porque aparece en países centrales con democracias institucionalizadas.
    La trampa más tentadora pone a Mussolini y Hitler como ejemplos: eso es fascismo y nazismo, no populismo.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-049e2c30
  - q-b26893fd
  estado: borrador
  notas: 'El examen pregunta la misma idea al derecho y al revés ("ligado a lo europeo" es falso; "ligado
    a lo latinoamericano" es verdadero). Sirve como ejercicio de reformulación.

    '
- id: petrino.yrigoyen-peron
  eje: conceptos
  autor: Laura Petrino
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Yrigoyen y Perón como populismos
  afirmacion: 'Yrigoyen y Perón son dos casos paradigmáticos del populismo en la Argentina: discurso de
    antinomias, liderazgos personales fuertes y demandas de sectores sin representación política.

    '
  puntos:
  - Ambos movimientos tenían un discurso basado en antinomias; el "pueblo" se enfrenta al "régimen" o
    a la "oligarquía".
  - Elaboraron movimientos con fuertes liderazgos personales.
  - Al nacer, el yrigoyenismo y el peronismo conjugaron demandas democráticas y sociales de sectores que
    estaban fuera del sistema y sin representación política.
  trampas:
  - texto: En ambos casos los líderes crearon partidos a la medida de su poder, como organizaciones que
      pudieran manejar a su antojo.
    error: dato_inventado
    por_que: La autora no caracteriza así a estos movimientos; además, la Unión Cívica Radical ya existía
      antes del liderazgo de Yrigoyen.
  pregunta_guia: ¿Qué tres rasgos comparten el yrigoyenismo y el peronismo según la autora?
  explicacion_modelo: 'Son correctas tres de las cuatro afirmaciones. Según Petrino, Yrigoyen y Perón
    comparten un discurso de antinomias (pueblo contra régimen u oligarquía), liderazgos personales fuertes
    y el haber canalizado demandas de sectores sin representación. La opción tentadora es la de los partidos
    "a la medida" del líder: suena a crítica conocida, pero no es lo que plantea la autora.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-fbaeefaa
  estado: borrador
  notas: La UCR fue fundada en 1891, antes del liderazgo de Yrigoyen; validar si Petrino lo menciona.
- id: valdez.estado-vs-nacion
  eje: conceptos
  autor: María José Valdez
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Estado y nación
  afirmacion: 'Hablar del Estado implica centrarse en las instituciones políticas; hablar de la nación
    cambia el enfoque hacia otros actores, como la sociedad y la ciudadanía.

    '
  puntos:
  - Hablar del Estado implica centrarse en las instituciones políticas.
  - Cuando nos referimos a la nación, el enfoque cambia y hay que atender a otros actores, como la sociedad
    y la ciudadanía.
  trampas:
  - texto: Las universidades públicas.
    error: dato_inventado
    por_que: La autora menciona a la sociedad y a la ciudadanía; las universidades no forman parte de
      su planteo.
  - texto: Los sindicatos.
    error: dato_inventado
    por_que: Es un actor plausible, pero no es el que nombra la autora.
  - texto: Las Pymes (pequeñas y medianas empresas).
    error: dato_inventado
    por_que: No forma parte de los actores que la autora asocia a la nación.
  - texto: Las redes sociales.
    error: dato_inventado
    por_que: No forma parte de los actores que la autora asocia a la nación.
  pregunta_guia: Cuando se pasa de hablar del Estado a hablar de la nación, ¿a qué actores hay que mirar?
  explicacion_modelo: 'Las correctas son la sociedad y la ciudadanía. Según Valdez, el Estado remite a
    las instituciones políticas, y la nación obliga a mirar a otros actores: la sociedad y la ciudadanía.
    Las demás opciones (sindicatos, universidades, Pymes, redes) son actores plausibles que la autora
    no nombra; en estas consignas hay que recordar lo que dice el texto.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-d802b9f8
  estado: borrador
- id: sribman.estado-liberal
  eje: conceptos
  autor: Ariel Sribman
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Elementos del Estado liberal
  afirmacion: 'Según Sribman, el Estado liberal en sus inicios se constituye con tres elementos: el gobierno
    representativo, la división de poderes y el liberalismo económico.

    '
  puntos:
  - El gobierno representativo es un elemento constitutivo del Estado liberal en sus inicios.
  - La división de poderes es un elemento constitutivo del Estado liberal en sus inicios.
  - El liberalismo económico es un elemento constitutivo del Estado liberal en sus inicios.
  trampas:
  - texto: Las Fuerzas Armadas son un elemento constitutivo del Estado liberal.
    error: dato_inventado
    por_que: Cualquier Estado tiene fuerzas armadas; no es un rasgo que defina al Estado liberal según
      Sribman.
  pregunta_guia: ¿Cuáles son los tres elementos que, según Sribman, constituyen al Estado liberal en sus
    inicios? ¿Cuáles tienen que ver con la forma de gobierno y cuál con la economía?
  explicacion_modelo: 'La correcta es la que incluye las tres: gobierno representativo, división de poderes
    y liberalismo económico. Según Sribman, esos son los elementos con los que nace el Estado liberal.
    Lo que más tienta son las combinaciones de dos: son verdaderas pero incompletas, y como no hay puntaje
    parcial valen cero. Las Fuerzas Armadas existen en cualquier Estado, no son un rasgo propio del liberal.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-62902631
  estado: borrador
- id: garcia.estado-liberal
  eje: conceptos
  autor: Enrique García
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Estado liberal y mercado
  afirmacion: 'Según García, el Estado liberal se apoya en la creencia en leyes naturales del mercado
    y en la iniciativa individual: es un Estado mínimo, porque el mercado es el único capaz de asignar
    eficientemente los recursos, y el lucro individual mejora al conjunto de la sociedad.

    '
  puntos:
  - Es un Estado mínimo que concibe al mercado como el único capaz de asignar eficientemente los recursos.
  - Los liberales creen que el espíritu de lucro individual promueve el beneficio personal y el mejoramiento
    del conjunto de la sociedad.
  trampas:
  - texto: Es un Estado interventor en la economía que regula para que los mercados sean más eficientes.
    error: concepto_vecino
    por_que: Describe un Estado interventor, lo opuesto al Estado mínimo liberal.
  - texto: Los liberales creen que el Estado podría ser un empresario exitoso si lo dirigieran personas
      que saben de economía.
    error: concepto_vecino
    por_que: Es la idea del Estado empresario; para los liberales el que asigna bien los recursos es el
      mercado, no el Estado.
  pregunta_guia: Para el liberalismo, según García, ¿quién asigna mejor los recursos, el Estado o el mercado?
    ¿Qué papel cumple el interés individual?
  explicacion_modelo: 'Son correctas la del Estado mínimo y la del lucro individual. Según García, el
    Estado liberal confía en las leyes naturales del mercado: el mercado asigna los recursos y el interés
    de cada uno termina mejorando a toda la sociedad. La opción del Estado interventor tienta porque habla
    de mercados eficientes, pero describe justo lo contrario: un Estado que regula, no uno mínimo.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-dd5df609
  estado: borrador
- id: garcia.estado-fascista
  eje: conceptos
  autor: Enrique García
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Estado fascista
  afirmacion: 'Según García, el poder del Estado fascista no tenía límites: su control sobre la sociedad
    era total, no se reducía a la educación, la cultura y los medios de comunicación.

    '
  puntos:
  - El poder del Estado fascista no poseía límites.
  - Su control sobre la sociedad era total, en todas sus esferas.
  trampas:
  - texto: Es verdadero, porque el Estado fascista ponía énfasis solo en el control de los valores y los
      discursos.
    error: absoluto_falso
    por_que: El control no se limitaba a valores y discursos; abarcaba a toda la sociedad.
  - texto: Es falso, porque el Estado fascista se evidenciaba sobre todo en la economía.
    error: motivo_equivocado
    por_que: 'El veredicto es correcto, pero el control no se concentraba en la economía: era total.'
  - texto: Es verdadero, porque los fascistas pensaban que desde esos espacios (educación, cultura, medios)
      podían controlar a toda la sociedad.
    error: media_verdad
    por_que: 'Esos espacios importaban, pero el Estado fascista no se limitaba a ellos: su control era
      total.'
  pregunta_guia: Según García, ¿hasta dónde llegaba el control del Estado fascista sobre la sociedad?
    ¿Había alguna esfera que quedara afuera?
  explicacion_modelo: 'Es falso. Según García, el poder del Estado fascista no tenía límites y su control
    sobre la sociedad era total, así que no es cierto que dejara esferas afuera. La opción que dice que
    desde la educación, la cultura y los medios controlaban a toda la sociedad tienta porque esos espacios
    eran clave, pero acepta la premisa falsa de que el control se limitaba a ellos.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-52a3ee4a
  estado: borrador
- id: garcia.estado-bienestar
  eje: conceptos
  autor: Enrique García
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Estado de bienestar (desde 1945)
  afirmacion: 'Según García, el Estado de bienestar se desarrolló en Occidente después de 1945 para dar
    solución a los efectos económicos y sociales de la guerra y para retomar el crecimiento y la estabilidad
    social ante el avance del comunismo.

    '
  puntos:
  - Se desarrolló en Occidente a partir de 1945, después de la Segunda Guerra Mundial.
  - Se conformó para dar solución a los efectos económicos y sociales que la guerra había provocado.
  - Buscaba retomar el rumbo del crecimiento y de la estabilidad social ante el avance del comunismo.
  trampas:
  - texto: Fue la primera organización estatal exitosa por fuera del capitalismo que triunfó en Occidente.
    error: concepto_vecino
    por_que: El Estado de bienestar es una forma del Estado capitalista, no una alternativa al capitalismo.
  - texto: Fue consecuencia del enorme éxito de la economía soviética, que Occidente imitó.
    error: hecho_equivocado
    por_que: Surgió para frenar el avance del comunismo, no para imitar a la economía soviética.
  pregunta_guia: ¿Qué dos problemas de la posguerra buscaba resolver el Estado de bienestar, según García?
  explicacion_modelo: 'Son correctas las dos causas: dar solución a los efectos económicos y sociales
    de la guerra y retomar el crecimiento y la estabilidad social ante el avance del comunismo. La opción
    de la economía soviética tienta porque también nombra al comunismo, pero invierte la relación: el
    Estado de bienestar fue una respuesta para contenerlo, no una copia.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-315c3a2a
  estado: borrador
- id: pirsch.federalismo-america-latina
  eje: conceptos
  autor: Sofía Pirsch
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Países federales de América Latina
  afirmacion: 'Según Pirsch, en América Latina solo hay cuatro países con sistemas federales; entre ellos
    están México y Venezuela.

    '
  puntos:
  - En América Latina solo hay cuatro países con sistemas federales.
  - México tiene un sistema federal.
  - Venezuela tiene un sistema federal.
  trampas:
  - texto: Chile tiene un sistema federal.
    error: hecho_equivocado
    por_que: Chile es un Estado unitario.
  - texto: Uruguay tiene un sistema federal.
    error: hecho_equivocado
    por_que: Uruguay es un Estado unitario.
  pregunta_guia: ¿Cuáles son los cuatro países federales de América Latina según Pirsch? ¿Qué vecinos
    de la Argentina no lo son?
  explicacion_modelo: 'Son correctas México y Venezuela. Según Pirsch, solo cuatro países latinoamericanos
    son federales y estos dos están entre ellos. Chile y Uruguay tientan porque son vecinos y tienen democracias
    estables, pero son Estados unitarios.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-fa8d7cb4
  estado: borrador
  notas: 'El examen solo nombra a México y Venezuela. Los otros dos federales son Argentina y Brasil (dato
    general): confirmar que Pirsch los menciona antes de enseñarlos en la ficha.

    '
- id: batlle.dahl-democracia
  eje: conceptos
  autor: Margarita Batlle
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: La democracia según Dahl
  afirmacion: 'Según Batlle, para Robert Dahl la democracia es un orden ideal e inalcanzable en la práctica;
    por la complejidad del concepto, su obra se ocupa de comprender cómo funcionan los sistemas políticos
    occidentales, y en ellos los funcionarios no elegidos deben subordinarse a los elegidos.

    '
  puntos:
  - Para Dahl la democracia es un sistema inalcanzable e imposible de adoptar en la práctica, un orden
    utópico e ideal.
  - La complejidad del concepto de democracia fue un obstáculo analítico y práctico.
  - Por eso la obra de Dahl muestra su preocupación por comprender el funcionamiento de los sistemas políticos
    occidentales.
  - Los funcionarios públicos no elegidos deben estar subordinados a los elegidos popularmente; los electos
    no deben ser condicionados por personas sin representación electoral.
  trampas:
  - texto: Es falso que los electos deban ser condicionados por no electos, porque los funcionarios políticos
      no deben rendir cuentas ni ser controlados por la justicia o los parlamentos.
    error: motivo_equivocado
    por_que: 'El veredicto es correcto, pero el motivo no: el control de la justicia y del parlamento
      no es lo que está en juego, sino la subordinación de los no electos a los electos.'
  - texto: Debe haber una persona o grupo que tenga el poder (o pueda condicionarlo) sin haber sido electo.
    error: concepto_vecino
    por_que: Eso describe un poder tutelar no democrático; en la democracia los no electos se subordinan
      a los electos.
  - texto: Los funcionarios electos deben subordinarse a los designados por el presidente o el Congreso.
    error: cambio_de_palabra
    por_que: 'Invierte la relación: son los designados los que se subordinan a los electos.'
  - texto: Es falso que la democracia sea inalcanzable, porque numerosos países han vivido en democracia.
    error: verdad_general
    por_que: Confunde las democracias reales con el ideal; para Dahl la democracia plena es un ideal que
      ningún país alcanza.
  - texto: Es falso, porque no existen cuestiones utópicas para que los seres humanos organicen sus sociedades.
    error: absoluto_falso
    por_que: Generaliza sin sustento; justamente Dahl piensa la democracia como un ideal utópico.
  - texto: Es verdadero, porque la única democracia verdadera es la de asambleas donde participan todos
      los ciudadanos.
    error: motivo_equivocado
    por_que: El veredicto es correcto, pero confunde el ideal de Dahl con la democracia directa asamblearia.
  - texto: La obra de Dahl se preocupa por comprender los sistemas políticos de todo el mundo / la democracia
      en la historia mundial.
    error: cambio_de_palabra
    por_que: 'Cambia el alcance: Dahl se ocupa de los sistemas políticos occidentales.'
  - texto: La obra de Dahl se preocupa por comprender los sistemas electorales occidentales.
    error: cambio_de_palabra
    por_que: Cambia "sistemas políticos" por "sistemas electorales", que es solo una parte.
  pregunta_guia: Según Batlle, ¿por qué para Dahl la democracia es un ideal inalcanzable? ¿Qué sistemas
    estudia entonces y qué relación debe haber entre funcionarios electos y no electos?
  explicacion_modelo: 'Es verdadero: según Batlle, Dahl entiende la democracia como un orden ideal, utópico,
    que ninguna sociedad alcanza del todo en la práctica. La opción "es falso porque muchos países vivieron
    en democracia" tienta porque es lo que diría el sentido común, pero confunde las democracias reales
    con el ideal del que habla Dahl.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-146be346
  - q-b2b0a999
  - q-6e0f83ef
  estado: borrador
  notas: 'Dahl llama "poliarquía" a las democracias reales; el término aparece en distractores de otras
    preguntas, pero no en las de Batlle. Confirmar si Batlle lo usa antes de incorporarlo a la ficha.
    La redacción de la clave ("orden utópico al que no puede aspirar la sociedad") es fuerte: validar
    el matiz con el texto.

    '
- id: beyreuther.dictaduras
  eje: conceptos
  autor: Verónica Beyreuther
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: 'Dictaduras: poder concentrado, coacción y consenso'
  afirmacion: 'Según Beyreuther, las dictaduras excluyen la división de poderes, porque un poder compartido
    y con límites les resulta inconducente; pueden dominar al principio con coacción pura, pero con el
    tiempo necesitan algún grado de consenso, porque su duración depende de su legitimidad.

    '
  puntos:
  - Los regímenes dictatoriales excluyen cualquier posibilidad de división de los poderes del Estado.
  - En una dictadura, la idea de un poder dividido, compartido y con mecanismos que impidan su concentración
    en uno de los poderes resulta inconducente.
  - La coacción pura puede servir al principio, pero con el tiempo se hace necesario algún grado de consenso.
  - El problema de la duración de una dictadura está unido en forma inseparable al de la legitimidad que
    la sostiene.
  - Para lograr ese consenso, las dictaduras generalmente apelan a representar un supuesto interés público.
  trampas:
  - texto: Es verdadero, porque el dictador retoma el modelo de las monarquías constitucionales y ocupa
      desde la fuerza el lugar del monarca.
    error: motivo_equivocado
    por_que: El veredicto es correcto, pero la monarquía constitucional limita el poder del rey; no es
      el modelo de la dictadura.
  - texto: Es falso, porque aun en las dictaduras el poder debe respetar el control del Poder Legislativo
      (o del Judicial) sobre el Ejecutivo.
    error: concepto_vecino
    por_que: Describe los controles de una república; en la dictadura el poder no se divide ni se controla.
  - texto: Las dictaduras siempre requieren de una legitimidad electoral para justificar el uso de la
      fuerza.
    error: absoluto_falso
    por_que: Las dictaduras no se legitiman por elecciones; buscan consenso apelando a un supuesto interés
      público.
  - texto: Las dictaduras buscan sostenerse siempre en un consenso mayoritario, sobre todo si ya no existe
      la causa que les dio origen.
    error: absoluto_falso
    por_que: La autora habla de "algún grado de consenso", no de un consenso mayoritario y permanente.
  pregunta_guia: Según Beyreuther, ¿por qué una dictadura no puede convivir con la división de poderes?
    ¿Por qué la fuerza sola no le alcanza para durar?
  explicacion_modelo: 'Son correctas la de la legitimidad y la del interés público. Según Beyreuther,
    la coacción alcanza al principio, pero para durar una dictadura necesita algún grado de consenso,
    y lo busca presentándose como representante de un supuesto interés público. La opción del "consenso
    mayoritario" tienta porque también habla de consenso, pero exagera con "siempre" y "mayoritario".

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-e7648876
  - q-35aaa976
  estado: borrador
- id: hermo.genocidio
  eje: conceptos
  autor: Javier Hermo
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Definición de genocidio (ONU)
  afirmacion: 'Según Hermo, las Naciones Unidas definieron el genocidio desde un punto de vista jurídico
    y político, como luego la Corte Penal Internacional; entre sus puntos centrales están la lesión grave
    a la integridad física o mental de los miembros del grupo y el sometimiento intencional del grupo
    a condiciones de existencia que acarreen su destrucción física, total o parcial.

    '
  puntos:
  - La ONU generó una definición de genocidio desde un punto de vista jurídico y político; años después
    lo hizo también la Corte Penal Internacional.
  - Un punto central es la lesión grave a la integridad física o mental de los miembros del grupo.
  - Otro punto central es el sometimiento intencional del grupo a condiciones de existencia que hayan
    de acarrear su destrucción física, total o parcial.
  trampas:
  - texto: Matanzas en las que la cantidad de víctimas sea claramente superior a las tasas de violencia
      habituales.
    error: dato_inventado
    por_que: La definición no se basa en la cantidad de víctimas sino en la intención de destruir a un
      grupo.
  - texto: Medidas destinadas a impedir casamientos en el seno del grupo.
    error: cambio_de_palabra
    por_que: La definición habla de medidas para impedir nacimientos, no casamientos.
  pregunta_guia: '¿Qué actos incluye la definición de genocidio de la ONU? ¿Qué es lo que la define: la
    cantidad de víctimas o la intención?'
  explicacion_modelo: 'Son correctas la lesión grave a la integridad física o mental y el sometimiento
    intencional a condiciones de existencia que lleven a la destrucción del grupo. Así lo recoge Hermo
    a partir de la definición de la ONU. La de "impedir casamientos" tienta porque suena a la definición,
    pero cambia una palabra: lo que la definición menciona es impedir nacimientos.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-3e52b36d
  estado: borrador
  notas: 'La Convención de 1948 enumera además la matanza de miembros del grupo, las medidas para impedir
    nacimientos y el traslado forzoso de niños; el examen solo evaluó dos puntos. Validar con el texto
    de Hermo antes de sumar los demás a `puntos`.

    '
- id: etchevest.terrorismo
  eje: conceptos
  autor: Graciela Etchevest
  fuente: Material de la cátedra (texto pendiente de identificar)
  tema: Cambios del terrorismo en el siglo XXI
  afirmacion: 'Según Etchevest, en el siglo XXI el terrorismo cambió: se sumaron grupos religiosos radicalizados,
    sobre todo el llamado fundamentalismo islámico, con impacto en la agenda mundial, que se organizan
    en grupos más pequeños y usan con eficiencia la tecnología y las redes sociales.

    '
  puntos:
  - Con el nuevo siglo se sumaron grupos religiosos radicalizados cuyo accionar tuvo un fuerte impacto
    en la agenda mundial, principalmente el llamado "fundamentalismo islámico".
  - La novedad es que se organiza a partir de grupos más pequeños, con un eficiente uso de herramientas
    tecnológicas, muchas veces ligadas a las redes sociales.
  trampas:
  - texto: Sus espacios de acción se restringen al continente de origen; a veces no tienen país de origen
      y actúan en escenarios regionales.
    error: media_verdad
    por_que: Que a veces no tengan país de origen no implica que se restrinjan a un continente; su impacto
      es mundial.
  - texto: Sus espacios de acción se restringen al país de origen, como en el ataque a las Torres Gemelas
      de 2001.
    error: hecho_equivocado
    por_que: 'El ejemplo contradice la idea: el ataque a las Torres Gemelas fue fuera del país de origen
      de sus autores.'
  pregunta_guia: Según Etchevest, ¿qué tiene de nuevo el terrorismo del siglo XXI en sus actores, su organización
    y su alcance?
  explicacion_modelo: 'Son correctas la de los grupos religiosos radicalizados y la de los grupos pequeños
    con uso de tecnología y redes. Según Etchevest, esas son las dos novedades del terrorismo del nuevo
    siglo, que además tiene impacto en la agenda mundial. Las opciones que lo "restringen" al país o al
    continente tientan porque suenan precisas, pero contradicen ese alcance global.

    '
  recurso_ubaxxi: pendiente
