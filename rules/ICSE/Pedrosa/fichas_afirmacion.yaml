- id: romero.rodrigazo-1975
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: El Rodrigazo (1975)
  afirmacion: 'En 1975 el Rodrigazo, el plan del ministro de Economía Celestino Rodrigo, desató una crisis
    económica que el gobierno peronista ya no pudo controlar.

    '
  puntos:
  - Provocó corridas hacia el dólar e inflación galopante.
  - Hizo aparecer los mecanismos de indexación.
  - Dejó al gobierno con escasas posibilidades de controlar la coyuntura; el gobierno peronista se encaminaba
    a su final.
  trampas:
  - texto: Fue el primer default de la deuda externa y el inicio del aislamiento internacional.
    error: hecho_equivocado
    por_que: El Rodrigazo fue una crisis de precios, dólar e inflación, no una cesación de pagos.
  - texto: Fue una protesta de productores agrícolas surgida en Santa Fe.
    error: hecho_equivocado
    por_que: Lleva el apellido del ministro de Economía; fue una crisis económica, no un movimiento social.
  - texto: En 1975 ya gobernaban los militares con Videla.
    error: anacronismo
    por_que: El golpe fue el 24 de marzo de 1976; en 1975 gobernaba Isabel Perón.
  pregunta_guia: ¿Qué pasó con el dólar, los precios y la capacidad del gobierno de controlar la economía
    después del Rodrigazo?
  explicacion_modelo: 'Es verdadero. Según Romero, el Rodrigazo desató corridas al dólar, inflación galopante
    e indexación, y el gobierno de Isabel quedó sin control de la economía. La opción del “primer default”
    tienta porque también suena a crisis, pero es otro hecho; y la de Videla es un anacronismo: el golpe
    fue en marzo de 1976.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-805de77b
  - q-85b635b6
