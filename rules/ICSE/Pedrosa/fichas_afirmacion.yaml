  estado: borrador
- id: romero.malvinas-1982
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: Malvinas como salida para el gobierno militar
  afirmacion: 'Según Romero, para el gobierno militar la ocupación de las Malvinas en abril de 1982 era
    la solución a muchos de sus problemas: permitiría ganar de un golpe la legitimidad que había perdido
    ante una sociedad disconforme.

    '
  puntos:
  - Una acción militar para “recuperar las islas” permitiría ganar de un golpe la cuestionada legitimidad
    ante una sociedad visiblemente disconforme.
  trampas:
  - texto: La guerra servía para distraer la atención de un conflicto con Brasil por importaciones y exportaciones.
    error: dato_inventado
    por_que: Romero explica Malvinas por la búsqueda de legitimidad interna, no por un conflicto con Brasil.
  - texto: 'Es falso: recuperar las islas podía unificar a la población detrás del gobierno de Alfonsín,
      que estaba debilitado.'
    error: anacronismo
    por_que: En 1982 gobernaba la Junta con Galtieri; Alfonsín asumió el 10 de diciembre de 1983.
  - texto: 'Es falso: Galtieri tenía apoyos sociales, como la marcha de la CGT del 30 de marzo de 1982
      a favor de su liderazgo.'
    error: hecho_equivocado
    por_que: La movilización de la CGT del 30 de marzo de 1982 fue una protesta contra el gobierno militar,
      y fue reprimida.
  pregunta_guia: ¿Qué problema tenía el gobierno militar a comienzos de 1982 y por qué pensó que Malvinas
    lo resolvía?
  explicacion_modelo: 'Es verdadero. Según Romero, ante una sociedad disconforme, la ocupación de las
    islas era para el gobierno militar una forma de recuperar de un golpe la legitimidad perdida. La opción
    de Alfonsín tienta porque menciona un gobierno debilitado, pero es un anacronismo: en 1982 gobernaba
    Galtieri, y Alfonsín asumió a fines de 1983.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-ac0b8ed4
  estado: borrador
- id: romero.alfonsin-renovacion-radical
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: Alfonsín y la renovación del radicalismo
  afirmacion: 'El radicalismo se renovó por impulso de Alfonsín, que en 1972 creó el Movimiento de Renovación
    y Cambio para disputarle el liderazgo a Ricardo Balbín y se distinguió por su oposición a la dictadura
    y su discurso ético.

    '
  puntos:
  - En 1972 Alfonsín creó el Movimiento de Renovación y Cambio para disputarle el liderazgo del radicalismo
    a Ricardo Balbín.
  - Durante el Proceso se distinguió del resto de los políticos, porque criticó con energía a los militares,
    defendió a detenidos políticos y reclamó por los desaparecidos.
  - Reivindicó los aspectos éticos de la política con un discurso ganador, muy distinto del radical tradicional,
    que atrajo al partido una masa de afiliados y simpatizantes.
  trampas:
  - texto: Disputó las presidenciales de 1973 con Perón y, aunque perdió, quedó posicionado para ser el
      candidato radical siguiente.
    error: hecho_equivocado
    por_que: En las dos elecciones de 1973 el candidato radical fue Balbín, no Alfonsín.
  - texto: Criticó a los militares durante el Proceso y al mismo tiempo fue uno de los grandes promotores
      de la euforia popular por Malvinas.
    error: media_verdad
    por_que: La primera parte es correcta, pero el examen da por falso que haya promovido la euforia por
      la Guerra de Malvinas.
  pregunta_guia: ¿Qué hizo Alfonsín entre 1972 y 1983 que lo diferenció de Balbín y del resto de los políticos?
  explicacion_modelo: 'Romero explica la renovación del radicalismo por dos cosas: durante el Proceso,
    Alfonsín se diferenció de los demás políticos criticando a los militares y defendiendo a presos y
    desaparecidos, y además tenía un discurso ético y ganador que atrajo afiliados. La trampa de Malvinas
    tienta porque arranca con algo cierto (su crítica a los militares), pero le agrega algo falso. Y la
    de 1973 confunde: ese año el candidato radical fue Balbín.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-2018c8e7
  estado: borrador
  notas: Validar con el texto que Romero menciona que Alfonsín se mantuvo al margen de la euforia por
    Malvinas; el examen solo dice que la opción es falsa.
- id: romero.alfonsin-intelectuales
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: Los intelectuales y la política desde 1983
  afirmacion: 'Desde 1983 los intelectuales volvieron a la vida académica y además se incorporaron a la
    política, y la política se intelectualizó.

    '
  puntos:
  - Alfonsín recurrió a intelectuales como asesores o funcionarios técnicos.
  - El discurso de Alfonsín traducía en clave política lo que los académicos elaboraban, y por eso resultó
    moderno, complejo y profundo.
  - Dirigentes peronistas también recurrieron a los intelectuales.
  - La discusión política adquirió brillo y, en menor medida, profundidad.
  trampas:
  - texto: El peronismo logró rápidamente el control de la vida institucional y política de las universidades
      nacionales, que ya tenía desde los 70.
    error: dato_inventado
    por_que: Romero habla de intelectuales que se suman a la política, no de un partido que controla las
      universidades.
  - texto: Las listas de concejales, diputados y senadores se llenaron de académicos e intelectuales,
      que desplazaron a los políticos tradicionales.
    error: dato_inventado
    por_que: Exagera; los intelectuales asesoraron y aportaron ideas, pero no reemplazaron a los políticos
      en las listas.
  pregunta_guia: ¿De qué manera concreta entraron los intelectuales en la política después de 1983, y
    qué cambió en la discusión pública?
  explicacion_modelo: 'Según Romero, la política se intelectualizó porque Alfonsín usó a los intelectuales
    como asesores y funcionarios técnicos y su discurso traducía en clave política lo que ellos elaboraban;
    los peronistas también recurrieron a ellos, y la discusión ganó brillo y, en menor medida, profundidad.
    La opción de las listas llenas de académicos tienta porque suena a "intelectuales en la política",
    pero exagera: asesoraban, no reemplazaron a los políticos.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-cf935fc6
  estado: borrador
  notas: Ojo con el matiz "brillo y, en menor medida, profundidad"; una variante futura podría invertirlo.
- id: romero.alfonsin-legado-militar
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: Las distinciones de Alfonsín sobre el legado militar
  afirmacion: 'Al asumir, Alfonsín propuso distinciones lógicas sobre el legado militar (separar a los
    culpables de la institución y graduar las responsabilidades) que eran difíciles de aceptar para la
    sociedad movilizada y los organismos de derechos humanos.

    '
  puntos:
  - Alfonsín pensaba que había que separar el juicio a los culpables del juzgamiento a la institución
    militar, que era parte del Estado.
  - Proponía concentrar el castigo en las cúpulas y aplicar al resto el criterio de la obediencia debida.
  - Esas distinciones eran difíciles de admitir para la sociedad movilizada y, en particular, para las
    organizaciones de derechos humanos.
  trampas:
  - texto: Alfonsín pensaba que había que evitar el juicio a los culpables porque implicaba atacar a toda
      la institución, que era parte del Estado.
    error: cambio_de_palabra
    por_que: Invierte la idea, porque Alfonsín separaba culpables e institución justamente para poder
      juzgar a los culpables (el Juicio a las Juntas fue en 1985).
  - texto: Alfonsín no había condenado las violaciones a los derechos humanos durante la dictadura y siguió
      esa línea en su gobierno.
    error: hecho_equivocado
    por_que: Alfonsín denunció las violaciones durante el Proceso y como presidente creó la CONADEP en
      1983.
  pregunta_guia: ¿Qué distinciones hacía Alfonsín entre culpables, cúpulas e institución militar, y por
    qué los organismos de derechos humanos las rechazaban?
  explicacion_modelo: 'Romero dice que Alfonsín distinguía entre juzgar a los culpables y juzgar a la
    institución, y que proponía castigar a las cúpulas y aplicar al resto la obediencia debida; por eso
    las organizaciones de derechos humanos, que querían justicia para todos los responsables, no las aceptaban.
    La opción "evitar el juicio a los culpables" tienta porque usa la misma idea de proteger a la institución,
    pero concluye lo contrario: Alfonsín sí juzgó a los culpables.

    '
  recurso_ubaxxi: pendiente
  preguntas:
  - q-90304d80
  - q-3ecdf8c6
  estado: borrador
- id: romero.alfonsin-civilidad-o-consenso
  eje: historia
  autor: Luis A. Romero
  fuente: Breve historia contemporánea de la Argentina (capítulo pendiente)
  tema: Civilidad o soluciones consensuadas
  afirmacion: 'Alfonsín debió optar entre tensar al máximo el polo de la civilidad o privilegiar soluciones
    consensuadas; eligió en general la primera línea, pero los contratiempos lo obligaron a aceptar la
    segunda.

    '
  puntos:
  - Al asumir en 1983, Alfonsín debía elegir entre tensar al máximo el polo de la civilidad, confrontando
    con intereses establecidos (incluso entre sus apoyos), o privilegiar soluciones consensuadas.
  - En general eligió la primera línea y hasta 1987 mantuvo la iniciativa, buscando caminos alternativos
    y presentando nuevas propuestas ante cada contraste.
  - Debió aceptar la segunda línea cuando algunos fuertes contratiempos le mostraron los límites de su
    poder.
  trampas:
  - texto: El gobierno eligió en general la segunda línea, y un resultado fue el Pacto de Olivos que Alfonsín
      consensuó con el peronismo.
    error: anacronismo
    por_que: El Pacto de Olivos fue en 1993, entre Alfonsín, ya ex presidente, y Menem.
  - texto: El gobierno se sostuvo firmemente en la primera línea durante los 4 años de su mandato, confrontando
      hasta el último día con sindicatos, militares, opositores y la Iglesia.
    error: absoluto_falso
    por_que: Romero dice que terminó aceptando la segunda línea; además, el mandato de Alfonsín era de
      seis años (1983–1989).
  pregunta_guia: ¿Qué dos caminos tenía Alfonsín en 1983, cuál eligió y qué lo hizo cambiar?
  explicacion_modelo: 'Según Romero, Alfonsín eligió en general la confrontación desde la civilidad y
    mantuvo la iniciativa hasta 1987, proponiendo alternativas ante cada contraste; pero cuando los contratiempos
    le mostraron los límites de su poder tuvo que aceptar soluciones consensuadas. Por eso son correctas
    las dos opciones sobre la primera línea. La de "confrontó hasta el último día" tienta porque dice
    "primera línea", pero es un absoluto que el texto niega.

    '
  recurso_ubaxxi: pendiente
