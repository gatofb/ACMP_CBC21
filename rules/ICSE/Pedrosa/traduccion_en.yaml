      enunciado: >-
        Luis A. Romero states that by 1975 the Peronist government was nearing its end. The "Rodrigazo" had
        unleashed an economic crisis that proved impossible to control.
      opciones:
        A: It is false, because in 1975 the military were already governing under Gen. Jorge R. Videla.
        B: >-
          It is false, because the “Rodrigazo” was a social protest movement that arose in Santa Fe, based on
          agricultural producers.
        C: >-
          It is true, because it was the first default (suspension of foreign debt payments) and the beginning
          of the country's international isolation and heavy legal costs abroad.
        D: >-
          It is true, because the “Rodrigazo” brought about the appearance of indexation mechanisms and, in
          general, scant possibilities for controlling the situation from power.
  q-46512c49:
    - fuente: 30ede0347e
      enunciado: >-
        According to Romero, carrying out the economic transformation proposed by the last dictatorship raised
        a political problem, set out by Jorge Schvarzer: the economic leadership had to last a fairly limited
        time so that corruption would not become an endemic issue.
      opciones:
        A: >-
          It is false, because the economic leadership had to remain in power long enough for the changes to
          be irreversible.
        B: >-
          It is true, because corruption had long been established as the basis structuring all of Argentine
          politics, and ending it was the central reason the military took power.
        C: >-
          It is false, because how long the economic leadership lasted was not as relevant as the stability of
          its corporate alliances.
        D: >-
          It is true, because most of the military had a neoliberal project and opposed Economy Minister
          Martínez de Hoz, who came from a statist tradition and was supported only by President Videla.
  q-ac0b8ed4:
    - fuente: d4af4b2234
      enunciado: >-
        Romero states that the occupation of the Malvinas Islands in April 1982 was the solution to many of
        the problems the government had at that time.
      opciones:
        A: >-
          It is true, because a military action for what they called "recovering the islands” would make it
          possible to win, in one stroke, the questioned legitimacy before a visibly dissatisfied society.
        B: >-
          It is true, because a military action in the Malvinas would have a great advantage: it was far from
          the mainland and made it possible to divert attention from the conflict with the Brazilian
          Government over issues related to imports and exports.
        C: >-
          It is false, because the Malvinas were an important claim for many Argentines and "recovering the
          islands” could lead to the unification of the population behind Alfonsín's government, at a time
          when it was very politically weakened.
        D: >-
          It is false, because the warlike impetus of then-president Galtieri was stimulated by social support
          that included street mobilizations in favor of his appointment and leadership, such as the march
          launched by the CGT on March 30, 1982.
  q-f86741b3:
