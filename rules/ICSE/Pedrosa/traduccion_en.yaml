        According to Romero, some of the most important events of the transition in Argentina were those that
        took place during Holy Week of 1987, when a military uprising put democratic stability to the test.
        This was so because:
      opciones:
        A: >-
          It was a rebellion by military sectors demanding an end to the trials against officers involved in
          the repression during the military dictatorship that had ended a few years earlier.
        B: >-
          The uprising was immediately suppressed through a military intervention ordered by President
          Alfonsín, without the need for further negotiations.
        C: It was a successful coup attempt that forced Raúl Alfonsín to resign before completing his term.
        D: >-
          It was a turning point in the relationship between the Government and the military, later leading to
          the passing of the Ley de Obediencia Debida (Due Obedience Law).
        E: The correct options are A and B.
        F: The correct options are B and D.
        G: The correct options are A and D.
        H: The correct options are A, C and D.
