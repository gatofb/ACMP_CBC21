  q-a9c42bff:
    - fuente: cddd75d38c
      enunciado: >-
        According to Romero, the Peronist guerrilla group Montoneros was very skilled at interpreting Perón's
        words while he was in exile in Madrid, but they had to face the problem posed by the leader's return
        to the country. This could be seen in that:
      opciones:
        A: >-
          The Montoneros developed the theory of the "cerco" (siege) or "entorno" (inner circle), which
          supposedly prevented Perón from knowing the true will of his people.
        B: >-
          Perón began to speak unequivocally, recalling the “Peronist orthodoxy”, which had little to do with
          the "socialist” one.
        C: >-
          Perón began to speak unequivocally, recalling his socialist origins, which had little to do with the
          “Peronist orthodoxy”.
        D: >-
          Perón began to abandon his traditional right-wing discourse, denouncing the "apresurados" (hasty
          ones) and infiltrators of the Triple A.
        E: The correct options are A and B.
        F: The correct options are B and D.
        G: The correct options are C and D.
        H: The correct options are A, B and D.
  q-64c6848f:
    - fuente: a7e6e8e978
      enunciado: >-
        According to Romero, in the so-called “Cordobazo” of 1969, social mobilization was expressed in
        various ways, for example, in that:
      opciones:
        A: >-
          Immigrants were central actors in the protests, seeking a place in the labor market and an easier
          path to naturalization.
        B: >-
          The crowd, which controlled the city for several hours, had precise slogans and leaders who
          coordinated the actions.
        C: >-
          Before the uprising there was strong union agitation in Córdoba, where the main automobile factories
          were concentrated.
        D: >-
          The uprising was preceded by a wave of student protests at various universities, some of them
          harshly repressed.
        E: The correct options are A and C
        F: The correct options are B and C.
        G: The correct options are B and D.
        H: The correct options are C and D.
