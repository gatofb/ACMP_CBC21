  q-982eb0c5:
    - fuente: 8c8d95f390
      enunciado: >-
        According to Florencia Deich, the case of President Arturo Frondizi and his replacement in 1963 is
        complex to analyze when defining whether it was a Coup d'État or an institutional interruption. This
        is so because:
      opciones:
        A: >-
          The military finally decided to remove Frondizi from power and, in this sense, their action was
          successful because they managed to achieve all their objectives, since they placed a member of the
          Armed Forces in the presidency.
        B: >-
          The way events unfolded created complications when defining the type of regime, since the legitimate
          president was removed by military pressure, but the person who took office in his place did so
          respecting the rules of succession set out in the Constitution.
        C: >-
          The military finally decided to remove Frondizi from power and, in this sense, their action was
          successful; however, they did not manage to achieve all their objectives, since they did not place a
          member of the Armed Forces in the presidency.
        D: >-
          The way events unfolded did not create complications when defining the type of regime since the
          legitimate president was removed by military pressure, but the person who took office in his place
          did so respecting the rules of succession set out in the Constitution.
        E: The correct options are A and B.
        F: The correct options are B and C.
        G: The correct options are C and D.
        H: The correct options are A and D.
  q-8b79eae8:
    - fuente: 63b068fb5c
      enunciado: >-
        Romero points out that the Church, which in 1981 had declared itself in favor of democracy –though
        without criticizing its relationship with the military government–, gradually evolved toward growing
        hostility toward the radical government headed by Alfonsín. This was so because:
      opciones:
        A: >-
          The ecclesiastical authorities were irritated by their limited influence in the area of private
          education.
        B: >-
          The ecclesiastical authorities rejected the secular tone of the cultural discourse circulating
          through the institutions and media of the State.
        C: >-
          A sector of the Church took on the role of social censor, with a combative discourse. Democracy
          –they said– turned out to be responsible for the evils of the century: gambling and betting, social
          media and multiculturalism.
        D: >-
          A change in the internal balance of the local episcopate converged with the general orientation
          given to the Church by Pope John Paul II, who was determined to wage a battle against the Argentine
          Catholic leader, the then young archbishop Jorge Bergoglio.
        E: The correct options are A and B.
        F: The correct options are C and B.
        G: The correct options are A and D.
        H: The correct options are A, B, C and D.
  q-6e0f83ef:
    - fuente: af32d84359
      enunciado: >-
        According to Margarita Batlle, the complexity of the concept of democracy was an obstacle, both
        analytical and practical. That is why:
      opciones:
        A: Robert Dahl's work shows his concern with understanding how Western political systems function.
        B: >-
          Robert Dahl's work shows his concern with understanding how political systems function throughout
          the world.
        C: >-
          Robert Dahl's work shows his concern with understanding how democracy has functioned in world
          history.
        D: Robert Dahl's work shows his concern with understanding how Western electoral systems function.
        E: The correct options are A and D.
        F: The correct options are B and C.
        G: The correct options are C and D.
        H: The correct options are A, C and D.
  q-fbaeefaa:
    - fuente: f7ea32f2a1
      enunciado: >-
        According to Laura Petrino, Yrigoyen and Perón are two paradigmatic cases of populism in Argentina.
        This can be seen in:
      opciones:
        A: >-
          Both movements had a discourse based on antinomies: the “people” confront the “regime” or the
          “oligarchy”.
        B: They built movements with strong personal leadership.
        C: >-
          In both cases the leaders created parties tailored to their power, as organizations they could
          manage at will.
        D: >-
          At the moment of their birth, yrigoyenismo and peronismo brought together a set of democratic and
          social demands from sectors that were outside the system and lacked political representation.
        E: The correct options are A and B.
        F: The correct options are B and D.
        G: The correct options are A, B and D.
        H: The correct options are A, C and D.
  q-25f11a44:
    - fuente: 62fccedd4c
      enunciado: >-
        In the video in which Eduardo Levy Yeyati interviews Pablo Gerchunoff about the figure of Raúl
        Alfonsín, Gerchunoff stresses that the radical Government's decree empowering the Supreme Council of
        the Armed Forces to try the military Juntas was fundamental.
      opciones:
        A: >-
          It is false, because the Argentine military only began to be tried during Néstor Kirchner's
          Government in 2003.
        B: >-
          It is false, because there was only one trial of the military Juntas and it was not the one by the
          Supreme Council of the Armed Forces.
        C: >-
          It is true, because the decree mentioned by the interviewee allowed the military to be acquitted at
          first instance, and therefore later to obtain the subsequent pardon that Alfonsín himself was forced
          to issue.
        D: >-
          It is true, because if Alfonsín had not signed the decree sending the military Juntas to be tried
          first by their own peers, the famous later trial would not have taken place.
  q-7dfdd578:
    - fuente: 7ab3f518cc
      enunciado: >-
        According to Nicolás Simone, the transition is a period of time that begins when a country's
        non-democratic regime begins to withdraw and ends when a democratic regime takes hold, no longer at
        risk of being overthrown.
      opciones:
        A: >-
          It is true, because the transition is like polyarchy, ways in which the democratic system is
          referred to and described.
        B: >-
          It is false, because the transition cannot be foreseen exactly, since it is a period in which
          uncertainty is the norm.
        C: >-
          It is true, because the transition, in a broad sense, is completed when there is no danger of
          authoritarian regression.
        D: >-
          It is false, because a democracy never takes hold without risk. As long as there are military
          forces, there will always be the possibility of coups d'état.
  q-33de77a8:
    - fuente: 7e3fbe52cd
      enunciado: >-
        According to Max Povse, to be hybrid, a regime must have indicators with both democratic and
        authoritarian values.
      opciones:
        A: >-
          It is true, because political regimes are pluralistic and offer all kinds of ideological
          possibilities within them.
        B: It is false, because democracy has nothing to do with authoritarian systems. It is one or the other.
        C: It is false, because that is not hybrid, but a polyarchy.
        D: >-
          It is true, because these are cases where there are free elections, but there is also an “uneven
          playing field” in favor of the governing party.
  q-b2b0a999:
    - fuente: e121e516de
      enunciado: >-
        According to Margarita Batlle, Robert Dahl understood democracy to be an unattainable system that is
        impossible to adopt in practice.
      opciones:
        A: >-
          It is false, because numerous countries have lived under democracy in this century and in previous
          ones.
        B: >-
          It is true, because it means that democracy is a utopian and ideal order to which society cannot
          aspire.
        C: It is false, because there are no utopian matters for human beings to organize their societies.
        D: >-
          It is true, because the only true democracy is the one found in assemblies in which all citizens
          participate.
  q-52a3ee4a:
    - fuente: 92c8053fe6
      enunciado: >-
        According to Enrique García, the fascist State was not evident in all spheres of society, but it was
        evident, without control, in education, culture and the media.
      opciones:
        A: >-
          It is false, because the power of the fascist State had no limits and its control over society was
          total.
        B: >-
          It is true, because the fascist State placed emphasis only on whatever had to do with total control
          of values and discourses.
        C: It is false, because the fascist State was evident above all in the economy.
        D: It is true, because the fascists thought that from those spaces they could control all of society.
  q-883542ff:
    - fuente: 93dbaef75a
      enunciado: >-
        According to Nadia Yannuzzi, among the multiple effects of the process of individuation, the
        withdrawal of the individual into the private sphere stands out.
      opciones:
        A: It is false, because the individual's sphere of belonging is always the private sphere.
        B: It is false, because no one is saved alone.
        C: It is true, because the process of individuation results in "every man for himself."
        D: It is true, because individuals withdraw, given that they feel they have no say in public affairs.
  q-b26893fd:
    - fuente: 0dca3733f7
      enunciado: >-
        According to Laura Petrino, the variety of Latin American examples shows that the economic and social
        characteristics of our region are the only conditions conducive to the emergence of charismatic
        figures regarded as populist.
      opciones:
        A: >-
          It is false, because populism is also a powerful political phenomenon in core countries with highly
          institutionalized democracies.
        B: >-
          It is false, because populism is also a powerful political phenomenon in communist countries with
          poorly institutionalized democracies.
        C: >-
          It is true, because the “informal institutions” characteristic of Latin America are what open the
          way to populism.
        D: It is true, because all cases of populism come from Latin America.
  q-8bf9f5aa:
    - fuente: 7710b2e6b2
      enunciado: >-
        In the video in which Eduardo Levy Yeyati interviews Pablo Gerchunoff about the figure of Alfonsín,
        particularly during his time as President of the Nation, the interviewee considers 1985 a turning
        point. Why does he choose that year?
      opciones:
        A: >-
          Because in 1985 the pact with the renewal faction of Peronism took place, along with the
          implementation of the Plan Primavera, a successful economic stabilization program implemented by the
          Radical Government.
        B: >-
          Because it coincides with the film titled with that same year (“1985”), which competed for the
          Oscars, bringing the figure of Alfonsín and his political legacy back into public debate.
        C: >-
          Because the success of the Plan Austral, an economic stabilization program, allowed Alfonsín to win
          the 1985 midterm elections.
        D: >-
          Because it combines the year in which the trial of the military Juntas took place, as a great moment
          of democratic institutionality, with the moment of greatest success of the so-called Plan Austral,
          an economic stabilization program implemented by the Radical Government.
        E: The correct options are A and C.
        F: The correct options are B and D.
        G: The correct options are C and D.
        H: The correct options are A, C and D.
  q-bdd1ef5c:
    - fuente: ae6e00ecdd
      enunciado: >-
        According to Romero, the Catholic Church grew increasingly hostile toward the Radical Government led
        by Alfonsín from 1983. This was so because:
      opciones:
        A: >-
          The Church was annoyed by its limited influence –at least, less than it aspired to– in the area of
          private education.
        B: >-
          The Church was annoyed by its limited influence –at least, less than it aspired to– in social
          assistance and in public education.
        C: >-
          The Church was annoyed by the bill to decriminalize abortion that the Government was promoting and
          that was rejected in Congress.
        D: >-
          The Church was annoyed by the secular tone of the cultural discourse circulating in State
          institutions and media.
        E: The correct options are A and D.
        F: The correct options are B and D.
        G: The correct options are A, C and D.
        H: 'The correct options are B, C and D. DNI:'
  q-7b8ffb27:
    - fuente: 497fb0664b
      enunciado: >-
        The video on Transition to Democracy deals with different types of transition in contexts of armed
        conflict. Among them, it distinguishes:
      opciones:
        A: >-
          Transitions in which a regime change has occurred between the “hard-line” and “soft-line” sectors of
          the armed conflict.
        B: Transitions that take place in cases in which an armed conflict is still ongoing.
        C: Transitions in which a military humiliation has occurred, but not a total defeat.
        D: >-
          Transitions in which the political regime has been assimilated on the basis of the victorious side
          in an armed conflict.
        E: The correct options are A and B.
        F: The correct options are B and C.
        G: The correct options are C and D.
        H: The correct options are A, B and D.
  q-35aaa976:
    - fuente: 7ac1f6330c
      enunciado: >-
        According to Verónica Beyreuther, under a dictatorship, pure coercion may initially serve to maintain
        domination over a society, but, as time goes by, some degree of consensus becomes necessary. This is
        so because:
      opciones:
        A: >-
          Dictatorships always require an electoral legitimacy that can legitimize the use of force to
          guarantee their domination over a society over time.
        B: >-
          Dictatorships always seek to sustain themselves on a majority consensus, especially if the cause
          that gave rise to them no longer exists.
        C: >-
          The problem of a dictatorship's duration is inseparably linked to that of the legitimacy that
          sustains it.
        D: >-
          To achieve that consensus, dictatorships generally appeal to representing a supposed public
          interest.
        E: The correct options are A and B.
        F: The correct options are B and C.
        G: The correct options are C and D.
        H: The correct options are B, C and D.
  q-15c86453:
    - fuente: 375f3d2146
      enunciado: >-
        According to Romero, the illegal repression by the Armed Forces did not begin with the 1976 military
        coup; it could already be observed under the Peronist Government headed by Isabel Perón between 1974
        and 1976. This was seen in that:
      opciones:
        A: >-
          From February 1975, the Army, called upon by Isabel Perón, took on the task of repressing the
          guerrilla in Tucumán.
        B: With Perón's death, the guerrilla groups chose to go underground and step up political violence.
        C: >-
          The guerrillas linked to the Radical Party and its leader, Raúl Alfonsín, became strong in the
          interior of the Province of Buenos Aires.
        D: >-
          The repression in the south of the country in 1975, known as the “Patagonia Rebelde”, was the first
          act in which the Armed Forces applied illegal repression to annihilate the left-wing guerrillas.
        E: The correct options are A and B.
        F: The correct options are B and C.
        G: The correct options are C and D.
        H: The correct options are A, C and D.
  q-7c6990f8:
    - fuente: 9e41537494
      enunciado: >-
        According to Romero, the transition Government that began in 1983 had to face a major obstacle:
        business leaders and trade unionists agreed in making the sectoral concertation policy that
        then-president Alfonsín and his economic team had bet on fail. This happened when:
      opciones:
        A: >-
          National business leaders opposed the total opening of imports proposed by Alfonsín's Minister of
          Economy.
        B: >-
          The trade unionists found in the piquetero mobilization an unexpected ally to make up for the lack
          of enthusiasm of their own members.
        C: >-
          The CGT mobilized for both union and political reasons, since it was the backbone of the Peronist
          opposition.
        D: >-
          Business leaders questioned state spending and intervention, though with the exception of the
          policies that benefited them directly.
        E: The correct options are A and B.
        F: The correct options are B and C.
        G: The correct options are B and D.
        H: The correct options are C and D.
  q-315c3a2a:
    - fuente: fb72e47172
      enunciado: >-
        According to Enrique García, the welfare state developed in the West from 1945 onward, that is, after
        the Second World War (1939-1945). This happened because:
      opciones:
        A: >-
          The welfare state was the first successful state organization outside capitalism to triumph in the
          West.
        B: >-
          This type of State sought to regain the path of growth and social stability in the face of the
          advance of communism.
        C: >-
          This type of State was formed to provide a solution to the economic and social effects the war had
          caused.
        D: >-
          The welfare state was a consequence of the enormous success of the Soviet economy, and for that
          reason it was imitated by the West.
        E: The correct options are A and B.
        F: The correct options are B and C.
        G: The correct options are C and D.
        H: The correct options are B, C and D.
  q-9c3bd448:
    - fuente: 1960e0b7ce
      enunciado: >-
        Romero recounts that the 1987 divorce law was passed during the Government of the Radical Raúl
        Alfonsín after a brief but very intense debate. This intensity was related to the fact that:
      opciones:
        A: It was the high point of the cultural modernization begun in 1983.
        B: >-
          It was the moment when the breaking off of diplomatic relations between Argentina and the Vatican
          was formalized.
        C: >-
          The traditional sectors of the Catholic Church opposed it, resorting to customary pressure
          mechanisms and to other, more novel ones.
        D: >-
          The most traditional sectors of the Radical Party tried to oppose it by blocking its consideration
          in Congress.
        E: The correct options are A and C.
        F: The correct options are A and B.
        G: The correct options are C and D.
        H: The correct options are A, C and D.
  q-3ecdf8c6:
    - fuente: 9575d96b0c
      enunciado: >-
        According to Romero, upon assuming the presidency, Alfonsín proposed some logical distinctions
        regarding the military legacy, which at the same time were difficult for the mobilized society to
        accept, especially for the human rights organizations. This was because:
      opciones:
        A: >-
          Alfonsín believed that the trial of the guilty had to be separated from the judgment of the
          institution, which was part of the State.
        B: >-
          Alfonsín believed that the trial of the guilty military officers had to be avoided because it meant
          attacking the entire institution, which was part of the State.
        C: >-
          Alfonsín had not condemned the human rights violations during the dictatorship and continued along
          that line during his Government.
        D: >-
          Alfonsín believed that punishment should be concentrated on the top ranks and that the principle of
          due obedience should be applied to the rest.
        E: The correct options are A and B.
        F: The correct options are B and C.
        G: The correct options are C and D.
        H: The correct options are A and D.
fichas:
  povse.gobierno-vs-regimen:
    fuente: 957dda5c48
    tema: Change of government and change of regime
    autor: Max Povse
    pregunta_guia: What changes when the government changes, and what has to change for the regime to change?
  povse.totalitarismo:
    fuente: 073ddfc162
    tema: Totalitarian regimes
    autor: Max Povse
    pregunta_guia: How far does the control of a totalitarian regime reach, and what does it demand of the population?
  povse.regimen-hibrido:
    fuente: a4197bce58
    tema: Hybrid regimes
    autor: Max Povse
    pregunta_guia: What democratic features and what authoritarian features coexist in a hybrid regime?
  gomez-talavera.estado-vs-gobierno:
    fuente: f349f6489c
    tema: State and government
    autor: Patricio Gómez Talavera
    pregunta_guia: What remains and what changes when there are elections?
  yannuzzi.ciudadania-arendt:
    fuente: 35aed0a055
    tema: Citizenship as the right to have rights (Arendt)
    autor: Nadia Yannuzzi
    pregunta_guia: 'According to this perspective, how are rights obtained: by agreement or through conflicts?'
  yannuzzi.individuacion:
    fuente: 63021233df
    tema: Individuation and withdrawal into the private sphere
    autor: Nadia Yannuzzi
    pregunta_guia: Why does the individual withdraw from the public sphere, according to the author?
  simone.democracia-representativa:
    fuente: 948e7fe198
    tema: Representative democracy
    autor: Nicolás Simone
    pregunta_guia: In representative democracy, who makes the decisions and who elects them?
  simone.transicion:
    fuente: 7a77870c56
    tema: What a transition is
    autor: Nicolás Simone
    pregunta_guia: What marks the beginning and what marks the end of a transition?
  simone.pactos-elites:
    fuente: a94ab231ae
    tema: Elite pacts in the transition
    autor: Nicolás Simone
    pregunta_guia: What do parties gain by reaching agreements during a transition?
  simone.lanusse-gan-1971:
    fuente: 75ad148638
    tema: Lanusse and the 1971 electoral way out
    autor: Nicolás Simone
    pregunta_guia: What were the military offering in 1971, and what condition did they attach to that way out?
  petrino.populismo-america-latina:
    fuente: ae8df6a63b
    tema: Populism and Latin America
    autor: Laura Petrino
    pregunta_guia: >-
      Where does the author place the classic examples of populism, and in what other countries does it appear
      today?
  petrino.yrigoyen-peron:
    fuente: c284a69567
    tema: Yrigoyen and Perón as populisms
    autor: Laura Petrino
    pregunta_guia: What three features do yrigoyenismo and Peronism share, according to the author?
  valdez.estado-vs-nacion:
    fuente: 27bc7669f0
    tema: State and nation
    autor: María José Valdez
    pregunta_guia: >-
      When we move from talking about the State to talking about the nation, which actors do we need to look
      at?
  sribman.estado-liberal:
    fuente: c57aeb4748
    tema: Elements of the liberal State
    autor: Ariel Sribman
    pregunta_guia: >-
      What are the three elements that, according to Sribman, constitute the liberal State in its beginnings?
      Which ones have to do with the form of government and which one with the economy?
  garcia.estado-liberal:
    fuente: 93cbd243d0
    tema: The liberal State and the market
    autor: Enrique García
    pregunta_guia: >-
      For liberalism, according to García, who allocates resources better, the State or the market? What role
      does individual interest play?
  garcia.estado-fascista:
    fuente: a038c11301
    tema: The fascist State
    autor: Enrique García
    pregunta_guia: >-
      According to García, how far did the fascist State's control over society reach? Was there any sphere
      left outside it?
  garcia.estado-bienestar:
    fuente: 0819aa0515
    tema: The welfare State (from 1945)
    autor: Enrique García
    pregunta_guia: What two postwar problems did the welfare State seek to solve, according to García?
  pirsch.federalismo-america-latina:
    fuente: 0bc6a582e8
    tema: Federal countries of Latin America
    autor: Sofía Pirsch
    pregunta_guia: >-
      What are the four federal countries of Latin America according to Pirsch? Which of Argentina's neighbors
      are not federal?
  batlle.dahl-democracia:
    fuente: 244b85c0c5
    tema: Democracy according to Dahl
    autor: Margarita Batlle
    pregunta_guia: >-
      According to Batlle, why is democracy an unattainable ideal for Dahl? What systems does he study, then,
      and what relationship must there be between elected and unelected officials?
  beyreuther.dictaduras:
    fuente: 4d54332d36
    tema: 'Dictatorships: concentrated power, coercion and consensus'
    autor: Verónica Beyreuther
    pregunta_guia: >-
      According to Beyreuther, why can a dictatorship not coexist with the separation of powers? Why is force
      alone not enough for it to last?
  hermo.genocidio:
    fuente: '2635877954'
    tema: Definition of genocide (UN)
    autor: Javier Hermo
    pregunta_guia: >-
      What acts does the UN definition of genocide include? What defines it: the number of victims or the
      intent?
  etchevest.terrorismo:
    fuente: feee575365
    tema: Changes in terrorism in the 21st century
    autor: Graciela Etchevest
    pregunta_guia: >-
      According to Etchevest, what is new about 21st-century terrorism in its actors, its organization and its
      reach?
  deich.frondizi-guido:
    fuente: 953c9c1eab
    tema: 'Frondizi''s fall: coup or institutional interruption?'
    autor: Florencia Deich
    pregunta_guia: >-
      According to Deich, what about Frondizi's removal was a coup and what was a constitutional succession?
      Why does that make it hard to classify?
  video.sudafrica-comision-verdad:
    fuente: a77cb3bb9e
    tema: Truth and Reconciliation Commission
    autor: 'Course video: Transition to democracy in South Africa'
    pregunta_guia: >-
      What did the Truth and Reconciliation Commission seek instead of criminal punishment? What was gained
      and what was sacrificed with that approach?
  video.transiciones-conflicto-armado:
    fuente: 472256d90f
    tema: Transitions in contexts of armed conflict
    autor: 'Course video: Transition to democracy'
    pregunta_guia: >-
      What types of transition does the video distinguish according to the state of the armed conflict
      (ongoing, humiliation, defeat)?
  video.gerchunoff-alfonsin:
    fuente: 9f96fad46d
    tema: 'Alfonsín: the Trial of the Juntas, the pardon and 1985'
    autor: 'Course video: Eduardo Levy Yeyati''s interview with Pablo Gerchunoff'
    pregunta_guia: >-
      According to Gerchunoff, what earlier step made the Trial of the Juntas possible? Who pardoned the
      commanders? What two things come together in 1985?
  romero.cordobazo-1969:
    fuente: bce09c6a35
    tema: The Cordobazo (1969)
    autor: Luis A. Romero
    pregunta_guia: What had been happening in the factories and universities of Córdoba before May 1969?
  romero.montoneros-vuelta-de-peron:
    fuente: d6533cb265
    tema: Montoneros and Perón's return
    autor: Luis A. Romero
    pregunta_guia: >-
      When Perón returned and spoke in the first person, what did he say and how did the Montoneros explain
      it?
  romero.ruptura-plaza-1974:
    fuente: ba6209261d
    tema: The break between Perón and Montoneros (5/1/1974)
    autor: Luis A. Romero
    pregunta_guia: >-
      After Perón threw them out of the Plaza, what path did the Montoneros take and what happened to them
      when Perón died?
  romero.programa-reconstruccion:
    fuente: d03ae1abb2
    tema: Program of National Reconstruction and Liberation
    autor: Luis A. Romero
    pregunta_guia: >-
      What kind of measures did Perón's economic program include and how did it differ from what the Peronist
      youth said?
  romero.isabel-presidencia:
    fuente: fb9c79c3b2
    tema: The presidency of Isabel Perón
    autor: Luis A. Romero
    pregunta_guia: What did Isabel imitate from Perón and how did her way of governing differ?
  romero.represion-antes-del-golpe:
