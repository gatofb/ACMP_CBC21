  q-e7648876:
    - fuente: 128d1ea78b
      enunciado: >-
        According to Verónica Beyreuther, dictatorial regimes exclude any possibility of the division of the
        powers of the State that is characteristic of democracy or the Republic: the legislative, judicial and
        executive powers.
      opciones:
        A: >-
          It is true, because the dictator takes up the model of constitutional monarchies again, occupying
          the place of the monarch from a position of force.
        B: >-
          It is true, because in a dictatorship the idea of a divided power, that is, a shared power with
          mechanisms that prevent all of it from being concentrated in one of the powers, is pointless.
        C: >-
          It is false, because even in dictatorships, power has to show some forms of respect for the control
          that the Legislative Power exercises over the Executive.
        D: >-
          It is false, because even in dictatorships, power has to show respect for the control that the
          Judicial Power exercises over the Executive.
  q-c6c17dc6:
    - fuente: '8988840e93'
      enunciado: >-
        The video on the Transition to Democracy in South Africa states that the Truth and Reconciliation
        Commission made it possible to go further in legal matters, achieving varied and exemplary sentences
        against those responsible for the violation of Human Rights in that African country.
      opciones:
        A: >-
          It is true, because the sentences proposed by the TRC are generally considered sufficient by the
          victims, and they suggest that the search for truth can be achieved in a context of transition.
        B: >-
          It is false, because in South Africa, as in the rest of the African countries, there were no
          judicial reviews of what happened during the period of the so-called “apartheid” or of different
          kinds of Human Rights violations.
        C: >-
          It is false, because by prioritizing access to information in pursuit of the search for truth,
          justice and reparation for the victims were largely sacrificed.
        D: >-
          It is true, because the TRC was creative, innovating both in ways of classifying the type of crime
          and in the way of punishing it, thereby setting legal precedent.
