  q-3dda527d:
    - fuente: 8ed1208d7a
      enunciado: >-
        According to Romero, on May 1, 1974, the break between Perón and the Montoneros came about when they
        left a Plaza from which Perón himself was expelling them. This meant that:
      opciones:
        A: >-
          Perón replaced the Montoneros with another left-wing group called the Ejército Revolucionario del
          Pueblo (ERP).
        B: >-
          The Montoneros chose to return to the old tactic and went underground. There were more
          assassinations and spectacular kidnappings to improve their finances.
        C: >-
          The Montoneros reappeared once more, barely two months later, at Perón's fantastic funeral, and then
