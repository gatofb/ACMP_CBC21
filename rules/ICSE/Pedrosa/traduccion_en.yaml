  q-805de77b:
    - fuente: f6e64e9424
      enunciado: >-
        Luis A. Romero argues that by 1975 the Peronist government was heading toward its end. The Rodrigazo
        —named after the surname of the Peronist government's Minister of Economy, Celestino Rodrigo—
        unleashed an economic crisis that proved impossible to control.
      opciones:
        A: >-
          It is true, because the Rodrigazo involved "runs" on the dollar, galloping inflation and the
          appearance of indexation mechanisms.
        B: >-
          It is true, because it was the first default (suspension of foreign debt payments) and the beginning
          of the country's international isolation and heavy legal costs abroad.
        C: >-
          It is false, because the Rodrigazo was a social protest movement that arose in the province of Santa
          Fe, based on agricultural producers.
        D: It is false, because in 1975 the military were already governing under Gen. Jorge R. Videla.
  q-b9eb9f76:
    - fuente: 2f39764003
      enunciado: >-
        According to Romero, the first murky question raised by the so-called “Proceso de Reorganización
        Nacional” (National Reorganization Process), which began in March 1976, was where power really lay.
      opciones:
        A: >-
          It is false, because power lay with the Junta of commanders, which centralized the executive,
          legislative and judicial functions throughout the entire country.
        B: >-
          It is true, because the “Proceso de Reorganización Nacional” entailed the existence of a terrorist
          State, visible and public, in charge of repression as well as social, cultural and even economic
          policies.
        C: >-
          It is true, because the authority of the president –at first the first among his peers, and later
          not even that- was controlled and limited by the heads of the three armed forces.
        D: >-
          It is false, because the country's political tradition was strongly presidentialist, and moreover
          unity of command was always one of the principles of the Armed Forces, so the president's authority
          was never questioned or reviewed by his military peers.
