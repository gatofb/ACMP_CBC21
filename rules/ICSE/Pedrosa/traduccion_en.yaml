      enunciado: >-
        Romero states that Radicalism was renewed through the drive of Alfonsín, who in 1972 had created the
        Movimiento de Renovación y Cambio to challenge the historic leader, Ricardo Balbín, for the
        leadership. This was so because:
      opciones:
        A: >-
