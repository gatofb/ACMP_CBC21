  q-68b7e0de:
    - fuente: 5cae9a4e76
      enunciado: >-
        Romero states that, between 1975 and early 1976, various factors gradually created the conditions for
        accepting a coup d'état that promised to restore order and ensure the state's monopoly on force. Among
        them, one can mention:
      opciones:
        A: >-
          Death present on a daily basis, the spectacular actions of the guerrilla organizations -which had
          failed in two large operations against military units in Greater Buenos Aires and in Formosa-.
        B: The terror spread by the Argentine Anticommunist Alliance (Triple A).
        C: >-
          The constant and public presence in the country of the Soviet Communist Party through funding,
          propaganda and a large body of militants, which suggested the imminent opening of a revolutionary
          front.
        D: The terror spread by various organized crime gangs, most of them linked to drug trafficking.
        E: The correct options are A and B.
        F: The correct options are A and D.
        G: The correct options are B and D.
        H: The correct options are C and D.
  q-cf935fc6:
    - fuente: a0a9b1afc2
      enunciado: >-
        Romero states that in 1983, when Raúl Alfonsín took office, in addition to returning to academic life,
        intellectuals joined politics, and politics became intellectualized. This was seen in that:
      opciones:
        A: >-
          Alfonsín turned to them as advisers or technical officials, and his discourse, which translated into
          political terms what academics were developing, came across as modern, complex and profound.
        B: >-
          Peronism quickly gained control of institutional and political life in the national universities,
          which it had already held since the 1970s.
        C: >-
          Peronist leaders also turned to them, and political debate after the end of the dictatorship gained
          brilliance and, to a lesser extent, depth.
        D: >-
          The lists of candidates for city councillors, deputies and senators were filled with academics and
          intellectuals, pushing traditional politicians aside.
        E: The correct options are A and B.
        F: The correct options are C and D.
        G: The correct options are A and C.
        H: The correct options are A, B and C.
