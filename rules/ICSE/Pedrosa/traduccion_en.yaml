    - fuente: 34f00c2402
      enunciado: >-
        According to Romero, the Catholic Church changed its behavior toward the dictatorship as the military
        regime that took power in 1976 began to show signs of weakness. This was seen in that:
      opciones:
        A: >-
          From 1979 on, the Church's concerns with moral issues or the family extended to individual rights
          and politics.
        B: >-
          From 1983 on, the Church maintained a strongly oppositional stance led by the then young and popular
          priest Jorge Bergoglio.
        C: >-
          Revising its earlier positions, the Church set out to give up direct interference in social or
          political matters and devote itself to evangelizing an excessively secularized society.
        D: >-
          Revising its earlier positions, the Church set out to give up direct interference in social or
          political matters and devote itself to evangelizing a society it judged to be excessively leaning
          toward the left.
        E: The correct options are A and B.
        F: The correct options are A and C.
        G: The correct options are B and D.
        H: The correct options are A, C and D.
