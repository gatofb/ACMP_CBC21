  q-fe6feae2:
    - fuente: 815094b013
      enunciado: >-
        Romero points out that, during the first year of the Radical government that began in 1983, the
        economic policy of minister Bernardo Grinspun followed the classic dirigiste and redistributive
        formulas. This can be seen in that:
      opciones:
        A: >-
          It included state control of credit, the foreign exchange market and prices, and was complemented by
          social welfare measures.
        B: >-
          Business leaders and union leaders converged in supporting this policy, following the model
          established by the famous Gelbard Plan, implemented in the 1970s.
        C: >-
          They were measures similar to those applied between 1963 and 1966, ideas that Radicalism shared with
          historical Peronism.
        D: >-
          They were measures similar to those applied between 1955 and 1958, since Radicalism opposed what
          historical Peronism proposed.
        E: The correct options are A and B.
        F: The correct options are A and C.
        G: The correct options are B and C.
        H: The correct options are A, B, C and D.
