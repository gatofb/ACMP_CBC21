          violations.
        B: >-
          It is true, because the sentences proposed by the Commission are generally considered sufficient by
          the victims, and they suggest that the search for truth can be achieved in a context of transition.
        C: >-
          It is false, because by prioritizing access to information in pursuit of the search for truth,
          justice and reparation for the victims were largely sacrificed.
        D: >-
          It is true, because the passing of the Due Obedience and Full Stop Laws prevented those convicted
          from serving their full sentence.
  q-f8411670:
    - fuente: 6d0ea70066
      enunciado: >-
        As Nicolás Simone points out, in March 1971 the army appointed Gen. Agustín Lanusse as president to
        negotiate a transition to democracy. The military sought to control the process and opened
        negotiations with the political parties, including Peronism.
      opciones:
        A: >-
          It is false, because Agustín Lanusse was never president, either under dictatorship or under
          democracy.
        B: >-
          It is false, because the military in power never negotiate with the opposition, much less with the
          traditional political parties.
        C: >-
          It is true, because the military in power felt very close to Peronism, since Perón had been a career
          military officer for almost all his life.
        D: >-
          It is true, because the proposal was that, in exchange for calling elections, Perón would be
          excluded from them. The parties formally rejected the invitation, but took advantage of the
          situation to forge some agreements.
  q-146be346:
    - fuente: 34b8a34e60
      enunciado: >-
        According to Margarita Batlle, under certain circumstances elected public officials can (and must) be
        conditioned by people without electoral popular representation.
      opciones:
        A: >-
          It is false, because there must be a subordination of non-elected public officials to those who are
          popularly elected.
        B: >-
          It is false, because political officials must not be accountable or be controlled by institutions
          such as the judiciary or parliaments
        C: >-
          It is true, because there must be a person or group that holds power (or can condition it) without
          having been elected democratically, that is, through elections.
        D: >-
          It is true, because there must be a subordination of elected public officials to those appointed by
          the president or Congress.
  q-a587b241:
    - fuente: 7b83ea0eb4
      enunciado: >-
        In the video in which Eduardo Levy Yeyati interviews Pablo Gerchunoff, the interviewee points out
        that, even though Raúl Alfonsín issued the pardon, the fact of having previously imprisoned the
        commanders, even if only for two years, was quite an achievement of the young Argentine democracy.
      opciones:
        A: >-
          It is true, because the passing of the Full Stop and Due Obedience laws allowed the military to be
          released after their conviction in the famous 1985 trial and therefore to later obtain the
          subsequent pardon.
        B: >-
          It is false, because the Argentine military only began to be tried during the government of Néstor
          Kirchner in 2003.
        C: >-
          It is true, because due to the carapintada uprisings and the passing of the Full Stop and Due
          Obedience laws in 1987, the junta members convicted in 1985 left prison at the end of the Radical
          president's term.
        D: >-
          It is false, because Alfonsín left the presidency in 1989 with the commanders in prison, and they
          were only pardoned shortly afterwards by the Peronist president Carlos Menem.
  q-dd5df609:
    - fuente: 7294361d79
      enunciado: >-
        According to Enrique García, the liberal State rests on the belief in natural laws of the market (laws
        of supply and demand and free competition) and on individual initiative. This is so because:
      opciones:
        A: >-
          It is an interventionist State in the economic sphere that seeks to regulate so that markets are
          more efficient.
        B: >-
          It is a minimal State that regards the market as the only one capable of allocating resources
          efficiently.
        C: >-
          Liberals believe that the individual profit motive promotes personal benefit and the improvement of
          society as a whole.
        D: >-
          Liberals believe that the State could be a successful and efficient entrepreneur if it were run by
          people who knew about economics.
        E: The correct options are A and B.
        F: The correct options are C and D.
        G: The correct options are B and C.
        H: 'The correct options are A, B and C. DNI:'
  q-eb51cdff:
    - fuente: 77681486d3
      enunciado: >-
        According to Romero, the great popularity achieved by President Alfonsín in various parts of the world
        was used to consolidate and strengthen the local democratic institutions, which were still precarious.
        Some of the following pending international issues were addressed with those criteria:
      opciones:
        A: With Chile, over a dispute in the Beagle Channel.
        B: >-
          With Uruguay, over the fate of some pulp mills to be built on the bank of the Uruguay River, near
          the Uruguayan city of Fray Bentos and the Argentine city of Gualeguaychú.
        C: >-
          With Brazil and Paraguay, over the triple border and the illegal trade, smuggling and Islamic
          terrorism that abounded in that place.
        D: With Great Britain, over the Malvinas.
        E: The correct options are A and D.
        F: The correct options are B and C.
        G: The correct options are C and D.
        H: The correct options are A, C and D.
  q-3e52b36d:
    - fuente: 6f3b698673
      enunciado: >-
        As stated in Javier Hermo's text on genocide, the United Nations produced a definition from a legal
        and political point of view, as did the International Criminal Court years later. Among the central
        points of the definition of “genocide” were:
      opciones:
        A: Massacres in which the number of victims is clearly higher than the usual rates of violence.
        B: Causing serious bodily or mental harm to members of the group.
        C: Measures intended to prevent marriages within the group.
        D: >-
          Deliberately inflicting on the group conditions of life calculated to bring about its physical
          destruction in whole or in part.
        E: The correct options are A and B.
        F: The correct options are B and D.
        G: The correct options are B, C and D.
        H: The correct options are A, C and D.
  q-e3444683:
    - fuente: 086e25874a
      enunciado: >-
        Romero points out that, in the dictatorship that took power in 1976, a faction stronger than the
        others, but far from dominant, formed around Generals Videla and Viola –his second-in-command in the
        Army-. This meant that:
      opciones:
        A: >-
          These commanders did not recognize the need to find some political way out in the future. Thus, they
          had strong conflicts with the leaders of the political parties, who, persecuted day and night by the
          military, saw that group as the least civilized sector.
        B: >-
          These commanders recognized the need to find some political way out in the future. Thus, they kept
          in communication with the leaders of the political parties, who deluded themselves into believing
          they saw in them the most civilized sector.
        C: >-
          These commanders backed Martínez de Hoz, who was heavily criticized by the more nationalist military
          officers, who abounded among the younger ranks.
        D: >-
          These commanders did not back Martínez de Hoz, who was strongly supported by the more liberal
          military officers, who abounded among the younger ranks.
        E: The correct options are A and B.
        F: The correct options are C and B.
        G: The correct options are A and D.
        H: The correct options are A, B, C and D.
  q-b9349c41:
    - fuente: 52f773eaf8
      enunciado: >-
        Romero points out that, in September 1987, after President Raúl Alfonsín's electoral defeat in the
        midterm parliamentary elections, the government's position weakened rapidly. This caused:
      opciones:
        A: Instability and the sense of a lack of governability to grow.
        B: >-
          Peronism, looking with new optimism to the 1989 presidential elections, refused to back reforms
          whose social cost was evident.
        C: >-
          The forced reconciliation with the corporations, although it meant a serious deterioration of the
          Radical government's image among civil society, yielded some of the expected results in the economic
          sphere.
        D: >-
          The Kirchnerist sector of Peronism to take control of the party with its harder stance toward
          Alfonsín's weakened government.
        E: The correct options are A and B.
        F: The correct options are C and B.
        G: The correct options are A and D.
        H: The correct options are A, B, C and D.
  q-d47b26d4:
    - fuente: a2e8290134
      enunciado: >-
        According to Graciela Etchevest, terrorist violence has changed from the last decades of the 20th
        century to the 21st century. This was seen in that:
      opciones:
        A: >-
          With the new century, radicalized religious groups joined in, whose actions have had a strong impact
          on the world agenda, mainly through so-called “Islamic fundamentalism”.
        B: >-
          With the new century, this new type of terrorism introduces something new compared with the one that
          preceded it: its actions are organized around smaller groups, with efficient use of technological
          tools, often linked to social networks.
        C: >-
          The spaces for its action are restricted to the continent of origin; in fact, sometimes they have no
          country of origin and their settings are regional, depending on the circumstances and the
          possibilities of organizing.
        D: >-
          The spaces for its action are restricted to the country of origin, so as to maximize resources and
          achieve a more powerful effect, such as, for example, the attack on the Twin Towers in the United
          States in 2001.
        E: The correct options are A and B.
        F: The correct options are B and D.
        G: The correct options are C and A.
        H: The correct options are A, B and D.
  q-6bb9129a:
    - fuente: 18e30b8b14
      enunciado: >-
        Romero states that, at Easter 1987, the illusion of the unlimited power of democracy definitively came
        to an end. This was so because:
      opciones:
        A: Alfonsín lost exclusive leadership over Peronism.
        B: Alfonsín lost exclusive leadership over the middle class.
        C: Alfonsín lost exclusive leadership over civil society.
        D: Alfonsín lost exclusive leadership over the Radicals.
        E: The correct options are A and D.
        F: The correct options are B and C.
        G: The correct options are C and D.
        H: 'The correct options are A, C and D. DNI:'
  q-86349768:
    - fuente: f89ed8b37d
      enunciado: >-
        According to Romero, on taking office in 1983, Alfonsín had to choose between pushing the pole of
        civil society to the maximum (which meant confronting established interests, even among his
        supporters) or, on the other hand, favoring consensual solutions and avoiding so many conflicts.
        Therefore:
      opciones:
        A: >-
          The Radical government generally chose the second course, and one result of this was the so-called
          Pacto de Olivos, which Alfonsín managed to agree on with Peronism.
        B: >-
          The Radical government held firmly to the first course throughout the 4 years of its presidential
          term, confronting unions, the military, the opposition and the Catholic Church until the last day.
        C: >-
          The Radical government generally chose the first course and until 1987 kept the initiative, seeking
          alternative paths and presenting new proposals after each setback.
        D: >-
          The Radical government generally chose the first course, but had to accept the second when some
          serious setbacks showed it the limits of its power.
        E: The correct options are A and D.
        F: The correct options are B and C.
        G: The correct options are C and D.
        H: The correct options are A, C and D.
  q-131b96a5:
    - fuente: ca12fd8a4c
      enunciado: >-
        In January 1989 a terrorist group attacked the La Tablada barracks in Greater Buenos Aires, and the
        Army found the opportunity to carry out a crushing show of force that ended with the annihilation of
        the attackers. According to Romero, this meant that:
      opciones:
        A: >-
          The memory of the past of illegal repression returned to public opinion, which unanimously
          repudiated the event, and this gave political breathing room to the Alfonsín government, which had
          managed to try the military juntas.
        B: >-
          It could be anticipated that the open military question would ultimately lead to the forgetting of
          the crimes of the "dirty war" and the burial of the illusions of civil society of 1983.
        C: >-
          The acknowledgment of the military repression was the first sign of the change of priorities and
          values in public opinion.
        D: >-
          The rejection that the military repression received for the action was a new sign of the change of
          era that had begun in 1983.
        E: The correct options are A and B.
        F: The correct options are B and C.
        G: The correct options are C and D.
        H: The correct options are A and D.
