      enunciado: >-
        According to Romero, upon taking office as president, Alfonsín proposed some logical distinctions
        regarding the military legacy, but at the same time these were hard for the mobilized society, and in
        particular for the human rights organizations, to accept. This was so because:
      opciones:
        A: >-
          Alfonsín thought that the trial of the guilty had to be separated from the judgment of the
          institution, which was part of the State.
        B: >-
          Alfonsín thought that the trial of the guilty had to be avoided because it implied attacking the
          entire institution, which was part of the State.
        C: >-
          Alfonsín had not condemned the human rights violations during the dictatorship and continued that
          line during his government.
        D: >-
          Alfonsín thought that punishment should be concentrated on the top ranks and the criterion of due
          obedience applied to the rest.
        E: The correct options are A and B.
        F: The correct options are B and C.
        G: The correct options are C and D.
        H: The correct options are D and A.
