  q-c5f34ee0:
    - fuente: af363bbabb
      enunciado: >-
        According to Romero, the Program for National Reconstruction and Liberation (presented by Perón during
        his third presidency) had objectives in line with the changes already consolidated in the country's
        economic structure. This meant that:
      opciones:
        A: >-
          Despite the predominant narratives within Peronism, there was nothing in Perón's economic program
          that indicated an orientation toward "national socialism".
        B: The measures were strongly interventionist and, to a lesser extent, nationalist and distributionist.
        C: >-
          The State set out to make a large reduction in spending, especially in the number of public
          employees and state-owned companies, in order to reduce the growing deficit.
        D: >-
          There was in that program a clear orientation toward "national socialism", which was the predominant
          discourse within Peronism and especially among its youth.
        E: The correct options are A and B.
        F: The correct options are B and C.
        G: The correct options are B and D.
        H: The correct options are C and D.
