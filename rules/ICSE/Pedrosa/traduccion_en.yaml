  q-aeea6199:
    - fuente: b7de43654b
      enunciado: >-
        Max Povse states that it is very important to understand that a change of government is the same as a
        change of political regime.
      opciones:
        A: >-
          It is true, because there cannot be one and the same government that passes through different
          political regimes.
        B: It is true, because when the president changes, the regime necessarily changes.
        C: It is false, because a regime can remain in place even if the government changes.
        D: It is false, because for there to be a change of regime, the government must not change.
  q-17bf5e88:
    - fuente: bbffcb2d09
      enunciado: >-
        According to Patricio Gómez Talavera, it is necessary to observe an important distinction between the
        State and the government.
      opciones:
        A: >-
          It is false, because the members of the government do not have a temporally fixed mandate, unlike
          those in charge of administering the bureaucratic structure of the State, who take office with a
          fixed mandate of a certain number of years.
        B: It is true, because the State is a structure of permanent existence, although its forms may change.
        C: >-
          It is true, because the government is a structure of permanent existence, although its forms may
          change.
        D: >-
          It is false, because the members of the State have a temporally fixed mandate, after which they must
          leave their posts to new people in charge of administering the bureaucratic structure of the
          government.
  q-9f2e3ca3:
    - fuente: 0a039ca11c
      enunciado: >-
        According to Nadia Yannuzzi, following Hannah Arendt, there is another way of understanding
        citizenship by approaching it from a conceptual perspective.
      opciones:
        A: >-
          It is false, because citizenship can only be understood from a legal perspective between the State
          and society.
        B: >-
          It is false, because citizenship is the right to have rights, which implies that it is an area of
          strong consensus.
        C: >-
          It is true, because rights are obtained through complex economic processes marked by class struggle
          and income redistribution.
        D: >-
          It is true, because rights are obtained through complex historical processes marked by violence and
          by diverse and opposing interests.
  q-61539aa3:
    - fuente: 048ca5d4c1
      enunciado: >-
        Nicolás Simone states that representative democracy is achieved when citizens elect a small group of
        people to make decisions on their behalf.
      opciones:
        A: >-
          It is false, because representative democracy seeks to oppose the power of small groups over the
          people.
        B: >-
          It is false, because representative democracy is achieved when citizens take the major decisions of
          the State into their own hands.
        C: >-
          It is true, because representative democracy is achieved when citizens elect others to design a
          government that expresses the will of the majority.
        D: >-
          It is true, because representative democracy is achieved when a group of people, starting from
          direct democracy, design a government that expresses the will of the majority.
